<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Высококачественный Онлайн Конвертер PDF в PNG</title>
    <!-- Стабильная веб-версия библиотеки без внешних скрытых процессов -->
    <script src="https://cloudflare.com"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        h2 { color: #1e293b; margin-top: 0; }
        .upload-box {
            border: 2px dashed #cbd5e1;
            padding: 30px;
            border-radius: 8px;
            background: #f8fafc;
            cursor: pointer;
            margin-bottom: 20px;
            transition: all 0.2s;
        }
        .upload-box:hover { border-color: #2563eb; background: #eff6ff; }
        input[type="file"] { display: none; }
        .btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }
        .btn:hover { background-color: #1d4ed8; }
        .btn:disabled { background-color: #94a3b8; cursor: not-allowed; }
        #status { margin: 15px 0; font-weight: 600; color: #475569; font-size: 15px; }
        #render-canvas { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Преобразование PDF в PNG без потери качества</h2>
    <p style="color: #64748b; font-size: 14px; margin-bottom: 25px;">
        Внимание: Этот инструмент работает <b>только при открытии через сайт (GitHub Pages)</b>. При запуске с компьютера файл заблокируется браузером.
    </p>
    
    <!-- Зона загрузки -->
    <div class="upload-box" onclick="document.getElementById('pdf-file').click()">
        <span id="upload-text" style="font-size: 16px; font-weight: 500; color: #1e293b;">
            📁 Кликните, чтобы выбрать или перетащить PDF
        </span>
        <input type="file" id="pdf-file" accept="application/pdf">
    </div>

    <div id="status">Файл не выбран</div>
    <button id="download-all-btn" class="btn" disabled>📥 Скачать все страницы как PNG</button>
</div>

<!-- Скрытый холст для генерации картинок высокого разрешения -->
<canvas id="render-canvas"></canvas>

<script>
    // Настраиваем библиотеку для работы в открытом безопасном вебе (HTTPS)
    const pdfjsLib = window['pdfjs-dist/build/pdf'];
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cloudflare.com';

    let currentPdfDocument = null;
    let baseFileName = "document";

    // Обработка прикрепления файла
    document.getElementById('pdf-file').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        baseFileName = file.name.replace(/\.[^/.]+\$/, ""); 
        document.getElementById('upload-text').innerText = `📄 Файл прикреплен: ${file.name}`;
        document.getElementById('status').innerText = "⏳ Инициализация документа сервером...";
        document.getElementById('download-all-btn').disabled = true;

        const fileReader = new FileReader();
        fileReader.onload = function() {
            const typedarray = new Uint8Array(this.result);
            
            pdfjsLib.getDocument({data: typedarray}).promise.then(function(pdf) {
                currentPdfDocument = pdf;
                document.getElementById('status').innerText = `✅ Документ готов к обработке! Страниц: ${pdf.numPages}`;
                document.getElementById('download-all-btn').disabled = false;
            }).catch(function(error) {
                document.getElementById('status').innerText = "❌ Ошибка безопасности браузера. Загрузите этот HTML на GitHub Pages.";
                console.error(error);
            });
        };
        fileReader.readAsArrayBuffer(file);
    });

    // Постраничный экспорт
    document.getElementById('download-all-btn').addEventListener('click', async function() {
        if (!currentPdfDocument) return;

        const btn = this;
        btn.disabled = true;
        const statusDiv = document.getElementById('status');
        const canvas = document.getElementById('render-canvas');
        const ctx = canvas.getContext('2d');

        // Коэффициент четкости: 3.0 делает текст идеально резким (300 DPI)
        const HIGH_QUALITY_SCALE = 3.0; 

        for (let i = 1; i <= currentPdfDocument.numPages; i++) {
            statusDiv.innerText = `⏳ Рендеринг и сохранение: страница ${i} из ${currentPdfDocument.numPages}...`;
            
            const page = await currentPdfDocument.getPage(i);
            const viewport = page.getViewport({ scale: HIGH_QUALITY_SCALE });
            
            canvas.height = viewport.height;
            canvas.width = viewport.width;

            const renderContext = {
                canvasContext: ctx,
                viewport: viewport
            };

            await page.render(renderContext).promise;

            // Генерируем изображение в максимальном качестве
            const imgDataUrl = canvas.toDataURL('image/png', 1.0);

            // Скачиваем на компьютер
            const downloadLink = document.createElement('a');
            downloadLink.href = imgDataUrl;
            downloadLink.download = `${baseFileName}_page_${i}.png`;
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        }

        statusDiv.innerText = `🎉 Все страницы успешно скачаны в Загрузки!`;
        btn.disabled = false;
    });
</script>

</body>
</html>
