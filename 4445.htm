<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUPERMARKET: Present Simple vs Continuous</title>
    <style>
        :root {
            --cart-blue: #0984e3;
            --apple-red: #d63031;
            --cheese-gold: #fdcb6e;
            --leaf-green: #00b894;
            --bg-color: #f1f2f6;
            --text-dark: #2d3436;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        #game-card {
            width: 95%;
            max-width: 520px;
            background: #fff;
            border-radius: 40px;
            border: 8px solid var(--cart-blue);
            box-shadow: 0 15px 0px #2980b9;
            padding: 30px;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .header { display: flex; justify-content: space-between; margin-bottom: 20px; align-items: center; }
        .score-pill { background: var(--cheese-gold); padding: 5px 20px; border-radius: 20px; border: 3px solid #2d3436; font-weight: bold; font-size: 1.2rem; }
        .tag { background: var(--leaf-green); color: white; padding: 5px 15px; border-radius: 50px; font-size: 12px; font-weight: bold; text-transform: uppercase; }

        .display-area {
            background: #fdfcf0;
            min-height: 180px;
            border-radius: 30px;
            border: 4px dashed var(--cart-blue);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            padding: 15px;
        }

        .item-emoji { font-size: 55px; margin-bottom: 10px; }
        .sentence { font-size: 21px; font-weight: 700; color: #2d3436; line-height: 1.5; }
        .highlight { color: var(--cart-blue); background: #dff9fb; padding: 2px 10px; border-radius: 8px; border-bottom: 3px solid; font-weight: bold; }

        .btn-grid { display: flex; flex-direction: column; gap: 12px; }

        .btn-choice {
            background: white;
            border: 4px solid #2d3436;
            border-radius: 20px;
            padding: 12px;
            font-size: 1.3rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 5px 0 #2d3436;
            transition: 0.1s;
            color: var(--text-dark);
        }

        .btn-choice:active:not(:disabled) { transform: translateY(3px); box-shadow: none; }
        .btn-choice:disabled { opacity: 0.5; cursor: not-allowed; }

        #progress-bar { width: 100%; height: 12px; background: #eee; border-radius: 10px; margin-top: 25px; border: 2px solid #ccc; overflow: hidden; }
        #progress-fill { width: 0%; height: 100%; background: var(--leaf-green); transition: 0.4s; }

        #win-screen { display: none; }

        /* Анимация летящих сердечек */
        .heart-particle {
            position: absolute;
            font-size: 28px;
            pointer-events: none;
            user-select: none;
            z-index: 5;
            animation: burst 0.8s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes burst {
            0% { transform: translate(0, 0) scale(0) rotate(0deg); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(1.4) rotate(var(--rot)); opacity: 0; }
        }
    </style>
</head>
<body>

<div id="game-card">
    <div id="play-area">
        <div class="header">
            <div class="tag" id="level-tag">Verbs Quiz</div>
            <div class="score-pill">🛒 <span id="score-val">0</span></div>
        </div>

        <div class="display-area">
            <div class="item-emoji" id="emoji-box">🐶</div>
            <div class="sentence" id="sentence-box">The dog <span class="highlight">?</span> food. He's hungry.</div>
        </div>

        <div class="btn-grid" id="btn-container"></div>

        <div id="progress-bar"><div id="progress-fill"></div></div>
    </div>

    <div id="win-screen">
        <h1 style="color: var(--leaf-green); font-size: 38px;">GRAMMAR EXPERT! 🧺</h1>
        <p style="font-size: 1.2rem;">You mastered Stative Verbs and Present tenses perfectly!</p>
        <div style="font-size: 60px; margin: 20px;">🐶📝📺🍳🧹📱</div>
        <button class="btn-choice" onclick="location.reload()" style="width:100%">PLAY AGAIN</button>
    </div>
</div>

<script>
    let score = 0;
    let current = 0;

    // Вопросы полностью перенесены с вашего изображения
    const questions = [
        { s: "The dog <span class='highlight'>...</span> food. He's hungry.", opt: ["needs", "is needing"], ans: "needs", emo: "🐶", hint: "'Need' is a stative verb! We use Present Simple ➔ needs" },
        { s: "I <span class='highlight'>...</span> the answers.", opt: ["don't know", "am not knowing"], ans: "don't know", emo: "📝", hint: "'Know' is a stative verb! It cannot be Continuous ➔ don't know" },
        { s: "<span class='highlight'>...</span> watching films on TV?", opt: ["Do you like", "Are you liking"], ans: "Do you like", emo: "📺", hint: "'Like' represents a state, not an action right now ➔ Do you like" },
        { s: "Where's Dad? He <span class='highlight'>...</span> lunch.", opt: ["is cooking", "cooks"], ans: "is cooking", emo: "🍳", hint: "An action happening right now (Where is he?) ➔ is cooking" },
        { s: "Mum <span class='highlight'>...</span> the beds. Let's help her.", opt: ["is making", "makes"], ans: "is making", emo: "🧹", hint: "An action happening at the moment (Let's help her!) ➔ is making" },
        { s: "<span class='highlight'>...</span> his new phone?", opt: ["Does Dave love", "Is Dave loving"], ans: "Does Dave love", emo: "📱", hint: "'Love' is a stative verb! We don't use -ing here ➔ Does Dave love" }
    ];

    function loadMission() {
        const m = questions[current];
        document.getElementById('emoji-box').innerText = m.emo;
        document.getElementById('sentence-box').innerHTML = m.s.replace("...", "<span class='highlight'>?</span>");
        document.getElementById('progress-fill').style.width = (current / questions.length * 100) + '%';
        
        const btnContainer = document.getElementById('btn-container');
        btnContainer.innerHTML = '';
        
        // Перемешиваем варианты на кнопках для честной проверки
        const currentOptions = [...m.opt].sort(() => Math.random() - 0.5);
        
        currentOptions.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'btn-choice';
            btn.innerText = opt;
            btn.onclick = () => check(opt, btn);
            btnContainer.appendChild(btn);
        });
    }

    function launchHearts() {
        const heartEmojis = ["❤️", "💖", "💝", "💕", "💘"];
        const count = 20;
        const card = document.getElementById('game-card');
        const rect = card.getBoundingClientRect();
        
        const originX = rect.left + rect.width / 2;
        const originY = rect.top + rect.height / 2;

        for (let i = 0; i < count; i++) {
            const heart = document.createElement('div');
            heart.className = 'heart-particle';
            heart.innerText = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
            
            heart.style.left = `${originX}px`;
            heart.style.top = `${originY}px`;

            const angle = Math.random() * Math.PI * 2;
            const distance = 130 + Math.random() * 160;
            const targetX = Math.cos(angle) * distance;
            const targetY = Math.sin(angle) * distance;
            const rotation = Math.random() * 90 - 45;

            heart.style.setProperty('--tx', `${targetX}px`);
            heart.style.setProperty('--ty', `${targetY}px`);
            heart.style.setProperty('--rot', `${rotation}deg`);

            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 800);
        }
    }

    function check(selectedOption, clickedBtn) {
        const currentQuestion = questions[current];
        const allButtons = document.querySelectorAll('.btn-choice');
        
        if (selectedOption === currentQuestion.ans) {
            allButtons.forEach(b => b.disabled = true);
            launchHearts(); // Салют из сердечек!
            
            score += 10;
            current++;
            document.getElementById('score-val').innerText = score;
            
            setTimeout(() => {
                if (current < questions.length) {
                    loadMission();
                } else {
                    showWin();
                }
            }, 600);
        } else {
            const card = document.getElementById('game-card');
            card.style.borderColor = "#d63031";
            setTimeout(() => card.style.borderColor = "#0984e3", 500);
            alert(currentQuestion.hint);
        }
    }

    function showWin() {
        document.getElementById('play-area').style.display = 'none';
        document.getElementById('win-screen').style.display = 'block';
        document.getElementById('progress-fill').style.width = '100%';
    }

    loadMission();
</script>
</body>
</html>
