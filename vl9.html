<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trace, Learn & Play</title>
    <style>
        :root { 
            --bg: #fdfefe; 
            --accent: #2980b9; 
            --btn-green: #2ecc71; 
            --btn-red: #e74c3c;
            --betty-orange: #e67e22;
        }
        body { 
            font-family: 'Comic Sans MS', 'Comic Neue', sans-serif; 
            background: #eef2f7; 
            display: flex; 
            justify-content: center; 
            padding: 20px; 
            margin: 0; 
        }
        
        .card { 
            background: white; 
            width: 100%; 
            max-width: 800px; 
            padding: 30px; 
            border-radius: 40px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            text-align: center; 
            border: 6px solid #aed6f1; 
            position: relative;
        }
        
        .progress { 
            color: var(--accent); 
            font-size: 1.5rem; 
            font-weight: bold; 
            margin-bottom: 5px; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
        }
        
        .image-hint-container {
            height: 110px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px 0;
        }
        
        .emoji-hint { 
            font-size: 6rem; 
            line-height: 1; 
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.1)); 
        }

        /* --- TRACING SECTION --- */
        #canvas-box { 
            position: relative; 
            background: #fff; 
            border: 4px dashed #9bc5e2; 
            border-radius: 30px; 
            margin: 20px auto; 
            width: 100%; 
            max-width: 700px; 
            height: 320px; 
            touch-action: none; 
        }
        canvas { 
            position: absolute; 
            top: 0; left: 0; 
            z-index: 2; 
            cursor: crosshair; 
            width: 100%;
            height: 100%;
        }
        
        .trace-text { 
            position: absolute; 
            width: 100%; 
            top: 50%; 
            transform: translateY(-50%); 
            font-size: 85px; 
            color: #ebf5fb; 
            user-select: none; 
            z-index: 1; 
            letter-spacing: 3px; 
            font-weight: bold; 
            text-align: center; 
            text-transform: lowercase; 
        }

        /* --- QUIZ SECTION --- */
        #quiz-box { display: none; margin: 20px auto; max-width: 600px; }
        .question-text { font-size: 2rem; color: #2d3436; margin-bottom: 20px; font-weight: bold; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        
        .option-btn {
            padding: 20px; font-size: 1.5rem; font-weight: bold; border-radius: 20px; 
            cursor: pointer; border: 3px solid #bdc3c7; background: #f8f9fa; 
            transition: 0.2s; font-family: inherit; color: #2d3436; box-shadow: 0 4px 0 #bdc3c7;
        }
        .option-btn:hover:not(:disabled) { background: #e8f4f8; border-color: #85c1e9; box-shadow: 0 4px 0 #85c1e9; }
        .option-btn:active:not(:disabled) { transform: translateY(4px); box-shadow: none; }
        .option-btn:disabled { cursor: default; }
        .option-btn.correct { background: var(--btn-green) !important; border-color: #27ae60 !important; color: white !important; box-shadow: 0 4px 0 #27ae60 !important; }
        .option-btn.wrong { background: var(--btn-red) !important; border-color: #c0392b !important; color: white !important; box-shadow: 0 4px 0 #c0392b !important; animation: shake 0.4s; }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        /* --- NOTEBOOK SECTION --- */
        #notebook { 
            display: none; 
            padding: 40px 20px; 
            background: #fdf9e7; 
            border: 4px solid #f1c40f; 
            border-radius: 30px; 
            margin: 20px 0; 
        }
        .word-show { font-size: 5rem; font-weight: bold; color: #2d3436; margin-bottom: 15px; text-transform: lowercase; line-height: 1; }
        .instr-text { font-size: 1.8rem; color: #2980b9; font-weight: bold; margin-bottom: 10px; }

        /* --- BUTTONS --- */
        .btn-row { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
        button { 
            padding: 15px 45px; font-size: 1.5rem; font-weight: bold; border-radius: 30px; 
            cursor: pointer; border: none; transition: 0.2s; font-family: inherit; 
        }
        .btn-next { background: var(--btn-green); color: white; box-shadow: 0 6px 0 #27ae60; display: none; }
        .btn-next:active { transform: translateY(4px); box-shadow: none; }
        .btn-clear { background: #ff6b6b; color: white; box-shadow: 0 6px 0 #ee5253; }
        .btn-clear:active { transform: translateY(4px); box-shadow: none; }

        /* --- FINAL SCREEN --- */
        #final-screen { display: none; padding: 40px 20px; }
        h1 { font-size: 3.5rem; color: var(--btn-green); margin-bottom: 10px; }
        p { font-size: 1.8rem; color: #566573; margin-bottom: 25px; }
        .success-msg { color: #27ae60; font-weight: bold; font-size: 1.2rem; margin-top: 15px; display: none; background: #eafaf1; padding: 10px; border-radius: 10px; border: 2px solid #27ae60; }
        
        @media (max-width: 650px) {
            .trace-text { font-size: 50px; }
            .options-grid { grid-template-columns: 1fr; }
            .word-show { font-size: 3rem; }
        }
    </style>
</head>
<body>

<div class="card" id="main-card">
    <div class="progress" id="info">Word 1 of 10</div>
    
    <div class="image-hint-container">
        <div class="emoji-hint" id="visual-element">🚌</div>
    </div>
    
    <div class="instr-text" id="instr">Trace the word! ✍️</div>

    <!-- 1. TRACING -->
    <div id="canvas-box">
        <div class="trace-text" id="trace-text">bus</div>
        <canvas id="drawCanvas" width="700" height="320"></canvas>
    </div>

    <!-- 2. QUIZ -->
    <div id="quiz-box">
        <div class="question-text" id="question-text">___ is a bus.</div>
        <div class="options-grid" id="options-container"></div>
    </div>

    <!-- 3. NOTEBOOK -->
    <div id="notebook">
        <div class="word-show" id="big-word">bus</div>
        <h2 style="color: #e67e22; margin:0; font-size: 2.2rem;">📓 Write it in your notebook!</h2>
    </div>

    <div class="btn-row">
        <button class="btn-clear" id="clear-btn" onclick="clearDraw()">Clear</button>
        <button class="btn-next" id="main-btn" onclick="goNext()">DONE ✨</button>
    </div>
</div>

<div class="card" id="final-screen">
    <h1>🎖️ EXCELLENT!</h1>
    <p id="final-score-text">You scored 0 out of 10</p>
    <p class="success-msg" id="send-msg">Results sent successfully! ✅</p>
    <button class='btn-next' style="display:inline-block; margin-top:20px;" onclick='location.reload()'>START AGAIN</button>
</div>

<script>
    // ==============================================================
    //  CONFIGURATION & DATA
    // ==============================================================
    const TEST_NAME = "Trace & Learn: Transport, Numbers & Plurals";
    let userMistakes = [];
    let score = 0;
    let idx = 0;
    let phase = 0; // 0 = Trace, 1 = Quiz, 2 = Notebook

    // Combined Data: Tracing Words + Grammar Quiz
    const data = [
        { word: "bus", emoji: "🚌", question: "___ is a bus.", options: ["This", "These"], correct: "This" },
        { word: "lorry", emoji: "🚚", question: "___ is a lorry.", options: ["This", "Those"], correct: "This" },
        { word: "helicopter", emoji: "🚁", question: "___ is a helicopter.", options: ["That", "These"], correct: "That" },
        { word: "big", emoji: "📦", question: "The pink box is ___.", options: ["big", "small"], correct: "big" },
        { word: "small", emoji: "📦", question: "The blue box is ___.", options: ["big", "small"], correct: "small" },
        { word: "thirty", emoji: "30", question: "The number is ___.", options: ["thirty", "thirteen"], correct: "thirty" },
        { word: "thirty-two", emoji: "32", question: "The number is ___.", options: ["thirty-two", "twenty-three"], correct: "thirty-two" },
        { word: "forty", emoji: "40", question: "The number is ___.", options: ["forty", "fourteen"], correct: "forty" },
        { word: "forty-six", emoji: "46", question: "The number is ___.", options: ["forty-six", "sixty-four"], correct: "forty-six" },
        { word: "fifty", emoji: "50", question: "The number is ___.", options: ["fifty", "fifteen"], correct: "fifty" }
    ];

    const totalQuestions = data.length;

    // ==============================================================
    //  CANVAS DRAWING LOGIC
    // ==============================================================
    const canvas = document.getElementById('drawCanvas');
    const ctx = canvas.getContext('2d');
    let drawing = false;

    ctx.lineWidth = 9;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#3498db';

    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        // Scale coordinates based on actual canvas size vs CSS size
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        
        const clientX = e.clientX || (e.touches && e.touches[0].clientX);
        const clientY = e.clientY || (e.touches && e.touches[0].clientY);
        
        return { 
            x: (clientX - rect.left) * scaleX, 
            y: (clientY - rect.top) * scaleY 
        };
    }

    function start(e) { drawing = true; ctx.beginPath(); const p = getPos(e); ctx.moveTo(p.x, p.y); }
    function move(e) { if (!drawing) return; e.preventDefault(); const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); }
    function stop() { drawing = false; }

    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    window.addEventListener('mouseup', stop);
    canvas.addEventListener('touchstart', start);
    canvas.addEventListener('touchmove', move);
    canvas.addEventListener('touchend', stop);

    function clearDraw() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

    // ==============================================================
    //  GAME FLOW LOGIC
    // ==============================================================
    function updateUI() {
        if (idx >= data.length) {
            showFinalScreen();
            return;
        }

        const currentItem = data[idx];
        document.getElementById('info').innerText = `Word ${idx + 1} of ${data.length}`;
        document.getElementById('visual-element').innerText = currentItem.emoji;

        if (phase === 0) {
            // TRACE PHASE
            document.getElementById('canvas-box').style.display = 'block';
            document.getElementById('quiz-box').style.display = 'none';
            document.getElementById('notebook').style.display = 'none';
            document.getElementById('clear-btn').style.display = 'inline-block';
            document.getElementById('main-btn').style.display = 'inline-block';
            document.getElementById('main-btn').innerText = "DONE ✨";
            document.getElementById('instr').innerText = "Trace the word! ✍️";
            document.getElementById('trace-text').innerText = currentItem.word;
            clearDraw();
        } 
        else if (phase === 1) {
            // QUIZ PHASE
            document.getElementById('canvas-box').style.display = 'none';
            document.getElementById('quiz-box').style.display = 'block';
            document.getElementById('notebook').style.display = 'none';
            document.getElementById('clear-btn').style.display = 'none';
            document.getElementById('main-btn').style.display = 'none'; // Hidden during quiz
            document.getElementById('instr').innerText = "Answer the question:";
            document.getElementById('question-text').innerText = currentItem.question;

            const container = document.getElementById('options-container');
            container.innerHTML = '';
            const shuffledOpts = [...currentItem.options].sort(() => Math.random() - 0.5);

            shuffledOpts.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(btn, opt, currentItem.correct);
                container.appendChild(btn);
            });
        } 
        else if (phase === 2) {
            // NOTEBOOK PHASE
            document.getElementById('canvas-box').style.display = 'none';
            document.getElementById('quiz-box').style.display = 'none';
            document.getElementById('notebook').style.display = 'block';
            document.getElementById('clear-btn').style.display = 'none';
            document.getElementById('main-btn').style.display = 'inline-block';
            document.getElementById('main-btn').innerText = "NEXT WORD ➡️";
            document.getElementById('instr').innerText = "Now write it on paper:";
            document.getElementById('big-word').innerText = currentItem.word;
        }
    }

    function checkAnswer(btn, selected, correct) {
        const allBtns = document.querySelectorAll('.option-btn');
        allBtns.forEach(b => b.disabled = true);

        if (selected === correct) {
            btn.classList.add('correct');
            score++;
            if (navigator.vibrate) navigator.vibrate(50);
            
            // Move to notebook phase after a short delay
            setTimeout(() => {
                phase = 2;
                updateUI();
            }, 1000);
        } else {
            btn.classList.add('wrong');
            if (!userMistakes.includes(selected)) {
                userMistakes.push(selected);
            }
            if (navigator.vibrate) navigator.vibrate([50, 50, 50]);
            
            allBtns.forEach(b => {
                if (b.innerText === correct) b.classList.add('correct');
            });

            // Move to notebook phase after a longer delay to see the correct answer
            setTimeout(() => {
                phase = 2;
                updateUI();
            }, 2000);
        }
    }

    function goNext() {
        if (phase === 0) {
            phase = 1; // Move to Quiz
        } else if (phase === 2) {
            idx++; // Move to next word
            phase = 0;
        }
        updateUI();
    }

    // ==============================================================
    //  FINAL SCREEN & GOOGLE SHEETS
    // ==============================================================
    function showFinalScreen() {
        document.getElementById('main-card').style.display = 'none';
        document.getElementById('final-screen').style.display = 'block';
        document.getElementById('final-score-text').innerText = `You scored ${score} out of ${totalQuestions}`;
        sendResultsToGoogle();
    }

    async function sendResultsToGoogle() {
        const url = "https://script.google.com/macros/s/AKfycbxZDFh5oa4GAU6RMvWX_OIh0GeLTbolr7P-6cCtbCNT5qiTShRaCYlETAxewsLsnooK/exec";
        
        const params = new URLSearchParams({
            name: TEST_NAME,
            score: score,
            total: totalQuestions,
            mistakes: userMistakes.join(', ')
        });

        try {
            await fetch(url, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: params.toString()
            });
            
            document.getElementById('send-msg').style.display = 'block';
        } catch (error) {
            console.error("Error sending results:", error);
        }
    }

    // Initialize
    updateUI();
</script>

</body>
</html>
