<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotlight 2 · Plurals Mission</title>
    <style>
        :root {
            --sun-yellow: #ffd93e;
            --sky-blue: #6bc6ff;
            --grass-green: #7bc67e;
            --text-dark: #3a3a3a;
            --correct-green: #4caf50;
            --wrong-red: #ff6b6b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Comic Neue', 'Arial Rounded MT Bold', 'Segoe UI', sans-serif;
            background: linear-gradient(180deg, var(--sky-blue) 0%, #c3e8ff 60%, var(--grass-green) 100%);
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            background-attachment: fixed;
        }

        #game-frame {
            background: #ffffff;
            width: 95%;
            max-width: 550px;
            padding: 25px 20px 20px;
            border-radius: 35px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            border: 4px solid #ffeaa7;
            position: relative;
            overflow: hidden;
        }

        #game-frame::before {
            content: "⭐";
            position: absolute;
            top: 10px;
            left: 15px;
            font-size: 2rem;
            opacity: 0.4;
        }
        #game-frame::after {
            content: "🌟";
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 2rem;
            opacity: 0.4;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 10px;
        }

        .badge {
            padding: 10px 18px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 1rem;
            letter-spacing: 0.5px;
        }

        .lvl-badge {
            background: #f0f0f0;
            color: var(--text-dark);
            border: 2px solid #ddd;
        }
        .score-badge {
            background: #ffd93e;
            color: #3a3a3a;
            border: 2px solid #f0c000;
        }

        .emoji-display {
            font-size: 4rem;
            margin: 5px 0;
            line-height: 1.2;
        }

        .word-display {
            font-size: 2.5rem;
            color: var(--text-dark);
            margin: 10px 0;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .instruction {
            color: #888;
            font-size: 1.1rem;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 25px;
        }

        .option-btn {
            background: #fff;
            border: 3px solid #e0e0e0;
            padding: 18px 10px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 18px;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            color: var(--text-dark);
            background: #fafafa;
        }

        .option-btn:hover {
            border-color: var(--sky-blue);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        .option-btn:active {
            transform: scale(0.96);
        }

        .correct {
            background: #c8f7c5 !important;
            color: #2e7d32 !important;
            border-color: #4caf50 !important;
            font-size: 1.4rem !important;
        }

        .wrong {
            background: #ffd6d6 !important;
            color: #c62828 !important;
            border-color: #ff6b6b !important;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(8px); }
            75% { transform: translateX(-5px); }
        }

        .progress-container {
            height: 14px;
            background: #eee;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 5px;
        }

        .progress-fill {
            height: 100%;
            background: var(--correct-green);
            width: 0%;
            transition: 0.4s ease;
            border-radius: 10px;
        }

        #win-screen {
            display: none;
            padding: 20px 0;
        }

        #win-screen h1 {
            font-size: 3rem;
            margin-bottom: 5px;
        }

        #win-screen p {
            font-size: 1.3rem;
            color: #555;
            margin-bottom: 15px;
        }

        .final-score {
            font-size: 1.2rem;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .btn-restart {
            background: var(--sun-yellow);
            color: #3a3a3a;
            border: none;
            padding: 15px 35px;
            border-radius: 25px;
            font-size: 1.2rem;
            cursor: pointer;
            font-weight: bold;
            border: 3px solid #f0c000;
            transition: 0.2s;
            font-family: inherit;
        }

        .btn-restart:hover {
            background: #ffe566;
            transform: translateY(-2px);
        }

        @media (max-width: 400px) {
            .word-display { font-size: 2rem; }
            .option-btn { font-size: 1.1rem; padding: 14px 8px; }
        }
    </style>
</head>
<body>

<div id="game-frame">
    <div id="play-screen">
        <div class="header">
            <div class="badge lvl-badge">📝 Word: <span id="current-idx">1</span>/12</div>
            <div class="badge score-badge">⭐ Score: <span id="score">0</span></div>
        </div>

        <div class="emoji-display" id="emoji-icon">🐱</div>
        <div class="instruction">Choose the correct plural form:</div>
        <div class="word-display" id="main-word">Cat</div>

        <div class="options-grid" id="options">
            <!-- Buttons generated by JS -->
        </div>

        <div class="progress-container">
            <div class="progress-fill" id="progress"></div>
        </div>
    </div>

    <div id="win-screen">
        <div class="emoji-display">🏆</div>
        <h1>Super! 🎉</h1>
        <p>You are the Plurals Champion!</p>
        <div class="final-score">⭐ Your Score: <span id="final-score">0</span> / 120</div>
        <button class="btn-restart" onclick="location.reload()">🔄 Play Again</button>
    </div>
</div>

<script>
    // 12 вопросов по лексике Spotlight 2 (животные, игрушки, школа, еда)
    const questions = [
        { word: "Cat", emoji: "🐱", options: ["Cats", "Cates"], correct: "Cats" },
        { word: "Dog", emoji: "🐶", options: ["Doges", "Dogs"], correct: "Dogs" },
        { word: "Frog", emoji: "🐸", options: ["Frogs", "Froges"], correct: "Frogs" },
        { word: "Fox", emoji: "🦊", options: ["Foxs", "Foxes"], correct: "Foxes" },
        { word: "Baby", emoji: "👶", options: ["Babys", "Babies"], correct: "Babies" },
        { word: "Pen", emoji: "🖊️", options: ["Pens", "Penes"], correct: "Pens" },
        { word: "Box", emoji: "📦", options: ["Boxs", "Boxes"], correct: "Boxes" },
        { word: "Teddy", emoji: "🧸", options: ["Teddys", "Teddies"], correct: "Teddies" },
        { word: "Dish", emoji: "🍽️", options: ["Dishs", "Dishes"], correct: "Dishes" },
        { word: "Apple", emoji: "🍎", options: ["Apples", "Appleses"], correct: "Apples" },
        { word: "Toy", emoji: "🧩", options: ["Toys", "Toies"], correct: "Toys" },
        { word: "Banana", emoji: "🍌", options: ["Bananas", "Bananaes"], correct: "Bananas" }
    ];

    let currentIdx = 0;
    let score = 0;

    function loadQuestion() {
        const q = questions[currentIdx];
        document.getElementById('main-word').innerText = q.word;
        document.getElementById('emoji-icon').innerText = q.emoji;
        document.getElementById('current-idx').innerText = currentIdx + 1;
        
        const optionsEl = document.getElementById('options');
        optionsEl.innerHTML = '';
        
        q.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(btn, opt);
            optionsEl.appendChild(btn);
        });

        const progress = (currentIdx / questions.length) * 100;
        document.getElementById('progress').style.width = progress + '%';
    }

    function checkAnswer(btn, choice) {
        const correct = questions[currentIdx].correct;
        const allBtns = document.querySelectorAll('.option-btn');
        
        allBtns.forEach(b => b.disabled = true);

        if (choice === correct) {
            btn.classList.add('correct');
            score += 10;
            document.getElementById('score').innerText = score;
        } else {
            btn.classList.add('wrong');
            allBtns.forEach(b => {
                if(b.innerText === correct) b.classList.add('correct');
            });
        }

        setTimeout(() => {
            currentIdx++;
            if (currentIdx < questions.length) {
                loadQuestion();
            } else {
                showWin();
            }
        }, 1400);
    }

    function showWin() {
        document.getElementById('play-screen').style.display = 'none';
        document.getElementById('win-screen').style.display = 'block';
        document.getElementById('final-score').innerText = score;
        document.getElementById('progress').style.width = '100%';
    }

    loadQuestion();
</script>

</body>
</html>
