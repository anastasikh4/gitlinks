<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starlight 2: Round-up Test B</title>
    <style>
        :root {
            --cart-blue: #0984e3;
            --apple-red: #d63031;
            --cheese-gold: #fdcb6e;
            --leaf-green: #00b894;
            --bg-color: #f1f2f6;
            --text-dark: #2c3e50;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        #game-card {
            width: 95%;
            max-width: 550px;
            background: #fff;
            border-radius: 40px;
            border: 8px solid var(--cart-blue);
            box-shadow: 0 15px 0px #2980b9;
            padding: 30px;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            align-items: center;
        }

        .score-pill {
            background: var(--cheese-gold);
            padding: 5px 20px;
            border-radius: 20px;
            border: 3px solid #2d3436;
            font-weight: bold;
            font-size: 1.2rem;
            color: var(--text-dark);
        }

        .tag {
            background: var(--leaf-green);
            color: white;
            padding: 5px 15px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .display-area {
            background: #fdfcf0;
            min-height: 180px;
            border-radius: 30px;
            border: 4px dashed var(--cart-blue);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            padding: 15px;
        }

        .item-emoji {
            font-size: 55px;
            margin-bottom: 10px;
        }

        .sentence {
            font-size: 20px;
            font-weight: 700;
            color: #2d3436;
            line-height: 1.5;
            text-align: center;
        }

        .highlight {
            color: var(--cart-blue);
            background: #dff9fb;
            padding: 2px 10px;
            border-radius: 8px;
            border-bottom: 3px solid;
            font-weight: bold;
        }

        .btn-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-choice {
            background: white;
            border: 4px solid #2d3436;
            border-radius: 20px;
            padding: 14px;
            font-size: 1.2rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 5px 0 #2d3436;
            transition: 0.1s;
            color: var(--text-dark);
            text-align: left;
            padding-left: 20px;
        }

        .btn-choice:active:not(:disabled) {
            transform: translateY(3px);
            box-shadow: none;
        }

        .btn-choice:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #progress-bar {
            width: 100%;
            height: 12px;
            background: #eee;
            border-radius: 10px;
            margin-top: 25px;
            border: 2px solid #ccc;
            overflow: hidden;
        }

        #progress-fill {
            width: 0%;
            height: 100%;
            background: var(--leaf-green);
            transition: 0.4s;
        }

        #win-screen {
            display: none;
        }

        .heart-particle {
            position: absolute;
            font-size: 28px;
            pointer-events: none;
            user-select: none;
            z-index: 5;
            animation: burst 0.8s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes burst {
            0% { transform: translate(0, 0) scale(0) rotate(0deg); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(1.4) rotate(var(--rot)); opacity: 0; }
        }

        @media (max-width: 480px) {
            #game-card { padding: 20px; }
            .sentence { font-size: 17px; }
            .btn-choice { font-size: 1rem; padding: 12px 16px; }
            .item-emoji { font-size: 40px; }
            .score-pill { font-size: 1rem; padding: 4px 14px; }
        }
    </style>
</head>
<body>

<div id="game-card">
    <div id="play-area">
        <div class="header">
            <div class="tag" id="level-tag">Round-up Test B</div>
            <div class="score-pill">⭐ <span id="score-val">0</span></div>
        </div>

        <div class="display-area">
            <div class="item-emoji" id="emoji-box">Amy 👧</div>
            <div class="sentence" id="sentence-box">Loading intel...</div>
        </div>

        <div class="btn-grid" id="btn-container"></div>

        <div id="progress-bar"><div id="progress-fill"></div></div>
    </div>

    <div id="win-screen">
        <h1 style="color: var(--leaf-green); font-size: 36px;">TEST B COMPLETE! 🏆</h1>
        <p style="font-size: 1.2rem; color: var(--text-dark);">Excellent reading, writing and conversation skills!</p>
        <div style="font-size: 60px; margin: 20px;">👧🐶✍️🎒📖</div>
        <button class="btn-choice" onclick="location.reload()" style="width:100%; text-align:center; padding-left:0;">PRACTICE AGAIN</button>
    </div>
</div>

<script>
    let score = 0;
    let current = 0;
    let shuffledMissions = [];

    // 10 questions – exactly 2 options each
    const baseMissions = [
        // Dialogue 1
        {
            m: "MISSION 1: TALK",
            s: "A: What's that?<br>B: ...",
            opt: ["It's a sharpener.", "Yes, it is."],
            ans: "It's a sharpener.",
            emo: "✏️❓",
            hint: "What's that? asks for an object name ➔ It's a sharpener."
        },
        // Dialogue 2
        {
            m: "MISSION 1: TALK",
            s: "A: Is that Mona's rubber?<br>B: ...",
            opt: ["No, it's Emma's.", "No, it's Emma."],
            ans: "No, it's Emma's.",
            emo: "🧽❓",
            hint: "Mona's rubber needs a possessive answer too ➔ Emma's"
        },
        // Dialogue 3
        {
            m: "MISSION 1: TALK",
            s: "A: What's your name?<br>B: ...",
            opt: ["I'm Mona.", "Nice to meet you."],
            ans: "I'm Mona.",
            emo: "👧❓",
            hint: "What's your name? asks directly for a name ➔ I'm Mona."
        },
        // Dialogue 4
        {
            m: "MISSION 1: TALK",
            s: "A: Look at Lee's pencil.<br>B: ...",
            opt: ["It's so funny.", "They're so funny."],
            ans: "It's so funny.",
            emo: "✏️👀",
            hint: "A pencil is singular (just 1 item) ➔ It's so funny."
        },
        // Dialogue 5 (new)
        {
            m: "MISSION 1: TALK",
            s: "A: Are these your books?<br>B: ...",
            opt: ["Yes, they are.", "Yes, it is."],
            ans: "Yes, they are.",
            emo: "📚❓",
            hint: "'books' is plural, so we need 'they are' ➔ Yes, they are."
        },
        // Amy's blog 1
        {
            m: "MISSION 2: TEXT",
            s: "Hi! My name <span class='highlight'>0) is</span> Amy.<br>I'm <span class='highlight'>1) ...</span> years old.",
            opt: ["nine", "black"],
            ans: "nine",
            emo: "👧🎂",
            hint: "The only number among options ➔ nine."
        },
        // Amy's blog 2
        {
            m: "MISSION 2: TEXT",
            s: "This is <span class='highlight'>2) ...</span> dog, Fluffy.",
            opt: ["my", "dog"],
            ans: "my",
            emo: "🐶👋",
            hint: "Possessive needed ➔ my dog."
        },
        // Amy's blog 3
        {
            m: "MISSION 2: TEXT",
            s: "Fluffy is <span class='highlight'>3) ...</span> and white.",
            opt: ["black", "nine"],
            ans: "black",
            emo: "🐕🐾",
            hint: "Color description ➔ black and white."
        },
        // Amy's blog 4
        {
            m: "MISSION 2: TEXT",
            s: "I love <span class='highlight'>4) ...</span> dog!",
            opt: ["my", "is"],
            ans: "my",
            emo: "❤️🐕",
            hint: "Finishing the statement ➔ I love my dog!"
        },
        // Amy's blog 5 (new)
        {
            m: "MISSION 2: TEXT",
            s: "Fluffy has <span class='highlight'>5) ...</span> big ears.",
            opt: ["two", "four"],
            ans: "two",
            emo: "🐕👂",
            hint: "Dogs usually have two ears ➔ two."
        }
    ];

    // Shuffle array helper
    function shuffleArray(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    // Load missions in shuffled order, with shuffled options (2 options, swapped randomly)
    function loadMission() {
        const m = shuffledMissions[current];
        document.getElementById('level-tag').innerText = m.m;
        document.getElementById('emoji-box').innerText = m.emo;
        document.getElementById('sentence-box').innerHTML = m.s;
        document.getElementById('progress-fill').style.width = (current / shuffledMissions.length * 100) + '%';

        const btnContainer = document.getElementById('btn-container');
        btnContainer.innerHTML = '';

        // Shuffle the two options
        const shuffledOptions = shuffleArray(m.opt);

        shuffledOptions.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'btn-choice';
            btn.innerText = opt;
            btn.onclick = () => check(opt, btn);
            btnContainer.appendChild(btn);
        });
    }

    function launchHearts() {
        const heartEmojis = ["❤️", "💖", "💝", "💕", "💘"];
        const count = 20;
        const card = document.getElementById('game-card');
        const rect = card.getBoundingClientRect();

        const originX = rect.left + rect.width / 2;
        const originY = rect.top + rect.height / 2;

        for (let i = 0; i < count; i++) {
            const heart = document.createElement('div');
            heart.className = 'heart-particle';
            heart.innerText = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];

            heart.style.left = `${originX}px`;
            heart.style.top = `${originY}px`;

            const angle = Math.random() * Math.PI * 2;
            const distance = 130 + Math.random() * 160;
            const targetX = Math.cos(angle) * distance;
            const targetY = Math.sin(angle) * distance;
            const rotation = Math.random() * 90 - 45;

            heart.style.setProperty('--tx', `${targetX}px`);
            heart.style.setProperty('--ty', `${targetY}px`);
            heart.style.setProperty('--rot', `${rotation}deg`);

            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 800);
        }
    }

    function check(selectedOption, clickedBtn) {
        const currentQuestion = shuffledMissions[current];
        const allButtons = document.querySelectorAll('.btn-choice');

        if (selectedOption === currentQuestion.ans) {
            allButtons.forEach(b => b.disabled = true);
            launchHearts();

            score += 10;
            current++;
            document.getElementById('score-val').innerText = score;

            setTimeout(() => {
                if (current < shuffledMissions.length) {
                    loadMission();
                } else {
                    showWin();
                }
            }, 600);
        } else {
            const card = document.getElementById('game-card');
            card.style.borderColor = "#d63031";
            setTimeout(() => card.style.borderColor = "#0984e3", 500);
            alert(currentQuestion.hint);
        }
    }

    function showWin() {
        document.getElementById('play-area').style.display = 'none';
        document.getElementById('win-screen').style.display = 'block';
        document.getElementById('progress-fill').style.width = '100%';
        setTimeout(launchHearts, 300);
        setTimeout(launchHearts, 700);
    }

    // Shuffle mission order at start
    shuffledMissions = shuffleArray(baseMissions);
    loadMission();
</script>

</body>
</html>
