<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Grand Prix Lexis · Fill in the Blank</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --duo-green: #58cc02;
            --duo-green-shadow: #46a302;
            --duo-red: #ff4b4b;
            --duo-red-shadow: #ea2b2b;
            --duo-blue: #1cb0f6;
            --duo-blue-shadow: #1899d6;
            --duo-gray: #afafaf;
            --duo-light-gray: #e5e5e5;
            --duo-text: #3c3c3c;
            --duo-bg: #ffffff;
            --duo-card-bg: #f7f7f7;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', -apple-system, sans-serif;
            user-select: none;
        }
        body {
            background-color: var(--duo-bg);
            color: var(--duo-text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px 16px;
        }
        .quiz-container { width: 100%; max-width: 500px; display: flex; flex-direction: column; flex-grow: 1; }
        .top-bar { display: flex; align-items: center; gap: 16px; margin-bottom: 30px; width: 100%; }
        .exit-btn { font-size: 28px; color: var(--duo-gray); cursor: pointer; background: none; border: none; font-weight: bold; line-height: 1; }
        .progress-track { background-color: var(--duo-light-gray); height: 16px; border-radius: 16px; flex-grow: 1; overflow: hidden; position: relative; }
        .progress-fill { background-color: var(--duo-green); height: 100%; width: 0%; border-radius: 16px; transition: width 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1); }
        .quiz-card { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; animation: cardSlideIn 0.3s ease-out; }
        @keyframes cardSlideIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .prompt-label { font-size: 0.95rem; color: var(--duo-gray); text-transform: uppercase; font-weight: 800; letter-spacing: 0.8px; margin-bottom: 12px; }
        .sentence-box { font-size: 1.35rem; font-weight: 800; line-height: 1.6; margin-bottom: 35px; color: #2b2b2b; background-color: var(--duo-card-bg); padding: 24px; border-radius: 20px; border: 2px solid var(--duo-light-gray); text-align: center; }
        .blank-space { color: var(--duo-blue); border-bottom: 3px dashed var(--duo-blue); padding: 0 8px; font-weight: 900; transition: all 0.2s; }
        .options-list { display: flex; flex-direction: column; gap: 14px; margin-bottom: 24px; }
        .option-card { background-color: #ffffff; border: 2px solid var(--duo-light-gray); border-bottom: 5px solid var(--duo-light-gray); border-radius: 16px; padding: 16px 20px; font-size: 1.1rem; font-weight: 700; color: var(--duo-text); cursor: pointer; text-align: left; position: relative; outline: none; -webkit-tap-highlight-color: transparent; }
        .option-card:active:not(.disabled) { transform: translateY(4px); border-bottom-width: 1px; }
        .option-card.correct-glow { background-color: #d7ffb8 !important; border-color: #58cc02 !important; border-bottom-color: #46a302 !important; color: #2d6a0a !important; }
        .option-card.wrong-glow { background-color: #ffd8d8 !important; border-color: #ff4b4b !important; border-bottom-color: #ea2b2b !important; color: #b91c1c !important; }
        .option-card.disabled { pointer-events: none; }
        .shake-effect { animation: structuralShake 0.4s ease-in-out; }
        @keyframes structuralShake { 0%,100%{ transform: translateX(0); } 20%,60%{ transform: translateX(-12px); } 40%,80%{ transform: translateX(12px); } }
        .feedback-sheet { position: fixed; bottom: 0; left: 0; right: 0; padding: 24px 16px 36px 16px; display: flex; justify-content: center; transform: translateY(100%); transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1); z-index: 100; box-shadow: 0 -4px 15px rgba(0,0,0,0.05); }
        .feedback-sheet.revealed { transform: translateY(0); }
        .feedback-content { width: 100%; max-width: 500px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
        .feedback-message { display: flex; flex-direction: column; font-weight: 900; font-size: 1.3rem; }
        .feedback-message span { font-weight: 700; font-size: 0.95rem; margin-top: 4px; }
        .feedback-sheet.correct-state { background-color: #d7ffb8; border-top: 2px solid #a5ed6e; }
        .feedback-sheet.correct-state .feedback-message { color: #46a302; }
        .feedback-sheet.error-state { background-color: #ffd8d8; border-top: 2px solid #ff9e9e; }
        .feedback-sheet.error-state .feedback-message { color: #ea2b2b; }
        .action-btn { border: none; border-radius: 16px; padding: 16px 32px; font-size: 1rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.8px; cursor: pointer; color: #ffffff; box-shadow: 0 4px 0 rgba(0,0,0,0.15); }
        .feedback-sheet.correct-state .action-btn { background-color: var(--duo-green); box-shadow: 0 4px 0 var(--duo-green-shadow); }
        .feedback-sheet.error-state .action-btn { background-color: var(--duo-red); box-shadow: 0 4px 0 var(--duo-red-shadow); }
        .action-btn:active { transform: translateY(4px); box-shadow: none; }
        .summary-card { text-align: center; background: #ffffff; padding: 40px 24px; border-radius: 24px; border: 2px solid var(--duo-light-gray); box-shadow: 0 8px 0 var(--duo-light-gray); animation: cardSlideIn 0.4s ease-out; }
        .summary-headline { font-size: 1.8rem; font-weight: 900; color: var(--duo-blue); margin-bottom: 8px; }
        .badge-sub { font-size: 1.1rem; color: var(--duo-gray); font-weight: 700; margin-bottom: 24px; }
        .tally-score { font-size: 4.5rem; font-weight: 900; color: var(--duo-green); margin: 24px 0; line-height: 1; }
        .summary-card .action-btn { background-color: var(--duo-blue); box-shadow: 0 4px 0 var(--duo-blue-shadow); width: 100%; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
<div class="quiz-container">
    <div class="top-bar" id="top-bar">
        <button class="exit-btn" onclick="triggerRestart()">×</button>
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    </div>
    <div id="quiz-card-anchor" class="quiz-card"></div>
</div>
<div class="feedback-sheet" id="feedback-overlay">
    <div class="feedback-content">
        <div class="feedback-message" id="feedback-message"></div>
        <button class="action-btn" id="continue-btn" onclick="moveToNextStep()">Continue</button>
    </div>
</div>
<script>
    // Lexis provided by the user – sentences with one key word blanked
    const quizDatabase = [
        { q: "A woman in a ________ has a Japanese car.", a: "helmet", options: ["helmet", "beard", "flag", "news"] },
        { q: "A German man will stand with a ________.", a: "flag", options: ["flag", "car", "helmet", "race"] },
        { q: "A man with a dark ________ was a second driver.", a: "beard", options: ["beard", "helmet", "news", "TV"] },
        { q: "A Brazilian woman is listening to ________.", a: "news", options: ["news", "race", "flag", "tomorrow"] },
        { q: "He will ________ and listen to the race on the TV.", a: "watch", options: ["watch", "stand", "listen", "drive"] },
        { q: "Drivers were on the ________.", a: "track", options: ["track", "car", "flag", "tomorrow"] },
        { q: "Tomorrow they will ________ again.", a: "race", options: ["race", "watch", "listen", "stand"] }
    ];

    let randomizedQueue = [];
    let trackPointer = 0;
    let scoreTally = 0;
    let isAnswered = false;

    function startQuizSession() {
        randomizedQueue = [...quizDatabase].sort(() => Math.random() - 0.5);
        trackPointer = 0; scoreTally = 0; isAnswered = false;
        document.getElementById('top-bar').classList.remove('hidden');
        displayActiveQuestionCard();
    }
    function displayActiveQuestionCard() {
        isAnswered = false;
        document.getElementById('feedback-overlay').className = 'feedback-sheet';
        const activeItem = randomizedQueue[trackPointer];
        const progressPercentage = (trackPointer / randomizedQueue.length) * 100;
        document.getElementById('progress-fill').style.width = `${progressPercentage}%`;
        const formattedQuestion = activeItem.q.replace('________', '<span class="blank-space" id="active-blank">______</span>');
        const mixedOptions = [...activeItem.options].sort(() => Math.random() - 0.5);
        const frameNode = document.getElementById('quiz-card-anchor');
        frameNode.innerHTML = `<div class="prompt-label">Complete the sentence</div><div class="sentence-box">${formattedQuestion}</div><div class="options-list">${mixedOptions.map(opt => `<button class="option-card" onclick="validateSelection(this, '${opt.replace(/'/g, "\\'")}')">${opt}</button>`).join('')}</div>`;
    }
    function validateSelection(clickedButton, selectedValue) {
        if (isAnswered) return; isAnswered = true;
        const activeItem = randomizedQueue[trackPointer];
        const isMatchCorrect = (selectedValue === activeItem.a);
        const overlayNode = document.getElementById('feedback-overlay');
        const textNode = document.getElementById('feedback-message');
        const rootCardNode = document.getElementById('quiz-card-anchor');
        document.querySelectorAll('.option-card').forEach(card => { card.classList.add('disabled'); if (card.innerText.trim() === activeItem.a) card.classList.add('correct-glow'); });
        const blankSpace = document.getElementById('active-blank');
        if (isMatchCorrect) {
            scoreTally++; clickedButton.classList.add('correct-glow');
            textNode.innerHTML = 'Excellent! ✅'; overlayNode.className = 'feedback-sheet revealed correct-state';
            if (blankSpace) { blankSpace.innerText = activeItem.a; blankSpace.style.color = 'var(--duo-green)'; blankSpace.style.borderColor = 'var(--duo-green)'; }
        } else {
            clickedButton.classList.add('wrong-glow');
            rootCardNode.classList.add('shake-effect'); if (navigator.vibrate) navigator.vibrate(150);
            setTimeout(() => rootCardNode.classList.remove('shake-effect'), 400);
            textNode.innerHTML = `Correct answer: <span>${activeItem.a}</span>`; overlayNode.className = 'feedback-sheet revealed error-state';
            if (blankSpace) { blankSpace.innerText = activeItem.a; blankSpace.style.color = 'var(--duo-red)'; blankSpace.style.borderColor = 'var(--duo-red)'; }
        }
    }
    function moveToNextStep() {
        trackPointer++;
        if (trackPointer < randomizedQueue.length) displayActiveQuestionCard();
        else renderFinalSummaryView();
    }
    function renderFinalSummaryView() {
        document.getElementById('progress-fill').style.width = '100%';
        document.getElementById('feedback-overlay').className = 'feedback-sheet';
        document.getElementById('top-bar').classList.add('hidden');
        let milestoneTitle = "Keep Practicing!";
        if (scoreTally === randomizedQueue.length) milestoneTitle = "Perfect Lexis! 🏆";
        else if (scoreTally >= 5) milestoneTitle = "Great Job! 🌟";
        else if (scoreTally >= 3) milestoneTitle = "Good Effort! 👍";
        const frameNode = document.getElementById('quiz-card-anchor');
        frameNode.innerHTML = `<div class="summary-card"><div class="summary-headline">${milestoneTitle}</div><div class="badge-sub">You completed the lexis challenge!</div><div class="tally-score">${scoreTally}/${randomizedQueue.length}</div><button class="action-btn" onclick="startQuizSession()">Try Again</button></div>`;
    }
    function triggerRestart() { if (confirm("Restart the quiz?")) startQuizSession(); }
    window.addEventListener('DOMContentLoaded', startQuizSession);
</script>
</body>
</html>
