<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Subjects Quiz</title>
    <style>
        :root {
            --quiz-purple: #461a42;
            --quiz-light-purple: #8854d0;
            --quiz-green: #26de81;
            --quiz-red: #eb3b5a;
            --white: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--quiz-purple);
            color: var(--white);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .quiz-container {
            background: var(--white);
            color: #333;
            width: 100%;
            max-width: 600px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            text-align: center;
        }

        /* --- QUIZ SECTION --- */
        .header {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
        }

        .progress-container {
            width: 100%;
            background: #eee;
            height: 15px;
            border-radius: 10px;
            overflow: hidden;
        }

        #progress-bar {
            height: 100%;
            width: 0%;
            background: var(--quiz-green);
            transition: width 0.4s ease;
        }

        /* Question Display */
        .text-display {
            background: #fafafa;
            padding: 30px 20px;
            border-radius: 15px;
            border: 3px dashed #dfe4ea;
            margin-bottom: 25px;
            font-size: 1.5rem;
            line-height: 1.4;
            color: #2c3e50;
            font-weight: bold;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Answer Options */
        .options-area {
            display: flex;
            flex-direction: column;
            gap: 12px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .option-btn {
            padding: 18px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            transition: 0.2s;
            border: 3px solid #bdc3c7;
            background: #fafafa;
            color: #333;
            font-family: inherit;
            text-align: left;
        }

        .option-btn:hover:not(:disabled) {
            background: #e6f7ff;
            border-color: #3498db;
            transform: scale(1.02);
        }

        .option-btn.correct {
            background: #e8f8f0;
            border-color: var(--quiz-green);
            color: var(--quiz-green);
        }

        .option-btn.wrong {
            background: #fff0f0;
            border-color: var(--quiz-red);
            color: var(--quiz-red);
        }

        .option-btn:disabled {
            opacity: 0.8;
            cursor: default;
            transform: none;
        }

        /* Buttons & Feedback */
        .action-buttons {
            display: flex;
            justify-content: center;
        }

        .btn-next {
            background: var(--quiz-green);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            display: none;
            width: 100%;
        }
        .btn-next:hover { background: #20bf6b; }

        #feedback {
            margin-bottom: 15px;
            font-weight: bold;
            min-height: 30px;
            font-size: 1.1rem;
        }

        .final-screen h1 { font-size: 4rem; margin-bottom: 10px; }
        
    </style>
</head>
<body>

<div class="quiz-container" id="quiz-box">
    
    <div class="header">
        <div class="progress-container"><div id="progress-bar"></div></div>
    </div>

    <div id="content">
        <div class="text-display" id="question-text">
            Loading...
        </div>
        
        <div class="options-area" id="options-area">
            <!-- Options generated by JS -->
        </div>
    </div>

    <div id="feedback"></div>
    
    <div class="action-buttons">
        <button class="btn-next" id="next-btn" onclick="handleNext()">NEXT ➡️</button>
    </div>
</div>

<script>
    // 14 Questions based on School Subjects
    const questions = [
        {
            text: "🔬 We can do experiments. It's interesting. What subject is this?",
            options: ["Science", "Art"],
            correct: 0,
            explanation: "Science involves doing experiments!"
        },
        {
            text: "🏛️ We can learn about the past. What subject is this?",
            options: ["Geography", "History"],
            correct: 1,
            explanation: "History is the study of the past."
        },
        {
            text: "⚽ We can play football. What subject is this?",
            options: ["Music", "PE (Physical Education)"],
            correct: 1,
            explanation: "We do sports and exercise in PE."
        },
        {
            text: "💻 We can play computer games. What subject is this?",
            options: ["Computer Studies", "Maths"],
            correct: 0,
            explanation: "Computer Studies teaches us about computers and IT."
        },
        {
            text: "🎹 We can play the piano and the guitar. What subject is this?",
            options: ["Art", "Music"],
            correct: 1,
            explanation: "We learn to play instruments in Music class."
        },
        {
            text: "🌍 We can learn about different countries. What subject is this?",
            options: ["Geography", "Science"],
            correct: 0,
            explanation: "Geography is the study of the Earth and its countries."
        },
        {
            text: "🔢 We can learn about numbers and shapes. What subject is this?",
            options: ["English", "Maths"],
            correct: 1,
            explanation: "Maths is all about numbers, shapes, and problem-solving."
        },
        {
            text: "🇫🇷 We can learn to speak the French language. What subject is this?",
            options: ["PE", "French"],
            correct: 1,
            explanation: "In French class, you learn to speak and write French."
        },
        {
            text: "🎨 We can draw pictures and paint with colours. What subject is this?",
            options: ["Art", "History"],
            correct: 0,
            explanation: "Art class is for drawing, painting, and being creative."
        },
        {
            text: "📚 We read books, learn new words, and write stories. What subject is this?",
            options: ["English", "Maths"],
            correct: 0,
            explanation: "English class focuses on reading, writing, and grammar."
        },
        {
            text: "🌿 We learn about plants, animals, and nature. What subject is this?",
            options: ["Science", "Geography"],
            correct: 0,
            explanation: "Science includes learning about biology and the natural world."
        },
        {
            text: "🏃‍♀️ We learn to run fast and jump in the gym. What subject is this?",
            options: ["PE (Physical Education)", "Music"],
            correct: 0,
            explanation: "PE is all about physical exercise and sports."
        },
        {
            text: "👑 We learn about kings, queens, and important events. What subject is this?",
            options: ["History", "English"],
            correct: 0,
            explanation: "History teaches us about past events and rulers."
        },
        {
            text: "⌨️ We learn how to type and use the internet safely. What subject is this?",
            options: ["Computer Studies", "Art"],
            correct: 0,
            explanation: "Computer Studies teaches us IT skills."
        }
    ];

    let currentQ = 0;
    let score = 0;
    let isAnswered = false;
    let currentShuffledOptions = [];

    // Fisher-Yates Shuffle algorithm to mix options
    function shuffleArray(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex !== 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    }

    function loadQuestion() {
        const q = questions[currentQ];
        
        // Update UI
        document.getElementById('progress-bar').style.width = ((currentQ + 1) / questions.length) * 100 + "%";
        document.getElementById('question-text').innerText = q.text;
        document.getElementById('feedback').innerText = '';
        document.getElementById('next-btn').style.display = 'none';
        isAnswered = false;

        // Prepare options for shuffling
        let mappedOptions = q.options.map((text, index) => {
            return { text: text, isCorrect: index === q.correct };
        });

        // Shuffle the options
        currentShuffledOptions = shuffleArray(mappedOptions);

        // Generate Options in the UI
        const optionsArea = document.getElementById('options-area');
        optionsArea.innerHTML = '';
        
        currentShuffledOptions.forEach((option) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = option.text;
            btn.onclick = () => checkAnswer(option.isCorrect, btn);
            optionsArea.appendChild(btn);
        });
    }

    function checkAnswer(isCorrect, selectedBtn) {
        if (isAnswered) return;
        isAnswered = true;

        const q = questions[currentQ];
        const feedback = document.getElementById('feedback');
        const allBtns = document.querySelectorAll('.option-btn');

        // Disable all buttons
        allBtns.forEach(btn => btn.disabled = true);

        if (isCorrect) {
            // Correct Answer Selected
            score++;
            selectedBtn.classList.add('correct');
            feedback.innerHTML = "Awesome! ✅";
            feedback.style.color = "var(--quiz-green)";
        } else {
            // Wrong Answer Selected
            selectedBtn.classList.add('wrong');
            
            // Find and highlight the correct answer
            allBtns.forEach((btn, index) => {
                if (currentShuffledOptions[index].isCorrect) {
                    btn.classList.add('correct');
                }
            });
            
            feedback.innerHTML = "Oops! " + q.explanation;
            feedback.style.color = "var(--quiz-red)";
        }

        document.getElementById('next-btn').style.display = 'block';
    }

    function handleNext() {
        currentQ++;
        if (currentQ < questions.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        document.getElementById('progress-bar').style.width = "100%";
        document.getElementById('quiz-box').innerHTML = `
            <div class="final-screen">
                <h1>🏆</h1>
                <h2>Great Job!</h2>
                <p style="font-size: 1.5rem; margin-bottom: 25px;">You got <strong>${score} / ${questions.length}</strong> right!</p>
                <button class="btn-next" style="display:inline-block;" onclick="location.reload()">PLAY AGAIN 🔄</button>
            </div>
        `;
    }

    // Initialize
    loadQuestion();
</script>

</body>
</html>
