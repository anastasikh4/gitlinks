<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Quest: Grammar & Communication Master</title>
    <style>
        :root { 
            --main-bg: #1a1a2e; 
            --card-bg: #ffffff; 
            --gold: #f1c40f; 
            --text: #2c3e50; 
            --primary-blue: #3498db;
            --success-green: #2ecc71;
            --error-red: #e74c3c;
        }
        body { 
            font-family: 'Arial Rounded MT Bold', 'Helvetica', sans-serif; 
            background: var(--main-bg); 
            color: var(--text); 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        
        .game-ui { 
            background: #16213e; 
            color: white; 
            padding: 15px 30px; 
            border-radius: 50px; 
            border: 3px solid var(--gold); 
            margin-bottom: 20px; 
            font-size: 20px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.5); 
            width: fit-content; 
            font-weight: bold;
        }
        
        .card { 
            background: var(--card-bg); 
            width: 100%; 
            max-width: 550px; 
            padding: 25px; 
            border-radius: 20px; 
            text-align: center; 
            box-shadow: 0 10px 0 #bdc3c7; 
        }
        
        .image-container { 
            width: 100%; 
            height: 180px; 
            background: #e2e8f0; 
            border-radius: 15px; 
            margin-bottom: 15px; 
            overflow: hidden; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 75px; 
        }
        
        .sentence { 
            font-size: 20px; 
            font-weight: bold; 
            margin: 15px 0; 
            min-height: 60px; 
            line-height: 1.6;
            color: #34495e;
        }
        
        .options { 
            display: flex; 
            gap: 12px; 
            justify-content: center; 
            flex-direction: column;
            margin-top: 15px; 
        }
        
        .btn { 
            padding: 14px 20px; 
            font-size: 17px; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            color: white; 
            transition: all 0.2s; 
            font-weight: bold; 
            text-align: left;
            box-shadow: 0 5px 0 #2980b9;
        }
        .btn-choice { 
            background: var(--primary-blue); 
        }
        .btn-choice:hover {
            background: #2980b9;
        }
        .btn:active { 
            transform: translateY(4px); 
            box-shadow: none; 
        }

        .btn.correct-ans {
            background: var(--success-green) !important;
            box-shadow: 0 5px 0 #27ae60 !important;
        }

        .btn.wrong-ans {
            background: var(--error-red) !important;
            box-shadow: 0 5px 0 #c0392b !important;
        }

        .hidden { display: none; }
        .win-screen { font-size: 32px; color: var(--gold); margin-bottom: 10px; }
        .badge { 
            background: var(--gold); 
            color: #000; 
            padding: 5px 15px; 
            border-radius: 10px; 
            font-size: 14px; 
            margin-bottom: 15px; 
            display: inline-block; 
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="game-ui">
    💎 SCORE: <span id="score">0</span> | MISSION: <span id="current">1</span>/9
</div>

<div class="card" id="game-card">
    <div id="mission-badge" class="badge">MISSION 1: TEXT FILL</div>
    <div class="image-container" id="img-box">🎵</div>
    <div class="sentence" id="task-text">Loading secure prompt...</div>
    
    <div id="choice-mode" class="options"></div>
</div>

<div id="finish" class="hidden">
    <div class="card">
        <h1 class="win-screen">🏆 EXTRAORDINARY!</h1>
        <p style="font-size: 18px; font-weight: bold; color: #7f8c8d;">You are a certified Grammar Superhero!</p>
        <div style="font-size: 80px; margin: 15px 0;">👑🚀✨</div>
        <button class="btn btn-choice" onclick="location.reload()" style="text-align:center; margin: 20px auto 0; display: block; width: 200px;">PLAY AGAIN</button>
    </div>
</div>

<script>
    let score = 0;
    let step = 0;

    // Данные полностью соответствуют страницам учебника на фото
    const quizDatabase = [
        // MISSION 1: HOLLY'S FAMILY TEXT FILL
        { q: "I am Holly and this 1) ________ my family.", a: "is", img: "👩", options: ["is", "am", "are"] },
        { q: "My mum and dad 2) ________ singers.", a: "are", img: "🎤", options: ["is", "am", "are"] },
        { q: "3) ________ they famous? No, they aren't.", a: "Are", img: "❓", options: ["Is", "Are", "Am"] },
        { q: "But we 5) ________ a very happy family!", a: "are", img: "❤️", options: ["is", "are", "am"] },
        
        // MISSION 2: COMMUNICATION DIALOGUES (Ex. 5)
        { q: "A: Who's that?<br>B: ________", a: "a) That's my sister", img: "👧", options: ["a) That's my sister", "b) That's a vase."] },
        { q: "A: Is he sad?<br>B: ________", a: "b) Yes, he is", img: "😢", options: ["a) Yes, she is.", "b) Yes, he is"] },
        { q: "A: How old is he?<br>B: ________", a: "a) He is seventeen", img: "🎂", options: ["a) He is seventeen", "b) Be careful!"] }
    ];

    function updateGameScreen() {
        if (step >= quizDatabase.length) {
            document.getElementById('game-card').classList.add('hidden');
            document.getElementById('finish').classList.remove('hidden');
            return;
        }

        document.getElementById('current').innerText = step + 1;
        const item = quizDatabase[step];
        const badge = document.getElementById('mission-badge');
        
        // Переключаем маркеры миссий
        if (step < 4) {
            badge.innerText = "MISSION 1: HOLLY'S TEXT";
            badge.style.background = "#f1c40f";
        } else {
            badge.innerText = "MISSION 2: DIALOGUE INVERSION";
            badge.style.background = "#e67e22";
        }

        document.getElementById('task-text').innerHTML = item.q;
        document.getElementById('img-box').innerText = item.img;
        
        const optionsBox = document.getElementById('choice-mode');
        optionsBox.innerHTML = '';

        // Генерируем варианты ответов
        item.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'btn btn-choice';
            btn.innerText = opt;
            btn.onclick = () => verifySelection(opt, btn, item.a);
            optionsBox.appendChild(btn);
        });
    }

    function verifySelection(selectedOption, clickedButton, correctOption) {
        const allButtons = document.querySelectorAll('.btn-choice');
        allButtons.forEach(btn => btn.style.pointerEvents = 'none'); // Блокируем спам кликов

        if (selectedOption === correctOption) {
            clickedButton.classList.add('correct-ans');
            score += 10;
            document.getElementById('score').innerText = score;
        } else {
            clickedButton.classList.add('wrong-ans');
            // Подсвечиваем верный
            allButtons.forEach(btn => {
                if (btn.innerText === correctOption) btn.classList.add('correct-ans');
            });
        }

        // Переход на следующий уровень с задержкой
        setTimeout(() => {
            step++;
            updateGameScreen();
        }, 1300);
    }

    // Инициализация при первой загрузке
    window.onload = updateGameScreen;
</script>

</body>
</html>
