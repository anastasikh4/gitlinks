<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prepositions & There is / There are — 14 Questions</title>
<style>
    :root {
        --primary: #6c5ce7;
        --primary-dark: #4a3fa3;
        --success: #00b894;
        --success-light: #d4f7e8;
        --error: #e17055;
        --error-light: #ffe0d4;
        --bg-start: #a29bfe;
        --bg-end: #74b9ff;
        --text: #2d3436;
        --text-soft: #636e72;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        min-height: 100dvh;
        padding: 18px;
        color: var(--text);
    }

    .quiz-card {
        background: linear-gradient(180deg, #ffffff 0%, #f7f9fc 100%);
        width: 100%;
        max-width: 640px;
        padding: 34px 30px 30px;
        border-radius: 26px;
        box-shadow: 0 22px 45px rgba(0,0,0,0.22);
        text-align: center;
        position: relative;
        overflow: hidden;
    }

    h1 {
        color: var(--primary);
        margin-bottom: 20px;
        font-size: 1.55rem;
        letter-spacing: 0.3px;
    }

    .progress-container {
        height: 10px;
        background: #eef1f5;
        border-radius: 6px;
        margin-bottom: 8px;
        overflow: hidden;
    }
    #progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #6c5ce7, #00b894);
        border-radius: 6px;
        transition: width 0.4s ease;
    }

    .counter {
        font-size: 0.78rem;
        font-weight: 800;
        color: var(--text-soft);
        letter-spacing: 1.6px;
        text-transform: uppercase;
        margin-bottom: 22px;
    }

    .emoji-display {
        font-size: 3.6rem;
        margin-bottom: 14px;
        line-height: 1;
        animation: pop 0.5s ease;
    }
    @keyframes pop {
        0% { transform: scale(0.5); }
        60% { transform: scale(1.1); }
        100% { transform: scale(1); }
    }

    .sentence-target {
        background: #f8f9fa;
        border: 3px dashed var(--primary);
        min-height: 90px;
        padding: 22px 16px;
        border-radius: 16px;
        margin-bottom: 24px;
        font-size: 1.3rem;
        font-weight: 700;
        color: var(--text);
        line-height: 1.6;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: center;
        align-items: center;
    }

    .sentence-target .blank {
        display: inline-block;
        min-width: 100px;
        padding: 2px 12px;
        border-bottom: 3px solid var(--primary);
        color: var(--primary);
        background: #ede9fe;
        border-radius: 6px 6px 0 0;
        font-weight: 900;
        transition: all 0.25s ease;
    }

    .word-options {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
        margin-bottom: 22px;
    }

    .word-btn {
        padding: 15px 24px;
        background: white;
        border: 3px solid var(--primary);
        border-bottom-width: 6px;
        color: var(--primary);
        border-radius: 14px;
        font-family: inherit;
        font-size: 1.05rem;
        font-weight: 800;
        cursor: pointer;
        transition: all 0.1s ease;
        min-width: 90px;
    }

    .word-btn:hover:not(.disabled) {
        background: #ede9fe;
        transform: translateY(-2px);
        border-bottom-width: 8px;
    }

    .word-btn:active:not(.disabled) {
        transform: translateY(3px);
        border-bottom-width: 3px;
    }

    .word-btn.disabled {
        pointer-events: none;
        opacity: 0.45;
    }

    .word-btn.correct {
        background: var(--success-light) !important;
        border-color: var(--success);
        border-bottom-color: #00916e;
        color: var(--success);
        opacity: 1 !important;
        animation: pulse 0.5s;
    }

    .word-btn.wrong {
        background: var(--error-light) !important;
        border-color: var(--error);
        border-bottom-color: #a84028;
        color: var(--error);
        animation: shake 0.4s;
    }

    @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.06); }
    }
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20% { transform: translateX(-7px); }
        40% { transform: translateX(7px); }
        60% { transform: translateX(-5px); }
        80% { transform: translateX(5px); }
    }

    #feedback-area {
        margin: 14px 0 10px;
        font-weight: 800;
        font-size: 1.05rem;
        min-height: 26px;
        display: none;
    }
    #feedback-area.correct { color: var(--success); display: block; }
    #feedback-area.wrong { color: var(--error); display: block; }

    #clear-btn, #next-btn {
        padding: 14px 30px;
        color: white;
        border: none;
        border-radius: 14px;
        font-family: inherit;
        font-weight: 900;
        font-size: 1rem;
        cursor: pointer;
        margin: 6px 5px;
        letter-spacing: 0.5px;
        transition: 0.15s;
    }
    #clear-btn {
        background: #dfe6e9;
        color: var(--text);
    }
    #clear-btn:hover { background: #b2bec3; }

    #next-btn {
        background: var(--primary);
        box-shadow: 0 5px 0 var(--primary-dark);
    }
    #next-btn:hover { transform: translateY(-2px); box-shadow: 0 7px 0 var(--primary-dark); }
    #next-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--primary-dark); }
    #next-btn.hidden { display: none; }

    .results {
        display: none;
        padding: 16px 0 8px;
        animation: pop 0.5s ease;
    }
    .results .trophy {
        font-size: 4.2rem;
        margin-bottom: 10px;
        animation: bounce 1.6s infinite;
    }
    @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-12px); }
    }
    .results h2 {
        color: var(--primary);
        font-size: 1.9rem;
        margin-bottom: 12px;
    }
    .results .message {
        font-size: 1rem;
        color: var(--text-soft);
        font-weight: 700;
        margin-bottom: 20px;
    }
    .results .score {
        background: linear-gradient(135deg, #ffeaa7, #fdcb6e);
        border-radius: 18px;
        padding: 22px;
        margin: 18px 0 22px;
        font-size: 1.9rem;
        font-weight: 900;
        color: #b83b1a;
        box-shadow: 0 6px 0 #e1a947;
    }
    .results button {
        padding: 16px 36px;
        background: var(--primary);
        color: white;
        border: none;
        border-bottom: 6px solid var(--primary-dark);
        border-radius: 14px;
        font-family: inherit;
        font-weight: 900;
        font-size: 1.05rem;
        cursor: pointer;
        transition: 0.15s;
        letter-spacing: 0.5px;
    }
    .results button:hover { transform: translateY(-2px); }
    .results button:active { transform: translateY(3px); border-bottom-width: 3px; }

    @media (max-width: 480px) {
        body { padding: 10px; }
        .quiz-card { padding: 24px 16px 20px; border-radius: 20px; }
        h1 { font-size: 1.2rem; margin-bottom: 14px; }
        .emoji-display { font-size: 2.8rem; }
        .sentence-target { font-size: 1.05rem; padding: 18px 10px; min-height: 80px; }
        .sentence-target .blank { min-width: 80px; }
        .word-btn { padding: 12px 16px; font-size: 0.95rem; min-width: 70px; border-radius: 12px; }
        #clear-btn, #next-btn { padding: 12px 22px; font-size: 0.9rem; }
        .results h2 { font-size: 1.5rem; }
        .results .score { font-size: 1.5rem; padding: 16px; }
    }
</style>
</head>
<body>

<div class="quiz-card">
    <div id="quiz-ui">
        <h1>Prepositions &amp; There is / There are</h1>
        <div class="progress-container"><div id="progress-fill"></div></div>
        <div class="counter">Question <span id="qNow">1</span> / <span id="qTotal">14</span></div>

        <div class="emoji-display" id="emoji-display">📺</div>

        <div class="sentence-target" id="sentence-target"></div>

        <div class="word-options" id="word-options"></div>

        <div id="feedback-area"></div>
        <button id="clear-btn" onclick="clearSelection()">Clear</button>
        <button id="next-btn" class="hidden" onclick="nextQuestion()">Next ➔</button>
    </div>

    <div id="result-ui" class="results">
        <div class="trophy">🏆</div>
        <h2>Quiz Complete!</h2>
        <p class="message" id="score-text"></p>
        <div class="score" id="score-big">0 / 14</div>
        <button onclick="location.reload()">Play Again</button>
    </div>
</div>

<script>
/* ============================================================
   QUIZ DATA — 14 questions
   Q1–Q8  · Prepositions of place
   Q9–Q14 · There is / There are / It is / They are
   ============================================================ */
const questions = [
    /* ---------- PREPOSITIONS ---------- */
    {
        emoji: '📺👨‍👩‍👦',
        before: 'They are ',
        after: ' the TV.',
        options: ['in', 'on', 'in front of'],
        correct: 'in front of'
    },
    {
        emoji: '🛏',
        before: 'He is ',
        after: ' bed.',
        options: ['down', 'on', 'under'],
        correct: 'on'
    },
    {
        emoji: '👦👧',
        before: 'Tony is ',
        after: ' Sandra.',
        options: ['opposite', 'between', 'under'],
        correct: 'opposite'
    },
    {
        emoji: '👧👧👧',
        before: 'Lyn is ',
        after: ' Sue and Pat.',
        options: ['between', 'opposite', 'on'],
        correct: 'between'
    },
    {
        emoji: '🚴‍♀️',
        before: "She's ",
        after: ' her bicycle.',
        options: ['on', 'in', 'under'],
        correct: 'on'
    },
    {
        emoji: '🐈🚗',
        before: 'The cat is ',
        after: ' the car.',
        options: ['under', 'on', 'in front of'],
        correct: 'under'
    },
    {
        emoji: '🛋',
        before: 'The dog is ',
        after: ' the sofa.',
        options: ['on', 'under', 'between'],
        correct: 'on'
    },
    {
        emoji: '🌳🚶',
        before: 'Tom is ',
        after: ' the tree.',
        options: ['next to', 'on', 'in front of'],
        correct: 'next to'
    },

    /* ---------- THERE IS / THERE ARE ---------- */
    {
        emoji: '🛋️🪑',
        before: '',
        after: ' a table in front of the sofa.',
        options: ['There is', 'There are', 'It is'],
        correct: 'There is'
    },
    {
        emoji: '🖼️🖼️',
        before: '',
        after: ' some paintings on the walls.',
        options: ['There is', 'There are', 'They are'],
        correct: 'There are'
    },
    {
        emoji: '📚📚',
        before: '',
        after: ' two books on the table.',
        options: ['There is', 'There are', 'It is'],
        correct: 'There are'
    },
    {
        emoji: '🏪',
        before: '',
        after: ' a sports shop around the corner.',
        options: ['There is', 'There are', 'They are'],
        correct: 'There is'
    },
    {
        emoji: '☕',
        before: '',
        after: ' a cup of tea on the desk.',
        options: ['There is', 'There are', 'They are'],
        correct: 'There is'
    },
    {
        emoji: '🪑🪑🪑',
        before: '',
        after: ' three chairs in the kitchen.',
        options: ['There is', 'There are', 'It is'],
        correct: 'There are'
    }
];

/* ============================================================
   STATE
   ============================================================ */
const totalQuestions = questions.length;
let currentQIndex = 0;
let score = 0;
let answered = false;

document.getElementById('qTotal').textContent = totalQuestions;

/* ============================================================
   FISHER-YATES SHUFFLE
   ============================================================ */
function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

/* ============================================================
   LOAD QUESTION
   ============================================================ */
function loadQuestion() {
    if (currentQIndex >= totalQuestions) {
        showResults();
        return;
    }

    answered = false;
    const data = questions[currentQIndex];

    document.getElementById('qNow').textContent = currentQIndex + 1;
    document.getElementById('progress-fill').style.width =
        (currentQIndex / totalQuestions) * 100 + '%';

    /* emoji */
    const emojiEl = document.getElementById('emoji-display');
    emojiEl.textContent = data.emoji;
    emojiEl.style.animation = 'none';
    void emojiEl.offsetWidth;
    emojiEl.style.animation = 'pop 0.5s ease';

    /* sentence with a blank */
    const sentenceDiv = document.getElementById('sentence-target');
    sentenceDiv.innerHTML = `${data.before}<span class="blank" id="blank">?</span>${data.after}`;

    /* options — shuffled */
    const optionsDiv = document.getElementById('word-options');
    optionsDiv.innerHTML = '';
    shuffle(data.options).forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'word-btn';
        btn.textContent = opt;
        btn.onclick = () => selectWord(btn, opt, data);
        optionsDiv.appendChild(btn);
    });

    /* reset UI state */
    const fb = document.getElementById('feedback-area');
    fb.className = '';
    fb.style.display = 'none';
    fb.textContent = '';
    document.getElementById('next-btn').classList.add('hidden');
    document.getElementById('clear-btn').style.display = 'inline-block';
}

/* ============================================================
   HANDLE ANSWER
   ============================================================ */
function selectWord(btn, word, data) {
    if (answered) return;

    const isCorrect = word === data.correct;
    const blank = document.getElementById('blank');
    const allBtns = document.querySelectorAll('.word-btn');

    if (isCorrect) {
        answered = true;
        score++;

        blank.textContent = word;
        blank.style.color = 'var(--success)';
        blank.style.borderBottomColor = 'var(--success)';
        blank.style.background = 'var(--success-light)';

        btn.classList.add('correct');
        allBtns.forEach(b => { if (b !== btn) b.classList.add('disabled'); });

        const fb = document.getElementById('feedback-area');
        fb.textContent = 'Correct! ✓';
        fb.className = 'correct';
        fb.style.display = 'block';

        document.getElementById('next-btn').classList.remove('hidden');
        document.getElementById('clear-btn').style.display = 'none';

        setTimeout(() => {
            nextQuestion();
        }, 1200);

    } else {
        btn.classList.add('wrong');
        btn.classList.add('disabled');

        const fb = document.getElementById('feedback-area');
        fb.textContent = 'Not quite — try again.';
        fb.className = 'wrong';
        fb.style.display = 'block';

        setTimeout(() => {
            btn.classList.remove('wrong');
            allBtns.forEach(b => {
                if (b.classList.contains('wrong')) b.classList.remove('wrong');
            });
        }, 600);
    }
}

/* ============================================================
   CLEAR / RETRY SAME QUESTION
   ============================================================ */
function clearSelection() {
    const allBtns = document.querySelectorAll('.word-btn');
    allBtns.forEach(b => b.classList.remove('wrong', 'disabled'));

    const blank = document.getElementById('blank');
    blank.textContent = '?';
    blank.style.color = 'var(--primary)';
    blank.style.borderBottomColor = 'var(--primary)';
    blank.style.background = '#ede9fe';

    const fb = document.getElementById('feedback-area');
    fb.className = '';
    fb.style.display = 'none';
}

/* ============================================================
   NEXT QUESTION
   ============================================================ */
function nextQuestion() {
    currentQIndex++;
    loadQuestion();
}

/* ============================================================
   RESULT SCREEN
   ============================================================ */
function showResults() {
    document.getElementById('quiz-ui').style.display = 'none';
    document.getElementById('result-ui').style.display = 'block';
    document.getElementById('score-big').textContent = `${score} / ${totalQuestions}`;
    document.getElementById('progress-fill').style.width = '100%';

    const pct = Math.round((score / totalQuestions) * 100);
    let msg;
    if (pct === 100)      msg = 'Perfect! You got them all right!';
    else if (pct >= 80)   msg = 'Excellent! Almost perfect!';
    else if (pct >= 60)   msg = 'Good job! Keep practising.';
    else if (pct >= 40)   msg = 'Not bad — try the quiz again!';
    else                  msg = 'Practise makes perfect — try again!';

    document.getElementById('score-text').textContent = msg;
}

/* ============================================================
   START
   ============================================================ */
loadQuestion();
</script>

</body>
</html>
