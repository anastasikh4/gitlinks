<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Duolingo-style · Present Continuous Homework</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      padding: 20px 12px;
      min-height: 100vh;
    }

    .duolingo-card {
      max-width: 520px;
      width: 100%;
      background: #ffffff;
      border-radius: 32px;
      padding: 28px 24px 24px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
      position: relative;
      border: 1px solid #e8e8e8;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 10px;
    }

    .header .title {
      font-size: 20px;
      font-weight: 800;
      color: #1f1f1f;
    }

    .header .score {
      margin-left: auto;
      background: #f0f0f0;
      padding: 4px 16px;
      border-radius: 40px;
      font-size: 15px;
      font-weight: 800;
      color: #1f1f1f;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .score span {
      color: #58cc02;
      font-size: 18px;
    }

    .progress-wrap {
      width: 100%;
      height: 10px;
      background: #e5e5e5;
      border-radius: 20px;
      margin-bottom: 22px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: #58cc02;
      border-radius: 20px;
      transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .question-area {
      text-align: center;
      margin-bottom: 12px;
    }

    .q-emoji {
      font-size: 48px;
      margin-bottom: 4px;
    }

    .q-text {
      font-size: 22px;
      font-weight: 800;
      color: #1f1f1f;
      line-height: 1.4;
    }

    .q-text .positive {
      color: #58cc02;
      font-weight: 800;
      background: #f0f7e8;
      padding: 0 10px;
      border-radius: 40px;
      display: inline-block;
      margin-bottom: 6px;
    }

    .q-text .blank {
      color: #1f1f1f;
      border-bottom: 3px dashed #58cc02;
      padding: 0 4px;
      min-width: 80px;
      display: inline-block;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 20px 0 18px;
    }

    .option-btn {
      background: #f7f7f7;
      border: 2px solid #e0e0e0;
      border-bottom: 4px solid #e0e0e0;
      border-radius: 16px;
      padding: 16px 18px;
      font-size: 18px;
      font-weight: 700;
      color: #1f1f1f;
      cursor: pointer;
      transition: all 0.08s linear;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .option-btn:active:not(:disabled) {
      transform: translateY(2px);
      border-bottom-width: 2px;
    }

    .option-btn .letter {
      background: #e8e8e8;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 14px;
      color: #777;
      flex-shrink: 0;
    }

    .option-btn.correct {
      background: #d7ffb8;
      border-color: #58cc02;
      border-bottom-color: #46a302;
    }

    .option-btn.correct .letter {
      background: #58cc02;
      color: white;
    }

    .option-btn.wrong {
      background: #ffdfe0;
      border-color: #ff4b4b;
      border-bottom-color: #d32f2f;
      animation: shake 0.4s ease;
    }

    .option-btn.wrong .letter {
      background: #ff4b4b;
      color: white;
    }

    .option-btn:disabled {
      cursor: default;
      opacity: 0.8;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-10px); }
      40% { transform: translateX(10px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }

    .continue-btn {
      width: 100%;
      background: #58cc02;
      border: none;
      border-bottom: 4px solid #46a302;
      border-radius: 16px;
      padding: 16px;
      font-size: 20px;
      font-weight: 800;
      color: white;
      cursor: pointer;
      transition: 0.1s;
      display: none;
    }

    .continue-btn:active {
      transform: translateY(2px);
      border-bottom-width: 2px;
    }

    .continue-btn.show {
      display: block;
      animation: fadeUp 0.25s ease;
    }

    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(12px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .feedback {
      min-height: 40px;
      font-weight: 700;
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 4px 0 8px;
    }

    .feedback.correct {
      color: #58a700;
    }
    .feedback.wrong {
      color: #d32f2f;
    }

    .result-screen {
      display: none;
      text-align: center;
      padding: 20px 0 10px;
    }

    .result-screen.show {
      display: block;
      animation: fadeUp 0.5s ease;
    }

    .result-icon {
      font-size: 72px;
      margin-bottom: 8px;
    }

    .result-title {
      font-size: 28px;
      font-weight: 900;
      color: #1f1f1f;
    }

    .result-sub {
      font-size: 18px;
      color: #777;
      margin-top: 4px;
    }

    .result-score {
      font-size: 44px;
      font-weight: 900;
      color: #58cc02;
      background: #f0f7e8;
      display: inline-block;
      padding: 6px 40px;
      border-radius: 60px;
      margin: 12px 0 20px;
    }

    .restart-btn {
      background: #1cb0f6;
      border: none;
      border-bottom: 4px solid #1899d6;
      border-radius: 16px;
      padding: 14px 48px;
      font-size: 20px;
      font-weight: 800;
      color: white;
      cursor: pointer;
    }

    .restart-btn:active {
      transform: translateY(2px);
      border-bottom-width: 2px;
    }

    .game-content.hidden {
      display: none;
    }

    .heart-particle {
      position: fixed;
      font-size: 26px;
      pointer-events: none;
      user-select: none;
      z-index: 999;
      animation: burst 0.8s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
    }

    @keyframes burst {
      0% {
        transform: translate(0, 0) scale(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translate(var(--tx), var(--ty)) scale(1.4) rotate(var(--rot));
        opacity: 0;
      }
    }

    @media (max-width: 480px) {
      .duolingo-card {
        padding: 18px 14px 20px;
        border-radius: 24px;
      }
      .q-text {
        font-size: 18px;
      }
      .option-btn {
        font-size: 16px;
        padding: 14px 14px;
      }
      .header .title {
        font-size: 17px;
      }
      .result-title {
        font-size: 22px;
      }
      .result-score {
        font-size: 34px;
        padding: 4px 28px;
      }
    }

    @media (max-width: 380px) {
      .q-text {
        font-size: 16px;
      }
      .option-btn {
        font-size: 14px;
        padding: 12px 12px;
      }
      .option-btn .letter {
        width: 26px;
        height: 26px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>

<div class="duolingo-card" id="app">

  <div class="header">
    <div class="title">📘 Present Continuous</div>
    <div class="score">⭐ <span id="scoreDisplay">0</span></div>
  </div>

  <div class="progress-wrap">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <div class="game-content" id="gameContent">

    <div class="question-area">
      <div class="q-emoji" id="qEmoji">☔</div>
      <div class="q-text" id="qText">
        <!-- dynamic content -->
      </div>
    </div>

    <div class="options" id="optionsContainer"></div>

    <div class="feedback" id="feedback"></div>

    <button class="continue-btn" id="continueBtn">CONTINUE ➜</button>
  </div>

  <div class="result-screen" id="resultScreen">
    <div class="result-icon" id="resultIcon">🏆</div>
    <div class="result-title" id="resultTitle">Great Job!</div>
    <div class="result-sub" id="resultSub">You completed all exercises.</div>
    <div class="result-score" id="resultScoreDisplay">0 / 0</div>
    <button class="restart-btn" id="restartBtn">🔄 Try Again</button>
  </div>

</div>

<script>
  // ============================================================
  //  QUESTION BANK  (Present Continuous)
  //  Negative questions now display the positive sentence
  //  with a "+" icon and options that include common mistakes.
  // ============================================================
  const questions = [
    // ---- Exercise 1: -ing forms ----
    { emoji: '☔', prompt: 'rain →', options: ['raining', 'rain', 'rained'], correct: 'raining' },
    { emoji: '⛄', prompt: 'snow →', options: ['snow', 'snowing', 'snowed'], correct: 'snowing' },
    { emoji: '🗣️', prompt: 'speak →', options: ['speaking', 'speak', 'speaked'], correct: 'speaking' },
    { emoji: '⚽', prompt: 'play →', options: ['played', 'play', 'playing'], correct: 'playing' },
    { emoji: '🎧', prompt: 'listen →', options: ['listen', 'listening', 'listened'], correct: 'listening' },
    { emoji: '🏃', prompt: 'run →', options: ['runing', 'running', 'ran'], correct: 'running' },
    { emoji: '🏊', prompt: 'swim →', options: ['swiming', 'swam', 'swimming'], correct: 'swimming' },
    { emoji: '🪑', prompt: 'sit →', options: ['sitting', 'siting', 'sat'], correct: 'sitting' },
    { emoji: '💃', prompt: 'dance →', options: ['danceing', 'dancing', 'danced'], correct: 'dancing' },
    { emoji: '📖', prompt: 'read →', options: ['reading', 'read', 'readed'], correct: 'reading' },

    // ---- Exercise 4: is/am/are + -ing ----
    { emoji: '👦', prompt: 'He ______ football.', options: ['is playing', 'am playing', 'are playing'], correct: 'is playing' },
    { emoji: '👧', prompt: 'I ______ a book.', options: ['am reading', 'is reading', 'are reading'], correct: 'am reading' },
    { emoji: '👫', prompt: 'We ______ dresses.', options: ['am wearing', 'is wearing', 'are wearing'], correct: 'are wearing' },
    { emoji: '⛄', prompt: 'It ______.', options: ['am snowing', 'is snowing', 'are snowing'], correct: 'is snowing' },
    { emoji: '🎹', prompt: 'She ______ the piano.', options: ['am playing', 'is playing', 'are playing'], correct: 'is playing' },

    // ---- Negative exercises (with positive sentence displayed) ----
    // We use a special format: positive = the affirmative sentence, options include the correct negative
    { emoji: '📖', positive: 'I am reading.', options: ['I am not reading.', 'I am not drawing.', 'I not reading.'], correct: 'I am not reading.' },
    { emoji: '☔', positive: 'It is raining.', options: ['It is not raining.', 'It not raining.', 'It is not snowing.'], correct: 'It is not raining.' },
    { emoji: '⚽', positive: 'He is playing football.', options: ['He is not playing football.', 'He not playing football.', 'He is not playing the piano.'], correct: 'He is not playing football.' },
    { emoji: '👖', positive: 'We are wearing jeans.', options: ['We are not wearing jeans.', 'We not wearing jeans.', 'We are not wearing dresses.'], correct: 'We are not wearing jeans.' },
    { emoji: '👧', positive: 'She is singing.', options: ['She is not singing.', 'She not singing.', 'She isn\'t singing.'], correct: 'She is not singing.' },
    { emoji: '🎨', positive: 'They are drawing.', options: ['They are not drawing.', 'They not drawing.', 'They are not painting.'], correct: 'They are not drawing.' }
  ];

  // shuffle questions on load
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // ---- state ----
  let shuffledQuestions = [];
  let currentIndex = 0;
  let score = 0;
  let isAnswered = false;

  const letters = ['A', 'B', 'C', 'D'];

  // ---- DOM refs ----
  const qEmoji = document.getElementById('qEmoji');
  const qText = document.getElementById('qText');
  const optionsContainer = document.getElementById('optionsContainer');
  const feedback = document.getElementById('feedback');
  const continueBtn = document.getElementById('continueBtn');
  const progressFill = document.getElementById('progressFill');
  const scoreDisplay = document.getElementById('scoreDisplay');
  const gameContent = document.getElementById('gameContent');
  const resultScreen = document.getElementById('resultScreen');
  const resultIcon = document.getElementById('resultIcon');
  const resultTitle = document.getElementById('resultTitle');
  const resultSub = document.getElementById('resultSub');
  const resultScoreDisplay = document.getElementById('resultScoreDisplay');
  const restartBtn = document.getElementById('restartBtn');

  // ---- launch hearts on correct answer ----
  function launchHearts() {
    const heartEmojis = ['❤️', '💖', '💝', '💕', '💘'];
    const count = 20;
    const originX = window.innerWidth / 2;
    const originY = window.innerHeight / 2;

    for (let i = 0; i < count; i++) {
      const heart = document.createElement('div');
      heart.className = 'heart-particle';
      heart.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
      heart.style.left = originX + 'px';
      heart.style.top = originY + 'px';

      const angle = Math.random() * Math.PI * 2;
      const distance = 120 + Math.random() * 180;
      const targetX = Math.cos(angle) * distance;
      const targetY = Math.sin(angle) * distance;
      const rotation = Math.random() * 90 - 45;

      heart.style.setProperty('--tx', targetX + 'px');
      heart.style.setProperty('--ty', targetY + 'px');
      heart.style.setProperty('--rot', rotation + 'deg');

      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 800);
    }
  }

  // ---- load current question ----
  function loadQuestion() {
    isAnswered = false;
    feedback.textContent = '';
    feedback.className = 'feedback';
    continueBtn.classList.remove('show');

    const q = shuffledQuestions[currentIndex];
    const total = shuffledQuestions.length;
    const progress = (currentIndex / total) * 100;
    progressFill.style.width = progress + '%';

    qEmoji.textContent = q.emoji;

    // Build question text
    let html = '';
    if (q.positive) {
      // Negative exercise: show positive sentence with "+"
      html = `<span class="positive">➕ ${q.positive}</span><br><span style="font-size:0.9rem; color:#888;">→ negative:</span> <span class="blank">______</span>`;
    } else {
      // Regular gap-fill: show prompt with blank
      html = q.prompt + ' <span class="blank">______</span>';
    }
    qText.innerHTML = html;

    // shuffle options
    const shuffledOptions = shuffle([...q.options]);
    optionsContainer.innerHTML = '';

    shuffledOptions.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      const letter = letters[idx] || '?';
      btn.innerHTML = `<span class="letter">${letter}</span> ${opt}`;
      btn.dataset.value = opt;
      btn.addEventListener('click', () => handleOptionClick(btn, opt, q.correct));
      optionsContainer.appendChild(btn);
    });
  }

  // ---- handle option click ----
  function handleOptionClick(btn, selected, correct) {
    if (isAnswered) return;
    isAnswered = true;

    const allBtns = document.querySelectorAll('.option-btn');
    allBtns.forEach(b => b.disabled = true);

    if (selected === correct) {
      btn.classList.add('correct');
      feedback.textContent = '✅ Perfect! +10 ⭐';
      feedback.className = 'feedback correct';
      score += 10;
      scoreDisplay.textContent = score;
      launchHearts();
      // fill the blank with the correct word
      const blank = document.querySelector('.blank');
      if (blank) blank.textContent = correct;
    } else {
      btn.classList.add('wrong');
      feedback.textContent = '❌ Not quite. The correct negative is: ' + correct;
      feedback.className = 'feedback wrong';
      // highlight correct answer
      allBtns.forEach(b => {
        if (b.dataset.value === correct) {
          b.classList.add('correct');
        }
      });
      // fill blank with correct answer after a moment
      setTimeout(() => {
        const blank = document.querySelector('.blank');
        if (blank) blank.textContent = correct;
      }, 300);
    }

    continueBtn.classList.add('show');
  }

  // ---- continue to next question ----
  function goToNext() {
    currentIndex++;
    if (currentIndex < shuffledQuestions.length) {
      loadQuestion();
    } else {
      showResults();
    }
  }

  // ---- show results ----
  function showResults() {
    gameContent.classList.add('hidden');
    resultScreen.classList.add('show');
    const total = shuffledQuestions.length;
    const totalScore = score;
    const maxScore = total * 10;

    resultScoreDisplay.textContent = totalScore + ' / ' + maxScore;

    const pct = totalScore / maxScore;
    if (pct === 1) {
      resultIcon.textContent = '🏆';
      resultTitle.textContent = 'Perfect Score!';
      resultSub.textContent = 'You\'re a Present Continuous Master!';
    } else if (pct >= 0.7) {
      resultIcon.textContent = '🌟';
      resultTitle.textContent = 'Great Job!';
      resultSub.textContent = 'Keep up the good work!';
    } else {
      resultIcon.textContent = '💪';
      resultTitle.textContent = 'Good Effort!';
      resultSub.textContent = 'Practice makes perfect. Try again!';
    }

    progressFill.style.width = '100%';
  }

  // ---- restart ----
  function restartGame() {
    shuffledQuestions = shuffle(questions);
    currentIndex = 0;
    score = 0;
    scoreDisplay.textContent = '0';
    resultScreen.classList.remove('show');
    gameContent.classList.remove('hidden');
    loadQuestion();
  }

  // ---- init ----
  function init() {
    shuffledQuestions = shuffle(questions);
    currentIndex = 0;
    score = 0;
    scoreDisplay.textContent = '0';
    resultScreen.classList.remove('show');
    gameContent.classList.remove('hidden');
    loadQuestion();

    continueBtn.addEventListener('click', goToNext);
    restartBtn.addEventListener('click', restartGame);
  }

  init();
</script>

</body>
</html>
