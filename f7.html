<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personality Adjectives - Wendy's Family Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --ww-blue: #1d3557;
            --ww-pink: #ff006e;
            --ww-teal: #06aed5;
            --correct: #58cc02;
            --correct-dark: #46a302;
            --wrong: #ff4b4b;
            --wrong-dark: #e03e3e;
            --bg-gradient: linear-gradient(135deg, #4361ee 0%, #3a0ca3 100%);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Raleway', sans-serif;
            background: var(--bg-gradient);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #2b2d42;
            padding: 20px;
        }

        #game-container {
            width: 100%;
            max-width: 720px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            padding: 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* ---------- PROGRESS BAR ---------- */
        .progress-bar {
            height: 12px;
            background: #e0e0e0;
            border-radius: 10px;
            margin-bottom: 16px;
            overflow: hidden;
        }
        #progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff006e, #fbb13c);
            transition: width 0.4s ease;
            border-radius: 10px;
        }

        /* ---------- SCORE ROW ---------- */
        .score-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-weight: 800;
            font-size: 14px;
            color: #64748b;
        }
        .score-row .score-val {
            color: var(--ww-pink);
            font-size: 18px;
        }

        /* ---------- VOCABULARY BAR ---------- */
        .vocab-bar {
            background: linear-gradient(135deg, #e0f2f7, #c7e9f1);
            border: 2px dashed #06aed5;
            border-radius: 14px;
            padding: 12px 14px;
            margin-bottom: 18px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }
        .vocab-chip {
            background: white;
            color: #0d5e75;
            border: 2px solid #06aed5;
            border-bottom-width: 4px;
            border-radius: 20px;
            padding: 5px 14px;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.3px;
        }
        .vocab-title {
            width: 100%;
            text-align: center;
            font-size: 11px;
            font-weight: 900;
            color: #06aed5;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        /* ---------- QUESTION ---------- */
        h1 {
            color: var(--ww-blue);
            font-size: 24px;
            margin: 0 0 12px 0;
            font-weight: 900;
        }

        .persona-card {
            background: linear-gradient(135deg, #fff5e1, #ffe5b4);
            border-left: 6px solid #fbb13c;
            border-radius: 14px;
            padding: 14px 18px;
            text-align: left;
            margin-bottom: 22px;
        }
        .persona-name {
            display: inline-block;
            background: #fbb13c;
            color: #fff;
            font-weight: 900;
            font-size: 13px;
            padding: 3px 12px;
            border-radius: 20px;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        .question-text {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--ww-blue);
            line-height: 1.55;
        }
        .question-text .blank {
            display: inline-block;
            min-width: 90px;
            padding: 0 8px;
            border-bottom: 3px dashed #fbb13c;
            color: #b45309;
            font-weight: 900;
            text-align: center;
        }

        /* ---------- OPTIONS (3 in a row on desktop) ---------- */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .option {
            background: white;
            border: 3px solid #e0e0e0;
            border-bottom: 6px solid #e0e0e0;
            border-radius: 15px;
            padding: 18px 10px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.1s;
            text-align: center;
            font-family: inherit;
            color: #2b2d42;
            letter-spacing: 0.2px;
            word-break: break-word;
        }

        .option:hover:not(.disabled) {
            border-color: #cbd5e1;
            transform: translateY(-2px);
        }
        .option:active:not(.disabled) {
            transform: translateY(2px);
            border-bottom-width: 3px;
        }
        .option.disabled { cursor: default; }

        .option.correct {
            background-color: #eef9e8 !important;
            border-color: var(--correct) !important;
            border-bottom-color: var(--correct-dark) !important;
            color: var(--correct-dark) !important;
            animation: bounce 0.5s;
        }
        .option.wrong {
            background-color: #fff0f0 !important;
            border-color: var(--wrong) !important;
            border-bottom-color: var(--wrong-dark) !important;
            color: var(--wrong) !important;
            animation: shake 0.4s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }

        /* ---------- RESULT SCREEN ---------- */
        #result-screen.hidden, #quiz-area.hidden { display: none; }

        #result-screen h1 {
            font-size: 38px;
            margin-bottom: 6px;
        }
        #result-screen .result-emoji {
            font-size: 90px;
            display: block;
            margin-bottom: 10px;
            animation: bounce 1.5s infinite;
        }
        #final-score {
            font-size: 26px;
            font-weight: 900;
            color: var(--ww-pink);
            margin: 12px 0 6px;
        }
        #result-msg {
            font-size: 15px;
            font-weight: 700;
            color: #64748b;
            margin-bottom: 24px;
        }
        .restart-btn {
            background: var(--ww-pink);
            color: white;
            border: none;
            padding: 15px 44px;
            border-radius: 50px;
            font-weight: 900;
            cursor: pointer;
            font-size: 1.15rem;
            letter-spacing: 1px;
            box-shadow: 0 5px 0 #b90051;
            font-family: inherit;
            transition: 0.1s;
        }
        .restart-btn:hover { filter: brightness(1.05); }
        .restart-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #b90051;
        }

        @media (max-width: 600px) {
            .options-grid { grid-template-columns: 1fr; }
        }

        @media (max-width: 520px) {
            #game-container { padding: 20px 16px; }
            h1 { font-size: 19px; }
            .question-text { font-size: 1rem; }
            .option { font-size: 0.95rem; padding: 14px 10px; }
            .vocab-chip { font-size: 11px; padding: 4px 10px; }
            #result-screen h1 { font-size: 26px; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div class="progress-bar"><div id="progress-fill"></div></div>

        <div id="quiz-area">
            <div class="score-row">
                <span>⭐ Score: <span class="score-val" id="score-display">0</span></span>
                <span id="q-counter">1 / 10</span>
            </div>

            <div class="vocab-bar">
                <div class="vocab-title">📘 Personality Adjectives</div>
                <span class="vocab-chip">bossy</span>
                <span class="vocab-chip">easy-going</span>
                <span class="vocab-chip">loud</span>
                <span class="vocab-chip">messy</span>
                <span class="vocab-chip">organised</span>
                <span class="vocab-chip">patient</span>
                <span class="vocab-chip">quiet</span>
                <span class="vocab-chip">tidy</span>
            </div>

            <h1 id="q-title">Choose the correct adjective</h1>

            <div class="persona-card">
                <span class="persona-name">WENDY, 14</span>
                <div class="question-text" id="q-text">Loading...</div>
            </div>

            <div class="options-grid" id="options-container"></div>
        </div>

        <div id="result-screen" class="hidden">
            <span class="result-emoji" id="result-emoji">🏆</span>
            <h1 id="result-title">MISSION COMPLETE!</h1>
            <p id="final-score">0 / 10</p>
            <p id="result-msg"></p>
            <button class="restart-btn" onclick="location.reload()">RESTART</button>
        </div>
    </div>

    <script>
        /* ============================================================
           QUESTIONS — 3 варианта у каждого, правильный всегда один
           ============================================================ */
        const questions = [
            {
                q: 'Dad is a <span class="blank">?</span> man. He doesn\'t talk a lot, but he always listens to us.',
                a: ['quiet', 'loud', 'bossy'],
                correct: 0
            },
            {
                q: 'My mum\'s <span class="blank">?</span>. She doesn\'t get angry when our bedrooms are untidy.',
                a: ['messy', 'easy-going', 'loud'],
                correct: 1
            },
            {
                q: 'My big twin sisters are <span class="blank">?</span>! They always shout when they argue!',
                a: ['quiet', 'loud', 'tidy'],
                correct: 1
            },
            {
                q: 'My brother is <span class="blank">?</span>. He never puts his clothes away.',
                a: ['tidy', 'patient', 'messy'],
                correct: 2
            },
            {
                q: 'I\'m <span class="blank">?</span>. I like putting things in the right place.',
                a: ['tidy', 'messy', 'bossy'],
                correct: 0
            },
            {
                q: 'Gran plans everything and she knows where everything is. She\'s <span class="blank">?</span>.',
                a: ['easy-going', 'organised', 'patient'],
                correct: 1
            },
            {
                q: 'A person who tells other people what to do all the time is…',
                a: ['quiet', 'patient', 'bossy'],
                correct: 2
            },
            {
                q: 'A person who can wait for a long time without getting angry is…',
                a: ['patient', 'loud', 'messy'],
                correct: 0
            },
            {
                q: 'A person who is relaxed and doesn\'t worry about small things is…',
                a: ['bossy', 'tidy', 'easy-going'],
                correct: 2
            },
            {
                q: 'A person who never puts things back in their place is…',
                a: ['organised', 'messy', 'quiet'],
                correct: 1
            }
        ];

        let currentQ = 0;
        let score = 0;

        /* ============================================================
           LOAD QUESTION
           ============================================================ */
        function loadQuestion() {
            if (currentQ >= questions.length) {
                showResults();
                return;
            }

            const data = questions[currentQ];

            document.getElementById('q-title').innerText = 'Choose the correct adjective';
            document.getElementById('q-counter').innerText = `${currentQ + 1} / ${questions.length}`;
            document.getElementById('q-text').innerHTML = data.q;
            document.getElementById('score-display').innerText = score;
            document.getElementById('progress-fill').style.width =
                ((currentQ) / questions.length * 100) + '%';

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            // перемешиваем варианты, сохраняя правильный индекс
            const indexedOptions = data.a.map((opt, i) => ({ text: opt, originalIndex: i }));
            indexedOptions.sort(() => Math.random() - 0.5);

            indexedOptions.forEach((option) => {
                const btn = document.createElement('button');
                btn.className = 'option';
                btn.type = 'button';
                btn.innerText = option.text;
                btn.dataset.text = option.text;
                btn.onclick = () => checkAnswer(option.originalIndex, btn);
                container.appendChild(btn);
            });
        }

        /* ============================================================
           CHECK ANSWER
           ============================================================ */
        function checkAnswer(index, element) {
            const allOptions = document.querySelectorAll('.option');
            allOptions.forEach(opt => opt.classList.add('disabled'));

            const correctText = questions[currentQ].a[questions[currentQ].correct];

            if (index === questions[currentQ].correct) {
                element.classList.add('correct');
                score++;
                document.getElementById('score-display').innerText = score;
            } else {
                element.classList.add('wrong');
                allOptions.forEach(opt => {
                    if (opt.dataset.text === correctText) opt.classList.add('correct');
                });
            }

            document.getElementById('progress-fill').style.width =
                ((currentQ + 1) / questions.length * 100) + '%';

            setTimeout(() => {
                currentQ++;
                loadQuestion();
            }, 1300);
        }

        /* ============================================================
           RESULTS
           ============================================================ */
        function showResults() {
            document.getElementById('quiz-area').classList.add('hidden');
            const res = document.getElementById('result-screen');
            res.classList.remove('hidden');

            const total = questions.length;
            const pct = Math.round((score / total) * 100);

            let emoji = '💪', title = 'KEEP PRACTISING!', msg = 'Review the adjectives and try again!';
            if (pct === 100) {
                emoji = '🏆'; title = 'PERFECT!'; msg = 'Amazing! You know all the personality adjectives! 🎉';
            } else if (pct >= 80) {
                emoji = '🎉'; title = 'GREAT JOB!'; msg = 'Almost perfect! Just a couple of mistakes.';
            } else if (pct >= 50) {
                emoji = '👍'; title = 'GOOD EFFORT!'; msg = 'Not bad! Read the vocabulary box again.';
            }

            document.getElementById('result-emoji').textContent = emoji;
            document.getElementById('result-title').textContent = title;
            document.getElementById('final-score').innerText = `Your Score: ${score} / ${total}`;
            document.getElementById('result-msg').innerText = msg;
            document.getElementById('progress-fill').style.width = '100%';
        }

        loadQuestion();
    </script>
</body>
</html>
