<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Science & Vocabulary Lab: EN-RU</title>
    <style>
        :root {
            --lab-dark: #1e293b;
            --lab-light: #f8fafc;
            --lab-teal: #0d9488;
            --lab-blue: #2563eb;
            --lab-orange: #ea580c;
            --correct-btn: #10b981;
            --wrong-btn: #ef4444;
            --bg-color: #e2e8f0;
            --primary: #4f46e5;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg-color); 
            background-image: 
                linear-gradient(rgba(255,255,255,0.5) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.5) 1px, transparent 1px);
            background-size: 20px 20px;
            text-align: center; color: var(--lab-dark); margin: 0; padding: 20px; overflow-x: hidden;
        }
        .game-container { 
            max-width: 900px; margin: 0 auto; padding: 30px; background: white; 
            border-radius: 20px; border: 4px solid var(--lab-dark); position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); z-index: 2;
        }
        h1 { margin-top: 0; color: var(--lab-dark); font-size: 2.2em; letter-spacing: 1px; }
        
        .level { display: none; }
        .active { display: block; }
        
        #score-board { 
            font-size: 1.1em; background: #f1f5f9; padding: 10px 25px; 
            border-radius: 15px; border: 2px solid #cbd5e1; 
            margin-bottom: 20px; display: inline-flex; gap: 20px; font-weight: bold;
            color: var(--lab-blue);
        }

        .game-board {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        
        .column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 400px;
        }
        
        .column h3 {
            margin: 0 0 10px 0;
            color: var(--lab-teal);
            font-size: 1.2em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card { 
            padding: 15px 20px; 
            background: white; 
            border-radius: 12px; 
            border: 2px solid #cbd5e1;
            border-bottom: 4px solid #94a3b8;
            font-size: 1em; 
            font-weight: bold; 
            cursor: pointer; 
            transition: all 0.2s ease;
            user-select: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            word-wrap: break-word;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80px;
            text-align: center;
            color: var(--lab-dark);
        }

        /* Level Specific Colors */
        .card.level1-card { border-color: #bfdbfe; border-bottom-color: #60a5fa; }
        .card.level2-card { border-color: #fde68a; border-bottom-color: #fbbf24; }
        .card.level3-card { border-color: #bbf7d0; border-bottom-color: #4ade80; }

        .card:hover { transform: translateY(-2px); box-shadow: 0 6px 8px rgba(0,0,0,0.1); }
        .card.selected { 
            border-color: var(--lab-orange) !important; 
            border-bottom-color: #9a3412 !important;
            background: #ffedd5;
            transform: translateY(2px); 
            box-shadow: none;
        }
        .card.matched { 
            background: #f8fafc; 
            border-color: #cbd5e1; 
            color: #94a3b8; 
            cursor: default; 
            pointer-events: none; 
            opacity: 0.6; 
            transform: translateY(4px);
            box-shadow: none;
        }
        .card.wrong-match { 
            background: #fee2e2; 
            border-color: #ef4444; 
            animation: shake 0.4s; 
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        .feedback { font-weight: bold; min-height: 30px; margin-top: 20px; font-size: 1.2em; }
        
        button { 
            padding: 12px 30px; font-size: 1.1em; cursor: pointer; 
            color: white; border: none; border-radius: 10px; transition: 0.2s;
            font-family: inherit; font-weight: bold; margin-top: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-restart { background: var(--lab-blue); }
        .btn-restart:hover { background: #1d4ed8; transform: scale(1.05); }

        /* SALUTE ANIMATION */
        .salute {
            position: absolute; width: 8px; height: 8px; background: var(--lab-teal);
            border-radius: 50%; pointer-events: none; z-index: 999;
            animation: explode 0.8s ease-out forwards;
        }
        @keyframes explode {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }
        
        .status-msg {
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 15px;
            min-height: 20px;
        }
    </style>
</head>
<body>

<div class="game-container" id="main-box">
    <h1>🧪 Science & Vocabulary Lab (EN-RU) 🔬</h1>
    <div id="score-board">
        <span>Level: <span id="level-display">1</span> / 3</span>
        <span>Score: <span id="score">0</span></span>
    </div>

    <!-- MAIN EXERCISE LEVEL -->
    <div id="level1" class="level active">
        <h3 id="level-title">Level 1: Scientific Disciplines</h3>
        
        <div class="game-board">
            <div class="column" id="left-col">
                <h3>🇬🇧 English</h3>
            </div>
            <div class="column" id="right-col">
                <h3>🇷🇺 Russian</h3>
            </div>
        </div>
        
        <div id="feedback" class="feedback"></div>
    </div>

    <!-- WIN SCREEN -->
    <div id="win-screen" class="level">
        <h2 style="font-size: 2.5em; color: var(--lab-teal);">ANALYSIS COMPLETE! 🏆</h2>
        <p style="font-size: 1.2em;">You successfully completed all 3 levels of the Lab!</p>
        
        <!-- Status Message for Google Sheets Sync -->
        <div id="send-status" class="status-msg"></div>
        
        <button class="btn-restart" onclick="initGame()">Restart Experiment 🔄</button>
    </div>
</div>

<script>
    // ========== TRACKING DATA ==========
    const TEST_NAME = "Science & Vocabulary Lab (EN-RU) - No Applied Science";
    let userMistakes = [];
    let correctMatchesCount = 0;

    let score = 0;
    let currentLevel = 1;
    let matchesFound = 0;
    let selectedLeft = null;
    let selectedRight = null;
    let isChecking = false;

    // --- LEVEL DATA ---

    // Level 1: Match English Scientific Category to Russian Translation
    const level1Data = [
        { id: 1, left: "Natural Science", right: "Естественные науки" },
        { id: 2, left: "Social Science", right: "Социальные науки" },
        { id: 3, left: "Biology", right: "Биология" },
        { id: 4, left: "Engineering", right: "Инженерия" }
    ];

    // Level 2: Match Vocabulary word to Russian Translation
    const level2Data = [
        { id: 1, left: "lift", right: "поднимать" },
        { id: 2, left: "capture", right: "захватывать" },
        { id: 3, left: "experiments", right: "эксперименты" },
        { id: 4, left: "presented", right: "представил" },
        { id: 5, left: "safe and sound", right: "целые и невредимые" }
    ];

    // Level 3: Match English Phrase to Russian Translation
    const level3Data = [
        { id: 1, left: "came to the conclusion", right: "пришли к выводу" },
        { id: 2, left: "lift this heavy equipment", right: "поднять это тяжелое оборудование" },
        { id: 3, left: "capture the reaction", right: "запечатлеть реакцию" },
        { id: 4, left: "presented her findings", right: "представила свои выводы" },
        { id: 5, left: "returned safe and sound", right: "вернулись целыми и невредимыми" }
    ];

    const allLevels = [level1Data, level2Data, level3Data];
    const levelTitles = [
        "Level 1: Scientific Disciplines",
        "Level 2: Vocabulary Definitions",
        "Level 3: Vocabulary in Context"
    ];

    // Dynamic total question calculation
    const totalQuestions = level1Data.length + level2Data.length + level3Data.length;

    // --- SALUTE EFFECT ---
    function triggerSalute() {
        const box = document.getElementById('main-box');
        for (let i = 0; i < 15; i++) {
            const part = document.createElement('div');
            part.className = 'salute';
            const x = Math.random() * 700;
            const y = Math.random() * 400;
            part.style.left = x + 'px';
            part.style.top = y + 'px';
            part.style.setProperty('--tx', (Math.random() - 0.5) * 200 + 'px');
            part.style.setProperty('--ty', (Math.random() - 0.5) * 200 + 'px');
            box.appendChild(part);
            setTimeout(() => part.remove(), 800);
        }
    }

    // --- GAME LOGIC ---
    function initGame() {
        score = 0;
        currentLevel = 1;
        correctMatchesCount = 0;
        userMistakes = [];
        
        document.getElementById('score').innerText = score;
        document.getElementById('level-display').innerText = currentLevel;
        document.getElementById('win-screen').classList.remove('active');
        document.getElementById('level1').classList.add('active');
        
        const statusEl = document.getElementById('send-status');
        if(statusEl) statusEl.innerText = "";

        loadLevel(currentLevel);
    }

    function loadLevel(levelNum) {
        matchesFound = 0;
        selectedLeft = null;
        selectedRight = null;
        isChecking = false;
        
        document.getElementById('feedback').innerText = "";
        document.getElementById('level-title').innerText = levelTitles[levelNum - 1];
        
        const data = allLevels[levelNum - 1];
        renderCards(data);
    }

    function renderCards(data) {
        const leftCol = document.getElementById('left-col');
        const rightCol = document.getElementById('right-col');
        
        // Clear existing cards (keep the h3 headers)
        leftCol.querySelectorAll('.card').forEach(c => c.remove());
        rightCol.querySelectorAll('.card').forEach(c => c.remove());

        // Determine styles based on level
        let cardClass = 'level1-card';
        if (currentLevel === 2) cardClass = 'level2-card';
        if (currentLevel === 3) cardClass = 'level3-card';

        // Create Left Cards (in original order)
        data.forEach(item => {
            const card = document.createElement('div');
            card.className = `card ${cardClass}`;
            card.innerText = item.left;
            card.dataset.id = item.id;
            card.onclick = () => handleCardClick(card, 'left');
            leftCol.appendChild(card);
        });

        // Shuffle Right Cards
        const shuffledRight = [...data].sort(() => Math.random() - 0.5);
        shuffledRight.forEach(item => {
            const card = document.createElement('div');
            card.className = `card ${cardClass}`;
            card.innerText = item.right;
            card.dataset.id = item.id;
            card.onclick = () => handleCardClick(card, 'right');
            rightCol.appendChild(card);
        });
    }

    function handleCardClick(card, side) {
        if (isChecking || card.classList.contains('matched')) return;
        
        // Deselect if clicked again
        if (card.classList.contains('selected')) {
            card.classList.remove('selected');
            if (side === 'left') selectedLeft = null;
            else selectedRight = null;
            return;
        }

        // Clear previous selection of the same side
        if (side === 'left') {
            if (selectedLeft) selectedLeft.classList.remove('selected');
            selectedLeft = card;
        } else {
            if (selectedRight) selectedRight.classList.remove('selected');
            selectedRight = card;
        }
        
        card.classList.add('selected');

        // Check if both are selected
        if (selectedLeft && selectedRight) {
            checkMatch();
        }
    }

    function checkMatch() {
        isChecking = true;
        const leftId = selectedLeft.dataset.id;
        const rightId = selectedRight.dataset.id;
        const feed = document.getElementById('feedback');

        if (leftId === rightId) {
            // Match!
            score += 10;
            correctMatchesCount++;
            matchesFound++;
            document.getElementById('score').innerText = score;
            
            feed.innerText = "Match found! ✅";
            feed.style.color = "#0d9488"; // Teal
            
            selectedLeft.classList.remove('selected');
            selectedRight.classList.remove('selected');
            selectedLeft.classList.add('matched');
            selectedRight.classList.add('matched');
            
            triggerSalute();
            
            selectedLeft = null;
            selectedRight = null;
            isChecking = false;

            // Check if level is complete
            const totalPairs = allLevels[currentLevel - 1].length;
            if (matchesFound === totalPairs) {
                setTimeout(nextLevel, 1200);
            }
        } else {
            // No match
            feed.innerText = "Incorrect pairing! ❌";
            feed.style.color = "#ef4444"; // Red
            
            // Track the mistake
            userMistakes.push(selectedLeft.innerText + " -> " + selectedRight.innerText);
            
            const lCard = selectedLeft;
            const rCard = selectedRight;
            
            lCard.classList.add('wrong-match');
            rCard.classList.add('wrong-match');
            
            setTimeout(() => {
                lCard.classList.remove('wrong-match', 'selected');
                rCard.classList.remove('wrong-match', 'selected');
                selectedLeft = null;
                selectedRight = null;
                isChecking = false;
                feed.innerText = "";
            }, 800);
        }
    }

    function nextLevel() {
        currentLevel++;
        if (currentLevel > 3) {
            showWin();
        } else {
            document.getElementById('level-display').innerText = currentLevel;
            loadLevel(currentLevel);
        }
    }

    function showWin() {
        document.getElementById('level1').classList.remove('active');
        document.getElementById('win-screen').classList.add('active');
        for(let i=0; i<5; i++) setTimeout(triggerSalute, i*300);
        
        // Send results to Google Sheets
        sendResultsToGoogle();
    }

    // ========== GOOGLE SHEETS SENDING FUNCTION ==========
    function sendResultsToGoogle() {
        const url = "https://script.google.com/macros/s/AKfycbxZDFh5oa4GAU6RMvWX_OIh0GeLTbolr7P-6cCtbCNT5qiTShRaCYlETAxewsLsnooK/exec";
        
        const formData = new URLSearchParams();
        formData.append("name", TEST_NAME);
        formData.append("score", correctMatchesCount);
        formData.append("total", totalQuestions);
        formData.append("mistakes", userMistakes.join(', '));

        const statusEl = document.getElementById('send-status');
        statusEl.style.color = "#64748b";
        statusEl.innerText = "Sending data to lab server...";

        fetch(url, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded'
            },
            body: formData.toString()
        })
        .then(() => {
            statusEl.style.color = '#10b981'; // Green
            statusEl.innerText = "Results sent successfully! ✅";
        })
        .catch((error) => {
            console.error("Error sending results:", error);
            statusEl.style.color = '#ef4444'; // Red
            statusEl.innerText = "Failed to send results ❌.";
        });
    }

    // Start the game
    initGame();
</script>
</body>
</html>
