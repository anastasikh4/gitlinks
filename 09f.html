<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌟 Easy School Actions Game 🌟</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0d1b2a 0%, #1b263b 50%, #000 100%);
            color: #fff;
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            overflow-x: hidden;
        }
        .app { max-width: 800px; width: 95%; padding: 20px; }
        .header { text-align: center; margin-bottom: 30px; }
        .logo { font-family: 'Arial Black', sans-serif; font-size: 2.5em; color: #00ffff; text-shadow: 0 0 15px #0099ff; margin-bottom: 10px; text-transform: uppercase; }
        
        .progress-container { width: 100%; height: 12px; background: rgba(255,255,255,0.1); border-radius: 10px; margin-bottom: 20px; }
        .progress-fill { height: 100%; background: #00ffff; width: 0%; border-radius: 10px; transition: width 0.4s; }
        
        .stats { display: flex; justify-content: space-between; font-size: 1.5em; margin-bottom: 20px; }
        .hearts { color: #ff4757; }

        .card { background: rgba(255,255,255,0.07); backdrop-filter: blur(10px); border: 2px solid rgba(255,255,255,0.1); border-radius: 30px; padding: 40px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .visual { font-size: 5.5em; margin-bottom: 20px; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        
        .question-text { font-size: 2.2rem; font-weight: bold; margin-bottom: 30px; color: #f0f0f0; line-height: 1.4; }
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        
        .btn { 
            padding: 18px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.2); 
            border-radius: 20px; cursor: pointer; font-size: 1.4em; font-weight: bold; color: white;
            transition: 0.3s; font-family: inherit;
        }
        .btn:hover { background: rgba(255,255,255,0.2); border-color: #00ffff; transform: scale(1.03); }
        .btn.correct { background: #00ff88 !important; color: #000; border-color: #00ff88; font-weight: bold; }
        .btn.wrong { background: #ff4757 !important; border-color: #ff4757; }

        .win-screen { display: none; text-align: center; }
    </style>
</head>
<body>

<div class="app">
    <div id="gameUI">
        <div class="header">
            <div class="logo">Teacher Says!</div>
            <div class="progress-container"><div class="progress-fill" id="pFill"></div></div>
            <div class="stats">
                <div id="qCounter">Task 1/8</div>
                <div class="hearts" id="heartBox">❤️❤️❤️</div>
            </div>
        </div>

        <div class="card">
            <div class="visual" id="visual">🗣️</div>
            <div class="question-text" id="qText">...</div>
            <div class="options" id="optBox"></div>
        </div>
    </div>

    <div id="winScreen" class="win-screen">
        <h1 style="font-size: 4em; color: #00ffff; font-family: 'Arial Black', sans-serif;">GREAT JOB!</h1>
        <p style="font-size: 2em; margin-top: 10px;">You know your school actions!</p>
        <button class="btn" onclick="location.reload()" style="margin-top:30px; padding: 20px 50px;">Play Again</button>
    </div>
</div>

<script>
    // Simplified target vocabulary array for Level A0+ Starters
    const questions = [
        { v: "🎨", q: "_______ the picture!", a: ["colour", "read"], c: "colour" },
        { v: "📖", q: "_______ the book!", a: ["read", "write"], c: "read" },
        { v: "🤫", q: "Please, _______!", a: ["be quiet", "sing"], c: "be quiet" },
        { v: "👂", q: "_______ carefully!", a: ["listen", "write"], c: "listen" },
        { v: "✍️", q: "_______ your name!", a: ["read", "write"], c: "write" },
        { v: "📘", q: "_______ your book!", a: ["open", "close"], c: "open" },
        { v: "🧍‍♂️", q: "Please, _______ up!", a: ["stand", "sit"], c: "stand" },
        { v: "🪑", q: "Please, _______ down!", a: ["stand", "sit"], c: "sit" }
    ];

    let current = 0;
    let lives = 3;

    function load() {
        if (current >= questions.length) {
            document.getElementById('gameUI').style.display = 'none';
            document.getElementById('winScreen').style.display = 'block';
            return;
        }

        const data = questions[current];
        document.getElementById('visual').innerText = data.v;
        document.getElementById('qText').innerHTML = `Teacher says:<br>"<strong>${data.q}</strong>"`;
        document.getElementById('qCounter').innerText = `Task ${current + 1}/${questions.length}`;
        
        const box = document.getElementById('optBox');
        box.innerHTML = '';
        
        const optionsShuffled = [...data.a].sort(() => Math.random() - 0.5);
        
        optionsShuffled.forEach(opt => {
            const b = document.createElement('button');
            b.className = 'btn';
            b.innerText = opt;
            b.onclick = () => check(opt, b);
            box.appendChild(b);
        });

        document.getElementById('pFill').style.width = (current / questions.length) * 100 + '%';
    }

    function check(choice, btn) {
        const buttons = document.querySelectorAll('.btn');
        buttons.forEach(b => b.style.pointerEvents = 'none');

        if (choice === questions[current].c) {
            btn.classList.add('correct');
            setTimeout(() => { 
                current++; 
                load(); 
            }, 800);
        } else {
            btn.classList.add('wrong');
            buttons.forEach(b => {
                if (b.innerText === questions[current].c) b.classList.add('correct');
            });
            
            lives--;
            updateHearts();
            if (lives <= 0) {
                setTimeout(() => {
                    alert("Game Over! Let's try again!");
                    location.reload();
                }, 400);
            } else {
                setTimeout(() => {
                    current++;
                    load();
                }, 1500);
            }
        }
    }

    function updateHearts() {
        let h = "";
        for(let i=0; i<3; i++) h += i < lives ? "❤️" : "🖤";
        document.getElementById('heartBox').innerText = h;
    }

    load();
</script>

</body>
</html>
