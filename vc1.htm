<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starlight 2: This, These, That, Those</title>
    <style>
        :root {
            --primary-purple: #7c4dff;
            --light-purple: #ede7f6;
            --correct-btn: #4caf50;
            --wrong-btn: #f44336;
            --bg-color: #e8eaf6;
            --near-color: #ff6b6b;
            --far-color: #4d96ff;
        }
        body { 
            font-family: 'Comic Sans MS', 'Segoe UI', cursive, sans-serif; 
            background: var(--bg-color); 
            text-align: center; color: #311b92; margin: 0; padding: 20px; overflow-x: hidden;
        }
        .game-container { 
            max-width: 750px; margin: 0 auto; padding: 30px; background: white; 
            border-radius: 30px; border: 6px solid var(--primary-purple); position: relative;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15); z-index: 2;
        }
        .level { display: none; }
        .active { display: block; }
        
        h1 { margin-top: 0; font-size: 1.8em; }

        /* ============ SCORE ============ */
        #score-board { 
            font-size: 1.05em; background: var(--light-purple); padding: 10px 20px; 
            border-radius: 20px; border: 2px solid var(--primary-purple); 
            margin-bottom: 20px; display: inline-block; font-weight: bold;
        }

        /* ============ SCENE ============ */
        .scene {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom, #f9f9f9, #eeeeee);
            border: 3px solid #ddd;
            border-radius: 16px;
            padding: 18px 10px;
            margin: 15px 0;
            position: relative;
            min-height: 120px;
        }
        .scene::after {
            content: '';
            position: absolute;
            bottom: 8px;
            left: 10%;
            right: 10%;
            border-top: 3px dotted #bbb;
        }
        .scene-item {
            display: flex;
            flex-direction: row;
            align-items: center;
            z-index: 2;
        }
        .scene-item .emoji { font-size: 2.8em; line-height: 1; }
        .scene-item .finger { font-size: 2.2em; line-height: 1; }

        /* Near: finger touches the object */
        .near-object {
            display: flex;
            align-items: center;
            gap: 0px;
        }
        .near-object .finger { transform: translateX(4px); }

        /* Far: finger points at the object from a distance */
        .far-object {
            display: flex;
            align-items: center;
            gap: 40px;
        }
        .far-object .finger { transform: scaleX(-1); }

        /* ============ QUESTION ============ */
        .text-display { 
            font-size: 1.35em; 
            line-height: 1.7; 
            margin: 18px 0; 
            padding: 20px; 
            background: var(--light-purple); 
            border-radius: 15px; 
            border: 2px dashed var(--primary-purple);
            text-align: center;
            font-weight: bold;
        }
        .blank { 
            display: inline-block; 
            min-width: 70px; 
            border-bottom: 3px solid var(--primary-purple); 
            text-align: center; 
            font-weight: bold; 
            color: var(--primary-purple);
            padding: 0 6px;
            transition: 0.3s;
        }
        .blank.filled {
            color: #2e7d32;
            border-bottom-color: #2e7d32;
        }

        /* ============ OPTIONS ============ */
        .options-row { 
            display: flex; 
            justify-content: center; 
            flex-wrap: wrap; 
            gap: 12px; 
            margin-top: 18px; 
        }
        button { 
            padding: 14px 26px; 
            font-size: 1.05em; 
            cursor: pointer; 
            color: white; 
            border: none; 
            border-radius: 15px; 
            transition: 0.2s;
            font-family: inherit; 
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-option { background: var(--primary-purple); }
        .btn-option:hover { transform: scale(1.05); opacity: 0.9; }
        
        .feedback { font-weight: bold; min-height: 30px; margin-top: 15px; font-size: 1.15em; }

        /* ============ MEMORY GRID (4 pairs = 8 cards) ============ */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 12px; 
            margin-top: 18px; 
        }
        .card { 
            width: 100%; 
            height: 110px; 
            background: var(--primary-purple); 
            color: white; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 0.95rem; 
            font-weight: bold; 
            cursor: pointer; 
            border-radius: 12px; 
            user-select: none; 
            padding: 6px;
            transition: all 0.3s ease; 
            text-align: center; 
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
            word-break: break-word;
        }
        .card:hover { transform: scale(1.05); }
        .card.flipped { 
            background: #fff9c4; 
            color: #311b92; 
            border: 2px solid #fbc531; 
            transform: scale(0.95); 
        }
        .card.matched { 
            background: var(--correct-btn); 
            color: white; 
            cursor: default; 
            opacity: 0.8; 
            transform: scale(1); 
        }
        .card.matched:hover { transform: scale(1); }

        /* ============ SALUTE ANIMATION ============ */
        .salute {
            position: absolute; width: 10px; height: 10px; background: gold;
            border-radius: 50%; pointer-events: none; z-index: 999;
            animation: explode 0.8s ease-out forwards;
        }
        @keyframes explode {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }

        /* Responsive */
        @media (max-width: 560px) {
            .grid { grid-template-columns: repeat(2, 1fr); }
            .card { height: 100px; font-size: 0.85rem; }
            .scene-item .emoji { font-size: 2.1em; }
            .scene-item .finger { font-size: 1.7em; }
            .far-object { gap: 20px; }
            .text-display { font-size: 1.1em; }
            h1 { font-size: 1.4em; }
            button { padding: 12px 20px; font-size: 0.95em; }
        }
    </style>
</head>
<body>

<div class="game-container" id="main-box">
    <h1>🌟 This, These, That, Those 🌟</h1>
    <div id="score-board">Level: <span id="current-level">1</span> | Score: <span id="score">0</span></div>

    <!-- LEVEL 1: Memory Game (4 pairs = 8 cards) -->
    <div id="level1" class="level active">
        <h3>Level 1: Match the Question to the Answer</h3>
        <div id="grid1" class="grid"></div>
        <div id="feedback1" class="feedback"></div>
        <button class="btn-option hidden" id="next1" onclick="goToLevel2()">Next Level ➡️</button>
    </div>

    <!-- LEVEL 2: Quiz with Scene & Arrows -->
    <div id="level2" class="level">
        <h3>Level 2: Choose the correct word</h3>
        <div id="l2-scene" class="scene"></div>
        <div id="l2-text" class="text-display"></div>
        <div id="l2-options" class="options-row"></div>
        <div id="l2-feedback" class="feedback"></div>
        <button class="btn-option hidden" id="next2" onclick="showWin()">Finish! 🏆</button>
    </div>

    <div id="win-screen" class="level">
        <h2 style="font-size: 2.5em; color: var(--primary-purple);">🌟 STAR STUDENT! 🌟</h2>
        <p style="font-size: 1.2em;">You finished all the exercises!</p>
        <button onclick="location.reload()" style="background: var(--primary-purple); margin-top: 20px;">Play Again 🔄</button>
    </div>
</div>

<script>
    let score = 0;
    let currentLvl = 1;

    // ============ LEVEL 1 DATA: Memory Game (4 pairs) ============
    const level1Data = [
        { id: 1, q: "What's this? 👉🎩", a: "It's a hat." },
        { id: 2, q: "What are those? 🎾🎾👈", a: "They're tennis balls." },
        { id: 3, q: "What's that? 🐶👈", a: "It's a dog." },
        { id: 4, q: "What are these? 👉👟👟", a: "They're my trainers." }
    ];
    let flippedCards = [];
    let matchedCount = 0;

    // ============ LEVEL 2 DATA: More questions, finger instead of labels ============
    // side: "near" (object + finger close) or "far" (finger far from object)
    // near: finger points up at object right next to it
    // far: finger points at object from a distance
    const l2Data = [
        // --- NEAR (singular: this) ---
        { side: "near", emoji: "🎩", finger: "👆", text: "What's ___? — It's a hat.", correct: "this" },
        { side: "near", emoji: "🍎", finger: "👆", text: "What's ___? — It's an apple.", correct: "this" },
        { side: "near", emoji: "📕", finger: "👆", text: "What's ___? — It's a book.", correct: "this" },
        { side: "near", emoji: "🐱", finger: "👆", text: "What's ___? — It's a cat.", correct: "this" },

        // --- NEAR (plural: these) ---
        { side: "near", emoji: "👟👟", finger: "👆", text: "What are ___? — They're my trainers.", correct: "these" },
        { side: "near", emoji: "✏️✏️", finger: "👆", text: "What are ___? — They're pencils.", correct: "these" },
        { side: "near", emoji: "🍪🍪", finger: "👆", text: "What are ___? — They're cookies.", correct: "these" },

        // --- FAR (singular: that) ---
        { side: "far", emoji: "🐶", finger: "👉", text: "What's ___? — It's a dog.", correct: "that" },
        { side: "far", emoji: "🚗", finger: "👉", text: "What's ___? — It's a car.", correct: "that" },
        { side: "far", emoji: "🏠", finger: "👉", text: "What's ___? — It's a house.", correct: "that" },
        { side: "far", emoji: "🌳", finger: "👉", text: "What's ___? — It's a tree.", correct: "that" },

        // --- FAR (plural: those) ---
        { side: "far", emoji: "🎾🎾🎾", finger: "👉", text: "What are ___? — They're tennis balls.", correct: "those" },
        { side: "far", emoji: "🌸🌸", finger: "👉", text: "What are ___? — They're flowers.", correct: "those" },
        { side: "far", emoji: "🐦🐦", finger: "👉", text: "What are ___? — They're birds.", correct: "those" }
    ];
    let l2Index = 0;
    const allOptions = ["this", "these", "that", "those"];

    // ============ SALUTE EFFECT ============
    function triggerSalute() {
        const box = document.getElementById('main-box');
        for (let i = 0; i < 15; i++) {
            const part = document.createElement('div');
            part.className = 'salute';
            const x = Math.random() * 600;
            const y = Math.random() * 400;
            part.style.left = x + 'px';
            part.style.top = y + 'px';
            part.style.setProperty('--tx', (Math.random() - 0.5) * 200 + 'px');
            part.style.setProperty('--ty', (Math.random() - 0.5) * 200 + 'px');
            part.style.background = `hsl(${Math.random() * 360}, 100%, 50%)`;
            box.appendChild(part);
            setTimeout(() => part.remove(), 800);
        }
    }

    // ============ LEVEL 1 LOGIC ============
    function initLevel1() {
        const grid = document.getElementById('grid1');
        grid.innerHTML = '';
        flippedCards = [];
        matchedCount = 0;

        let cardsData = [];
        level1Data.forEach(item => {
            cardsData.push({ id: item.id, text: item.q, type: 'q' });
            cardsData.push({ id: item.id, text: item.a, type: 'a' });
        });

        cardsData.sort(() => Math.random() - 0.5);

        cardsData.forEach(cardData => {
            const card = document.createElement('div');
            card.classList.add('card');
            card.dataset.id = cardData.id;
            card.dataset.type = cardData.type;
            card.innerText = "?"; 
            card.onclick = () => flipCard(card, cardData.text);
            grid.appendChild(card);
        });

        document.getElementById('feedback1').innerText = "";
        document.getElementById('next1').classList.add('hidden');
        updateScore();
    }

    function flipCard(card, text) {
        if (card.classList.contains('matched') || flippedCards.length === 2 || card.classList.contains('flipped')) return;

        card.innerText = text;
        card.classList.add('flipped');
        flippedCards.push(card);

        if (flippedCards.length === 2) {
            const [c1, c2] = flippedCards;
            
            if (c1.dataset.id === c2.dataset.id && c1.dataset.type !== c2.dataset.type) {
                c1.classList.add('matched');
                c2.classList.add('matched');
                matchedCount += 2;
                score += 10;
                updateScore();
                triggerSalute();
                flippedCards = [];
                
                if (matchedCount === level1Data.length * 2) {
                    document.getElementById('feedback1').innerText = "All pairs matched! 🎉";
                    document.getElementById('feedback1').style.color = "#2e7d32";
                    document.getElementById('next1').classList.remove('hidden');
                }
            } else {
                document.getElementById('feedback1').innerText = "Try again! ❌";
                document.getElementById('feedback1').style.color = "#c62828";
                setTimeout(() => {
                    c1.innerText = "?";
                    c2.innerText = "?";
                    c1.classList.remove('flipped');
                    c2.classList.remove('flipped');
                    flippedCards = [];
                    document.getElementById('feedback1').innerText = "";
                }, 800);
            }
        }
    }

    // ============ LEVEL 2 LOGIC ============
    function goToLevel2() {
        document.getElementById('level1').classList.remove('active');
        document.getElementById('level2').classList.add('active');
        document.getElementById('current-level').innerText = 2;
        l2Index = 0;
        initLevel2();
    }

    function initLevel2() {
        if (l2Index >= l2Data.length) {
            document.getElementById('next2').classList.remove('hidden');
            return;
        }

        const currentTask = l2Data[l2Index];

        // --- Render the scene: finger instead of labels ---
        const sceneEl = document.getElementById('l2-scene');
        const isNear = currentTask.side === 'near';

        // Near: finger right next to the object (touching)
        // Far: finger far from the object, pointing at it
        const objectHTML = isNear
            ? `<div class="scene-item near-object">
                   <span class="finger">${currentTask.finger}</span>
                   <span class="emoji">${currentTask.emoji}</span>
               </div>`
            : `<div class="scene-item far-object">
                   <span class="finger">${currentTask.finger}</span>
                   <span class="emoji">${currentTask.emoji}</span>
               </div>`;

        // Place near objects on the left, far objects on the right
        const leftHTML  = isNear ? objectHTML : '';
        const rightHTML = !isNear ? objectHTML : '';

        sceneEl.innerHTML = `
            <div style="flex:1; display:flex; justify-content:flex-start; align-items:center; padding-left:20px;">${leftHTML}</div>
            <div style="flex:1; display:flex; justify-content:flex-end; align-items:center; padding-right:20px;">${rightHTML}</div>
        `;

        // --- Render the sentence with blank ---
        const textContainer = document.getElementById('l2-text');
        textContainer.innerHTML = currentTask.text.replace("___", "<span class='blank' id='l2-blank'>___</span>");

        // --- Render the options (shuffled) ---
        const optionsContainer = document.getElementById('l2-options');
        optionsContainer.innerHTML = "";
        const shuffledOptions = [...allOptions].sort(() => Math.random() - 0.5);
        shuffledOptions.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'btn-option';
            btn.innerText = opt;
            btn.onclick = () => checkL2(opt, btn);
            optionsContainer.appendChild(btn);
        });

        document.getElementById('l2-feedback').innerText = "";
        document.getElementById('next2').classList.add('hidden');
        updateScore();
    }

    function checkL2(choice, btn) {
        const feed = document.getElementById('l2-feedback');
        const currentTask = l2Data[l2Index];
        
        if (choice === currentTask.correct) {
            const blankSpan = document.getElementById('l2-blank');
            if (blankSpan) {
                blankSpan.innerText = choice;
                blankSpan.classList.add('filled');
            }
            
            score += 10; 
            feed.innerText = "Correct! ✅"; 
            feed.style.color = "#2e7d32";
            triggerSalute();
            document.querySelectorAll('#l2-options .btn-option').forEach(b => b.disabled = true);
            l2Index++;
            updateScore();
            
            setTimeout(initLevel2, 1000);
        } else {
            feed.innerText = "Try again! ❌";
            feed.style.color = "#c62828";
            btn.style.background = "#c62828";
            setTimeout(() => { btn.style.background = ""; }, 800);
        }
    }

    function updateScore() { 
        document.getElementById('score').innerText = score; 
    }

    function showWin() {
        document.getElementById('level2').classList.remove('active');
        document.getElementById('win-screen').classList.add('active');
        for(let i=0; i<5; i++) setTimeout(triggerSalute, i*300);
    }

    // ============ START ============
    initLevel1();
</script>
</body>
</html>
