<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantifiers & Natural Disasters · Quest 2</title>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bubble-blue: #3498db;
            --bubble-green: #2ecc71;
            --bubble-yellow: #f1c40f;
            --bubble-red: #e74c3c;
            --text-dark: #2c3e50;
            --purple: #8e44ad;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Raleway', sans-serif;
            background: linear-gradient(135deg, #74b9ff 0%, #a29bfe 100%);
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        #game-frame {
            background: #fff;
            width: 100%;
            max-width: 560px;
            padding: 25px;
            border-radius: 30px;
            box-shadow: 0 15px 0px rgba(0,0,0,0.15);
            text-align: center;
            border: 5px solid var(--text-dark);
        }

        .header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-weight: 900;
            color: var(--text-dark);
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }

        .xp-badge {
            background: var(--bubble-yellow);
            padding: 2px 12px;
            border-radius: 40px;
            border: 2px solid var(--text-dark);
            font-size: 0.8rem;
        }

        .timer-bar-bg {
            width: 100%;
            height: 10px;
            background: #ecf0f1;
            border-radius: 40px;
            border: 2px solid var(--text-dark);
            margin-bottom: 18px;
            overflow: hidden;
        }

        .timer-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #2ecc71, #f1c40f, #e74c3c);
            width: 100%;
            transition: width 0.25s linear;
        }

        .dialogue-area {
            background: #f1f2f6;
            padding: 15px;
            border-radius: 20px;
            margin-bottom: 20px;
            min-height: 170px;
            border: 3px dashed #ccc;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .chat-line {
            background: white;
            padding: 14px 16px;
            border-radius: 12px;
            margin-bottom: 8px;
            font-size: 1.05rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            border: 2px solid #eee;
            color: var(--text-dark);
            line-height: 1.5;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .chat-line:last-child { margin-bottom: 0; }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .chat-line b {
            color: var(--bubble-blue);
            margin-right: 8px;
        }

        .chat-line.grammar-prompt b { color: var(--purple); }

        .chat-line u {
            color: var(--bubble-green);
            text-decoration: none;
            border-bottom: 3px solid var(--bubble-green);
            padding: 0 4px;
        }

        .chat-line .blank {
            display: inline-block;
            min-width: 100px;
            border-bottom: 3px dashed var(--purple);
            color: var(--purple);
            font-weight: 900;
            text-align: center;
            padding: 0 6px;
            margin: 0 4px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .option-btn {
            background: white;
            border: 3px solid var(--text-dark);
            padding: 14px 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 0 var(--text-dark);
            transition: 0.1s;
            text-align: center;
            color: var(--text-dark);
            font-family: 'Raleway', sans-serif;
        }

        .option-btn:hover:not(.disabled) {
            background: #fdfdfd;
            transform: translateY(-1px);
            box-shadow: 0 5px 0 var(--text-dark);
        }

        .option-btn:active {
            transform: translateY(2px);
            box-shadow: none;
        }

        .correct {
            border-color: var(--bubble-green) !important;
            color: var(--bubble-green) !important;
            background: #e8f8f5 !important;
        }

        .wrong {
            border-color: var(--bubble-red) !important;
            color: var(--bubble-red) !important;
            background: #fde8e8 !important;
            animation: shake 0.35s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        .disabled {
            pointer-events: none;
            opacity: 0.6;
        }

        #win-screen { display: none; padding: 20px; }

        #win-screen h2 {
            color: var(--bubble-green);
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        .final-xp {
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--text-dark);
            background: var(--bubble-yellow);
            display: inline-block;
            padding: 6px 24px;
            border-radius: 40px;
            border: 3px solid var(--text-dark);
            margin: 10px 0;
        }

        @media (max-width: 420px) {
            .option-btn { font-size: 0.9rem; padding: 12px 8px; }
            .chat-line { font-size: 0.95rem; }
            #game-frame { padding: 18px; }
        }
    </style>
</head>
<body>

<div id="game-frame">
    <div id="play-screen">
        <div class="header">
            <span id="round-title">ROUND 1: QUANTIFIERS 🔢</span>
            <span>TASK <span id="lvl-num">1</span> / <span id="total-lvls">5</span></span>
        </div>

        <div class="header" style="justify-content:center; margin-bottom:8px;">
            <span class="xp-badge">⭐ XP: <span id="xp-value">0</span></span>
        </div>

        <div class="timer-bar-bg">
            <div class="timer-bar-fill" id="timer-fill"></div>
        </div>

        <div class="dialogue-area" id="chat-box"></div>

        <div class="options-grid" id="options-box"></div>
    </div>

    <div id="win-screen">
        <h2>QUEST COMPLETED! 🏆</h2>
        <p style="font-weight:bold; font-size:1.1rem; color:var(--text-dark);">
            Amazing! You've mastered quantifiers and disaster vocabulary!
        </p>
        <div class="final-xp">⭐ Total XP: <span id="final-xp-value">0</span></div>
        <div style="font-size: 5rem; margin: 15px 0;">🌊🌋⭐</div>
        <button class="option-btn" style="text-align:center; width: 100%; margin-top:20px;" onclick="location.reload()">
            REPLAY QUEST
        </button>
    </div>
</div>

<script>
    /* ============================================================
       ROUND 1 — QUANTIFIERS (all-new sentences)
       ============================================================ */
    const round1Levels = [
        {
            sentence: "________ my sister and I love watching adventure films.",
            correct: "Both",
            choices: ["Both", "Either", "Neither", "None"]
        },
        {
            sentence: "You can take ________ the bus or the train to the airport.",
            correct: "either",
            choices: ["either", "neither", "both", "none"]
        },
        {
            sentence: "________ of the two brothers wanted to go camping in the storm.",
            correct: "Neither",
            choices: ["Neither", "Either", "Both", "None"]
        },
        {
            sentence: "________ of the hikers was hurt when the avalanche started.",
            correct: "None",
            choices: ["None", "Both", "Either", "Neither"]
        },
        {
            sentence: "The ________ neighbourhood lost power after the hurricane.",
            correct: "whole",
            choices: ["whole", "either", "neither", "none"]
        }
    ];

    /* ============================================================
       ROUND 2 — NATURAL DISASTERS VOCAB (all-new sentences)
       ============================================================ */
    const round2Levels = [
        {
            sentence: "The volcanic eruption caused ________ damage to the island.",
            correct: "tremendous",
            choices: ["tremendous", "powerful", "giant", "undersea"]
        },
        {
            sentence: "A ________ typhoon hit the coast of the Philippines last autumn.",
            correct: "powerful",
            choices: ["powerful", "giant", "tectonic", "undersea"]
        },
        {
            sentence: "________ waves crashed against the small fishing boats.",
            correct: "Giant",
            choices: ["Giant", "Tectonic", "Tremendous", "Undersea"]
        },
        {
            sentence: "Scientists study ________ activity to help predict earthquakes.",
            correct: "tectonic",
            choices: ["tectonic", "undersea", "giant", "powerful"]
        },
        {
            sentence: "An ________ fault line runs along the coast of California.",
            correct: "undersea",
            choices: ["undersea", "tectonic", "giant", "tremendous"]
        }
    ];

    /* ============================================================
       GAME STATE
       ============================================================ */
    let currentRound = 1;
    let currentLvl = 0;
    let xp = 0;

    /* ============================================================
       TIMER — 40 seconds per question
       ============================================================ */
    const TIME_LIMIT = 40;
    let timerInterval = null;
    let timeLeft = TIME_LIMIT;

    function startTimer() {
        clearInterval(timerInterval);
        timeLeft = TIME_LIMIT;
        const fill = document.getElementById('timer-fill');
        if (!fill) return;
        fill.style.width = '100%';

        timerInterval = setInterval(() => {
            timeLeft -= 0.25;
            if (timeLeft < 0) timeLeft = 0;
            fill.style.width = (timeLeft / TIME_LIMIT * 100) + '%';

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                const buttons = document.querySelectorAll('.option-btn');
                const activeLevels = currentRound === 1 ? round1Levels : round2Levels;
                const lvl = activeLevels[currentLvl];
                buttons.forEach(b => {
                    b.classList.add('disabled');
                    if (b.dataset.value.toLowerCase() === lvl.correct.toLowerCase())
                        b.classList.add('correct');
                });
                setTimeout(() => advanceLevel(activeLevels), 1200);
            }
        }, 250);
    }

    function stopTimer() { clearInterval(timerInterval); }

    /* ============================================================
       SHUFFLE
       ============================================================ */
    function shuffleArray(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    /* ============================================================
       RENDER
       ============================================================ */
    function loadGame() {
        const isRound1 = (currentRound === 1);
        const activeLevels = isRound1 ? round1Levels : round2Levels;
        const lvl = activeLevels[currentLvl];

        document.getElementById('round-title').innerText = isRound1
            ? "ROUND 1: QUANTIFIERS 🔢"
            : "ROUND 2: DISASTER VOCAB 🌊";
        document.getElementById('lvl-num').innerText = currentLvl + 1;
        document.getElementById('total-lvls').innerText = activeLevels.length;
        document.getElementById('xp-value').innerText = xp;

        const chatBox = document.getElementById('chat-box');
        const sentenceWithBlank = lvl.sentence.replace('________', '<span class="blank">?</span>');
        chatBox.innerHTML = `
            <div class="chat-line">
                <b>Fill in:</b>&nbsp;<span>${sentenceWithBlank}</span>
            </div>
        `;

        const optBox = document.getElementById('options-box');
        optBox.innerHTML = '';

        const choices = shuffleArray([...lvl.choices]);
        choices.forEach(choice => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.dataset.value = choice;
            btn.innerText = choice;
            btn.onclick = () => checkChoice(choice, btn);
            optBox.appendChild(btn);
        });

        startTimer();
    }

    /* ============================================================
       CHECK ANSWER
       ============================================================ */
    function checkChoice(val, btn) {
        const isRound1 = (currentRound === 1);
        const activeLevels = isRound1 ? round1Levels : round2Levels;
        const lvl = activeLevels[currentLvl];

        if (val.toLowerCase() === lvl.correct.toLowerCase()) {
            stopTimer();
            const bonus = Math.max(0, Math.round(timeLeft / 4));
            xp += 10 + bonus;
            document.getElementById('xp-value').innerText = xp;

            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(b => b.classList.add('disabled'));
            btn.classList.add('correct');

            const completed = lvl.sentence.replace('________', `<u>${lvl.correct}</u>`);
            document.getElementById('chat-box').innerHTML = `
                <div class="chat-line grammar-prompt"><b>✓ Correct:</b></div>
                <div class="chat-line">${completed}</div>
            `;

            setTimeout(() => advanceLevel(activeLevels), 1200);
        } else {
            btn.classList.add('wrong');
            setTimeout(() => {
                btn.classList.remove('wrong');
                btn.classList.add('disabled');
            }, 500);
        }
    }

    /* ============================================================
       ADVANCE
       ============================================================ */
    function advanceLevel(activeLevels) {
        currentLvl++;

        if (currentLvl < activeLevels.length) {
            loadGame();
        } else {
            if (currentRound === 1) {
                setTimeout(() => {
                    currentRound = 2;
                    currentLvl = 0;
                    loadGame();
                }, 700);
            } else {
                stopTimer();
                setTimeout(showWin, 600);
            }
        }
    }

    /* ============================================================
       WIN
       ============================================================ */
    function showWin() {
        document.getElementById('play-screen').style.display = 'none';
        document.getElementById('win-screen').style.display = 'block';
        document.getElementById('final-xp-value').innerText = xp;
    }

    /* ============================================================
       START
       ============================================================ */
    loadGame();
</script>
</body>
</html>
