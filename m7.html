<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🦸 Super Hero Quiz — Easy → Hard</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka:wght@500;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1729;
    --card: #ffffff;
    --text: #16213e;
    --text-light: #64748b;
    --blue: #2563eb;
    --blue-dark: #1e40af;
    --blue-light: #dbeafe;
    --orange: #f97316;
    --orange-dark: #c2410c;
    --green: #16a34a;
    --green-dark: #15803d;
    --green-light: #dcfce7;
    --red: #dc2626;
    --red-dark: #b91c1c;
    --red-light: #fee2e2;
    --yellow: #facc15;
    --yellow-dark: #eab308;
    --border: #e2e8f0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    font-family: 'Fredoka', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    overscroll-behavior: none;
  }

  body {
    background:
      radial-gradient(circle at 15% 10%, rgba(37,99,235,0.35) 0 100px, transparent 130px),
      radial-gradient(circle at 85% 20%, rgba(249,115,22,0.35) 0 120px, transparent 150px),
      radial-gradient(circle at 20% 90%, rgba(22,163,74,0.25) 0 90px, transparent 120px),
      radial-gradient(circle at 80% 85%, rgba(250,204,21,0.25) 0 100px, transparent 130px),
      linear-gradient(180deg, #0f1729 0%, #1a2540 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1.5px 1.5px at 15% 25%, white, transparent),
      radial-gradient(1.5px 1.5px at 45% 65%, white, transparent),
      radial-gradient(1.5px 1.5px at 78% 15%, white, transparent),
      radial-gradient(1.5px 1.5px at 88% 78%, white, transparent),
      radial-gradient(1.5px 1.5px at 30% 85%, white, transparent),
      radial-gradient(1.5px 1.5px at 60% 35%, white, transparent),
      radial-gradient(1.5px 1.5px at 5% 55%, white, transparent),
      radial-gradient(1.5px 1.5px at 95% 45%, white, transparent);
    background-size: 300px 300px, 400px 400px, 250px 250px, 350px 350px,
                     280px 280px, 320px 320px, 380px 380px, 260px 260px;
    opacity: 0.7;
    pointer-events: none;
    animation: twinkle 4s ease-in-out infinite;
    z-index: 0;
  }
  @keyframes twinkle {
    0%,100% { opacity: 0.7; }
    50% { opacity: 0.4; }
  }

  /* ============ HEADER ============ */
  .header {
    background: linear-gradient(135deg, #1e40af 0%, #2563eb 100%);
    border-bottom: 4px solid var(--yellow);
    padding: 12px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    gap: 10px;
  }
  .header-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .hero-badge {
    width: 42px; height: 42px;
    background: var(--yellow);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
    box-shadow: 0 0 0 3px rgba(250,204,21,0.3), inset 0 -3px 0 rgba(0,0,0,0.15);
    animation: heroPulse 2s ease-in-out infinite;
  }
  @keyframes heroPulse {
    0%,100% { box-shadow: 0 0 0 3px rgba(250,204,21,0.3), inset 0 -3px 0 rgba(0,0,0,0.15); }
    50% { box-shadow: 0 0 0 8px rgba(250,204,21,0.15), inset 0 -3px 0 rgba(0,0,0,0.15); }
  }
  .header-title {
    font-family: 'Bangers', cursive;
    font-size: 22px;
    color: white;
    letter-spacing: 2px;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.3);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .level-chip {
    background: rgba(255,255,255,0.15);
    border: 2px solid var(--yellow);
    color: var(--yellow);
    padding: 4px 10px;
    border-radius: 12px;
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 1px;
    flex-shrink: 0;
    transition: all 0.3s;
  }
  .score-badge {
    background: var(--yellow);
    color: #16213e;
    padding: 8px 14px;
    border-radius: 25px;
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 14px;
    letter-spacing: 0.5px;
    box-shadow: 0 4px 0 #ca8a04, inset 0 -2px 0 rgba(0,0,0,0.1);
    transition: all 0.3s;
    min-width: 70px;
    text-align: center;
    flex-shrink: 0;
  }
  .score-badge.good { background: var(--green); color: white; box-shadow: 0 4px 0 var(--green-dark), inset 0 -2px 0 rgba(0,0,0,0.15); }
  .score-badge.mid { background: var(--orange); color: white; box-shadow: 0 4px 0 var(--orange-dark), inset 0 -2px 0 rgba(0,0,0,0.15); }
  .score-badge.bad { background: var(--red); color: white; box-shadow: 0 4px 0 var(--red-dark), inset 0 -2px 0 rgba(0,0,0,0.15); }

  /* ============ MAIN ============ */
  .main {
    flex: 1;
    max-width: 720px;
    margin: 0 auto;
    width: 100%;
    padding: 22px 16px 50px;
    position: relative;
    z-index: 1;
  }

  /* ============ INTRO ============ */
  .intro {
    background: var(--card);
    border-radius: 28px;
    padding: 40px 28px 32px;
    text-align: center;
    border: 5px solid var(--blue);
    box-shadow: 0 8px 0 var(--blue-dark), 0 20px 40px rgba(0,0,0,0.3);
    position: relative;
    overflow: hidden;
    animation: cardIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .intro::before {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 160px; height: 160px;
    background: radial-gradient(circle, var(--blue-light) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
  }
  .intro::after {
    content: '';
    position: absolute;
    bottom: -60px; left: -60px;
    width: 180px; height: 180px;
    background: radial-gradient(circle, #fff7ed 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
  }
  @keyframes cardIn {
    0% { opacity: 0; transform: translateY(24px) scale(0.96); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  .intro-icon {
    font-size: 90px;
    line-height: 1;
    display: inline-block;
    margin-bottom: 8px;
    animation: heroFloat 2.4s ease-in-out infinite;
    position: relative;
    z-index: 1;
  }
  @keyframes heroFloat {
    0%,100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-12px) rotate(3deg); }
  }
  .intro-title {
    font-family: 'Bangers', cursive;
    font-size: 42px;
    color: var(--blue-dark);
    letter-spacing: 3px;
    line-height: 1.05;
    margin-bottom: 8px;
    text-shadow: 3px 3px 0 #dbeafe;
    position: relative;
    z-index: 1;
  }
  .intro-sub {
    color: var(--text-light);
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 26px;
    position: relative;
    z-index: 1;
  }

  .ladder {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 28px;
    text-align: left;
    position: relative;
    z-index: 1;
  }
  .ladder-step {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-radius: 14px;
    border: 3px solid;
    font-weight: 700;
    font-size: 0.95rem;
  }
  .ladder-step .lnum {
    font-family: 'Bangers', cursive;
    font-size: 24px;
    letter-spacing: 1px;
    width: 30px;
    text-align: center;
  }
  .ladder-step .ltext { flex: 1; }
  .ladder-step .lcount {
    font-family: 'Orbitron', sans-serif;
    font-size: 13px;
    font-weight: 900;
    padding: 4px 10px;
    border-radius: 10px;
    background: rgba(255,255,255,0.5);
  }
  .step-easy {
    background: var(--green-light);
    border-color: var(--green);
    color: var(--green-dark);
    box-shadow: 0 4px 0 var(--green-dark);
  }
  .step-easy .lcount { color: var(--green-dark); }
  .step-med {
    background: #fff7ed;
    border-color: var(--orange);
    color: var(--orange-dark);
    box-shadow: 0 4px 0 var(--orange-dark);
  }
  .step-med .lcount { color: var(--orange-dark); }
  .step-hard {
    background: var(--red-light);
    border-color: var(--red);
    color: var(--red-dark);
    box-shadow: 0 4px 0 var(--red-dark);
  }
  .step-hard .lcount { color: var(--red-dark); }

  .start-btn {
    width: 100%;
    padding: 20px;
    background: linear-gradient(180deg, var(--orange) 0%, #ea580c 100%);
    color: white;
    border: none;
    border-radius: 18px;
    font-family: 'Bangers', cursive;
    font-size: 26px;
    letter-spacing: 3px;
    cursor: pointer;
    transition: 0.12s;
    box-shadow: 0 7px 0 var(--orange-dark), inset 0 -3px 0 rgba(0,0,0,0.15);
    position: relative;
    z-index: 1;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.2);
  }
  .start-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 9px 0 var(--orange-dark), inset 0 -3px 0 rgba(0,0,0,0.15);
  }
  .start-btn:active {
    transform: translateY(4px);
    box-shadow: 0 3px 0 var(--orange-dark), inset 0 -2px 0 rgba(0,0,0,0.15);
  }

  /* ============ PROGRESS ============ */
  .progress-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
    font-family: 'Orbitron', sans-serif;
    font-size: 12px;
    color: white;
    font-weight: 900;
    letter-spacing: 1px;
    text-shadow: 1px 1px 0 rgba(0,0,0,0.4);
  }
  .progress-track {
    flex: 1;
    height: 16px;
    background: rgba(255,255,255,0.15);
    border: 3px solid var(--yellow);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: inset 0 3px 6px rgba(0,0,0,0.3);
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--yellow), var(--orange));
    width: 0%;
    transition: width 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
    border-radius: 8px;
    box-shadow: 0 0 12px rgba(250,204,21,0.6);
  }

  /* ============ QUIZ CARD ============ */
  .quiz-card {
    background: var(--card);
    border-radius: 24px;
    padding: 26px 22px;
    border: 5px solid var(--blue);
    box-shadow: 0 8px 0 var(--blue-dark), 0 20px 40px rgba(0,0,0,0.3);
    transition: transform 0.2s, border-color 0.3s, box-shadow 0.3s;
    position: relative;
    overflow: hidden;
    animation: cardIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .quiz-card.shake {
    animation: heroShake 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97);
    border-color: var(--red);
    box-shadow: 0 8px 0 var(--red-dark), 0 20px 40px rgba(0,0,0,0.3);
  }
  @keyframes heroShake {
    10%, 90% { transform: translateX(-4px); }
    20%, 80% { transform: translateX(8px); }
    30%, 50%, 70% { transform: translateX(-10px); }
    40%, 60% { transform: translateX(10px); }
  }

  .difficulty-tag {
    display: inline-block;
    font-family: 'Bangers', cursive;
    font-size: 14px;
    letter-spacing: 2px;
    padding: 5px 12px;
    border-radius: 12px;
    margin-bottom: 12px;
    text-transform: uppercase;
    color: white;
    box-shadow: 0 3px 0 rgba(0,0,0,0.2);
  }
  .diff-easy { background: linear-gradient(135deg, var(--green), var(--green-dark)); }
  .diff-med  { background: linear-gradient(135deg, var(--orange), var(--orange-dark)); }
  .diff-hard { background: linear-gradient(135deg, var(--red), var(--red-dark)); }

  .q-number {
    display: inline-block;
    background: rgba(37,99,235,0.1);
    color: var(--blue-dark);
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 1.2px;
    padding: 5px 12px;
    border-radius: 12px;
    margin-left: 8px;
    margin-bottom: 12px;
  }

  .q-text {
    font-family: 'Fredoka', sans-serif;
    font-size: 1.35rem;
    font-weight: 700;
    line-height: 1.4;
    color: var(--text);
    margin-bottom: 6px;
    text-align: center;
  }
  .q-hint {
    text-align: center;
    font-size: 0.9rem;
    color: var(--text-light);
    font-weight: 600;
    margin-bottom: 20px;
    font-style: italic;
  }

  /* ============ OPTIONS ============ */
  .options {
    display: grid;
    gap: 11px;
  }

  .option {
    position: relative;
    background: white;
    border: 3px solid var(--blue);
    border-radius: 16px;
    padding: 16px 18px;
    font-family: 'Fredoka', sans-serif;
    font-size: 1.02rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.1s, background 0.15s, border-color 0.15s, box-shadow 0.15s;
    text-align: left;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 5px 0 var(--blue-dark);
  }
  .option:hover:not(:disabled) {
    background: var(--blue-light);
    transform: translateY(-2px);
    box-shadow: 0 7px 0 var(--blue-dark);
  }
  .option:active:not(:disabled) {
    transform: translateY(4px);
    box-shadow: 0 1px 0 var(--blue-dark);
  }
  .option:disabled { cursor: default; }

  .option-letter {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--blue) 0%, var(--blue-dark) 100%);
    color: white;
    font-family: 'Bangers', cursive;
    font-size: 20px;
    letter-spacing: 1px;
    flex-shrink: 0;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,0.2);
    transition: 0.2s;
  }
  .option:hover:not(:disabled) .option-letter {
    transform: rotate(-6deg) scale(1.08);
  }
  .option.correct {
    background: var(--green-light);
    border-color: var(--green);
    color: var(--green-dark);
    box-shadow: 0 5px 0 var(--green-dark);
    animation: popWin 0.4s;
  }
  .option.correct .option-letter {
    background: linear-gradient(135deg, var(--green) 0%, var(--green-dark) 100%);
  }
  @keyframes popWin {
    0% { transform: scale(1); }
    50% { transform: scale(1.04); }
    100% { transform: scale(1); }
  }
  .option.wrong {
    background: var(--red-light);
    border-color: var(--red);
    color: var(--red-dark);
    box-shadow: 0 5px 0 var(--red-dark);
    animation: heroShake 0.4s;
  }
  .option.wrong .option-letter {
    background: linear-gradient(135deg, var(--red) 0%, var(--red-dark) 100%);
  }
  .option.dimmed { opacity: 0.4; }

  /* ============ FEEDBACK ============ */
  .feedback-msg {
    margin-top: 18px;
    padding: 14px 18px;
    border-radius: 14px;
    text-align: center;
    font-family: 'Bangers', cursive;
    font-size: 20px;
    letter-spacing: 1.5px;
    display: none;
    animation: fadeIn 0.3s;
    text-shadow: 1px 1px 0 rgba(0,0,0,0.1);
  }
  .feedback-msg.show { display: block; }
  .feedback-msg.good {
    background: var(--green-light);
    color: var(--green-dark);
    border: 3px solid var(--green);
    box-shadow: 0 4px 0 var(--green-dark);
  }
  .feedback-msg.bad {
    background: var(--red-light);
    color: var(--red-dark);
    border: 3px solid var(--red);
    box-shadow: 0 4px 0 var(--red-dark);
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ============ NEXT BUTTON ============ */
  .next-btn {
    width: 100%;
    margin-top: 18px;
    padding: 18px;
    background: linear-gradient(180deg, var(--blue) 0%, var(--blue-dark) 100%);
    color: white;
    border: none;
    border-radius: 16px;
    font-family: 'Bangers', cursive;
    font-size: 22px;
    letter-spacing: 2.5px;
    cursor: pointer;
    transition: 0.12s;
    box-shadow: 0 7px 0 #1e3a8a, inset 0 -3px 0 rgba(0,0,0,0.15);
    display: none;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.2);
  }
  .next-btn.show { display: block; animation: fadeIn 0.3s; }
  .next-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 9px 0 #1e3a8a, inset 0 -3px 0 rgba(0,0,0,0.15);
  }
  .next-btn:active {
    transform: translateY(4px);
    box-shadow: 0 3px 0 #1e3a8a, inset 0 -2px 0 rgba(0,0,0,0.15);
  }
  .next-btn.finish {
    background: linear-gradient(180deg, var(--green) 0%, var(--green-dark) 100%);
    box-shadow: 0 7px 0 #14532d, inset 0 -3px 0 rgba(0,0,0,0.15);
  }

  /* ============ RESULTS ============ */
  .results {
    background: var(--card);
    border-radius: 28px;
    padding: 44px 28px 36px;
    text-align: center;
    border: 5px solid var(--orange);
    box-shadow: 0 8px 0 var(--orange-dark), 0 20px 40px rgba(0,0,0,0.3);
    position: relative;
    overflow: hidden;
    animation: cardIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .results::before {
    content: '';
    position: absolute;
    top: -60px; left: 50%;
    transform: translateX(-50%);
    width: 400px; height: 200px;
    background: radial-gradient(circle, #fff7ed 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
  }
  .results-emoji {
    font-size: 100px;
    line-height: 1;
    display: inline-block;
    margin-bottom: 8px;
    animation: trophyBounce 1.8s ease-in-out infinite;
    position: relative;
    z-index: 1;
    filter: drop-shadow(0 8px 12px rgba(249,115,22,0.3));
  }
  @keyframes trophyBounce {
    0%,100% { transform: translateY(0) rotate(-5deg); }
    50% { transform: translateY(-14px) rotate(5deg); }
  }
  .results-title {
    font-family: 'Bangers', cursive;
    font-size: 46px;
    color: var(--orange-dark);
    letter-spacing: 3px;
    line-height: 1.05;
    margin-bottom: 6px;
    text-shadow: 3px 3px 0 #fed7aa;
    position: relative;
    z-index: 1;
  }
  .results-sub {
    color: var(--text-light);
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 18px;
    position: relative;
    z-index: 1;
  }
  .results-score {
    font-family: 'Orbitron', sans-serif;
    font-size: 58px;
    font-weight: 900;
    color: var(--blue-dark);
    line-height: 1;
    margin: 12px 0;
    letter-spacing: -3px;
    position: relative;
    z-index: 1;
  }
  .results-score .of {
    font-size: 24px;
    color: var(--text-light);
    font-weight: 700;
    letter-spacing: -1px;
  }
  .results-stars {
    font-size: 36px;
    letter-spacing: 8px;
    margin: 18px 0;
    position: relative;
    z-index: 1;
    animation: starsGlow 2s ease-in-out infinite;
  }
  @keyframes starsGlow {
    0%,100% { filter: drop-shadow(0 0 4px rgba(250,204,21,0.5)); }
    50% { filter: drop-shadow(0 0 16px rgba(250,204,21,0.9)); }
  }
  .results-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    max-width: 380px;
    margin: 22px auto;
    position: relative;
    z-index: 1;
  }
  .stat-box {
    border-radius: 16px;
    padding: 16px 12px;
    border: 3px solid;
  }
  .stat-box.correct-stat {
    background: var(--green-light);
    border-color: var(--green);
    box-shadow: 0 4px 0 var(--green-dark);
  }
  .stat-box.wrong-stat {
    background: var(--red-light);
    border-color: var(--red);
    box-shadow: 0 4px 0 var(--red-dark);
  }
  .stat-box .num {
    font-family: 'Orbitron', sans-serif;
    font-size: 32px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: -1px;
  }
  .stat-box.correct-stat .num { color: var(--green-dark); }
  .stat-box.wrong-stat .num { color: var(--red-dark); }
  .stat-box .lbl {
    font-size: 0.7rem;
    color: var(--text-light);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    margin-top: 6px;
  }
  .results-actions {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 22px;
    position: relative;
    z-index: 1;
  }
  .btn {
    padding: 18px 36px;
    border-radius: 16px;
    border: none;
    font-family: 'Bangers', cursive;
    font-size: 22px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: 0.12s;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.2);
    min-width: 180px;
  }
  .btn-primary {
    background: linear-gradient(180deg, var(--orange) 0%, var(--orange-dark) 100%);
    color: white;
    box-shadow: 0 6px 0 #9a3412, inset 0 -3px 0 rgba(0,0,0,0.15);
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 0 #9a3412, inset 0 -3px 0 rgba(0,0,0,0.15);
  }
  .btn-primary:active {
    transform: translateY(3px);
    box-shadow: 0 3px 0 #9a3412, inset 0 -2px 0 rgba(0,0,0,0.15);
  }

  .hidden { display: none !important; }

  /* ============ MOBILE ============ */
  @media (max-width: 600px) {
    .main { padding: 16px 12px 40px; }
    .quiz-card { padding: 20px 16px; border-radius: 20px; }
    .q-text { font-size: 1.1rem; }
    .option { padding: 14px 15px; font-size: 0.94rem; border-radius: 14px; }
    .option-letter { width: 30px; height: 30px; font-size: 17px; border-radius: 9px; }
    .intro { padding: 28px 18px 24px; border-radius: 24px; }
    .intro-icon { font-size: 70px; }
    .intro-title { font-size: 32px; letter-spacing: 2px; }
    .ladder-step { padding: 10px 12px; font-size: 0.85rem; }
    .ladder-step .lnum { font-size: 20px; width: 26px; }
    .start-btn { font-size: 22px; padding: 17px; letter-spacing: 2px; }
    .results { padding: 32px 20px 26px; border-radius: 24px; }
    .results-title { font-size: 32px; letter-spacing: 2px; }
    .results-score { font-size: 46px; }
    .results-emoji { font-size: 80px; }
    .results-stars { font-size: 28px; letter-spacing: 5px; }
    .btn { padding: 15px 24px; font-size: 18px; min-width: 140px; }
    .header-title { font-size: 15px; letter-spacing: 1px; }
    .hero-badge { width: 34px; height: 34px; font-size: 17px; }
    .score-badge { font-size: 12px; padding: 6px 10px; min-width: 60px; }
    .level-chip { font-size: 10px; padding: 3px 8px; }
    .next-btn { font-size: 19px; padding: 16px; letter-spacing: 2px; }
    .feedback-msg { font-size: 17px; padding: 12px 14px; }
  }
</style>
</head>
<body>

<!-- ==================== HEADER ==================== -->
<header class="header">
  <div class="header-left">
    <div class="hero-badge">🦸</div>
    <div class="header-title">SUPER QUIZ</div>
    <div class="level-chip" id="level-chip">EASY</div>
  </div>
  <div class="score-badge" id="score-badge">0 / 17</div>
</header>

<div class="main">

  <!-- ==================== INTRO ==================== -->
  <div id="intro-view" class="intro">
    <span class="intro-icon">🚀</span>
    <div class="intro-title">READY, HERO?</div>
    <div class="intro-sub">Three levels — go from easy to hard!</div>

    <div class="ladder">
      <div class="ladder-step step-easy">
        <span class="lnum">1</span>
        <span class="ltext">Easy — short answers</span>
        <span class="lcount">6 Q</span>
      </div>
      <div class="ladder-step step-med">
        <span class="lnum">2</span>
        <span class="ltext">Medium — fill the gap</span>
        <span class="lcount">5 Q</span>
      </div>
      <div class="ladder-step step-hard">
        <span class="lnum">3</span>
        <span class="ltext">Hard — pick the right sentence</span>
        <span class="lcount">6 Q</span>
      </div>
    </div>

    <button class="start-btn" onclick="startQuiz()">⚡ START QUIZ</button>
  </div>

  <!-- ==================== QUIZ ==================== -->
  <div id="quiz-view" class="hidden">
    <div class="progress-wrap">
      <span id="progress-text">1 / 17</span>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <span id="correct-count">0 ✓</span>
    </div>

    <div class="quiz-card" id="quiz-card">
      <div>
        <span class="difficulty-tag" id="diff-tag">EASY</span>
        <span class="q-number" id="q-number">1 / 17</span>
      </div>
      <div class="q-text" id="q-text"></div>
      <div class="q-hint" id="q-hint"></div>

      <div class="options" id="options-container"></div>

      <div class="feedback-msg" id="feedback-msg"></div>

      <button class="next-btn" id="next-btn" onclick="nextQuestion()">
        NEXT →
      </button>
    </div>
  </div>

  <!-- ==================== RESULTS ==================== -->
  <div id="results-view" class="hidden">
    <div class="results">
      <div class="results-emoji" id="results-emoji">🏆</div>
      <div class="results-title" id="results-title">GREAT JOB!</div>
      <div class="results-sub" id="results-sub">You finished the quiz</div>
      <div class="results-score" id="results-score">
        0<span class="of"> / 17</span>
      </div>
      <div class="results-stars" id="results-stars">⭐⭐⭐</div>

      <div class="results-stats">
        <div class="stat-box correct-stat">
          <div class="num" id="stat-correct">0</div>
          <div class="lbl">Correct</div>
        </div>
        <div class="stat-box wrong-stat">
          <div class="num" id="stat-wrong">0</div>
          <div class="lbl">Mistakes</div>
        </div>
      </div>

      <div class="results-actions">
        <button class="btn btn-primary" onclick="restartQuiz()">🔄 TRY AGAIN</button>
      </div>
    </div>
  </div>

</div>

<script>
/* =====================================================================
   QUIZ DATA — sorted EASY → MEDIUM → HARD
   Every question uses simple tap-the-answer buttons (no typing,
   no word-building). Hard = pick the correct full sentence.
   ===================================================================== */
const QUIZ_DATA = [
  /* =============== EASY (6 questions) =============== */
  {
    id: 1, diff: 'easy',
    q: "Are you Emma's brother?",
    hint: "Choose the correct short answer",
    options: ["Yes, I am.", "Yes, I am not.", "No, I am."],
    correct: "Yes, I am."
  },
  {
    id: 2, diff: 'easy',
    q: "Is she a singer?",
    hint: "Choose the correct short answer",
    options: ["No, she isn't.", "No, she is.", "Yes, she isn't."],
    correct: "No, she isn't."
  },
  {
    id: 3, diff: 'easy',
    q: "Is it a ruler?",
    hint: "Choose the correct short answer",
    options: ["Yes, I am.", "Yes, it is.", "No, it is."],
    correct: "Yes, it is."
  },
  {
    id: 4, diff: 'easy',
    q: "Is he Alvin?",
    hint: "Choose the correct short answer",
    options: ["No, you aren't.", "No, he isn't.", "Yes, he isn't."],
    correct: "No, he isn't."
  },
  {
    id: 5, diff: 'easy',
    q: "Are they happy? 👭",
    hint: "Choose the correct short answer",
    options: ["Yes, they are.", "No, they aren't.", "Yes, we are."],
    correct: "Yes, they are."
  },
  {
    id: 6, diff: 'easy',
    q: "Is she sad? 😢👧",
    hint: "Choose the correct short answer",
    options: ["Yes, she is.", "No, she isn't.", "Yes, he is."],
    correct: "Yes, she is."
  },

  /* =============== MEDIUM (5 questions) =============== */
  {
    id: 7, diff: 'medium',
    q: "My father and mother aren't doctors. ______ teachers.",
    hint: "Choose the correct word",
    options: ["They're", "It's", "He's"],
    correct: "They're"
  },
  {
    id: 8, diff: 'medium',
    q: "St. Petersburg ______ in Germany.",
    hint: "Choose the correct word",
    options: ["is", "isn't", "are"],
    correct: "isn't"
  },
  {
    id: 9, diff: 'medium',
    q: "St. Petersburg isn't in Germany. ______ in Russia.",
    hint: "Choose the correct word",
    options: ["She's", "It's", "They're"],
    correct: "It's"
  },
  {
    id: 10, diff: 'medium',
    q: "Harry ______ happy. ______ sad.",
    hint: "Choose the correct pair",
    options: ["isn't, He's", "is, He's", "isn't, She's"],
    correct: "isn't, He's"
  },
  {
    id: 11, diff: 'medium',
    q: "Olga and Denis ______ late.",
    hint: "Choose the correct word",
    options: ["are", "is", "isn't"],
    correct: "are"
  },

  /* =============== HARD (6 questions) =============== */
  /* Pick the correct full sentence */
  {
    id: 12, diff: 'hard',
    q: "Are they flowers? 🌻🌻",
    hint: "Choose the correct full answer",
    options: ["Yes, they are.", "Yes, they is.", "No, they isn't."],
    correct: "Yes, they are."
  },
  {
    id: 13, diff: 'hard',
    q: "Are we brothers? 👦👦👦",
    hint: "Choose the correct full answer",
    options: ["No, we are not.", "No, we isn't.", "Yes, we am not."],
    correct: "No, we are not."
  },
  {
    id: 14, diff: 'hard',
    q: "Are you sisters? 👧👧",
    hint: "Choose the correct full answer",
    options: ["Yes, we are.", "Yes, you is.", "No, we am."],
    correct: "Yes, we are."
  },
  {
    id: 15, diff: 'hard',
    q: "Is it an orange? 🍋",
    hint: "Choose the correct full answer",
    options: ["No, it isn't.", "No, it aren't.", "Yes, it am."],
    correct: "No, it isn't."
  },
  {
    id: 16, diff: 'hard',
    q: "Harry is not happy. Which sentence is correct?",
    hint: "Choose the correct full sentence",
    options: ["He isn't happy.", "He aren't happy.", "He am not happy."],
    correct: "He isn't happy."
  },
  {
    id: 17, diff: 'hard',
    q: "My sister is twenty years old. Which sentence is correct?",
    hint: "Choose the correct full sentence",
    options: ["She is twenty.", "She are twenty.", "She am twenty."],
    correct: "She is twenty."
  }
];

/* =====================================================================
   STATE
   ===================================================================== */
let queue = [];
let currentIndex = 0;
let correctCount = 0;
let wrongCount = 0;
let answered = false;

/* =====================================================================
   HELPERS
   ===================================================================== */
function normalize(str) {
  return String(str).toLowerCase().replace(/[.,!?;:'"]/g, '').replace(/\s+/g, ' ').trim();
}
function vibrate(p) { if (navigator.vibrate) { try { navigator.vibrate(p); } catch (e) {} } }

function updateScoreBadge() {
  const badge = document.getElementById('score-badge');
  badge.textContent = `${correctCount} / ${queue.length}`;
  badge.classList.remove('good', 'mid', 'bad');
  const pct = correctCount / queue.length;
  if (pct >= 0.8) badge.classList.add('good');
  else if (pct >= 0.5) badge.classList.add('mid');
  else if (currentIndex > 0) badge.classList.add('bad');
}

function updateLevelChip(diff) {
  const chip = document.getElementById('level-chip');
  if (diff === 'easy')   { chip.textContent = 'EASY';   chip.style.color = '#86efac'; chip.style.borderColor = '#86efac'; }
  if (diff === 'medium') { chip.textContent = 'MEDIUM'; chip.style.color = '#fdba74'; chip.style.borderColor = '#fdba74'; }
  if (diff === 'hard')   { chip.textContent = 'HARD';   chip.style.color = '#fca5a5'; chip.style.borderColor = '#fca5a5'; }
}

/* =====================================================================
   START QUIZ
   ===================================================================== */
function startQuiz() {
  queue = [...QUIZ_DATA];
  currentIndex = 0;
  correctCount = 0;
  wrongCount = 0;
  answered = false;

  document.getElementById('intro-view').classList.add('hidden');
  document.getElementById('results-view').classList.add('hidden');
  document.getElementById('quiz-view').classList.remove('hidden');

  renderQuestion();
}

/* =====================================================================
   RENDER QUESTION
   ===================================================================== */
function renderQuestion() {
  if (currentIndex >= queue.length) { showResults(); return; }

  answered = false;
  const item = queue[currentIndex];

  updateScoreBadge();
  updateLevelChip(item.diff);

  const total = queue.length;
  const pos = currentIndex + 1;
  document.getElementById('progress-text').textContent = `${pos} / ${total}`;
  document.getElementById('progress-fill').style.width = ((pos - 1) / total) * 100 + '%';
  document.getElementById('correct-count').textContent = `${correctCount} ✓`;

  const diffTag = document.getElementById('diff-tag');
  diffTag.className = 'difficulty-tag diff-' + (item.diff === 'easy' ? 'easy' : item.diff === 'medium' ? 'med' : 'hard');
  diffTag.textContent = item.diff.toUpperCase();

  document.getElementById('q-number').textContent = `${pos} / ${total}`;
  document.getElementById('q-text').textContent = item.q;
  document.getElementById('q-hint').textContent = item.hint || '';

  const card = document.getElementById('quiz-card');
  card.classList.remove('shake');

  const fb = document.getElementById('feedback-msg');
  fb.className = 'feedback-msg';
  fb.textContent = '';

  const nextBtn = document.getElementById('next-btn');
  nextBtn.classList.remove('show', 'finish');
  nextBtn.textContent = (pos === total) ? 'SEE RESULTS 🏆' : 'NEXT →';

  // Build options
  const optionsContainer = document.getElementById('options-container');
  optionsContainer.innerHTML = '';
  const letters = ['A', 'B', 'C', 'D'];

  item.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.innerHTML = `<span class="option-letter">${letters[i]}</span><span>${opt}</span>`;
    btn.onclick = () => checkAnswer(btn, opt, item.correct);
    optionsContainer.appendChild(btn);
  });
}

/* =====================================================================
   CHECK ANSWER
   ===================================================================== */
function checkAnswer(btn, chosen, correct) {
  if (answered) return;
  answered = true;

  const all = document.querySelectorAll('#options-container .option');
  all.forEach(b => b.disabled = true);

  const isCorrect = normalize(chosen) === normalize(correct);

  if (isCorrect) {
    btn.classList.add('correct');
    correctCount++;
    showFeedback(true, '');
    vibrate(30);
  } else {
    btn.classList.add('wrong');
    wrongCount++;
    all.forEach(b => {
      const bText = b.querySelector('span:last-child').textContent;
      if (normalize(bText) === normalize(correct)) b.classList.add('correct');
      else if (b !== btn) b.classList.add('dimmed');
    });
    const card = document.getElementById('quiz-card');
    card.classList.add('shake');
    setTimeout(() => card.classList.remove('shake'), 600);
    vibrate([40, 30, 40]);
    showFeedback(false, correct);
  }

  updateScoreBadge();
  document.getElementById('correct-count').textContent = `${correctCount} ✓`;
  document.getElementById('next-btn').classList.add('show');
  if (currentIndex === queue.length - 1) document.getElementById('next-btn').classList.add('finish');
}

/* =====================================================================
   FEEDBACK
   ===================================================================== */
function showFeedback(isGood, correctAnswer) {
  const fb = document.getElementById('feedback-msg');
  if (isGood) {
    fb.className = 'feedback-msg show good';
    fb.textContent = '✅ CORRECT!';
  } else {
    fb.className = 'feedback-msg show bad';
    fb.textContent = '❌ ANSWER: ' + correctAnswer;
  }
}

/* =====================================================================
   NEXT
   ===================================================================== */
function nextQuestion() {
  currentIndex++;
  if (currentIndex >= queue.length) showResults();
  else renderQuestion();
}

/* =====================================================================
   RESULTS
   ===================================================================== */
function showResults() {
  document.getElementById('quiz-view').classList.add('hidden');
  document.getElementById('results-view').classList.remove('hidden');

  const total = queue.length;
  const pct = Math.round((correctCount / total) * 100);

  let emoji = '🏆', title = 'GREAT JOB!', sub = 'You finished the quiz', stars = '⭐⭐⭐';

  if (pct === 100)    { emoji = '🥇'; title = 'PERFECT!';     sub = 'You are a SUPER HERO!';        stars = '⭐⭐⭐⭐⭐'; }
  else if (pct >= 80) { emoji = '🦸'; title = 'AMAZING!';     sub = 'You are a real hero!';         stars = '⭐⭐⭐⭐'; }
  else if (pct >= 60) { emoji = '🚀'; title = 'WELL DONE!';   sub = 'You are flying high!';         stars = '⭐⭐⭐'; }
  else if (pct >= 40) { emoji = '⚡'; title = 'GOOD EFFORT!'; sub = 'Keep training, hero!';         stars = '⭐⭐'; }
  else                { emoji = '💪'; title = 'KEEP GOING!';  sub = 'Every hero starts somewhere!'; stars = '⭐'; }

  document.getElementById('results-emoji').textContent = emoji;
  document.getElementById('results-title').textContent = title;
  document.getElementById('results-sub').textContent = sub;
  document.getElementById('results-score').innerHTML = correctCount + '<span class="of"> / ' + total + '</span>';
  document.getElementById('results-stars').textContent = stars;
  document.getElementById('stat-correct').textContent = correctCount;
  document.getElementById('stat-wrong').textContent = wrongCount;

  updateScoreBadge();
  vibrate([60, 40, 60, 40, 100]);
}

/* =====================================================================
   RESTART
   ===================================================================== */
function restartQuiz() {
  startQuiz();
}

/* =====================================================================
   INIT
   ===================================================================== */
updateScoreBadge();
</script>

</body>
</html>
