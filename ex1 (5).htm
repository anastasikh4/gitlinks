<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starlight 2: Advanced Plurals Obby</title>
    <style>
        :root { 
            --primary: #6c5ce7; 
            --success: #2ecc71; 
            --light-green: #eefbf2;
            --bg: #f8f9fc; 
        }
        * { box-sizing: border-box; font-family: 'Comic Sans MS', sans-serif; }
        body { background: var(--bg); display: flex; justify-content: center; padding: 20px; }
        .quiz-container { background: white; width: 100%; max-width: 600px; padding: 30px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; border: 5px solid #fff; }
        
        .progress { color: #aaa; font-weight: bold; text-transform: uppercase; margin-bottom: 10px; }
        .visual-box { font-size: 5rem; margin: 15px 0; min-height: 140px; display: flex; justify-content: center; align-items: center; background: #f1f2f6; border-radius: 20px; transition: background-color 0.4s ease, border 0.4s ease; border: 4px solid transparent; }
        
        .builder { border: 4px dashed var(--primary); min-height: 85px; margin: 20px 0; display: flex; justify-content: center; align-items: center; gap: 8px; border-radius: 20px; background: #fff; padding: 10px; flex-wrap: wrap; }
        .word-tag { background: var(--primary); color: white; padding: 10px 20px; border-radius: 12px; font-weight: bold; font-size: 1.4rem; animation: pop 0.2s; box-shadow: 0 4px 0 #4834d4; }
        
        .pool { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 20px; border-top: 2px solid #eee; padding-top: 20px; }
        .action-btn { background: #fff; padding: 12px 18px; border: 2px solid #ddd; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 1.1rem; box-shadow: 0 4px 0 #ccc; transition: 0.1s; }
        .action-btn:active { transform: translateY(3px); box-shadow: none; }
        
        .feedback { margin-top: 15px; font-size: 1.8rem; font-weight: bold; min-height: 45px; }
        .next-btn { display: none; background: var(--success); color: white; padding: 15px 40px; border: none; border-radius: 50px; font-size: 1.4rem; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 0 #27ae60; }
        @keyframes pop { 0% { transform: scale(0.8); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="progress" class="progress">Mission: 1 / 10</div>
    <div id="visual" class="visual-box"></div>
    <h3 id="instr">Build the correct plural phrase:</h3>

    <div class="builder" id="builder"></div>
    <div class="pool" id="pool"></div>

    <div class="feedback" id="feedback"></div>
    <button id="next-btn" class="next-btn" onclick="nextQuestion()">NEXT ➔</button>
</div>

<script>
    let currentStep = 0;
    let userPath = [];

    // Массив перебалансирован: уменьшено число базовых слов на -s, добавлено максимум исключений (Irregular) и усложненных правил (-es, -ies) с числительными от 2 до 10
    const rawData = [
        // Regular Baseline (Only 1 item left)
        { visual: "4 🐈", instr: "Group A: Standard -s rule", correct: ["Four", "cats"], extras: ["Fourty", "cates"], ans: "Four cats" },
        
        // Advanced Complex Rules (-es, -ies)
        { visual: "6 📦", instr: "Group B: Ends in -x, add -es", correct: ["Six", "boxes"], extras: ["Sixty", "boxs"], ans: "Six boxes" },
        { visual: "9 ⌚", instr: "Group B: Ends in -ch, add -es", correct: ["Nine", "watches"], extras: ["Ninety", "watchs"], ans: "Nine watches" },
        { visual: "3 👶", instr: "Group C: Consonant + y -> -ies", correct: ["Three", "babies"], extras: ["Thirty", "babys"], ans: "Three babies" },
        { visual: "5 🍬", instr: "Group C: Consonant + y -> -ies", correct: ["Five", "candies"], extras: ["Fifty", "candys"], ans: "Five candies" },
        
        // Irregular Plurals (Expanded Section)
        { visual: "10 🦷", instr: "Irregular Plural (oo -> ee)", correct: ["Ten", "teeth"], extras: ["Ten", "tooths"], ans: "Ten teeth" },
        { visual: "2 🐭", instr: "Irregular Plural (change word)", correct: ["Two", "mice"], extras: ["Two", "mouses"], ans: "Two mice" },
        { visual: "7 🦶", instr: "Irregular Plural (oo -> ee)", correct: ["Seven", "feet"], extras: ["Seventy", "foots"], ans: "Seven feet" },
        { visual: "8 🧑‍🤝‍🧑", instr: "Irregular Plural (change word)", correct: ["Eight", "children"], extras: ["Eighty", "childs"], ans: "Eight children" },
        { visual: "3 🧑", instr: "Irregular Plural (change word)", correct: ["Three", "people"], extras: ["Thirty", "persons"], ans: "Three people" }
    ];

    function loadGame() {
        const q = rawData[currentStep];
        if(!q) { showWin(); return; }

        document.getElementById('progress').innerText = `Mission: ${currentStep + 1} / 10`;
        document.getElementById('visual').innerHTML = q.visual;
        document.getElementById('visual').style.backgroundColor = "#f1f2f6";
        document.getElementById('visual').style.borderColor = "transparent";
        
        document.getElementById('instr').innerText = q.instr;
        document.getElementById('feedback').innerText = "";
        document.getElementById('next-btn').style.display = "none";
        document.getElementById('builder').innerHTML = ""; 
        
        const pool = document.getElementById('pool');
        pool.innerHTML = "";
        userPath = [];

        let allOptions = [...q.correct, ...q.extras];
        allOptions.sort(() => Math.random() - 0.5).forEach(item => {
            const btn = document.createElement('button');
            btn.className = "action-btn";
            btn.innerText = item;
            btn.onclick = () => {
                userPath.push(item);
                const tag = document.createElement('span');
                tag.className = "word-tag";
                tag.innerText = item;
                document.getElementById('builder').appendChild(tag);
                
                if(userPath.length === q.correct.length) {
                    if(userPath.join(" ") === q.ans) {
                        document.getElementById('feedback').innerText = "EXCELLENT! 🌟";
                        document.getElementById('feedback').style.color = "var(--success)";
                        document.getElementById('visual').style.backgroundColor = "var(--light-green)";
                        document.getElementById('visual').style.borderColor = "var(--success)";
                        document.getElementById('next-btn').style.display = "inline-block";
                    } else {
                        document.getElementById('feedback').innerText = "TRY AGAIN! ❌";
                        document.getElementById('feedback').style.color = "var(--success)";
                        document.getElementById('visual').style.backgroundColor = "var(--light-green)";
                        document.getElementById('visual').style.borderColor = "var(--success)";
                        setTimeout(loadGame, 1100);
                    }
                }
            };
            pool.appendChild(btn);
        });
    }

    function nextQuestion() { currentStep++; loadGame(); }

    function showWin() {
        document.querySelector('.quiz-container').innerHTML = `
            <h1 style="font-size:4rem; margin: 10px 0;">🏆🎉</h1>
            <h2>IRREGULAR PLURALS CHAMPION!</h2>
            <p style="font-size: 1.2rem; color: #555;">You mastered numbers and complex/irregular rules from the charts!</p>
            <button class="action-btn" onclick="location.reload()" style="background:var(--success); color:white; border:none; padding:15px 40px; border-radius: 50px; font-size: 1.2rem; box-shadow: 0 4px 0 #27ae60;">PLAY AGAIN</button>
        `;
    }

    window.onload = loadGame;
</script>
</body>
</html>
