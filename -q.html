<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌟 Zootopia: School Objects & To Be Quest 🌟</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #1c3d5a 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 15px;
        }
        .app { max-width: 800px; width: 100%; padding: 10px; }
        .header { text-align: center; margin-bottom: 25px; }
        .logo { font-family: 'Fredoka', sans-serif; font-size: 3em; color: #ff9900; text-shadow: 0 4px 10px rgba(0,0,0,0.3); margin-bottom: 10px; }
        
        .progress-container { width: 100%; height: 15px; background: rgba(255,255,255,0.1); border-radius: 10px; margin-bottom: 20px; position: relative; border: 1px solid rgba(255,255,255,0.2); }
        .progress-fill { height: 100%; background: #00ff88; width: 0%; border-radius: 10px; transition: width 0.4s; box-shadow: 0 0 15px #00ff88; }
        
        .stats { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 1.3em; font-weight: bold; }
        .hearts { color: #ff4757; font-size: 1.5em; }
        .heart.lost { opacity: 0.2; filter: grayscale(1); }

        .card { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(12px); border: 2px solid rgba(255,255,255,0.15); border-radius: 32px; padding: 35px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.4); }
        .visual { font-size: 5.5rem; margin-bottom: 15px; display: block; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
        
        .question-text { font-size: 1.6em; margin-bottom: 25px; line-height: 1.5; color: #00ffff; font-weight: 700; }
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        
        .btn { 
            padding: 18px; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.25); 
            border-radius: 20px; cursor: pointer; font-size: 1.2rem; font-weight: bold; color: white;
            transition: 0.2s; font-family: inherit;
        }
        .btn:hover:not(.disabled) { background: rgba(255,255,255,0.25); transform: scale(1.02); border-color: #ff9900; }
        .btn.correct { background: #00ff88 !important; color: #000 !important; border-color: #00ff88 !important; }
        .btn.wrong { background: #ff4757 !important; border-color: #ff4757 !important; color: white !important; animation: shake 0.4s; }
        .btn.disabled { pointer-events: none; opacity: 0.6; }

        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

        .win-screen { display: none; text-align: center; }
        .win-screen h1 { font-family: 'Fredoka', sans-serif; font-size: 4.5em; color: #ffff00; text-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

<div class="app">
    <div id="gameUI">
        <div class="header">
            <div class="logo">Zootopia Academy</div>
            <div class="progress-container"><div class="progress-fill" id="pFill"></div></div>
            <div class="stats">
                <div id="qCounter">Question 1/10</div>
                <div class="hearts" id="heartBox">❤️❤️❤️</div>
            </div>
        </div>

        <div class="card">
            <div class="visual" id="visual">🦊🎒</div>
            <div class="question-text" id="qText">Loading...</div>
            <div class="options" id="optBox"></div>
        </div>
    </div>

    <div id="winScreen" class="win-screen">
        <h1>MARVELLOUS!</h1>
        <p style="font-size: 2em; margin-top: 10px;">You are a School Objects Master!</p>
        <button class="btn" onclick="location.reload()" style="margin-top:30px; padding: 20px 50px;">Play Again</button>
    </div>
</div>

<script>
    // Обновленные вопросы на основе присланного изображения (Пазлы, Грамматика, Скрембл)
    const questions = [
        // Блок 1: Соединение пазлов (Puzzle Words Match)
        { v: "📏", q: " ru + ? = ________", a: ["ruler", "rubber", "roller"], c: "rubber" },
        { v: "🎒", q: " sch + ? = ________", a: ["school bag", "school case", "schoolbook"], c: "school bag" },
        { v: "✏️", q: "pen + ?= ________", a: ["pencil", "pencil case", "pen"], c: "pencil" },
        
        // Блок 2: Грамматика (To Be: is / are)
        { v: "?", q: "What _____ it?<br><em>It's grey and white.</em>", a: ["is", "are"], c: "is" },
        { v: "?", q: " What _____ it?<br><em>It has numbers from 1 to 10.</em>", a: ["is", "are"], c: "is" },
        { v: "📚", q: "Look! What _____ they?<br><em>You can read them.</em>", a: ["is", "are"], c: "are" },
        { v: "🎒", q: "What _____ it?<br><em>You put books in it.</em>", a: ["is", "are"], c: "is" },
        
        // Блок 3: Расшифровка слов (Anagram Unscramble)
        { v: "🐰🎒", q: "Judy likes her new _________ (p n e c l i a s e c).", a: ["pencil case", "school bag", "pencil"], c: "pencil case" },
        { v: "✒️", q: "She puts her _________ (e p n s) inside it.", a: ["pencils", "rubbers", "pens"], c: "pens" },
        { v: "🪨", q: "Don't forget to put your _________ (r b u b e r) in the bag!", a: ["ruler", "rubber", "book"], c: "rubber" }
    ];

    let current = 0;
    let lives = 3;

    function loadQuestion() {
        if (current >= questions.length) {
            document.getElementById('gameUI').style.display = 'none';
            document.getElementById('winScreen').style.display = 'block';
            return;
        }

        const data = questions[current];
        document.getElementById('visual').innerHTML = data.v;
        document.getElementById('qText').innerHTML = data.q;
        document.getElementById('qCounter').innerText = `Question ${current + 1}/${questions.length}`;
        
        const box = document.getElementById('optBox');
        box.innerHTML = '';
        
        // Перемешивание вариантов ответов
        const shuffledOptions = [...data.a].sort(() => Math.random() - 0.5);
        
        shuffledOptions.forEach(opt => {
            const b = document.createElement('button');
            b.className = 'btn';
            b.innerText = opt;
            b.onclick = () => check(opt, b);
            box.appendChild(b);
        });

        document.getElementById('pFill').style.width = (current / questions.length) * 100 + '%';
    }

    function check(choice, btn) {
        const buttons = document.querySelectorAll('.btn');
        buttons.forEach(b => b.classList.add('disabled'));

        if (choice === questions[current].c) {
            btn.classList.add('correct');
            setTimeout(() => { 
                current++; 
                loadQuestion(); 
            }, 1000);
        } else {
            btn.classList.add('wrong');
            lives--;
            updateHearts();
            if (lives <= 0) {
                setTimeout(() => {
                    alert("Game Over! Let's try again!");
                    location.reload();
                }, 400);
            } else {
                setTimeout(() => {
                    buttons.forEach(b => b.classList.remove('disabled', 'wrong'));
                }, 800);
            }
        }
    }

    function updateHearts() {
        let h = "";
        for(let i=0; i<3; i++) {
            h += i < lives ? "❤️" : "<span class='heart lost'>🖤</span>";
        }
        document.getElementById('heartBox').innerHTML = h;
    }

    loadQuestion();
</script>

</body>
</html>
