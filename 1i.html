<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Neighbourhood: Town Map Quest 🗺️</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --sky-blue: #3498db;
            --sun-yellow: #feca57;
            --text-dark: #2c3e50;
            --grass-green: #2ecc71;
            --apple-red: #e74c3c;
        }

        body {
            font-family: 'Nunito', 'Comic Sans MS', 'Arial Rounded MT Bold', sans-serif;
            background: linear-gradient(180deg, #5c93ff 0%, #a2c2fe 100%);
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .bg-cloud {
            position: fixed;
            background: white;
            border-radius: 50px;
            opacity: 0.5;
            animation: move linear infinite;
            z-index: 0;
        }
        @keyframes move {
            from { left: -150px; }
            to { left: 100%; }
        }

        #game-frame {
            background: rgba(255, 255, 255, 0.95);
            width: 95%;
            max-width: 650px;
            padding: 25px;
            border-radius: 40px;
            text-align: center;
            border: 6px solid var(--sky-blue);
            z-index: 1;
            position: relative;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .level-badge {
            background: #e1f5fe;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: bold;
            color: var(--sky-blue);
        }

        .score-badge {
            background: var(--sun-yellow);
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: bold;
            color: #d35400;
        }

        .hero-emoji {
            font-size: 5rem;
            animation: float 3s ease-in-out infinite;
            margin: 10px 0;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        .sentence-box {
            background: #fff9e6;
            padding: 25px;
            border-radius: 25px;
            font-size: 1.35rem;
            margin-bottom: 20px;
            line-height: 1.8;
            border: 3px dashed #ffd54f;
            color: var(--text-dark);
            text-align: left;
        }

        .gap {
            background: #fff;
            border-bottom: 4px solid var(--sky-blue);
            padding: 0px 15px;
            border-radius: 12px;
            display: inline-block;
            min-width: 80px;
            font-weight: bold;
            color: var(--sky-blue);
            text-align: center;
        }

        .options {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
        }

        .option-btn {
            background: white;
            border: 3px solid #eee;
            padding: 12px 22px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 5px 0 #ccc;
            font-family: inherit;
            color: var(--text-dark);
        }

        .option-btn:hover:not(:disabled) {
            transform: scale(1.03);
            border-color: var(--sky-blue);
            background: #f1f9ff;
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(3px);
            box-shadow: none;
        }

        .option-btn.correct {
            background: var(--grass-green) !important;
            color: white !important;
            box-shadow: 0 5px 0 #27ae60 !important;
            border-color: #27ae60 !important;
        }

        .option-btn.wrong {
            background: var(--apple-red) !important;
            color: white !important;
            box-shadow: 0 5px 0 #c0392b !important;
            border-color: #c0392b !important;
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background: rgba(0,0,0,0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 15px;
        }

        .progress-fill {
            height: 100%;
            background: var(--sun-yellow);
            width: 0%;
            transition: 0.3s;
        }

        .reset-btn {
            margin-top: 15px;
            background: #f1f5f9;
            border: 2px solid #cbd5e1;
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            color: #64748b;
        }

        #win-screen {
            display: none;
        }

        .win-emoji {
            font-size: 5rem;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="bg-cloud" style="width:80px; height:35px; top:15%; animation-duration: 18s;"></div>
<div class="bg-cloud" style="width:120px; height:50px; top:45%; animation-duration: 22s;"></div>
<div class="bg-cloud" style="width:100px; height:40px; top:75%; animation-duration: 25s;"></div>

<div id="game-frame">
    <div id="play-screen">
        <div class="header">
            <div class="level-badge">🗺️ Shop Quest <span id="lvl-num">1</span>/<span id="total">12</span></div>
            <div class="score-badge">⭐ Stars: <span id="score">0</span></div>
        </div>

        <div class="hero-emoji" id="hero">🏪</div>

        <div class="sentence-box" id="sentence"></div>

        <div class="options" id="options"></div>

        <div class="progress-bar">
            <div class="progress-fill" id="progress"></div>
        </div>

        <button class="reset-btn" onclick="resetGame()">🔄 Restart Quiz</button>
    </div>

    <div id="win-screen">
        <div class="win-emoji">🏆🏢🏪🥖</div>
        <h2 style="color: var(--sky-blue); font-size: 2.2rem; margin: 10px 0;">Neighbourhood Master!</h2>
        <p style="font-size: 1.2rem; color: #475569; font-weight: bold;">You know all the places in Tony's town perfectly!</p>
        <button class="reset-btn" onclick="resetGame()" style="background: var(--sun-yellow); color: #d35400; border: none; padding: 12px 35px; font-size: 1.2rem; box-shadow: 0 4px 0 #f39c12;">🌟 Play Again</button>
    </div>
</div>

<script>
    /* ======================================================
       12 MISSIONS — All shops from the photo
       ====================================================== */
    const missions = [
        {
            hero: "📮",
            text: "You can buy <span class='gap' id='g1'>____</span> at the <span class='gap' id='g2'>____</span> office.",
            answers: ["stamps", "post"],
            options: ["stamps", "post", "bread", "bank"]
        },
        {
            hero: "🏦",
            text: "You can get some <span class='gap' id='g1'>____</span> at the <span class='gap' id='g2'>____</span>.",
            answers: ["money", "bank"],
            options: ["money", "bank", "stamps", "library"]
        },
        {
            hero: "🥖",
            text: "You can buy fresh <span class='gap' id='g1'>____</span> at the <span class='gap' id='g2'>____</span>.",
            answers: ["bread", "baker's"],
            options: ["bread", "baker's", "ball", "chemist's"]
        },
        {
            hero: "🥦",
            text: "You can buy fresh <span class='gap' id='g1'>____</span> at the <span class='gap' id='g2'>____</span>.",
            answers: ["vegetables", "greengrocer's"],
            options: ["vegetables", "greengrocer's", "aspirin", "toy shop"]
        },
        {
            hero: "🛒",
            text: "You can buy milk and <span class='gap' id='g1'>____</span> at the <span class='gap' id='g2'>____</span>.",
            answers: ["eggs", "supermarket"],
            options: ["eggs", "supermarket", "books", "chemist's"]
        },
        {
            hero: "📰",
            text: "You can buy morning <span class='gap' id='g1'>____</span> at the <span class='gap' id='g2'>____</span>.",
            answers: ["newspapers", "newsagent's"],
            options: ["newspapers", "newsagent's", "ball", "pet shop"]
        },
        {
            hero: "💊",
            text: "When you need <span class='gap' id='g1'>____</span>, go to the <span class='gap' id='g2'>____</span>.",
            answers: ["aspirin", "chemist's"],
            options: ["aspirin", "chemist's", "toys", "library"]
        },
        {
            hero: "📚",
            text: "You can borrow interesting <span class='gap' id='g1'>____</span> from the <span class='gap' id='g2'>____</span>.",
            answers: ["books", "library"],
            options: ["books", "library", "food", "restaurant"]
        },
        {
            hero: "🐶",
            text: "You can buy food for your <span class='gap' id='g1'>____</span> at the <span class='gap' id='g2'>____</span>.",
            answers: ["dog", "pet shop"],
            options: ["dog", "pet shop", "stamps", "post office"]
        },
        {
            hero: "🍔",
            text: "You can eat a delicious <span class='gap' id='g1'>____</span> at the <span class='gap' id='g2'>____</span>.",
            answers: ["meal", "restaurant"],
            options: ["meal", "restaurant", "bread", "baker's"]
        },
        {
            hero: "🧸",
            text: "You can buy a new <span class='gap' id='g1'>____</span> at the <span class='gap' id='g2'>____</span>.",
            answers: ["toy", "toy shop"],
            options: ["toy", "toy shop", "money", "bank"]
        },
        {
            hero: "⚽",
            text: "You can buy a new <span class='gap' id='g1'>____</span> at the <span class='gap' id='g2'>____</span>.",
            answers: ["ball", "sports shop"],
            options: ["ball", "sports shop", "vegetables", "greengrocer's"]
        }
    ];

    let currentLevel = 0;
    let currentStep = 0;      // 0 = first gap, 1 = second gap
    let score = 0;
    let waiting = false;

    const playScreen = document.getElementById('play-screen');
    const winScreen = document.getElementById('win-screen');
    const heroEl = document.getElementById('hero');
    const sentenceEl = document.getElementById('sentence');
    const optionsEl = document.getElementById('options');
    const lvlNumSpan = document.getElementById('lvl-num');
    const totalSpan = document.getElementById('total');
    const scoreSpan = document.getElementById('score');
    const progressFill = document.getElementById('progress');

    /* ======================================================
       INIT
       ====================================================== */
    function initGame() {
        totalSpan.innerText = missions.length;
        loadLevel();
    }

    function loadLevel() {
        if (currentLevel >= missions.length) {
            showWinScreen();
            return;
        }

        waiting = false;
        const m = missions[currentLevel];
        heroEl.innerText = m.hero;
        lvlNumSpan.innerText = currentLevel + 1;
        scoreSpan.innerText = score;

        // Render sentence with fresh gaps
        sentenceEl.innerHTML = m.text;

        // Progress fill
        const progressPercent = (currentLevel / missions.length) * 100;
        progressFill.style.width = progressPercent + '%';

        renderOptions();
    }

    /* ======================================================
       OPTIONS
       ====================================================== */
    function renderOptions() {
        optionsEl.innerHTML = '';
        const m = missions[currentLevel];
        const shuffled = [...m.options].sort(() => Math.random() - 0.5);

        shuffled.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => handleChoice(btn, opt);
            optionsEl.appendChild(btn);
        });
    }

    /* ======================================================
       HANDLE CHOICE
       ====================================================== */
    function handleChoice(btn, selectedValue) {
        if (waiting) return;

        const m = missions[currentLevel];
        const targetCorrect = m.answers[currentStep];

        if (selectedValue === targetCorrect) {
            waiting = true;
            btn.classList.add('correct');
            score += 10;
            scoreSpan.innerText = score;

            // Fill the current gap
            const gapId = currentStep === 0 ? 'g1' : 'g2';
            const gapEl = document.getElementById(gapId);
            gapEl.innerText = targetCorrect;
            gapEl.style.background = '#e8f8f5';
            gapEl.style.color = '#27ae60';

            setTimeout(() => {
                if (currentStep === 0) {
                    currentStep = 1;
                    waiting = false;
                    renderOptions();
                } else {
                    currentLevel++;
                    currentStep = 0;
                    loadLevel();
                }
            }, 1000);

        } else {
            waiting = true;
            btn.classList.add('wrong');

            // Highlight the correct answer
            const buttons = optionsEl.querySelectorAll('.option-btn');
            buttons.forEach(b => {
                if (b.innerText === targetCorrect) b.classList.add('correct');
            });

            setTimeout(() => {
                btn.classList.remove('wrong');
                buttons.forEach(b => b.classList.remove('correct'));
                waiting = false;
            }, 1400);
        }
    }

    /* ======================================================
       WIN / RESET
       ====================================================== */
    function showWinScreen() {
        playScreen.style.display = 'none';
        winScreen.style.display = 'block';
        progressFill.style.width = '100%';
    }

    function resetGame() {
        currentLevel = 0;
        currentStep = 0;
        score = 0;
        winScreen.style.display = 'none';
        playScreen.style.display = 'block';
        loadLevel();
    }

    /* ======================================================
       START
       ====================================================== */
    initGame();
</script>
</body>
</html>
