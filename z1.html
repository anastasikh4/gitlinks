<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Can + Activities · Sentence Unscramble</title>
    <style>
        :root {
            --primary: #6c5ce7;
            --primary-dark: #4a3fa3;
            --success: #00b894;
            --error: #e17055;
            --bg-start: #a29bfe;
            --bg-end: #74b9ff;
            --text: #2d3436;
            --text-soft: #636e72;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 18px;
            color: var(--text);
        }

        .quiz-card {
            background: linear-gradient(180deg, #ffffff 0%, #f7f9fc 100%);
            width: 100%;
            max-width: 640px;
            padding: 34px 30px 30px;
            border-radius: 26px;
            box-shadow: 0 22px 45px rgba(0,0,0,0.22);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        h1 {
            color: var(--primary);
            margin-bottom: 18px;
            font-size: 1.5rem;
            letter-spacing: 0.3px;
        }

        .progress-container {
            height: 10px;
            background: #eef1f5;
            border-radius: 6px;
            margin-bottom: 8px;
            overflow: hidden;
        }
        #progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #6c5ce7, #00b894);
            border-radius: 6px;
            transition: width 0.4s ease;
        }

        .counter {
            font-size: 0.78rem;
            font-weight: 800;
            color: var(--text-soft);
            letter-spacing: 1.6px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .emoji-display {
            font-size: 4rem;
            margin-bottom: 16px;
            line-height: 1;
            animation: pop 0.5s ease;
        }
        @keyframes pop {
            0% { transform: scale(0.5); }
            60% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .sentence-target {
            background: #f8f9fa;
            border: 3px dashed var(--primary);
            min-height: 74px;
            padding: 16px;
            border-radius: 14px;
            margin-bottom: 18px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            align-items: center;
            font-size: 1.15rem;
            font-weight: 700;
        }

        .sentence-target .word {
            background: #ede9fe;
            color: var(--primary);
            padding: 6px 12px;
            border-radius: 10px;
            animation: popIn 0.2s ease;
        }
        @keyframes popIn {
            from { transform: scale(0.7); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .sentence-target .placeholder {
            color: #b2bec3;
            font-weight: 600;
            font-size: 0.95rem;
            font-style: italic;
        }

        .word-options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 18px;
        }

        .word-btn {
            padding: 12px 20px;
            background: white;
            border: 2px solid var(--primary);
            border-bottom-width: 5px;
            border-radius: 12px;
            color: var(--primary);
            font-family: inherit;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 3px 0 rgba(108,92,231,0.15);
            min-width: 70px;
        }

        .word-btn:hover:not(.disabled):not(.selected) {
            background: #ede9fe;
            transform: translateY(-2px);
            border-bottom-width: 7px;
        }
        .word-btn:active:not(.disabled):not(.selected) {
            transform: translateY(2px);
            border-bottom-width: 3px;
        }
        .word-btn.selected {
            background: var(--primary);
            color: white;
            cursor: default;
            opacity: 0.55;
        }
        .word-btn.disabled {
            opacity: 0.4;
            cursor: default;
            pointer-events: none;
        }
        .word-btn.correct {
            background: #d4f7e8 !important;
            border-color: var(--success) !important;
            color: var(--success) !important;
            opacity: 1 !important;
        }
        .word-btn.wrong {
            background: #ffe0d4 !important;
            border-color: var(--error) !important;
            color: var(--error) !important;
            animation: shake 0.4s;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-7px); }
            40% { transform: translateX(7px); }
            60% { transform: translateX(-5px); }
            80% { transform: translateX(5px); }
        }

        #feedback-area {
            margin-top: 12px;
            font-weight: 800;
            font-size: 1rem;
            display: none;
            min-height: 24px;
        }
        #feedback-area.correct { display: block; color: var(--success); }
        #feedback-area.wrong { display: block; color: var(--error); }

        #clear-btn, #next-btn {
            padding: 13px 26px;
            color: white;
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-weight: 900;
            font-size: 0.95rem;
            cursor: pointer;
            margin: 8px 5px 0;
            letter-spacing: 0.5px;
            transition: 0.15s;
        }
        #clear-btn {
            background: #dfe6e9;
            color: var(--text);
        }
        #clear-btn:hover { background: #b2bec3; }

        #next-btn {
            background: var(--primary);
            display: none;
            box-shadow: 0 5px 0 var(--primary-dark);
        }
        #next-btn:hover { transform: translateY(-2px); box-shadow: 0 7px 0 var(--primary-dark); }
        #next-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--primary-dark); }

        .results {
            display: none;
            padding: 14px 0 6px;
            animation: pop 0.5s ease;
        }
        .results .trophy {
            font-size: 4rem;
            margin-bottom: 10px;
            animation: bounce 1.6s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
        .results h2 {
            color: var(--primary);
            font-size: 1.9rem;
            margin-bottom: 12px;
        }
        .results p {
            font-size: 1rem;
            color: var(--text-soft);
            font-weight: 700;
            margin-bottom: 20px;
        }
        .results .score-box {
            background: linear-gradient(135deg, #ffeaa7, #fdcb6e);
            border-radius: 18px;
            padding: 20px;
            margin: 18px 0 22px;
            font-size: 1.8rem;
            font-weight: 900;
            color: #b83b1a;
            box-shadow: 0 6px 0 #e1a947;
        }
        .results button {
            padding: 15px 34px;
            background: var(--primary);
            color: white;
            border: none;
            border-bottom: 6px solid var(--primary-dark);
            border-radius: 14px;
            font-family: inherit;
            font-weight: 900;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.15s;
        }
        .results button:hover { transform: translateY(-2px); }
        .results button:active { transform: translateY(3px); border-bottom-width: 3px; }

        @media (max-width: 480px) {
            body { padding: 10px; }
            .quiz-card { padding: 24px 16px 20px; border-radius: 20px; }
            h1 { font-size: 1.2rem; }
            .emoji-display { font-size: 3rem; }
            .sentence-target { font-size: 1rem; padding: 12px; min-height: 66px; }
            .word-btn { padding: 10px 14px; font-size: 0.9rem; }
            #clear-btn, #next-btn { padding: 11px 20px; font-size: 0.85rem; }
            .results h2 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

<div class="quiz-card">
    <div id="quiz-ui">
        <h1>Can + Activities · Unscramble</h1>
        <div class="progress-container"><div id="progress-fill"></div></div>
        <div class="counter">Question <span id="qNow">1</span> / <span id="qTotal">10</span></div>

        <div class="emoji-display" id="emoji-display">🚴</div>

        <div class="sentence-target" id="sentence-target">
            <span class="placeholder">Tap the words below in the correct order</span>
        </div>

        <div class="word-options" id="word-options"></div>

        <div id="feedback-area"></div>
        <button id="clear-btn" onclick="clearSelection()">Clear</button>
        <button id="next-btn" onclick="nextQuestion()">Next ➔</button>
    </div>

    <div id="result-ui" class="results">
        <div class="trophy">🏆</div>
        <h2>Quiz Complete!</h2>
        <div class="score-box" id="score-text">0 / 10</div>
        <button onclick="location.reload()">Play Again</button>
    </div>
</div>

<script>
/* ============================================================
   QUESTIONS — based on the workbook photo
   Verb "can" + activities: ride a bike, sing, play football,
   skateboard, speak Spanish, cook, swim, play the guitar, draw
   ============================================================ */
const questions = [
    { emoji: '🚴', sentence: 'He can ride a bike.' },
    { emoji: '🎤', sentence: 'She can sing.' },
    { emoji: '⚽', sentence: 'They can play football.' },
    { emoji: '🛹', sentence: 'You can skateboard.' },
    { emoji: '🇪🇸', sentence: 'He can speak Spanish.' },
    { emoji: '🍳', sentence: 'I can cook.' },
    { emoji: '🏊', sentence: 'I can swim.' },
    { emoji: '🎸', sentence: 'She can play the guitar.' },
    { emoji: '✏️', sentence: 'You can draw.' },
    { emoji: '⚽', sentence: 'They can run fast.' }
];

const totalQuestions = questions.length;
let currentQIndex = 0;
let score = 0;
let selectedWords = [];
let currentWordsArray = [];

document.getElementById('qTotal').textContent = totalQuestions;

/* ============================================================
   FISHER-YATES SHUFFLE
   ============================================================ */
function shuffleWords(sentence) {
    const words = sentence.split(' ');
    currentWordsArray = [...words];
    for (let i = words.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [words[i], words[j]] = [words[j], words[i]];
    }
    return words;
}

/* ============================================================
   LOAD QUESTION
   ============================================================ */
function loadQuestion() {
    if (currentQIndex >= totalQuestions) {
        showResults();
        return;
    }

    const data = questions[currentQIndex];

    // counter
    document.getElementById('qNow').textContent = currentQIndex + 1;
    document.getElementById('progress-fill').style.width =
        (currentQIndex / totalQuestions) * 100 + '%';

    // emoji
    const emojiEl = document.getElementById('emoji-display');
    emojiEl.textContent = data.emoji;
    emojiEl.style.animation = 'none';
    void emojiEl.offsetWidth;
    emojiEl.style.animation = 'pop 0.5s ease';

    // sentence target — placeholder
    document.getElementById('sentence-target').innerHTML =
        '<span class="placeholder">Tap the words below in the correct order</span>';

    // options
    document.getElementById('word-options').innerHTML = '';
    selectedWords = [];
    document.getElementById('feedback-area').className = '';
    document.getElementById('feedback-area').style.display = 'none';
    document.getElementById('next-btn').style.display = 'none';
    document.getElementById('clear-btn').style.display = 'inline-block';

    const shuffled = shuffleWords(data.sentence);
    const optionsDiv = document.getElementById('word-options');
    shuffled.forEach((word) => {
        const btn = document.createElement('button');
        btn.className = 'word-btn';
        btn.textContent = word;
        btn.onclick = () => selectWord(btn, word);
        optionsDiv.appendChild(btn);
    });
}

/* ============================================================
   SELECT WORD
   ============================================================ */
function selectWord(btn, word) {
    if (btn.classList.contains('selected') || btn.classList.contains('disabled')) return;

    btn.classList.add('selected');
    selectedWords.push({ word, btn });
    updateTargetSentence();

    if (selectedWords.length === currentWordsArray.length) {
        autoCheck();
    }
}

/* ============================================================
   UPDATE SENTENCE TARGET
   ============================================================ */
function updateTargetSentence() {
    const targetDiv = document.getElementById('sentence-target');
    if (selectedWords.length === 0) {
        targetDiv.innerHTML = '<span class="placeholder">Tap the words below in the correct order</span>';
        return;
    }
    targetDiv.innerHTML = '';
    selectedWords.forEach(({ word }) => {
        const span = document.createElement('span');
        span.className = 'word';
        span.textContent = word;
        targetDiv.appendChild(span);
    });
}

/* ============================================================
   AUTO CHECK
   ============================================================ */
function autoCheck() {
    const currentSentence = selectedWords.map(s => s.word).join(' ');
    const correctSentence = questions[currentQIndex].sentence;
    const fb = document.getElementById('feedback-area');

    if (currentSentence === correctSentence) {
        score++;
        fb.textContent = 'Correct! ✓';
        fb.className = 'correct';
        fb.style.display = 'block';

        // mark buttons
        selectedWords.forEach(({ btn }) => {
            btn.classList.remove('selected');
            btn.classList.add('correct');
        });
        // disable remaining
        document.querySelectorAll('.word-btn').forEach(btn => {
            if (!btn.classList.contains('correct')) btn.classList.add('disabled');
        });

        document.getElementById('next-btn').style.display = 'inline-block';
        document.getElementById('clear-btn').style.display = 'none';
    } else {
        fb.textContent = 'Incorrect order. Try again. ✗';
        fb.className = 'wrong';
        fb.style.display = 'block';

        selectedWords.forEach(({ btn }) => {
            btn.classList.remove('selected');
            btn.classList.add('wrong');
        });

        setTimeout(() => {
            selectedWords.forEach(({ btn }) => btn.classList.remove('wrong'));
            selectedWords = [];
            updateTargetSentence();
            fb.className = '';
            fb.style.display = 'none';
        }, 700);
    }
}

/* ============================================================
   CLEAR
   ============================================================ */
function clearSelection() {
    selectedWords = [];
    updateTargetSentence();
    document.getElementById('feedback-area').className = '';
    document.getElementById('feedback-area').style.display = 'none';
    document.querySelectorAll('.word-btn').forEach(btn => {
        btn.classList.remove('selected', 'wrong', 'correct', 'disabled');
    });
}

/* ============================================================
   NEXT
   ============================================================ */
function nextQuestion() {
    currentQIndex++;
    loadQuestion();
}

/* ============================================================
   RESULTS
   ============================================================ */
function showResults() {
    document.getElementById('quiz-ui').style.display = 'none';
    document.getElementById('result-ui').style.display = 'block';
    document.getElementById('score-text').textContent = score + ' / ' + totalQuestions;
    document.getElementById('progress-fill').style.width = '100%';
}

/* ============================================================
   START
   ============================================================ */
loadQuestion();
</script>

</body>
</html>
