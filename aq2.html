<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food English Quest</title>
    <style>
        :root {
            --spring-green: #97d700; /* Fresh Grass */
            --blossom-pink: #ffb7c5; /* Cherry Blossom */
            --sky-blue: #a2d2ff;
            --petal-white: #f9fdf9;
            --dirt-gray: #afafaf;
            --flower-gold: #ffd700;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: #f0fff0; /* Very light mint */
            margin: 0;
            display: flex;
            justify-content: center;
            color: #333;
        }

        #app {
            width: 100%;
            max-width: 480px;
            padding: 20px;
            text-align: center;
            background: white;
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }

        /* Spring Header */
        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .bar-bg {
            flex-grow: 1;
            height: 16px;
            background: #eee;
            border-radius: 20px;
            margin: 0 15px;
            border: 2px solid #e0e0e0;
        }

        #bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--blossom-pink), var(--spring-green));
            border-radius: 20px;
            transition: width 0.5s ease-out;
        }

        .stat { font-weight: bold; font-size: 1.2rem; }
        .heart { color: #ff4b4b; }
        .streak { color: #ff9d00; }

        /* Question Box */
        .quest-box { min-height: 300px; margin-top: 20px; }
        .owl-avatar { font-size: 60px; margin-bottom: 10px; display: block; }
        
        .bubble {
            border: 3px solid var(--sky-blue);
            border-radius: 20px;
            padding: 20px;
            font-size: 1.25rem;
            background: var(--petal-white);
            margin-bottom: 30px;
            position: relative;
        }

        .bubble::after {
            content: '🍎';
            position: absolute;
            top: -15px;
            right: -10px;
            font-size: 24px;
        }

        /* Buttons */
        .options { display: grid; gap: 12px; }
        
        .opt-btn {
            background: white;
            border: 2px solid #e5e5e5;
            border-bottom: 5px solid #e5e5e5;
            border-radius: 18px;
            padding: 18px;
            font-size: 1.1rem;
            cursor: pointer;
            text-align: left;
            transition: all 0.1s;
        }

        .opt-btn:hover { background-color: #f7fff7; border-color: var(--spring-green); }
        
        .opt-btn.selected {
            background-color: #f0f7ff;
            border-color: var(--sky-blue);
            color: #0077cc;
        }

        /* Footer Feedback */
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top: 3px solid #eee;
            padding: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #feedback-panel {
            width: 100%;
            max-width: 480px;
            display: none;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 15px;
            text-align: left;
            font-weight: bold;
        }

        .correct-panel { background-color: #d7ffb8; color: #46a302; }
        .wrong-panel { background-color: #ffdfe0; color: #ee2c2c; }

        #action-btn {
            width: 100%;
            max-width: 480px;
            padding: 18px;
            border-radius: 18px;
            border: none;
            background: var(--spring-green);
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            border-bottom: 5px solid #7cb300;
            text-transform: uppercase;
        }

        #action-btn:disabled {
            background: #e5e5e5;
            border-bottom-color: #ccc;
            color: #999;
        }
    </style>
</head>
<body>

<div id="app">
    <div class="top-nav">
        <span class="stat streak">🔥 <span id="streak-val">0</span></span>
        <div class="bar-bg"><div id="bar-fill"></div></div>
        <span class="stat heart">❤️ <span id="lives-val">5</span></span>
    </div>

    <div id="game-body">
        <div class="quest-box">
            <span class="owl-avatar">🦉🍽️</span>
            <div class="bubble" id="question-text">Loading food mission...</div>
            <div class="options" id="options-grid"></div>
        </div>
    </div>

    <div class="footer">
        <div id="feedback-panel"></div>
        <button id="action-btn" onclick="handleBtnClick()" disabled>Check Answer</button>
    </div>
</div>

<script>
    const questions = [
        // Exercise 1: Vocabulary
        { q: "Label the photo: 🧈 (some b_______)", a: ["butter", "bread", "biscuits"], c: 0 },
        { q: "Label the photo: 🥒🥒 (two c_______)", a: ["carrots", "cucumbers", "cabbages"], c: 1 },
        { q: "Label the photo: 🧃 (some j_______)", a: ["juice", "jam", "jelly"], c: 0 },
        { q: "Label the photo: 🥚🥚🥚🥚🥚🥚 (six e_______)", a: ["eggs", "elephants", "envelopes"], c: 0 },
        { q: "Label the photo: 🍫 (some c_______)", a: ["cheese", "chocolate", "chips"], c: 1 },
        
        // Exercise 2: Countable or Uncountable
        { q: "Is 'butter' Countable (C) or Uncountable (U)?", a: ["Countable (C)", "Uncountable (U)"], c: 1 },
        
        // Exercise 3: Circle the correct answer
        { q: "I'd like ___ apple, please.", a: ["a", "an", "two"], c: 1 },
        { q: "Grandma likes ___ in her tea.", a: ["a sugar", "many sugar", "sugar"], c: 2 },
        { q: "There are ___ bananas in the kitchen.", a: ["some", "any", "one"], c: 0 },
        { q: "There aren't ___ carrots in this soup, only potatoes.", a: ["some", "any", "a"], c: 1 },
        { q: "___ there any milk in the fridge?", a: ["Are", "Am", "Is"], c: 2 },
        { q: "How ___ rice is there?", a: ["many", "much", "are"], c: 1 }
    ];

    let current = 0;
    let lives = 5;
    let streak = 0;
    let selected = null;

    function loadQ() {
        const data = questions[current];
        document.getElementById('question-text').innerText = data.q;
        const grid = document.getElementById('options-grid');
        grid.innerHTML = '';
        
        data.a.forEach((opt, i) => {
            const b = document.createElement('button');
            b.className = 'opt-btn';
            b.innerText = opt;
            b.onclick = () => {
                selected = i;
                document.querySelectorAll('.opt-btn').forEach(btn => btn.classList.remove('selected'));
                b.classList.add('selected');
                document.getElementById('action-btn').disabled = false;
            };
            grid.appendChild(b);
        });

        document.getElementById('feedback-panel').style.display = 'none';
        document.getElementById('action-btn').innerText = "Check Answer";
        document.getElementById('action-btn').style.background = "var(--spring-green)";
        document.getElementById('action-btn').style.borderBottomColor = "#7cb300";
    }

    function handleBtnClick() {
        const btn = document.getElementById('action-btn');
        if (btn.innerText === "CONTINUE") {
            current++;
            if (current < questions.length) {
                loadQ();
                updateBar();
            } else {
                finishGame();
            }
            return;
        }

        const isCorrect = selected === questions[current].c;
        const panel = document.getElementById('feedback-panel');
        panel.style.display = 'block';

        if (isCorrect) {
            streak++;
            panel.className = 'feedback-panel correct-panel';
            panel.innerText = "🍏 Correct! Delicious!";
            btn.style.background = "var(--spring-green)";
        } else {
            lives--;
            streak = 0;
            panel.className = 'feedback-panel wrong-panel';
            panel.innerText = "🍎 Almost! Answer: " + questions[current].a[questions[current].c];
            btn.style.background = "#ff4b4b";
            btn.style.borderBottomColor = "#c13535";
            if (lives <= 0) { alert("Oh no! You ran out of lives. Try again!"); location.reload(); }
        }

        document.getElementById('streak-val').innerText = streak;
        document.getElementById('lives-val').innerText = lives;
        btn.innerText = "CONTINUE";
        btn.disabled = false;
    }

    function updateBar() {
        const p = (current / questions.length) * 100;
        document.getElementById('bar-fill').style.width = p + "%";
    }

    function finishGame() {
        document.getElementById('bar-fill').style.width = "100%";
        document.getElementById('game-body').innerHTML = `
            <h1 style="font-size:80px">🍏✨</h1>
            <h2 style="color:var(--spring-green)">Quest Complete!</h2>
            <p style="font-size:1.1rem">You mastered all 12 Food Missions!</p>
            <p>Final Streak: 🔥 ${streak}</p>
            <button id="action-btn" style="background:var(--sky-blue); border-bottom-color:#6ba3d6;" onclick="location.reload()">PLAY AGAIN</button>
        `;
        document.querySelector('.footer').style.display = 'none';
    }

    loadQ();
</script>
</body>
</html>
