<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌟 School Supply Starlight Quest 🌟</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 50%, #000 100%);
            color: #fff;
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            overflow-x: hidden;
            padding: 10px;
        }
        .app { max-width: 650px; width: 100%; }
        .card { 
            background: white; 
            color: #1e293b;
            padding: 35px; 
            border-radius: 40px; 
            border: 8px solid #60a5fa; 
            box-shadow: 0 15px 0 #2563eb; 
            text-align: center; 
            position: relative;
        }
        .header { margin-bottom: 25px; }
        .badge { background: #ef4444; color: #fff; padding: 6px 16px; border-radius: 20px; font-weight: bold; display: inline-block; margin-bottom: 10px; font-size: 0.9rem; letter-spacing: 1px; }
        .score-box { font-weight: bold; font-size: 1.2rem; color: #2563eb; margin-bottom: 15px; }
        
        .progress-bar { width: 100%; height: 12px; background: #e2e8f0; border-radius: 10px; margin-bottom: 25px; overflow: hidden; border: 1px solid #cbd5e1; }
        .progress-fill { height: 100%; background: #10b981; width: 0%; transition: width 0.3s; }
        
        /* Container for the central graphic */
        .visual-container { height: 120px; display: flex; justify-content: center; align-items: center; margin-bottom: 15px; }
        .visual-text { font-size: 4.5rem; display: block; }
        .visual-img { max-height: 110px; width: auto; object-fit: contain; border-radius: 10px; }
        
        .prompt { font-size: 1.4rem; font-weight: 700; margin-bottom: 25px; color: #0f172a; line-height: 1.4; }
        
        .options { display: flex; flex-direction: column; gap: 12px; }
        .btn { 
            background: #f0f9ff; border: 3px solid #93c5fd; border-radius: 20px; padding: 15px; 
            font-size: 1.2rem; font-weight: 700; color: #1d4ed8; cursor: pointer; transition: 0.2s;
            font-family: inherit;
        }
        .btn:hover:not(:disabled) { background: #dbeafe; transform: translateY(-2px); }
        .btn:active:not(:disabled) { transform: translateY(0); }
        .btn.correct { background: #4def8d !important; border-color: #10b981 !important; color: #064e3b !important; }
        .btn.wrong { background: #fecaca !important; border-color: #ef4444 !important; color: #7f1d1d !important; }

        .win-screen { display: none; }
        .win-screen h2 { color: #2563eb; font-size: 2.2rem; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="app">
    <div class="card" id="quizCard">
        <div class="header">
            <div id="missionBadge" class="badge">MISSION 1: CLASSROOM ITEMS</div>
            <div class="score-box">XP POINTS: <span id="scoreText">0</span></div>
            <div class="progress-bar"><div class="progress-fill" id="pFill"></div></div>
        </div>

        <div id="gamePlay">
            <!-- Updated dynamic media presentation wrapper -->
            <div class="visual-container" id="mediaWrapper"></div>
            <div class="prompt" id="promptText">Loading mission intel...</div>
            <div class="options" id="optionsBox"></div>
        </div>

        <div id="winScreen" class="win-screen">
            <div class="visual-container"><span class="visual-text">🎒✏️🚀</span></div>
            <h2>ACADEMY EXPEDITION COMPLISHED!</h2>
            <p style="font-size: 1.2rem; color: #64748b; margin-bottom: 25px;">You have successfully mastered all textbook items and phrases!</p>
            <button class="btn" onclick="location.reload()" style="width: 100%;">START RE-ENTRY</button>
        </div>
    </div>
</div>

<script>
    const questions = [
        // MISSION 1: CLASSROOM VOCABULARY MATCHING
        // type: "text" parses standard string characters. type: "url" injects external image asset dimensions.
        { m: "MISSION 1: VOCABULARY", v: "✏️", type: "text", q: " ", a: ["rubber", "pencil"], c: "pencil" },
        { m: "MISSION 1: VOCABULARY", v: "🎒", type: "text", q: " ", a: ["schoolbag", "pencil case"], c: "schoolbag" },
        { m: "MISSION 1: VOCABULARY", v: "📖", type: "text", q: " ", a: ["book", "desk"], c: "book" },
        { m: "MISSION 1: VOCABULARY", v: "https://leto-rf.ru/upload/iblock/5c7/uzwow642i2vqx3419dxlxec97cyzs69k.jpg", type: "url", q: " ", a: ["rubber", "aeroplane"], c: "rubber" },
        { m: "MISSION 1: VOCABULARY", v: "👝", type: "text", q: " ", a: ["pencil case", "schoolbag"], c: "pencil case" },
        { m: "MISSION 1: VOCABULARY", v: "https://yourhomework.net/yhw/f/yhw-voca/2024/09/2/202409230718429078573.jpg", type: "url", q: " ", a: ["desk", "book"], c: "desk" },
        { m: "MISSION 1: VOCABULARY", v: "✈️", type: "text", q: " ", a: ["pencil", "aeroplane"], c: "aeroplane" },

        // MISSION 2: STRUCTURE & DESCRIPTION
        { m: "MISSION 2: GRAMMAR CRACKER", v: "?", type: "text", q: "There are pencils in the ______.", a: ["pencil case", "aeroplane"], c: "pencil case" },
        { m: "MISSION 2: GRAMMAR CRACKER", v: "?", type: "text", q: "Look up in the sky! It's a blue ______.", a: ["rubber", "aeroplane"], c: "aeroplane" },
        { m: "MISSION 2: GRAMMAR CRACKER", v: "?", type: "text", q: "There are books in your ______ .", a: ["desk", "schoolbag"], c: "schoolbag" },
        { m: "MISSION 2: GRAMMAR CRACKER", v: "?", type: "url", q: "Oh no! Give me please your ______?", a: ["rubber", "pencil case"], c: "rubber" },
        { m: "MISSION 2: GRAMMAR CRACKER", v: "?", type: "url", q: "Please sit down at the ______ .", a: ["desk", "aeroplane"], c: "desk" }
    ];

    let current = 0;
    let score = 0;

    function loadQuestion() {
        if (current >= questions.length) {
            document.getElementById('gamePlay').style.display = 'none';
            document.getElementById('missionBadge').style.display = 'none';
            document.getElementById('winScreen').style.display = 'block';
            document.getElementById('pFill').style.width = '100%';
            return;
        }

        const data = questions[current];
        document.getElementById('missionBadge').innerText = data.m;
        
        // Render content context conditionally by checking metadata flag
        const mediaWrapper = document.getElementById('mediaWrapper');
        mediaWrapper.innerHTML = '';
        if (data.type === "url") {
            const imgElement = document.createElement('img');
            imgElement.src = data.v;
            imgElement.className = 'visual-img';
            imgElement.alt = 'Target task visual clue';
            mediaWrapper.appendChild(imgElement);
        } else {
            const spanElement = document.createElement('span');
            spanElement.className = 'visual-text';
            spanElement.innerText = data.v;
            mediaWrapper.appendChild(spanElement);
        }

        document.getElementById('promptText').innerText = data.q === " " ? "Identify this object:" : data.q;
        
        const box = document.getElementById('optionsBox');
        box.innerHTML = '';
        
        data.a.forEach(opt => {
            const b = document.createElement('button');
            b.className = 'btn';
            b.innerText = opt;
            b.onclick = () => verifySelection(opt, b);
            box.appendChild(b);
        });

        document.getElementById('pFill').style.width = (current / questions.length) * 100 + '%';
    }

    function verifySelection(choice, btnElement) {
        const data = questions[current];
        const buttons = document.getElementById('optionsBox').querySelectorAll('.btn');
        buttons.forEach(b => b.disabled = true);

        if (choice === data.c) {
            btnElement.classList.add('correct');
            score += 50;
            document.getElementById('scoreText').innerText = score;
            setTimeout(() => {
                current++;
                loadQuestion();
            }, 800);
        } else {
            btnElement.classList.add('wrong');
            buttons.forEach(b => {
                if (b.innerText === data.c) {
                    b.classList.add('correct');
                }
            });
            setTimeout(() => {
                current++;
                loadQuestion();
            }, 1400);
        }
    }

    window.onload = loadQuestion;
</script>

</body>
</html>
