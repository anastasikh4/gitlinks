<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUPERMARKET: A, An or — ?</title>
    <style>
        :root {
            --cart-blue: #0984e3;
            --apple-red: #d63031;
            --cheese-gold: #fdcb6e;
            --leaf-green: #00b894;
            --bg-color: #f1f2f6;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        #game-card {
            width: 95%;
            max-width: 500px;
            background: #fff;
            border-radius: 40px;
            border: 8px solid var(--cart-blue);
            box-shadow: 0 15px 0px #2980b9;
            padding: 30px;
            text-align: center;
            transition: border-color 0.2s;
            position: relative;
            z-index: 10;
        }

        .header { display: flex; justify-content: space-between; margin-bottom: 20px; align-items: center; }
        .score-pill { background: var(--cheese-gold); padding: 5px 20px; border-radius: 20px; border: 3px solid #2d3436; font-weight: bold; font-size: 1.2rem; }
        .tag { background: var(--leaf-green); color: white; padding: 5px 15px; border-radius: 50px; font-size: 12px; font-weight: bold; text-transform: uppercase; }

        .display-area {
            background: #fdfcf0;
            height: 180px;
            border-radius: 30px;
            border: 4px dashed var(--cart-blue);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
        }

        .item-emoji { font-size: 55px; margin-bottom: 10px; }
        .sentence { font-size: 22px; font-weight: 700; color: #2d3436; line-height: 1.4; }
        .highlight { color: var(--cart-blue); background: #dff9fb; padding: 0 8px; border-radius: 5px; border-bottom: 3px solid; }

        .btn-grid { display: flex; flex-direction: column; gap: 12px; }

        .btn-choice {
            background: white;
            border: 4px solid #2d3436;
            border-radius: 20px;
            padding: 12px;
            font-size: 1.4rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 5px 0 #2d3436;
            transition: 0.1s;
        }

        .btn-choice:active:not(:disabled) { transform: translateY(3px); box-shadow: none; }
        .btn-choice:disabled { opacity: 0.5; cursor: not-allowed; }

        #progress-bar { width: 100%; height: 12px; background: #eee; border-radius: 10px; margin-top: 25px; border: 2px solid #ccc; overflow: hidden; }
        #progress-fill { width: 0%; height: 100%; background: var(--leaf-green); transition: 0.4s; }

        #win-screen { display: none; }

        /* ========================================== */
        /* HEARTS FIREWORK STRUCTURAL EFFECTS         */
        /* ========================================== */
        .heart-particle {
            position: absolute;
            font-size: 24px;
            pointer-events: none;
            user-select: none;
            z-index: 5;
            animation: burst 0.8s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes burst {
            0% {
                transform: translate(0, 0) scale(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                /* Values calculated programmatically inside Javascript */
                transform: translate(var(--tx), var(--ty)) scale(1.3) rotate(var(--rot));
                opacity: 0;
            }
        }
    </style>
</head>
<body>

<div id="game-card">
    <div id="play-area">
        <div class="header">
            <div class="tag" id="level-tag">A, An, or [—] Mixed</div>
            <div class="score-pill">🛒 <span id="score-val">0</span></div>
        </div>

        <div class="display-area">
            <div class="item-emoji" id="emoji-box">🍏</div>
            <div class="sentence" id="sentence-box">I've got <span class="highlight">?</span> apple.</div>
        </div>

        <div class="btn-grid" id="btn-container">
            <!-- Buttons are generated dynamically by JavaScript -->
        </div>

        <div id="progress-bar"><div id="progress-fill"></div></div>
    </div>

    <div id="win-screen">
        <h1 style="color: var(--leaf-green); font-size: 40px;">GRAMMAR EXPERT! 🧺</h1>
        <p>You mastered a, an, and plural boundaries perfectly!</p>
        <div style="font-size: 60px; margin: 20px;">🍇🍪🥕🍊🍎</div>
        <button class="btn-choice" onclick="location.reload()" style="width:100%">PLAY AGAIN</button>
    </div>
</div>

<script>
    let score = 0;
    let current = 0;

    const poolOptions = ["a", "an", "—"];

    const questions = [
        { s: "I need ... grapes.", ans: "—", emo: "🍇", hint: "Plural item (grapes) ➔ No article (—)" },
        { s: "I need ... orange.", ans: "an", emo: "🍊", hint: "Single item + vowel sound (O) ➔ AN" },
        { s: "I need ... lemon.", ans: "a", emo: "🍋", hint: "Single item + consonant sound (L) ➔ A" },
        { s: "I need ... cookies.", ans: "—", emo: "🍪", hint: "Plural item (cookies) ➔ No article (—)" },
        { s: "I need ... carrots.", ans: "—", emo: "🥕", hint: "Plural item (carrots) ➔ No article (—)" },
        { s: "I need ... onion.", ans: "an", emo: "🧅", hint: "Single item + vowel sound (O) ➔ AN" },
        { s: "I need ... pear.", ans: "a", emo: "🍐", hint: "Single item + consonant sound (P) ➔ A" },
        { s: "I need ... bananas.", ans: "—", emo: "🍌", hint: "Plural item (bananas) ➔ No article (—)" },
        { s: "I need ... tomato.", ans: "a", emo: "🍅", hint: "Single item + consonant sound (T) ➔ A" },
        { s: "I need ... strawberries.", ans: "—", emo: "🍓", hint: "Plural item (strawberries) ➔ No article (—)" }
    ];

    function loadMission() {
        const m = questions[current];
        document.getElementById('emoji-box').innerText = m.emo;
        document.getElementById('sentence-box').innerHTML = m.s.replace("...", "<span class='highlight'>?</span>");
        document.getElementById('progress-fill').style.width = (current / questions.length * 100) + '%';
        
        const btnContainer = document.getElementById('btn-container');
        btnContainer.innerHTML = '';
        
        const currentOptions = [...poolOptions].sort(() => Math.random() - 0.5);
        
        currentOptions.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'btn-choice';
            btn.innerText = opt;
            btn.onclick = () => check(opt, btn);
            btnContainer.appendChild(btn);
        });
    }

    // Programmatic particle engine creating a heart firework sequence
    function createHeartsFirework() {
        const heartVariations = ["❤️", "💖", "💝", "💕", "💘"];
        const particleCount = 24; // Number of heart particles in the burst
        const card = document.getElementById('game-card');
        const rect = card.getBoundingClientRect();
        
        // Calculate the central origin vector point of the board element
        const originX = rect.left + rect.width / 2;
        const originY = rect.top + rect.height / 2;

        for (let i = 0; i < particleCount; i++) {
            const heart = document.createElement('div');
            heart.className = 'heart-particle';
            heart.innerText = heartVariations[Math.floor(Math.random() * heartVariations.length)];
            
            // Set starting point to body absolute coordinates
            heart.style.left = `${originX}px`;
            heart.style.top = `${originY}px`;

            // Calculate random 360 radial trajectories
            const angle = Math.random() * Math.PI * 2;
            const distance = 150 + Math.random() * 200; // Radius burst spread bounds
            const targetX = Math.cos(angle) * distance;
            const targetY = Math.sin(angle) * distance;
            const rotation = Math.random() * 90 - 45; // Slight angle tweak

            // Pass targets downstream as CSS inline variables to run inside the keyframe properties
            heart.style.setProperty('--tx', `${targetX}px`);
            heart.style.setProperty('--ty', `${targetY}px`);
            heart.style.setProperty('--rot', `${rotation}deg`);

            document.body.appendChild(heart);

            // Clean nodes up out of memory immediately following lifecycle completion
            setTimeout(() => heart.remove(), 800);
        }
    }

    function check(selectedOption, clickedBtn) {
        const currentQuestion = questions[current];
        const allButtons = document.querySelectorAll('.btn-choice');
        
        if (selectedOption === currentQuestion.ans) {
            allButtons.forEach(b => b.disabled = true);
            
            // Instantly spawn firework particle effects loop
            createHeartsFirework();
            
            score += 10;
            current++;
            document.getElementById('score-val').innerText = score;
            
            setTimeout(() => {
                if (current < questions.length) {
                    loadMission();
                } else {
                    showWin();
                }
            }, 600); // Extended pause slightly so students can appreciate the firework
        } else {
            const card = document.getElementById('game-card');
            card.style.borderColor = "#d63031";
            setTimeout(() => card.style.borderColor = "#0984e3", 500);
            alert(currentQuestion.hint);
        }
    }

    function showWin() {
        document.getElementById('play-area').style.display = 'none';
        document.getElementById('win-screen').style.display = 'block';
        document.getElementById('progress-fill').style.width = '100%';
    }

    loadMission();
</script>

</body>
</html>
