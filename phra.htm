<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUPERHERO ACADEMY: Greetings & Introduction</title>
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-purple: #bc13fe;
            --neon-pink: #ff007b;
            --dark-space: #050505;
        }

        body {
            background-color: var(--dark-space);
            color: white;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #game-box {
            width: 95%;
            max-width: 650px;
            background: #111;
            padding: 25px;
            border-radius: 15px;
            border: 4px solid var(--neon-blue);
            box-shadow: 0 0 25px var(--neon-blue);
            text-align: center;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 1.2rem;
            color: var(--neon-blue);
            text-transform: uppercase;
        }

        .mission-header {
            color: var(--neon-pink);
            font-size: 1.8rem;
            margin-bottom: 15px;
            text-shadow: 2px 2px black;
        }

        .image-container {
            width: 100%;
            height: 220px;
            border: 3px solid white;
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
            background: #222;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .question-text {
            font-size: 1.4rem;
            margin-bottom: 25px;
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 5px;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .choice-btn {
            background: #222;
            color: white;
            border: 2px solid var(--neon-purple);
            padding: 15px;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            text-align: left;
        }

        .choice-btn:hover {
            background: var(--neon-purple);
            box-shadow: 0 0 15px var(--neon-purple);
            transform: scale(1.02);
        }

        #feedback-area {
            margin-top: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            height: 40px;
        }

        .next-mission-btn {
            display: none;
            background: var(--neon-blue);
            color: black;
            border: none;
            padding: 12px 40px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 15px;
            text-transform: uppercase;
        }

        .progress-container {
            width: 100%;
            background: #333;
            height: 10px;
            border-radius: 10px;
            margin-top: 25px;
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background: var(--neon-blue);
            border-radius: 10px;
            transition: 0.5s;
        }
    </style>
</head>
<body>

<div id="game-box">
    <div class="status-bar">
        <div>QUEST: <span id="m-num">1</span>/7</div>
        <div>XP: <span id="xp">0</span></div>
    </div>

    <div id="play-zone">
        <div class="mission-header" id="m-title">MISSION START!</div>
        
        <div class="image-container">
            <img id="m-img" src="" alt="Mission Visual">
        </div>

        <div class="question-text" id="m-quest">Loading Mission...</div>

        <div class="options-container" id="m-choices">
            <!-- Buttons appear here -->
        </div>

        <div id="feedback-area"></div>
        <button id="next-btn" class="next-mission-btn" onclick="nextLevel()">CONTINUE ➔</button>
    </div>

    <div id="finish-zone" style="display:none;">
        <h1 style="color:var(--neon-blue); font-size: 3rem;">HERO RANK: S+</h1>
        <p style="font-size: 1.5rem;">You completed all 7 Missions!</p>
        <h2 id="final-xp" style="color:var(--neon-pink);">Total XP: 0</h2>
        <button class="choice-btn" style="text-align:center" onclick="location.reload()">RESTART TRAINING</button>
    </div>

    <div class="progress-container">
        <div id="progress-bar"></div>
    </div>
</div>

<script>
    // 7 missions based on the textbook exercises (greetings, introductions, age)
    const levels = [
        {
            title: "MISSION 1: SAY HELLO!",
            img: "https://i.pinimg.com/originals/93/e9/8c/93e98cbe46ac77758045924605576837.jpg?nii=t",
            quest: "Hi! </b>",
            choices: ["Hello!", "Goodbye!", "Thank you!"],
            correct: 0
        },
        {
            title: "MISSION 2: WHAT'S YOUR NAME?",
            img: "https://www.shutterstock.com/image-photo/little-caucasian-boy-opens-door-600nw-1390726325.jpg",
            quest: "Hello, I'm Tom. What's your name?</b>",
            choices: ["My name's Yelena.", "This is Yelena.", "I'm good."],
            correct: 0
        },
        {
            title: "MISSION 3: NICE TO MEET YOU!",
            img: "https://elements-resized.envatousercontent.com/elements-video-cover-images/files/8988b3b3-3100-42f2-85ab-5a4550ee9215/inline_image_preview.jpg?w=500&cf_fit=cover&q=85&format=auto&s=43ab88e23c3005d15a1315070482681ce65471e93f3b5ee149f359237607eaf6",
            quest: "Hi, Yelena. Nice to meet you.</b>",
            choices: ["Nice to meet you, too!", "I'm fine, thanks.", "My name's Lee."],
            correct: 0
        },
        {
            title: "MISSION 4: HOW OLD ARE YOU?",
            img: "https://i.pinimg.com/originals/cb/0d/9c/cb0d9cab24c92d64ace39b3058ef5962.jpg",
            quest: "How old are you?</b>",
            choices: ["I'm good.", "I'm seven.", "I'm Lee."],
            correct: 1
        },
        {
            title: "MISSION 5: INTRODUCE YOURSELF",
            img: "https://thumbs.dreamstime.com/b/happy-teenage-boy-waving-to-say-hello-white-background-224499731.jpg",
            quest: "Hi! I'm Tom! :</b>",
            choices: ["Hi! I'm Lee.", "Bye! I'm Lee.", "Help! I'm Lee."],
            correct: 0
        },
        {
            title: "MISSION 6: ANSWER THE QUESTION",
            img: "https://img.freepik.com/premium-photo/cute-boy-standing-white-wall-grey-shirt-smiling_146935-312.jpg?semt=ais_hybrid",
            quest: "What's your name?",
            choices: ["I'm fine, thanks.", "My name's Harry.", "I'm eight."],
            correct: 1
        },
        {
            title: "MISSION 7: FINAL CHALLENGE",
            img: "https://media.gettyimages.com/id/1330337998/photo/boy-holding-number-5-shape-balloon.jpg?s=612x612&w=gi&k=20&c=BHy71AvyPizZWYwT33uNBXl_RHPDhnM_Fyick-rXvdg=",
            quest: "How old are you?</b>",
            choices: ["I'm five.", "Nice to meet you.", "Hello!"],
            correct: 0
        }
    ];

    let currentLvl = 0;
    let score = 0;

    function startLevel() {
        const data = levels[currentLvl];
        document.getElementById('m-num').innerText = currentLvl + 1;
        document.getElementById('m-title').innerText = data.title;
        document.getElementById('m-img').src = data.img;
        document.getElementById('m-quest').innerHTML = data.quest;
        document.getElementById('feedback-area').innerText = "";
        document.getElementById('next-btn').style.display = "none";
        
        const btnBox = document.getElementById('m-choices');
        btnBox.innerHTML = "";
        
        data.choices.forEach((txt, idx) => {
            const b = document.createElement('button');
            b.className = 'choice-btn';
            b.innerText = txt;
            b.onclick = () => check(idx);
            btnBox.appendChild(b);
        });

        document.getElementById('progress-bar').style.width = ((currentLvl / levels.length) * 100) + "%";
    }

    function check(idx) {
        const correctIdx = levels[currentLvl].correct;
        const feed = document.getElementById('feedback-area');
        const btns = document.querySelectorAll('.choice-btn');
        
        btns.forEach(b => b.disabled = true);

        if (idx === correctIdx) {
            feed.innerText = "💥 BOOM! CORRECT! +100 XP";
            feed.style.color = "var(--neon-blue)";
            score += 100;
            document.getElementById('xp').innerText = score;
        } else {
            feed.innerText = "⚡ GLITCH! TRY NEXT TIME";
            feed.style.color = "var(--neon-pink)";
        }
        
        document.getElementById('next-btn').style.display = "inline-block";
    }

    function nextLevel() {
        currentLvl++;
        if (currentLvl < levels.length) {
            startLevel();
        } else {
            document.getElementById('progress-bar').style.width = "100%";
            document.getElementById('play-zone').style.display = "none";
            document.getElementById('finish-zone').style.display = "block";
            document.getElementById('final-xp').innerText = "Final XP: " + score;
        }
    }

    startLevel();
</script>

</body>
</html>
