<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Chores Quiz 🧹</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: #f5f1eb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .quiz-wrapper {
            width: 100%;
            max-width: 640px;
            background: #ffffff;
            border-radius: 32px;
            padding: 32px 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.10);
            transition: all 0.2s;
        }

        /* progress */
        .progress-area {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 28px;
        }

        .progress-track {
            flex: 1;
            height: 12px;
            background: #e8e0d8;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: #58cc02;
            border-radius: 20px;
            transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .question-counter {
            font-weight: 800;
            font-size: 18px;
            color: #4a4a4a;
            background: #f0ebe4;
            padding: 4px 14px;
            border-radius: 40px;
            white-space: nowrap;
        }

        /* question area */
        .question-area {
            margin-bottom: 28px;
        }

        .question-label {
            font-weight: 700;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #af9f8a;
            margin-bottom: 8px;
        }

        .question-sentence {
            font-weight: 800;
            font-size: 24px;
            line-height: 1.5;
            color: #1e1e1e;
        }

        .blank-highlight {
            display: inline-block;
            min-width: 100px;
            border-bottom: 4px solid #58cc02;
            padding: 0 6px;
            color: #1e1e1e;
            font-weight: 900;
            background: #f0f7e8;
            border-radius: 4px 4px 0 0;
            transition: all 0.2s;
        }

        /* options grid */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 8px;
        }

        .option-btn {
            background: #f5f1eb;
            border: 3px solid #e0d6ca;
            border-radius: 18px;
            padding: 18px 8px;
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            font-size: 20px;
            color: #1e1e1e;
            cursor: pointer;
            transition: all 0.12s ease;
            text-align: center;
            line-height: 1.2;
            min-height: 72px;
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: break-word;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .option-btn:active {
            transform: scale(0.96);
        }

        .option-btn.correct {
            background: #d7ffb8;
            border-color: #58cc02;
            color: #2b6e00;
            animation: popCorrect 0.35s ease;
        }

        .option-btn.wrong {
            background: #ffdede;
            border-color: #ff4b4b;
            color: #a00000;
            animation: shake 0.4s ease;
        }

        .option-btn.disabled {
            pointer-events: none;
            opacity: 0.7;
        }

        @keyframes popCorrect {
            0% { transform: scale(1); }
            40% { transform: scale(1.04); }
            100% { transform: scale(1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
        }

        /* feedback message */
        .feedback-msg {
            margin-top: 16px;
            font-weight: 700;
            font-size: 18px;
            min-height: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 14px;
            border-radius: 16px;
            transition: all 0.2s;
        }

        .feedback-msg.correct-fb {
            color: #2b6e00;
            background: #e8f5e0;
        }

        .feedback-msg.wrong-fb {
            color: #a00000;
            background: #ffe6e6;
        }

        /* next button */
        .next-btn {
            display: none;
            width: 100%;
            padding: 18px;
            background: #58cc02;
            border: none;
            border-radius: 18px;
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            font-size: 22px;
            color: white;
            cursor: pointer;
            transition: all 0.15s;
            margin-top: 8px;
            box-shadow: 0 6px 0 #3c8b00;
        }

        .next-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #3c8b00;
        }

        .next-btn.show {
            display: block;
            animation: fadeUp 0.3s ease;
        }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(12px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* results screen */
        .result-screen {
            display: none;
            text-align: center;
            padding: 20px 0 10px;
            animation: fadeUp 0.5s ease;
        }

        .result-screen.show {
            display: block;
        }

        .result-icon {
            font-size: 72px;
            margin-bottom: 10px;
        }

        .result-title {
            font-weight: 900;
            font-size: 34px;
            color: #1e1e1e;
            margin-bottom: 6px;
        }

        .result-sub {
            font-weight: 700;
            font-size: 20px;
            color: #4a4a4a;
            margin-bottom: 8px;
        }

        .result-score {
            font-weight: 800;
            font-size: 48px;
            color: #58cc02;
            background: #f0f7e8;
            display: inline-block;
            padding: 8px 40px;
            border-radius: 60px;
            margin: 12px 0 24px;
        }

        .restart-btn {
            background: #1e1e1e;
            border: none;
            border-radius: 18px;
            padding: 18px 48px;
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            font-size: 22px;
            color: white;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 6px 0 #00000040;
        }

        .restart-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #00000040;
        }

        /* hide game elements when result is shown */
        .game-content.hidden {
            display: none;
        }

        /* mobile responsive */
        @media (max-width: 520px) {
            .quiz-wrapper {
                padding: 20px 16px;
                border-radius: 24px;
            }

            .question-sentence {
                font-size: 20px;
            }

            .options-grid {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            .option-btn {
                font-size: 17px;
                padding: 14px 6px;
                min-height: 64px;
                border-radius: 14px;
            }

            .blank-highlight {
                min-width: 70px;
                font-size: 20px;
            }

            .result-title {
                font-size: 28px;
            }

            .result-score {
                font-size: 38px;
                padding: 6px 30px;
            }

            .next-btn {
                font-size: 19px;
                padding: 15px;
            }
        }

        @media (max-width: 400px) {
            .options-grid {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }

            .option-btn {
                font-size: 15px;
                padding: 12px 4px;
                min-height: 56px;
            }

            .question-sentence {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

<div class="quiz-wrapper" id="app">

    <!-- progress -->
    <div class="progress-area">
        <div class="progress-track">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="question-counter" id="counterDisplay">1 / 8</div>
    </div>

    <!-- game content -->
    <div class="game-content" id="gameContent">

        <div class="question-area">
            <div class="question-label" id="qLabel">Fill in the blank</div>
            <div class="question-sentence" id="qSentence">
                I don't like <span class="blank-highlight" id="blankDisplay">______</span> the table.
            </div>
        </div>

        <div class="options-grid" id="optionsGrid">
            <!-- buttons injected by JS -->
        </div>

        <div class="feedback-msg" id="feedbackMsg"></div>

        <button class="next-btn" id="nextBtn">Continue ➜</button>
    </div>

    <!-- result screen -->
    <div class="result-screen" id="resultScreen">
        <div class="result-icon" id="resultIcon">🏆</div>
        <div class="result-title" id="resultTitle">You're a Chores Master!</div>
        <div class="result-sub" id="resultSub">Great job!</div>
        <div class="result-score" id="resultScore">8 / 8</div>
        <button class="restart-btn" id="restartBtn">🔄 Play Again</button>
    </div>

</div>

<script>
    (function() {
        // ----- DATA -----
        const allWords = [
            'setting', 'loading', 'taking', 'vacuuming',
            'putting', 'making', 'watering', 'feeding',
            'doing', 'ironing'
        ];

        const questionsData = [
            {
                sentence: 'I don\'t like ______ the table or clearing it after meals.',
                correct: 'setting'
            },
            {
                sentence: 'I don\'t like ______ and emptying the dishwasher.',
                correct: 'loading'
            },
            {
                sentence: 'I hate ______ out the rubbish! That\'s a smelly chore!',
                correct: 'taking'
            },
            {
                sentence: 'I like ______ the carpet in my bedroom.',
                correct: 'vacuuming'
            },
            {
                sentence: 'I like ______ away my clothes.',
                correct: 'putting'
            },
            {
                sentence: 'I like ______ my bed because I like having a tidy bedroom.',
                correct: 'making'
            },
            {
                sentence: 'I like ______ the plants too.',
                correct: 'watering'
            },
            {
                sentence: 'And I love ______ my dogs, Rusty and Mustard. They\'re my best friends.',
                correct: 'feeding'
            }
        ];

        // ----- STATE -----
        let shuffledQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let isAnswered = false;
        let totalQuestions = 0;

        // ----- DOM refs -----
        const progressFill = document.getElementById('progressFill');
        const counterDisplay = document.getElementById('counterDisplay');
        const qLabel = document.getElementById('qLabel');
        const qSentence = document.getElementById('qSentence');
        const blankDisplay = document.getElementById('blankDisplay');
        const optionsGrid = document.getElementById('optionsGrid');
        const feedbackMsg = document.getElementById('feedbackMsg');
        const nextBtn = document.getElementById('nextBtn');
        const gameContent = document.getElementById('gameContent');
        const resultScreen = document.getElementById('resultScreen');
        const resultIcon = document.getElementById('resultIcon');
        const resultTitle = document.getElementById('resultTitle');
        const resultSub = document.getElementById('resultSub');
        const resultScore = document.getElementById('resultScore');
        const restartBtn = document.getElementById('restartBtn');

        // ----- helpers -----
        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function getOptions(correct) {
            // pick 3 random distractors from allWords (excluding the correct one)
            const pool = allWords.filter(w => w !== correct);
            const shuffledPool = shuffle(pool);
            const distractors = shuffledPool.slice(0, 3);
            // combine and shuffle
            const opts = shuffle([correct, ...distractors]);
            return opts;
        }

        // ----- render question -----
        function renderQuestion() {
            const q = shuffledQuestions[currentIndex];
            const total = shuffledQuestions.length;
            const progress = ((currentIndex) / total) * 100;

            progressFill.style.width = progress + '%';
            counterDisplay.textContent = `${currentIndex + 1} / ${total}`;

            // sentence with blank
            const parts = q.sentence.split('______');
            if (parts.length === 2) {
                qSentence.innerHTML = `${parts[0]}<span class="blank-highlight" id="blankDisplay">______</span>${parts[1]}`;
            } else {
                // fallback
                qSentence.innerHTML = q.sentence.replace('______', '<span class="blank-highlight">______</span>');
            }

            // options
            const opts = getOptions(q.correct);
            optionsGrid.innerHTML = '';
            opts.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt;
                btn.dataset.value = opt;
                btn.addEventListener('click', () => handleOptionClick(btn, opt, q.correct));
                optionsGrid.appendChild(btn);
            });

            // reset state
            isAnswered = false;
            feedbackMsg.textContent = '';
            feedbackMsg.className = 'feedback-msg';
            nextBtn.classList.remove('show');
            document.querySelectorAll('.option-btn').forEach(b => {
                b.classList.remove('correct', 'wrong', 'disabled');
                b.disabled = false;
            });
        }

        // ----- handle answer -----
        function handleOptionClick(btn, selected, correct) {
            if (isAnswered) return;
            isAnswered = true;

            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.classList.add('disabled'));

            if (selected === correct) {
                btn.classList.add('correct');
                score++;
                feedbackMsg.textContent = '✅ Perfect! Well done!';
                feedbackMsg.className = 'feedback-msg correct-fb';
            } else {
                btn.classList.add('wrong');
                // highlight the correct one
                allBtns.forEach(b => {
                    if (b.dataset.value === correct) {
                        b.classList.add('correct');
                    }
                });
                feedbackMsg.textContent = `❌ Oops! The answer is “${correct}”.`;
                feedbackMsg.className = 'feedback-msg wrong-fb';
            }

            // show next button
            nextBtn.classList.add('show');
        }

        // ----- next question or finish -----
        function goToNext() {
            currentIndex++;
            if (currentIndex < shuffledQuestions.length) {
                renderQuestion();
            } else {
                showResults();
            }
        }

        // ----- results -----
        function showResults() {
            gameContent.classList.add('hidden');
            resultScreen.classList.add('show');

            const total = shuffledQuestions.length;
            const pct = score / total;

            let icon, title, sub;
            if (pct === 1) {
                icon = '🏆';
                title = 'Chores Master!';
                sub = 'Flawless performance! You know your chores!';
            } else if (pct >= 0.75) {
                icon = '🌟';
                title = 'Great Job!';
                sub = 'You\'re a household hero!';
            } else if (pct >= 0.5) {
                icon = '💪';
                title = 'Not Bad!';
                sub = 'Keep practicing, you\'ll get there!';
            } else {
                icon = '📚';
                title = 'Keep Learning!';
                sub = 'Review the words and try again!';
            }

            resultIcon.textContent = icon;
            resultTitle.textContent = title;
            resultSub.textContent = sub;
            resultScore.textContent = `${score} / ${total}`;

            progressFill.style.width = '100%';
            counterDisplay.textContent = `${total} / ${total}`;
        }

        // ----- restart -----
        function restartQuiz() {
            // reshuffle questions
            shuffledQuestions = shuffle(questionsData);
            currentIndex = 0;
            score = 0;
            isAnswered = false;

            resultScreen.classList.remove('show');
            gameContent.classList.remove('hidden');

            renderQuestion();
        }

        // ----- init -----
        function init() {
            shuffledQuestions = shuffle(questionsData);
            totalQuestions = shuffledQuestions.length;
            currentIndex = 0;
            score = 0;
            renderQuestion();

            nextBtn.addEventListener('click', goToNext);
            restartBtn.addEventListener('click', restartQuiz);
        }

        init();

        // fix: re-bind blankDisplay reference after re-render
        // We'll use a MutationObserver or just re-fetch inside render.
        // Actually, the blank is re-created each time, so we don't need to store it.
        // The renderQuestion function uses innerHTML, so the blank is always fresh.

        // One small fix: when the next button is clicked, we need to ensure the feedback
        // doesn't linger. The renderQuestion resets it anyway.

        // Also ensure the progress bar reaches 100% at the end.
        // It's handled in showResults.

        console.log('🧹 Chores Quiz ready!');
    })();
</script>

</body>
</html>
