<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Time: Hattie's Essay</title>
    <style>
        :root { --primary: #0984e3; --success: #00b894; --error: #d63031; --bg: #fdfdfd; --accent: #fdcb6e; }
        * { box-sizing: border-box; font-family: 'Comic Sans MS', sans-serif; }
        body { background: var(--bg); display: flex; justify-content: center; padding: 15px; margin: 0; font-size: 11px; }
        .quiz-container { background: white; width: 100%; max-width: 720px; padding: 20px; border-radius: 24px; box-shadow: 0 12px 30px rgba(0,0,0,0.1); text-align: center; border: 3px solid #eee; min-height: 520px; }

        .progress-header { font-weight: bold; color: #aaa; text-transform: uppercase; margin-bottom: 8px; font-size: 1rem; }
        .visual-box { font-size: 3.5rem; margin: 15px 0; display: flex; justify-content: center; gap: 20px; align-items: center; min-height: 120px; }

        .sentence-builder { border-bottom: 3px dashed #ddd; min-height: 70px; margin: 20px 0; display: flex; justify-content: center; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px; background: #f9fbfc; border-radius: 10px; font-size: 1.2rem; }
        .word-tag { background: var(--primary); color: white; padding: 8px 16px; border-radius: 10px; font-weight: bold; font-size: 1.1rem; animation: pop 0.3s; box-shadow: 0 3px 0 #076bb3; }

        .btn-pool { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
        .action-btn { background: #fff; padding: 12px 24px; border: 2px solid #ddd; border-radius: 14px; cursor: pointer; font-weight: bold; font-size: 1.1rem; box-shadow: 0 4px 0 #ccc; transition: all 0.15s; min-width: 220px; }
        .action-btn:hover { transform: translateY(-3px); box-shadow: 0 6px 0 #bbb; }
        .action-btn:disabled { opacity: 0.4; cursor: default; transform: none; box-shadow: none; }

        .feedback { margin-top: 20px; font-size: 1.6rem; font-weight: bold; min-height: 50px; }
        @keyframes pop { 0% { transform: scale(0.8); } 100% { transform: scale(1); } }
    </style>
</head>
<body>
<div class="quiz-container">
    <div id="progress" class="progress-header">Exercise 1 of 10</div>
    <h2 id="q-title">Title</h2>
    <div id="visual-content" class="visual-box"></div>
    <div id="game-ui">
        <div class="sentence-builder" id="builder"></div>
        <div id="pool" class="btn-pool"></div>
    </div>
    <div class="feedback" id="feedback"></div>
</div>

<script>
    let currentStep = 0;
    let userParts = [];

    /* =========================================================
       FAMILY TIME — by Hattie Jones
       Each exercise: read the title (context) and build the
       continuation using 3 shuffled word chunks.
       ========================================================= */
    const data = [
        {
            title: "On weekdays, in Hattie's family, they...",
            visual: "📅 🏠",
            parts: ["don't do", "a lot of things", "together"],
            correct: "don't do a lot of things together"
        },
        {
            title: "They don't do much together because...",
            visual: "⏰ 😓",
            parts: ["they're", "very", "busy"],
            correct: "they're very busy"
        },
        {
            title: "Usually, in the evening, they...",
            visual: "🍽️ ❌",
            parts: ["don't have dinner", "as a", "family"],
            correct: "don't have dinner as a family"
        },
        {
            title: "But sometimes they...",
            visual: "📺 ✅",
            parts: ["watch", "TV", "together"],
            correct: "watch TV together"
        },
        {
            title: "Hattie's family loves watching...",
            visual: "🐘 🦁 📺",
            parts: ["programmes", "about", "animals"],
            correct: "programmes about animals"
        },
        {
            title: "On Saturdays, Hattie...",
            visual: "🧹 📅",
            parts: ["does", "her", "chores"],
            correct: "does her chores"
        },
        {
            title: "She puts away her clothes and...",
            visual: "👕 🧹",
            parts: ["vacuums", "her", "room"],
            correct: "vacuums her room"
        },
        {
            title: "After her chores, she...",
            visual: "👫 😊",
            parts: ["meets", "her", "friends"],
            correct: "meets her friends"
        },
        {
            title: "She comes back home at 7:30 p.m. because they always...",
            visual: "🕢 🍽️",
            parts: ["have a family", "dinner in", "the evening"],
            correct: "have a family dinner in the evening"
        },
        {
            title: "On Sundays, they often...",
            visual: "👴 👵 📅",
            parts: ["visit", "her", "grandparents"],
            correct: "visit her grandparents"
        }
    ];

    function loadGame() {
        if (currentStep >= data.length) {
            document.getElementById('q-title').innerText = "🏆 Family Time Master!";
            document.getElementById('visual-content').innerHTML = "🏆✨🎉";
            document.getElementById('game-ui').innerHTML = `
                <h2 style='color:#00b894; font-size:1.6rem; line-height:1.5;'>
                    Great job! 🌟<br>
                    You know all about Hattie's family!
                </h2>
                <p style='color:#666; font-size:1rem; margin-top:15px; line-height:1.6;'>
                    <b>Activities Hattie does with her family:</b><br>
                    📺 Watch TV together<br>
                    🍽️ Have a family dinner on Saturdays<br>
                    👴👵 Visit grandparents on Sundays
                </p>
            `;
            document.getElementById('feedback').innerText = "";
            return;
        }

        const q = data[currentStep];
        document.getElementById('progress').innerText = `Exercise ${currentStep + 1} of ${data.length}`;
        document.getElementById('q-title').innerText = q.title;
        document.getElementById('visual-content').innerHTML = q.visual;
        document.getElementById('feedback').innerText = "";

        const builder = document.getElementById('builder');
        const pool = document.getElementById('pool');
        builder.innerHTML = '<span class="gap" style="color:#aaa; font-size:1.5rem;">. . .</span>';
        pool.innerHTML = "";
        userParts = [];

        // Shuffle the 3 parts
        const shuffled = [...q.parts].sort(() => Math.random() - 0.5);

        shuffled.forEach(part => {
            const btn = document.createElement('button');
            btn.className = "action-btn";
            btn.innerText = part;
            btn.onclick = () => {
                if (!btn.disabled) {
                    userParts.push(part);
                    btn.disabled = true;
                    if (builder.querySelector('.gap')) builder.innerHTML = '';
                    builder.innerHTML += `<span class="word-tag">${part}</span>`;

                    if (userParts.length === q.parts.length) {
                        checkAnswer();
                    }
                }
            };
            pool.appendChild(btn);
        });
    }

    function checkAnswer() {
        const joined = userParts.join(" ").trim();
        const correct = data[currentStep].correct.trim();

        if (joined.toLowerCase() === correct.toLowerCase()) {
            document.getElementById('feedback').innerHTML = "<span style='color:var(--success)'>🌟 WELL DONE! 🌟</span>";
            speak(correct);
            setTimeout(() => {
                currentStep++;
                loadGame();
            }, 1800);
        } else {
            document.getElementById('feedback').innerHTML = "<span style='color:var(--error)'>❌ Try again!</span>";
            setTimeout(() => {
                loadGame(); // auto reset
            }, 1500);
        }
    }

    function speak(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'en-US';
            msg.rate = 0.95;
            msg.pitch = 1.1;
            window.speechSynthesis.speak(msg);
        }
    }

    // Start
    loadGame();
</script>
</body>
</html>
