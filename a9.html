<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✉️ Lily's Letter — Tenses Quiz</title>
    <style>
        :root {
            --primary: #58cc02;
            --primary-dark: #46a302;
            --secondary: #1cb0f6;
            --secondary-dark: #1899d6;
            --error: #ff4b4b;
            --text: #4b4b4b;
            --gray: #e5e5e5;
            --paper: #fff9e6;
            --purple: #7c3aed;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #34d399 0%, #a7f3d0 100%);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        #game-container {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 26px;
            border-radius: 20px;
            box-shadow: 0 10px 0px var(--gray), 0 20px 40px rgba(0,0,0,0.15);
            text-align: center;
        }

        .progress-bar {
            height: 12px;
            background: var(--gray);
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        #progress-fill {
            height: 100%;
            width: 0%;
            background: var(--primary);
            transition: width 0.3s;
        }

        h1 {
            font-size: 22px;
            color: var(--purple);
            margin-bottom: 20px;
        }

        .level-container { display: none; }
        .active { display: block; animation: fadeIn 0.5s; }

        /* ---------- LETTER BOX ---------- */
        .letter-box {
            background: var(--paper);
            border: 3px dashed #f59e0b;
            border-radius: 16px;
            padding: 18px 20px;
            margin-bottom: 18px;
            text-align: left;
            font-size: 15px;
            line-height: 1.6;
            color: #5c4500;
        }
        .letter-box .letter-title {
            font-weight: 900;
            color: #b45309;
            margin-bottom: 8px;
            font-size: 13px;
            letter-spacing: 1px;
        }
        .letter-box .gap {
            display: inline-block;
            min-width: 130px;
            padding: 0 10px;
            margin: 0 4px;
            background: #fef3c7;
            border-bottom: 3px solid #f59e0b;
            border-radius: 6px 6px 0 0;
            color: #b45309;
            font-weight: 900;
            text-align: center;
        }

        /* ---------- LEVEL 1: MATCHING ---------- */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .card {
            padding: 14px 12px;
            border: 2px solid var(--gray);
            border-bottom: 4px solid var(--gray);
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 15px;
            transition: 0.1s;
            background: white;
            color: var(--text);
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 70px;
            line-height: 1.3;
        }
        .card:hover:not(.matched) { border-color: #c4b5fd; transform: translateY(-2px); }
        .card.selected {
            border-color: var(--secondary);
            background: #ddf4ff;
            color: var(--secondary-dark);
        }
        .card.matched {
            visibility: hidden;
            opacity: 0;
        }
        .card.correct-match {
            background: #d7ffb8;
            border-color: var(--primary);
            color: var(--primary-dark);
            animation: pop 0.4s;
        }
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        /* ---------- LEVEL 2 & 3: CHOICE ---------- */
        .btn-grid { display: grid; gap: 10px; }
        .option-btn {
            padding: 15px;
            border: 2px solid var(--gray);
            border-bottom: 4px solid var(--gray);
            border-radius: 15px;
            background: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            font-family: inherit;
            transition: 0.1s;
            color: var(--text);
        }
        .option-btn:hover:not(:disabled) {
            border-color: #c4b5fd;
            transform: translateY(-2px);
        }
        .option-btn:disabled { cursor: default; }

        .correct {
            background: #d7ffb8 !important;
            border-color: var(--primary) !important;
            color: var(--primary-dark) !important;
        }
        .wrong {
            background: #ffdfe0 !important;
            border-color: var(--error) !important;
            color: var(--error) !important;
            animation: shake 0.4s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ---------- RESULT ---------- */
        .big-emoji { font-size: 80px; margin: 20px 0; animation: pop 1.5s infinite; }

        .result-stats {
            display: flex;
            gap: 14px;
            justify-content: center;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .result-stat {
            background: #f5f3ff;
            border: 2px solid #c4b5fd;
            border-radius: 14px;
            padding: 12px 20px;
            min-width: 100px;
        }
        .result-stat .val {
            font-size: 1.5em;
            font-weight: 900;
            color: var(--purple);
        }
        .result-stat .lbl {
            font-size: 0.72em;
            font-weight: 900;
            color: #7c3aed;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 2px;
        }

        .question-label {
            font-size: 14px;
            color: var(--purple);
            font-weight: 800;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @media (max-width: 520px) {
            #game-container { padding: 18px 14px; }
            h1 { font-size: 18px; }
            .card { font-size: 13px; padding: 10px 8px; min-height: 60px; }
            .option-btn { font-size: 15px; padding: 13px; }
            .letter-box { font-size: 13.5px; }
            .letter-box .gap { min-width: 100px; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="progress-bar"><div id="progress-fill"></div></div>
    <h1 id="theme-title">✉️ Lily's Letter — Quiz</h1>

    <!-- ============ LEVEL 1: MATCHING (same words) ============ -->
    <div id="level1" class="level-container active">
        <div class="question-label">Level 1 · English ↔ Russian</div>
        <p style="margin-bottom:14px; color:var(--purple); font-weight:700;">Соедини английское слово с переводом:</p>
        <div id="card-grid" class="grid"></div>
    </div>

    <!-- ============ LEVEL 2: gaps 1-5 ============ -->
    <div id="level2" class="level-container">
        <div class="question-label">Level 2 · Gaps 1–5</div>
        <div class="letter-box" id="l2-letter"></div>
        <div id="l2-options" class="btn-grid"></div>
    </div>

    <!-- ============ LEVEL 3: gaps 6-10 ============ -->
    <div id="level3" class="level-container">
        <div class="question-label">Level 3 · Gaps 6–10</div>
        <div class="letter-box" id="l3-letter"></div>
        <div id="l3-options" class="btn-grid"></div>
    </div>

    <!-- ============ RESULT ============ -->
    <div id="result" class="level-container">
        <div class="big-emoji" id="result-emoji">🏆</div>
        <h2 id="result-title" style="color: var(--purple);">Excellent!</h2>
        <div class="result-stats">
            <div class="result-stat"><div class="val" id="final-correct">0/10</div><div class="lbl">Correct</div></div>
            <div class="result-stat"><div class="val" id="final-xp">0</div><div class="lbl">XP</div></div>
            <div class="result-stat"><div class="val" id="final-pct">0%</div><div class="lbl">Accuracy</div></div>
        </div>
        <p id="result-msg" style="margin-bottom:20px; color: var(--purple); font-weight:700;"></p>
        <button class="option-btn" style="width:100%; background: var(--primary); color:white; border-bottom-color: var(--primary-dark);" onclick="location.reload()">🔄 Начать заново</button>
    </div>
</div>

<script>
/* ============================================================
   DATA
   ============================================================ */

// ---- LEVEL 1: English ↔ Russian — ТА ЖЕ лексика (6 пар) ----
const level1Data = [
    { pair: 1, text: 'letter' },
    { pair: 1, text: 'письмо' },

    { pair: 2, text: 'busy' },
    { pair: 2, text: 'занятой' },

    { pair: 3, text: 'lawyer' },
    { pair: 3, text: 'юрист' },

    { pair: 4, text: 'pet dog' },
    { pair: 4, text: 'собака-питомец' },

    { pair: 5, text: 'naughty' },
    { pair: 5, text: 'непослушный' },

    { pair: 6, text: 'to promise' },
    { pair: 6, text: 'обещать' }
];

// ---- LEVEL 2: gaps 1-5 — новое письмо от Lily ----
const questions2 = [
    {
        gap: 1,
        sentence: 'How are you? I <span class="gap">1</span> about you every day since I left.',
        options: ["have thought", "thought", "was thinking"],
        correct: 0,
        hint: 'since I left → Present Perfect'
    },
    {
        gap: 2,
        sentence: 'I <span class="gap">2</span> to the seaside with my family last month.',
        options: ["have gone", "went", "was going"],
        correct: 1,
        hint: 'last month → Past Simple'
    },
    {
        gap: 3,
        sentence: 'While we <span class="gap">3</span> along the beach, we <span class="gap">4</span> an old shipwreck.',
        options: ["walked", "were walking", "have walked"],
        correct: 1,
        hint: 'while + длительное → Past Continuous'
    },
    {
        gap: 4,
        sentence: 'While we were walking along the beach, we <span class="gap">4</span> an old shipwreck.',
        options: ["were finding", "find", "found"],
        correct: 2,
        hint: 'короткое завершённое → Past Simple'
    },
    {
        gap: 5,
        sentence: 'Right now I <span class="gap">5</span> my suitcase for the next trip.',
        options: ["am packing", "pack", "was packing"],
        correct: 0,
        hint: 'right now → Present Continuous'
    }
];

// ---- LEVEL 3: gaps 6-10 ----
const questions3 = [
    {
        gap: 6,
        sentence: 'I <span class="gap">6</span> this seashell at a small shop two days ago.',
        options: ["buy", "bought", "was buying"],
        correct: 1,
        hint: 'two days ago → Past Simple'
    },
    {
        gap: 7,
        sentence: 'My brother <span class="gap">7</span> a sandcastle when the tide <span class="gap">8</span> in.',
        options: ["built", "was building", "has built"],
        correct: 1,
        hint: 'длительное действие → Past Continuous'
    },
    {
        gap: 8,
        sentence: 'My brother was building a sandcastle when the tide <span class="gap">8</span> in.',
        options: ["was coming", "comes", "came"],
        correct: 2,
        hint: 'внезапное короткое действие → Past Simple'
    },
    {
        gap: 9,
        sentence: 'I <span class="gap">9</span> you a big box of souvenirs, I promise!',
        options: ["bring", "brought", "will bring"],
        correct: 2,
        hint: 'promise + future → Future Simple'
    },
    {
        gap: 10,
        sentence: 'We <span class="gap">10</span> here for ten days now, and I love it!',
        options: ["have been", "were", "are being"],
        correct: 0,
        hint: 'for ten days now → Present Perfect'
    }
];

/* ============================================================
   STATE
   ============================================================ */
let currentLevel = 1;
let selectedCards = [];
let l2Idx = 0;
let l3Idx = 0;
let score = 0;
let xp = 0;

const LETTER_HEADER = 'DEAR MAX,';

/* ============================================================
   LEVEL 1 — MATCHING (EN ↔ RU), 6 pairs
   ============================================================ */
function initL1() {
    const grid = document.getElementById('card-grid');
    grid.innerHTML = '';
    const shuffled = [...level1Data].sort(() => Math.random() - 0.5);
    shuffled.forEach(item => {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerText = item.text;
        div.onclick = () => handleCardClick(div, item);
        grid.appendChild(div);
    });
}

function handleCardClick(div, item) {
    if (div.classList.contains('matched') || selectedCards.some(c => c.div === div)) return;

    div.classList.add('selected');
    selectedCards.push({ div, item });

    if (selectedCards.length === 2) {
        const [a, b] = selectedCards;
        if (a.item.pair === b.item.pair && a.item.text !== b.item.text) {
            setTimeout(() => {
                a.div.classList.add('correct-match');
                b.div.classList.add('correct-match');
                xp += 10;
                setTimeout(() => {
                    a.div.classList.add('matched');
                    b.div.classList.add('matched');
                    a.div.classList.remove('correct-match');
                    b.div.classList.remove('correct-match');
                    selectedCards = [];
                    checkL1End();
                }, 500);
            }, 300);
        } else {
            setTimeout(() => {
                a.div.classList.add('wrong');
                b.div.classList.add('wrong');
                setTimeout(() => {
                    a.div.classList.remove('wrong', 'selected');
                    b.div.classList.remove('wrong', 'selected');
                    selectedCards = [];
                }, 500);
            }, 300);
        }
    }
}

function checkL1End() {
    if (document.querySelectorAll('.card.matched').length === level1Data.length) {
        score += 5;
        setTimeout(() => goToLevel(2), 500);
    }
}

/* ============================================================
   LEVEL 2 — gaps 1–5
   ============================================================ */
function initL2() {
    const q = questions2[l2Idx];
    const letter = document.getElementById('l2-letter');
    letter.innerHTML = `
        <div class="letter-title">✉️ ${LETTER_HEADER}</div>
        <p style="margin-bottom:8px;">${q.sentence}</p>
        <p style="font-size:13px; font-style:italic; color:#9a6a00; margin-top:8px;">💡 ${q.hint}</p>
    `;

    const optionsDiv = document.getElementById('l2-options');
    optionsDiv.innerHTML = '';

    const shuffled = [...q.options].sort(() => Math.random() - 0.5);
    shuffled.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        btn.onclick = () => {
            optionsDiv.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
            if (opt === q.options[q.correct]) {
                btn.classList.add('correct');
                score++;
                xp += 10;
                setTimeout(() => {
                    l2Idx++;
                    if (l2Idx < questions2.length) initL2(); else goToLevel(3);
                }, 800);
            } else {
                btn.classList.add('wrong');
                optionsDiv.querySelectorAll('.option-btn').forEach(b => {
                    if (b.innerText === q.options[q.correct]) b.classList.add('correct');
                });
                setTimeout(() => {
                    l2Idx++;
                    if (l2Idx < questions2.length) initL2(); else goToLevel(3);
                }, 1400);
            }
        };
        optionsDiv.appendChild(btn);
    });
}

/* ============================================================
   LEVEL 3 — gaps 6–10
   ============================================================ */
function initL3() {
    const q = questions3[l3Idx];
    const letter = document.getElementById('l3-letter');
    letter.innerHTML = `
        <div class="letter-title">✉️ MORE FROM MY HOLIDAY</div>
        <p style="margin-bottom:8px;">${q.sentence}</p>
        <p style="font-size:13px; font-style:italic; color:#9a6a00; margin-top:8px;">💡 ${q.hint}</p>
    `;

    const optionsDiv = document.getElementById('l3-options');
    optionsDiv.innerHTML = '';

    const shuffled = [...q.options].sort(() => Math.random() - 0.5);
    shuffled.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        btn.onclick = () => {
            optionsDiv.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
            if (opt === q.options[q.correct]) {
                btn.classList.add('correct');
                score++;
                xp += 10;
                setTimeout(() => {
                    l3Idx++;
                    if (l3Idx < questions3.length) initL3(); else goToLevel('result');
                }, 800);
            } else {
                btn.classList.add('wrong');
                optionsDiv.querySelectorAll('.option-btn').forEach(b => {
                    if (b.innerText === q.options[q.correct]) b.classList.add('correct');
                });
                setTimeout(() => {
                    l3Idx++;
                    if (l3Idx < questions3.length) initL3(); else goToLevel('result');
                }, 1400);
            }
        };
        optionsDiv.appendChild(btn);
    });
}

/* ============================================================
   LEVEL CONTROL
   ============================================================ */
function goToLevel(num) {
    document.querySelectorAll('.level-container').forEach(c => c.classList.remove('active'));

    if (num === 'result') {
        document.getElementById('result').classList.add('active');
        document.getElementById('progress-fill').style.width = '100%';
        showResult();
        return;
    }

    document.getElementById('level' + num).classList.add('active');
    document.getElementById('progress-fill').style.width = (num - 1) * 33 + '%';

    if (num === 2) initL2();
    if (num === 3) initL3();
}

/* ============================================================
   RESULT
   ============================================================ */
function showResult() {
    const total = 10;
    const pct = Math.round((score / total) * 100);

    let emoji = '💪', title = 'KEEP PRACTISING!', msg = 'Review the tenses and try again!';
    if (pct === 100) {
        emoji = '🏆'; title = 'PERFECT!'; msg = 'Amazing! You know all the tenses! 🎉';
    } else if (pct >= 70) {
        emoji = '🎉'; title = 'GREAT JOB!'; msg = 'Almost perfect! Just a couple of mistakes.';
    } else if (pct >= 50) {
        emoji = '👍'; title = 'GOOD EFFORT!'; msg = 'Not bad! Review the rules and try again.';
    }

    document.getElementById('result-emoji').textContent = emoji;
    document.getElementById('result-title').textContent = title;
    document.getElementById('result-msg').textContent = msg;
    document.getElementById('final-correct').textContent = `${score}/${total}`;
    document.getElementById('final-xp').textContent = xp;
    document.getElementById('final-pct').textContent = pct + '%';
}

/* ============================================================
   INIT
   ============================================================ */
initL1();
</script>

</body>
</html>
