<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Food & Grammar Garden Quiz 🍎</title>
    <style>
        :root {
            --spring-mint: #e8f5e9;
            --cherry-pink: #ffc1cc;
            --leaf-green: #4caf50;
            --sun-yellow: #fff59d;
            --sky-blue: #b3e5fc;
            --bark: #5d4037;
        }
        body {
            background: linear-gradient(135deg, var(--sky-blue), var(--spring-mint));
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--bark);
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }
        .garden-card {
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 35px;
            border: 10px solid var(--cherry-pink);
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: var(--cherry-pink);
            padding: 20px;
            text-align: center;
            color: white;
        }
        .progress-container {
            height: 12px;
            background: rgba(255,255,255,0.4);
            border-radius: 10px;
            margin-top: 10px;
        }
        #progress-bar {
            height: 100%;
            background: var(--leaf-green);
            width: 0%;
            border-radius: 10px;
            transition: 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .stats { display: flex; justify-content: space-between; font-weight: bold; }
        
        .quiz-area { padding: 25px; text-align: center; flex-grow: 1; }
        .emoji-vibe { font-size: 3.5em; margin-bottom: 10px; display: block; }
        
        .btn-grid { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        button {
            padding: 18px;
            border: 3px solid var(--cherry-pink);
            border-radius: 50px;
            background: var(--sun-yellow);
            font-size: 1.1em;
            font-weight: bold;
            color: var(--bark);
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background: var(--leaf-green);
            color: white;
            transform: scale(1.05);
            border-color: var(--leaf-green);
        }
        #victory { display: none; padding: 40px; text-align: center; }
    </style>
</head>
<body>

<div class="garden-card">
    <div class="header">
        <div class="stats">
            <span id="rank-text">🌱 Seedling</span>
            <span id="q-count">1 / 12</span>
        </div>
        <div class="progress-container">
            <div id="progress-bar"></div>
        </div>
    </div>

    <div id="quiz-content" class="quiz-area">
        <span id="current-emoji" class="emoji-vibe">🍎</span>
        <h2 id="question-text">Loading quiz...</h2>
        <div id="options-container" class="btn-grid"></div>
    </div>

    <div id="victory">
        <span class="emoji-vibe">🦋🏆👑</span>
        <h1>QUIZ MASTERED!</h1>
        <p>You completed all 12 grammar missions perfectly.</p>
        <button onclick="location.reload()" style="width:100%">Play Again 🍽️</button>
    </div>
</div>

<script>
    // Data based on the provided image (Exercises 3 and 5)
    const questions = [
        // Exercise 3
        { q: "There ___ ___ apples.", opt: ["are some", "is any", "are any"], ans: 0, em: "🍎🍏" },
        { q: "There ___ ___ coffee.", opt: ["is any", "is some", "are some"], ans: 1, em: "☕" },
        { q: "There ___ ___ biscuits.", opt: ["are some", "is any", "are any"], ans: 0, em: "🍪" },
        { q: "There ___ ___ milk.", opt: ["is some", "are any", "is any"], ans: 0, em: "🥛" },
        { q: "There ___ ___ eggs.", opt: ["are some", "is any", "are any"], ans: 0, em: "🥚" },
        { q: "There ___ ___ cucumbers.", opt: ["are some", "is any", "are any"], ans: 0, em: "🥒" },
        
        // Exercise 5
        { q: "How ___ apples ___ there?", opt: ["many / are", "much / is", "many / is"], ans: 0, em: "🍎❓" },
        { q: "How ___ tuna ___ there?", opt: ["much / is", "many / are", "much / are"], ans: 0, em: "🐟❓" },
        { q: "How ___ eggs ___ there?", opt: ["many / are", "much / is", "many / is"], ans: 0, em: "🥚❓" },
        { q: "How ___ flour ___ there?", opt: ["much / is", "many / are", "much / are"], ans: 0, em: "🌾❓" },
        { q: "How ___ water ___ there?", opt: ["much / is", "many / are", "much / are"], ans: 0, em: "💧❓" },
        { q: "How ___ chocolate ___ there?", opt: ["much / is", "many / are", "much / are"], ans: 0, em: "🍫❓" }
    ];

    let currentQ = 0;
    let quizList = [...questions];
    const ranks = ["🌱 Seedling", "🌿 Sprout", "🌷 Blossom", "🦋 Butterfly", "🌳 Gardener", "👑 Master"];

    function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
    }

    function initQuiz() {
        shuffle(quizList);
        renderQuestion();
    }

    function renderQuestion() {
        const data = quizList[currentQ];
        document.getElementById('current-emoji').innerText = data.em;
        document.getElementById('question-text').innerText = data.q;
        document.getElementById('q-count').innerText = (currentQ + 1) + " / " + quizList.length;
        
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        
        // Shuffle options for each question so the correct answer isn't always first
        let shuffledOpts = data.opt.map((text, i) => ({ text, isCorrect: i === data.ans }));
        shuffle(shuffledOpts);

        shuffledOpts.forEach((optObj) => {
            const btn = document.createElement('button');
            btn.innerText = optObj.text;
            btn.onclick = () => check(optObj.isCorrect);
            container.appendChild(btn);
        });

        // Update UI
        document.getElementById('progress-bar').style.width = (currentQ / quizList.length * 100) + "%";
        let rIdx = Math.floor(currentQ / (quizList.length / ranks.length));
        document.getElementById('rank-text').innerText = ranks[rIdx] || "👑 Master";
    }

    function check(isCorrect) {
        if (isCorrect) {
            currentQ++;
            if (currentQ < quizList.length) {
                renderQuestion();
            } else {
                document.getElementById('quiz-content').style.display = 'none';
                document.getElementById('progress-bar').style.width = "100%";
                document.getElementById('victory').style.display = 'block';
            }
        } else {
            alert("🐝 Oops! Check your grammar again!");
        }
    }

    initQuiz();
</script>

</body>
</html>
