<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starlight 2: Plurals & Numbers Mission</title>
    <style>
        :root { --primary: #2ecc71; --success: #2ecc71; --error: #ff4757; --bg: #f8f9fc; --blue: #3498db; }
        * { box-sizing: border-box; font-family: 'Comic Sans MS', sans-serif; }
        body { background: var(--bg); display: flex; justify-content: center; padding: 20px; }
        .quiz-container { background: white; width: 100%; max-width: 600px; padding: 30px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; border: 5px solid #fff; }
        
        .progress { color: #aaa; font-weight: bold; text-transform: uppercase; margin-bottom: 10px; }
        .visual-box { font-size: 5rem; margin: 15px 0; min-height: 120px; display: flex; justify-content: center; align-items: center; background: #e0f2fe; border-radius: 20px; }
        
        .builder { border: 4px dashed var(--blue); min-height: 85px; margin: 20px 0; display: flex; justify-content: center; align-items: center; gap: 8px; border-radius: 20px; background: #fff; padding: 10px; flex-wrap: wrap; }
        .word-tag { background: var(--blue); color: white; padding: 10px 20px; border-radius: 12px; font-weight: bold; font-size: 1.4rem; animation: pop 0.2s; box-shadow: 0 4px 0 #2980b9; }
        
        .pool { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 20px; border-top: 2px solid #eee; padding-top: 20px; }
        .action-btn { background: #fff; padding: 12px 18px; border: 2px solid #ddd; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 1.1rem; box-shadow: 0 4px 0 #ccc; transition: 0.1s; }
        .action-btn:active { transform: translateY(3px); box-shadow: none; }
        
        .feedback { margin-top: 15px; font-size: 1.8rem; font-weight: bold; min-height: 45px; }
        .next-btn { display: none; background: var(--success); color: white; padding: 15px 40px; border: none; border-radius: 50px; font-size: 1.4rem; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 0 #27ae60; }
        @keyframes pop { 0% { transform: scale(0.8); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="progress" class="progress">Mission: 1 / 12</div>
    <div id="visual" class="visual-box"></div>
    <h3 id="instr">Build the phrase:</h3>

    <div class="builder" id="builder"></div>
    <div class="pool" id="pool"></div>

    <div class="feedback" id="feedback"></div>
    <button id="next-btn" class="next-btn" onclick="nextQuestion()">NEXT ➔</button>
</div>

<script>
    let currentStep = 0;
    let userPath = [];

    // Полностью адаптированные данные с добавлением новых числовых комбинаций
    const rawData = [
        // ROUND 1: Плюрализация существительных
        { visual: "🪑🪑", instr: "Make 'chair' plural:", correct: ["chairs"], extras: ["chaires", "chair"], ans: "chairs" },
        { visual: "📐📐", instr: "Make 'ruler' plural:", correct: ["rulers"], extras: ["ruleres", "ruler"], ans: "rulers" },
        { visual: "✏️✏️", instr: "Make 'sharpener' plural:", correct: ["sharpeners"], extras: ["sharpeneres", "sharpener"], ans: "sharpeners" },
        { visual: "📓📓", instr: "Make 'notebook' plural:", correct: ["notebooks"], extras: ["notebookes", "notebook"], ans: "notebooks" },
        { visual: "📋📋", instr: "Make 'board' plural:", correct: ["boards"], extras: ["boardes", "board"], ans: "boards" },
        
        // ROUND 2: Счёт предметов (Упражнение 2 + ваши новые варианты)
        { visual: "🍎🍎🍎", instr: "Count the objects:", correct: ["three", "apples"], extras: ["four", "apple"], ans: "three apples" },
        { visual: "🧽🧽🧽🧽", instr: "Count the objects:", correct: ["four", "rubbers"], extras: ["five", "rubberes"], ans: "four rubbers" },
        { visual: "🪑🪑🪑🪑🪑", instr: "Count the objects:", correct: ["five", "chairs"], extras: ["six", "chares"], ans: "five chairs" },
        { visual: "📋📋", instr: "Count the objects:", correct: ["two", "boards"], extras: ["three", "boardes"], ans: "two boards" },
        { visual: "🪑🪑🪑🪑🪑🪑", instr: "Count the objects:", correct: ["six", "chairs"], extras: ["seven", "chair"], ans: "six chairs" },
        { visual: "📐📐📐📐📐", instr: "Count the objects:", correct: ["five", "rulers"], extras: ["four", "ruler"], ans: "five rulers" },
        { visual: "🍊🍊🍊🍊🍊🍊🍊🍊🍊", instr: "Count the objects:", correct: ["nine", "oranges"], extras: ["eight", "orange"], ans: "nine oranges" }
    ];

    function loadGame() {
        const q = rawData[currentStep];
        if(!q) { showWin(); return; }

        document.getElementById('progress').innerText = `Mission: ${currentStep + 1} / ${rawData.length}`;
        document.getElementById('visual').innerHTML = q.visual;
        document.getElementById('instr').innerText = q.instr;
        document.getElementById('feedback').innerText = "";
        document.getElementById('next-btn').style.display = "none";
        document.getElementById('builder').innerHTML = ""; 
        
        const pool = document.getElementById('pool');
        pool.innerHTML = "";
        userPath = [];

        let allOptions = [...q.correct, ...q.extras];
        allOptions.sort(() => Math.random() - 0.5).forEach(item => {
            const btn = document.createElement('button');
            btn.className = "action-btn";
            btn.innerText = item;
            btn.onclick = () => {
                if (btn.classList.contains('disabled')) return;
                
                userPath.push(item);
                btn.classList.add('disabled');
                btn.style.opacity = "0.4";
                
                const tag = document.createElement('span');
                tag.className = "word-tag";
                tag.innerText = item;
                document.getElementById('builder').appendChild(tag);
                
                if(userPath.length === q.correct.length) {
                    if(userPath.join(" ") === q.ans) {
                        document.getElementById('feedback').innerText = "EXCELLENT! 🌟";
                        document.getElementById('feedback').style.color = "var(--success)";
                        document.getElementById('next-btn').style.display = "inline-block";
                        const options = pool.querySelectorAll('.action-btn');
                        options.forEach(b => b.classList.add('disabled'));
                    } else {
                        document.getElementById('feedback').innerText = "TRY AGAIN! ❌";
                        document.getElementById('feedback').style.color = "var(--error)";
                        setTimeout(loadGame, 1000);
                    }
                }
            };
            pool.appendChild(btn);
        });
    }

    function nextQuestion() { currentStep++; loadGame(); }

    function showWin() {
        document.querySelector('.quiz-container').innerHTML = `
            <h1 style="font-size:4rem;">🏆</h1>
            <h2>NUMBER & PLURAL MASTER!</h2>
            <p>You completed all 12 vocabulary and counting missions successfully.</p>
            <button class="action-btn" onclick="location.reload()" style="background:var(--blue); color:white; border:none; padding:15px 30px; box-shadow: 0 4px 0 #2980b9;">PLAY AGAIN</button>
        `;
    }

    loadGame();
</script>
</body>
</html>
