<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super English Hero: Plural Quest 🦸‍♂️</title>
    <style>
        :root {
            --primary: #FFD93D;
            --secondary: #6BCB77;
            --accent: #FF6B6B;
            --blue: #4D96FF;
            --purple: #9B7BFF;
            --orange: #FF9F45;
            --text-soft: #FFF3C4;
            --text-mint: #C8F7DC;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Montserrat', 'Comic Sans MS', sans-serif;
            background: #1a1a2e;
            color: var(--text-soft);
            margin: 0;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 20px 14px;
            overflow-x: hidden;
        }
        .container {
            background: #16213e;
            border: 8px solid var(--blue);
            border-radius: 40px;
            padding: 30px 24px 26px;
            width: 100%; max-width: 520px;
            text-align: center;
            box-shadow: 0 20px 0 #0f3460;
            position: relative;
        }

        .level-badge {
            position: absolute; top: -20px; right: 20px;
            background: var(--accent);
            color: #1a1a2e;
            padding: 8px 18px; border-radius: 20px;
            font-weight: 900; font-size: 18px;
            box-shadow: 0 4px 0 #b33939;
        }
        .topic-badge {
            display: inline-block;
            background: var(--purple);
            color: #1a1a2e;
            padding: 6px 16px; border-radius: 20px;
            font-weight: 800; font-size: 12px;
            letter-spacing: 1.5px; text-transform: uppercase;
            margin-bottom: 14px;
            box-shadow: 0 3px 0 rgba(0,0,0,0.3);
        }
        .topic-badge.word    { background: var(--primary); color: #1a1a2e; }
        .topic-badge.match   { background: var(--purple); color: #1a1a2e; }
        .topic-badge.article { background: var(--orange); color: #1a1a2e; }
        .topic-badge.verb    { background: var(--blue); color: #1a1a2e; }

        h1 {
            font-size: 24px; margin: 0 0 8px 0;
            letter-spacing: 1px;
            color: var(--primary);
        }

        .emoji-card {
            font-size: 80px;
            background: #fff;
            border-radius: 28px;
            margin: 14px auto 18px;
            width: 150px; height: 150px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: inset 0 -8px 0 #ddd;
            animation: pop 0.35s ease-out;
        }
        @keyframes pop {
            0%   { transform: scale(0.85); }
            60%  { transform: scale(1.06); }
            100% { transform: scale(1); }
        }

        .phrase {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 22px;
            color: var(--primary);
            line-height: 1.4;
            word-wrap: break-word;
        }
        .phrase .blank {
            display: inline-block;
            min-width: 80px;
            border-bottom: 4px dashed var(--text-mint);
            padding: 0 10px;
            color: var(--text-mint);
            transition: 0.25s;
        }
        .phrase .blank.correct {
            color: var(--secondary);
            border-bottom-color: var(--secondary);
        }
        .phrase .blank.wrong {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        /* Adjusted Grid for 3 options */
        .btn-grid {
            display: grid;
            gap: 12px;
            grid-template-columns: repeat(3, 1fr); /* 3 columns on desktop */
        }

        .hero-btn {
            padding: 16px 8px;
            font-size: 17px;
            font-weight: 900;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: 0.1s;
            color: #1a1a2e;
            font-family: inherit;
            line-height: 1.25;
            word-wrap: break-word;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero-btn.c1 { background: var(--accent);   box-shadow: 0 7px 0 #b33939; color: #2b0a0a; }
        .hero-btn.c2 { background: var(--secondary);box-shadow: 0 7px 0 #3b7a44; color: #0f2e17; }
        .hero-btn.c3 { background: var(--blue);     box-shadow: 0 7px 0 #2b5bb3; color: #0b1d3d; }

        .hero-btn:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 3px 0 rgba(0,0,0,0.4);
        }
        .hero-btn:disabled {
            opacity: 0.35;
            cursor: default;
        }
        .hero-btn.reveal {
            background: var(--secondary) !important;
            box-shadow: 0 7px 0 #3b7a44 !important;
            color: #0f2e17 !important;
            opacity: 1 !important;
        }
        .hero-btn.wrongPick {
            background: #3a1a1a !important;
            box-shadow: 0 7px 0 #1a0505 !important;
            color: #ff9c9c !important;
            opacity: 1 !important;
        }

        #msg {
            height: 36px;
            margin-top: 20px;
            font-size: 20px;
            font-weight: 800;
            color: var(--text-soft);
            transition: color 0.2s;
        }
        .score-board {
            margin-top: 10px;
            font-size: 16px;
            color: var(--text-mint);
            opacity: 0.9;
            font-weight: 700;
        }
        .score-board #xp { color: var(--primary); }

        .shake { animation: shake 0.5s; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%      { transform: translateX(-10px); }
            40%      { transform: translateX(10px); }
            60%      { transform: translateX(-8px); }
            80%      { transform: translateX(8px); }
        }

        .win-screen { text-align: center; padding: 20px 0; }
        .win-screen .trophy { font-size: 90px; display: inline-block; animation: bob 2s infinite; }
        @keyframes bob {
            0%,100% { transform: translateY(0) rotate(-4deg); }
            50%     { transform: translateY(-10px) rotate(4deg); }
        }
        .win-screen h1 { color: var(--secondary); font-size: 28px; margin: 10px 0; }
        .win-screen .final-score { font-size: 44px; color: var(--primary); font-weight: 900; margin: 12px 0; }
        .win-screen p { font-size: 15px; color: var(--text-mint); margin-bottom: 20px; }

        .restart-btn {
            width: 100%;
            padding: 16px;
            background: var(--secondary);
            color: #0f2e17;
            border: none;
            border-radius: 16px;
            font-family: inherit;
            font-weight: 900;
            font-size: 17px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            cursor: pointer;
            box-shadow: 0 7px 0 #3b7a44;
            transition: 0.1s;
            margin-top: 15px;
        }
        .restart-btn:active {
            transform: translateY(4px);
            box-shadow: 0 3px 0 #3b7a44;
        }

        .confetti {
            position: fixed; top: -12px;
            width: 10px; height: 14px;
            pointer-events: none; z-index: 999;
            animation: fall linear forwards;
        }
        @keyframes fall {
            0%   { transform: translateY(-10px) rotate(0); opacity: 1; }
            100% { transform: translateY(105vh) rotate(720deg); opacity: 0.4; }
        }

        /* Mobile optimization for 3 columns */
        @media (max-width: 450px) {
            .container { padding: 26px 16px 22px; border-width: 6px; }
            .emoji-card { width: 120px; height: 120px; font-size: 60px; }
            .phrase { font-size: 19px; }
            
            /* Stack buttons vertically on small screens for readability */
            .btn-grid { grid-template-columns: 1fr; } 
            
            .hero-btn { font-size: 16px; padding: 14px 10px; }
            h1 { font-size: 20px; }
            .level-badge { font-size: 15px; padding: 6px 14px; }
        }
    </style>
</head>
<body>

<div class="container" id="mainBox">
    <div class="level-badge">LVL: <span id="lvl">1</span></div>
    <div id="content"></div>
</div>

<script>
    // ========== TRACKING DATA ==========
    const TEST_NAME = "Plurals & Demonstratives A1 (3 Options)";
    let userMistakes = [];
    let correctCount = 0;

    /* =========================================================
       DATA ARRAY (Exactly 3 options per question)
       ========================================================= */
    const DATA = [
        {
            type: 'word',
            topic: 'Plurals',
            emoji: '🍓🍓',
            display: 'two ___',
            options: ['strawberries', 'strawberrys', 'strawberryes'],
            correct: 'strawberries'
        },
        {
            type: 'article',
            topic: 'This / These',
            emoji: '-->📦',
            display: '-->___ box',
            options: ['this', 'these', 'those'],
            correct: 'this'
        },
        {
            type: 'article',
            topic: 'This / These',
            emoji: '-->📦📦',
            display: '___ boxes',
            options: ['this', 'these', 'that'],
            correct: 'these'
        },
        {
            type: 'word',
            topic: 'Plurals',
            emoji: '🍑🍑',
            display: 'four ___',
            options: ['peaches', 'peachs', 'peachies'],
            correct: 'peaches'
        },
        {
            type: 'article',
            topic: 'This / These',
            emoji: '👨',
            display: '-->___ man',
            options: ['this', 'these', 'those'],
            correct: 'this'
        },
        {
            type: 'article',
            topic: 'This / These',
            emoji: '👨👨',
            display: '-->___ men',
            options: ['this', 'these', 'those'],
            correct: 'these'
        },
        {
            type: 'word',
            topic: 'Plurals',
            emoji: '👗👗',
            display: 'two ___',
            options: ['dresses', 'dresss', 'dressies'],
            correct: 'dresses'
        },
        {
            type: 'article',
            topic: 'That / Those',
            emoji: '👩',
            display: '-------------->___ woman',
            options: ['that', 'those', 'these'],
            correct: 'that'
        },
        {
            type: 'article',
            topic: 'That / Those',
            emoji: '👩👩',
            display: '-------------->___ women',
            options: ['that', 'those', 'these'],
            correct: 'those'
        },
        {
            type: 'word',
            topic: 'Plurals',
            emoji: '🍒🍒',
            display: 'four ___',
            options: ['cherries', 'cherrys', 'cherryes'],
            correct: 'cherries'
        }
    ];

    /* =========================================================
       STATE
       ========================================================= */
    let xp = 0;
    let level = 1;
    let current;
    let currentQueue = [];
    let queueIndex = 0;
    let answered = false;

    const container = document.getElementById('mainBox');
    const content   = document.getElementById('content');

    /* =========================================================
       UTILITIES
       ========================================================= */
    function shuffle(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    function buildQueue() {
        currentQueue = shuffle(DATA);
        queueIndex = 0;
        correctCount = 0; // Reset score
        userMistakes = []; // Reset mistakes
    }

    /* =========================================================
       RENDER QUESTION
       ========================================================= */
    function spawn() {
        if (queueIndex >= currentQueue.length) return showWin();

        current = currentQueue[queueIndex];
        answered = false;

        const topicClass = current.type;
        
        // Shuffle the 3 options so the correct answer is randomized
        const shuffledOptions = shuffle([...current.options]);

        const btnsHtml = shuffledOptions.map((opt, i) => {
            const colorClass = `c${(i % 3) + 1}`; // Use c1, c2, c3 colors
            return `<button class="hero-btn ${colorClass}" data-idx="${i}" onclick="check(this)">${opt}</button>`;
        }).join('');

        content.innerHTML = `
            <div class="topic-badge ${topicClass}">${current.topic}</div>
            <h1>Plural Quest! 🦸</h1>
            <div class="emoji-card">${current.emoji}</div>
            <div class="phrase">
                ${current.display.replace(/___/, '<span class="blank" id="blankSlot">___</span>')}
            </div>
            <div class="btn-grid" id="btnGrid">
                ${btnsHtml}
            </div>
            <div id="msg">Choose the right answer! ⚡</div>
            <div class="score-board">Score: <span id="xp">${xp}</span> &nbsp;·&nbsp; Card ${queueIndex + 1}/${currentQueue.length}</div>
        `;
    }

    /* =========================================================
       CHECK ANSWER
       ========================================================= */
    function check(btn) {
        if (answered) return;

        const chosen = btn.innerText.trim();
        // Ensure case-insensitive comparison just in case
        const isCorrect = chosen.toLowerCase() === current.correct.toLowerCase();

        const msg = document.getElementById('msg');
        const blank = document.getElementById('blankSlot');
        const allBtns = document.querySelectorAll('.hero-btn');

        if (isCorrect) {
            answered = true;

            if (blank) {
                blank.textContent = current.correct;
                blank.classList.add('correct');
            }

            btn.classList.add('reveal');
            allBtns.forEach(b => b.disabled = true);

            msg.textContent = 'AMAZING! 🌟';
            msg.style.color = 'var(--secondary)';

            xp++;
            correctCount++;
            document.getElementById('xp').textContent = xp;

            if (xp >= 10) {
                level++;
                xp = 0;
                document.getElementById('lvl').textContent = level;
                msg.textContent = 'LEVEL UP! 🚀';
            }

            if (navigator.vibrate) navigator.vibrate(35);

            queueIndex++;
            setTimeout(spawn, 1200);

        } else {
            userMistakes.push(chosen); // Track the mistake
            btn.classList.add('wrongPick');
            btn.disabled = true;

            if (blank) {
                blank.textContent = chosen;
                blank.classList.add('wrong');
            }

            msg.textContent = 'Ouch! Try again! ⚡';
            msg.style.color = 'var(--accent)';

            container.classList.add('shake');
            setTimeout(() => container.classList.remove('shake'), 500);

            if (navigator.vibrate) navigator.vibrate([40, 40, 80]);

            setTimeout(() => {
                if (blank) {
                    blank.textContent = '___';
                    blank.classList.remove('wrong');
                }
            }, 700);
        }
    }

    /* =========================================================
       WIN SCREEN & SEND RESULTS
       ========================================================= */
    function showWin() {
        content.innerHTML = `
            <div class="win-screen">
                <div class="trophy">🏆</div>
                <h1>YOU ARE A HERO!</h1>
                <p>You completed all plural quests!</p>
                <div class="final-score">Score: ${correctCount}/${DATA.length}</div>
                <div id="send-status" style="font-size: 1rem; font-weight: bold; margin-bottom: 15px; min-height: 20px;"></div>
                <button class="restart-btn" onclick="restart()">Play Again 🚀</button>
            </div>
        `;
        launchConfetti();
        
        // Send to Google Sheets
        sendResultsToGoogle();
    }

    function sendResultsToGoogle() {
        const url = "https://script.google.com/macros/s/AKfycbxZDFh5oa4GAU6RMvWX_OIh0GeLTbolr7P-6cCtbCNT5qiTShRaCYlETAxewsLsnooK/exec";
        
        const formData = new URLSearchParams();
        formData.append("name", TEST_NAME);
        formData.append("score", correctCount);
        formData.append("total", DATA.length);
        formData.append("mistakes", userMistakes.join(', '));

        const statusEl = document.getElementById('send-status');
        statusEl.style.color = "#666";
        statusEl.innerText = "Sending results...";

        fetch(url, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded'
            },
            body: formData.toString()
        })
        .then(() => {
            statusEl.style.color = '#00b894'; // Green
            statusEl.innerText = "Results sent successfully! ✅";
        })
        .catch((error) => {
            console.error("Error sending results:", error);
            statusEl.style.color = '#d63031'; // Red
            statusEl.innerText = "Failed to send results ❌.";
        });
    }

    function restart() {
        xp = 0;
        level = 1;
        document.getElementById('lvl').textContent = level;
        buildQueue();
        spawn();
    }

    /* =========================================================
       CONFETTI
       ========================================================= */
    function launchConfetti() {
        const colors = ['#FFD93D', '#6BCB77', '#FF6B6B', '#4D96FF', '#9B7BFF', '#FF9F45'];
        for (let i = 0; i < 70; i++) {
            const c = document.createElement('div');
            c.className = 'confetti';
            c.style.left = Math.random() * 100 + 'vw';
            c.style.background = colors[Math.floor(Math.random() * colors.length)];
            c.style.animationDuration = (Math.random() * 2 + 2) + 's';
            c.style.animationDelay = (Math.random() * 0.8) + 's';
            c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
            document.body.appendChild(c);
            setTimeout(() => c.remove(), 5000);
        }
    }

    /* =========================================================
       START
       ========================================================= */
    buildQueue();
    spawn();
</script>

</body>
</html>
