<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Objects Challenge (Level A0+)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --green: #58cc02; 
            --dark-green: #46a302; 
            --blue: #1cb0f6; 
            --gray: #e5e5e5; 
            --text: #4b4b4b; 
            --red: #ff4b4b;
        }
        * { box-sizing: border-box; }
        body { 
            font-family: 'Nunito', sans-serif; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            background: #f0f7ff; 
            color: var(--text); 
            min-height: 100vh;
            padding-bottom: 120px;
        }
        header { 
            width: 100%; 
            max-width: 650px; 
            padding: 20px; 
            display: flex; 
            align-items: center; 
            gap: 14px;
            box-sizing: border-box; 
        }
        .progress-bar { 
            flex-grow: 1; 
            height: 16px; 
            background: var(--gray); 
            border-radius: 10px; 
            overflow: hidden;
        }
        #fill { 
            width: 0%; 
            height: 100%; 
            background: var(--green); 
            border-radius: 10px; 
            transition: width 0.4s; 
        }
        .heart { font-size: 22px; white-space: nowrap; }
        main { 
            width: 100%; 
            max-width: 600px; 
            padding: 25px; 
            text-align: center; 
            background: white; 
            border-radius: 20px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.05); 
            margin-top: 20px; 
            box-sizing: border-box;
        }
        h1 { 
            font-size: 24px; 
            font-weight: 800; 
            margin-bottom: 8px; 
            color: #1e293b; 
        }
        .subtitle {
            font-size: 15px;
            font-weight: 700;
            color: #94a3b8;
            margin-bottom: 10px;
        }
        .grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 12px; 
            margin-top: 20px; 
        }
        .card { 
            background: white; 
            border: 2px solid var(--gray); 
            border-bottom: 5px solid var(--gray); 
            border-radius: 16px; 
            padding: 16px; 
            font-size: 18px; 
            font-weight: 800; 
            cursor: pointer; 
            transition: all 0.1s; 
            font-family: inherit; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 8px;
            min-height: 70px; 
            text-align: center;
            color: #334155;
        }
        .card:hover:not(.correct):not(.wrong):not(.gone) {
            background: #f8fafc;
            border-color: #cbd5e1;
        }
        .card:active { 
            transform: translateY(2px); 
            border-bottom-width: 2px;
        }
        .card .pic { font-size: 26px; }
        .card.selected { 
            background: #e0f2fe; 
            border-color: #7dd3fc; 
            color: #0369a1; 
        }
        .card.correct { 
            background: #d7ffb8; 
            border-color: #58cc02; 
            color: #14532d; 
            border-bottom-width: 2px;
            cursor: default; 
            pointer-events: none; 
        }
        .card.gone {
            visibility: hidden;
            pointer-events: none;
        }
        .card.wrong {
            background: #fef2f2;
            border-color: var(--red);
            color: #b91c1c;
            animation: shake 0.4s;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }
        .big-pic {
            font-size: 90px;
            margin: 10px 0 4px;
            animation: pop 0.4s;
        }
        @keyframes pop { 0% { transform: scale(0.4); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }
        .near-far {
            font-size: 16px;
            font-weight: 800;
            color: var(--blue);
            background: #e0f2fe;
            display: inline-block;
            padding: 6px 16px;
            border-radius: 12px;
            margin-bottom: 6px;
        }
        #feedback { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            right: 0; 
            padding: 20px; 
            display: none; 
            flex-direction: column;
            align-items: center;
            gap: 8px;
            background: #d7ffb8; 
            border-top: 2px solid #58cc02; 
            z-index: 10; 
        }
        #feedback .msg { font-weight: 800; font-size: 18px; color: #14532d; }
        .next-btn { 
            background: var(--green); 
            color: white; 
            border: none; 
            border-bottom: 4px solid var(--dark-green); 
            padding: 12px 50px; 
            border-radius: 12px; 
            font-weight: 800; 
            cursor: pointer; 
            font-size: 16px; 
            font-family: inherit;
        }
        .next-btn:active { transform: translateY(2px); border-bottom-width: 2px; }
        .end-screen { font-size: 22px; font-weight: 800; line-height: 1.5; color: #14532d; }
        .end-screen .trophy { font-size: 60px; display: block; margin-bottom: 15px; animation: pop 0.5s; }
        .restart-btn {
            margin-top: 20px;
            background: var(--blue);
            color: white;
            border: none;
            border-bottom: 4px solid #1899d6;
            padding: 12px 40px;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            font-size: 16px;
            font-family: inherit;
        }
    </style>
</head>
<body>

<header>
    <div class="progress-bar"><div id="fill"></div></div>
    <span class="heart">❤️ <span id="lives">3</span></span>
</header>

<main>
    <h1 id="title">School Objects</h1>
    <p class="subtitle" id="subtitle">Level A0+</p>
    <div id="game-area"></div>
</main>

<div id="feedback">
    <span class="msg">✅ Great job!</span>
    <button class="next-btn" onclick="nextStep()">CONTINUE</button>
</div>

<script>
    // --- EASY DATABASE (A0+) — 14 questions in total ---
    // Level 1: 5 matching pairs (5 questions)
    // Level 2: 5 this / that questions
    // Level 3: 4 listen & choose questions
    // Total = 5 + 5 + 4 = 14

    // Level 1: Match the word with its picture (simple)
    const level1Data = [
        { id: 1, text: 'pens',    type: 'word' }, { id: 1, text: '🖊🖊️', type: 'pic' },
        { id: 2, text: 'books',   type: 'word' }, { id: 2, text: '📕📕', type: 'pic' },
        { id: 3, text: 'school bags',    type: 'word' }, { id: 3, text: '🎒🎒', type: 'pic' },
        { id: 4, text: 'chairs',  type: 'word' }, { id: 4, text: '🪑🪑', type: 'pic' },
        { id: 5, text: 'pencils', type: 'word' }, { id: 5, text: '✏️✏️️️', type: 'pic' }
    ];

    // Level 2: this / that only (near = this, far = that), singular only
    const questions2 = [
        { pic: '📕', label: '-->',  correct: "This is a book.",   options: ["This is a book.",   "That is a book."] },
        { pic: '🎒', label: '-------->',  correct: "That is a bag.",    options: ["This is a bag.",    "That is a bag."] },
        { pic: '🪑', label: '-->',  correct: "This is a chair.",  options: ["This is a chair.",  "That is a chair."] },
        { pic: '🖊️', label:'--------->',  correct: "That is a pen.",    options: ["This is a pen.",    "That is a pen."] },
        { pic: '✏️', label: '-->',  correct: "This is a pencil.", options: ["That is a pencil.", "This is a pencil."] }
    ];

    // Level 3: Listen and choose the picture
    const targetSentences3 = [
        { audio: "This is a book.",   correct: "--> 📕 ",   choices: ["--> 📕 ", "---------> 📕 ", "--> 🎒"] },
        { audio: "That is a chair.",  correct: "------>🪑",  choices: ["------>✏️", "------>🪑", "-->🪑"] },
        { audio: "This is a bag.",    correct: "--> 🎒",    choices: ["--------> 🎒", "--> 🎒", "--> 🪑"] },
        { audio: "That is a pencil.", correct: "--------> ✏", choices: ["--------> ✏", "--> ✏", "--> 📕"]}
    ];

    const PAIRS = level1Data.length / 2;
    const totalSteps = PAIRS + questions2.length + targetSentences3.length; // 5 + 5 + 4 = 14

    let currentLevel = 1;
    let subStep = 0;
    let lives = 3;
    let selectedCards = [];
    let matchedPairs = 0;

    function shuffle(arr) {
        return [...arr].sort(() => Math.random() - 0.5);
    }

    function updateProgress() {
        let done;
        if (currentLevel === 1) done = matchedPairs;
        else if (currentLevel === 2) done = PAIRS + subStep + 1;
        else done = PAIRS + questions2.length + subStep + 1;
        document.getElementById('fill').style.width = (done / totalSteps * 100) + '%';
    }

    function loseLife() {
        lives--;
        if (lives < 0) lives = 0;
        document.getElementById('lives').innerText = lives;
        if (lives === 0) gameOver();
    }

    function initLevel() {
        const area = document.getElementById('game-area');
        area.innerHTML = '';
        document.getElementById('feedback').style.display = 'none';
        selectedCards = [];

        if (currentLevel === 1) {
            matchedPairs = 0;
            document.getElementById('title').innerText = "Match the Word and Picture";
            document.getElementById('subtitle').innerText = "Question 1–5 · Tap a word, then tap the picture.";
            const grid = document.createElement('div');
            grid.className = 'grid';
            shuffle(level1Data).forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = item.type === 'pic' ? '<span class="pic">' + item.text + '</span>' : item.text;
                card.onclick = () => selectLevel1(item, card);
                grid.appendChild(card);
            });
            area.appendChild(grid);
            updateProgress();
        } 
        else if (currentLevel === 2) {
            document.getElementById('title').innerText = "This or That?";
            document.getElementById('subtitle').innerText = "Question " + (PAIRS + subStep + 1) + " of " + totalSteps;
            const q = questions2[subStep];

            const nearFar = document.createElement('div');
            nearFar.className = 'near-far';
            nearFar.innerText = q.label;
            area.appendChild(nearFar);

            const pic = document.createElement('div');
            pic.className = 'big-pic';
            pic.innerText = q.pic;
            area.appendChild(pic);

            const grid = document.createElement('div');
            grid.className = 'grid';
            shuffle(q.options).forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'card';
                btn.innerText = opt;
                btn.onclick = () => checkChoice(opt, q.correct, btn);
                grid.appendChild(btn);
            });
            area.appendChild(grid);
            updateProgress();
        }
        else if (currentLevel === 3) {
            document.getElementById('title').innerText = "Listen and Choose";
            document.getElementById('subtitle').innerText = "Question " + (PAIRS + questions2.length + subStep + 1) + " of " + totalSteps;
            const stage = targetSentences3[subStep];
            area.innerHTML = '<button class="card" onclick="speak(\'' + stage.audio + '\')" style="width:100%; margin-bottom:20px; background:#e0f2fe; color:#0369a1; border-color:#7dd3fc; font-size:20px; justify-content:center;">🔊 LISTEN</button>';

            const grid = document.createElement('div');
            grid.className = 'grid';
            shuffle(stage.choices).forEach(choice => {
                const btn = document.createElement('button');
                btn.className = 'card';
                const parts = choice.split(' ');
                btn.innerHTML = '<span class="pic">' + parts[0] + '</span> ' + parts.slice(1).join(' ');
                btn.onclick = () => checkChoice(choice, stage.correct, btn);
                grid.appendChild(btn);
            });
            area.appendChild(grid);
            speak(stage.audio);
            updateProgress();
        }
    }

    function selectLevel1(item, card) {
        if (card.classList.contains('correct') || card.classList.contains('gone') || selectedCards.some(c => c.card === card)) return;
        card.classList.add('selected');
        selectedCards.push({ item, card });

        if (selectedCards.length === 2) {
            const [a, b] = selectedCards;
            if (a.item.id === b.item.id && a.item.type !== b.item.type) {
                selectedCards.forEach(c => { c.card.classList.remove('selected'); c.card.classList.add('correct'); });
                selectedCards = [];
                matchedPairs++;
                updateProgress();
                if (matchedPairs === PAIRS) showNext();
            } else {
                loseLife();
                selectedCards.forEach(c => { c.card.classList.remove('selected'); c.card.classList.add('wrong'); });
                const toClear = selectedCards.slice();
                selectedCards = [];
                setTimeout(() => {
                    toClear.forEach(c => c.card.classList.remove('wrong'));
                }, 500);
            }
        }
    }

    function checkChoice(choice, correct, btn) {
        if (btn.classList.contains('correct') || btn.classList.contains('wrong')) return;
        if (choice === correct) {
            btn.classList.add('correct');
            document.querySelectorAll('#game-area .card').forEach(b => b.style.pointerEvents = 'none');
            showNext();
        } else {
            btn.classList.add('wrong');
            btn.style.pointerEvents = 'none';
            loseLife();
        }
    }

    function showNext() {
        document.getElementById('feedback').style.display = 'flex';
    }

    function nextStep() {
        if (currentLevel === 1) { currentLevel = 2; subStep = 0; }
        else if (currentLevel === 2) {
            subStep++;
            if (subStep >= questions2.length) { currentLevel = 3; subStep = 0; }
        }
        else if (currentLevel === 3) {
            subStep++;
            if (subStep >= targetSentences3.length) { finishGame(); return; }
        }
        initLevel();
    }

    function finishGame() {
        document.getElementById('title').innerText = "You did it!";
        document.getElementById('subtitle').innerText = "14 of 14 questions done!";
        document.getElementById('fill').style.width = '100%';
        document.getElementById('game-area').innerHTML =
            '<div class="end-screen"><span class="trophy">🏆</span>' +
            'Great job! You know this and that!<br>' +
            'Lives left: ' + (lives > 0 ? '❤️'.repeat(lives) : 'none') +
            '<br><button class="restart-btn" onclick="restart()">PLAY AGAIN</button></div>';
        document.getElementById('feedback').style.display = 'none';
    }

    function gameOver() {
        document.getElementById('title').innerText = "Try again!";
        document.getElementById('subtitle').innerText = "";
        document.getElementById('game-area').innerHTML =
            '<div class="end-screen"><span class="trophy">💪</span>' +
            'Good try! Let\'s play again.' +
            '<br><button class="restart-btn" onclick="restart()">TRY AGAIN</button></div>';
        document.getElementById('feedback').style.display = 'none';
    }

    function restart() {
        currentLevel = 1;
        subStep = 0;
        lives = 3;
        selectedCards = [];
        matchedPairs = 0;
        document.getElementById('lives').innerText = lives;
        document.getElementById('fill').style.width = '0%';
        initLevel();
    }

    function speak(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.8; // slow and clear for beginners
            window.speechSynthesis.speak(utterance);
        }
    }

    initLevel();
</script>

</body>
</html>
