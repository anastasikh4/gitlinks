<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survival English Quiz</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }
        .quiz-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            max-width: 450px;
            width: 100%;
            box-sizing: border-box;
        }
        h2 { color: #212529; margin-top: 0; font-size: 22px; }
        .input-box { margin: 20px 0; }
        .input-box label { display: block; margin-bottom: 8px; font-weight: 600; color: #495057; }
        .input-box input { width: 100%; padding: 12px; border: 1px solid #ced4da; border-radius: 6px; font-size: 16px; box-sizing: border-box; }
        .option-link {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            background-color: #f1f3f5;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            text-align: left;
            cursor: pointer;
            font-size: 16px;
            color: #343a40;
            transition: all 0.2s;
            box-sizing: border-box;
        }
        .option-link:hover { background-color: #e9ecef; border-color: #ced4da; }
        .action-btn {
            background-color: #198754;
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            margin-top: 15px;
        }
        .action-btn:hover { background-color: #157347; }
        .hidden { display: none; }
        .results-preview {
            background: #f1f3f5;
            padding: 15px;
            border-radius: 6px;
            font-family: monospace;
            white-space: pre-wrap;
            font-size: 14px;
            margin: 15px 0;
            border-left: 4px solid #198754;
        }
    </style>
</head>
<body>

<div class="quiz-card">
    <!-- ЭКРАН 1: Начало -->
    <div id="screen-start">
        <h2>Английский для поездок ✈️</h2>
        <p>Короткий ИИ-тест для проверки ключевых фраз перед путешествием в Китай.</p>
        <div class="input-box">
            <label for="student-name">Ваше имя:</label>
            <input type="text" id="student-name" placeholder="Введите имя и фамилию" required>
        </div>
        <button class="action-btn" onclick="startQuiz()">Начать тест</button>
    </div>

    <!-- ЭКРАН 2: Вопросы -->
    <div id="screen-quiz" class="hidden">
        <h3 id="question-title">Текст вопроса</h3>
        <div id="options-list"></div>
    </div>

    <!-- ЭКРАН 3: Финал -->
    <div id="screen-result" class="hidden">
        <h2>Тест завершен! 🎉</h2>
        <p>Ваш отчет по ответам сформирован автоматически. Нажмите на кнопку ниже, чтобы отправить его преподавателю на проверку.</p>
        
        <div id="results-log" class="results-preview"></div>
        
        <button class="action-btn" onclick="sendViaEmail()">📧 Отправить преподавателю на Email</button>
        <button class="action-btn" style="background-color: #0d6efd;" onclick="sendViaTelegram()">💬 Отправить в Telegram</button>
    </div>
</div>

<script>
    // ПОДСТАВЬТЕ СВОЙ EMAIL СЮДА ДЛЯ ПОЛУЧЕНИЯ ОТЧЕТОВ
    const TEACHER_EMAIL = "anastasiallen@ya.ru"; 

    // Набор вопросов ИИ по теме Travel English
    const quizData = [
        {
            q: "Вы заселяетесь в отель. Администратор спрашивает паспорт. Что вы ответите, передавая документ?",
            options: ["Yes, here you are.", "No, thank you.", "I want to check-in."],
            correct: 0
        },
        {
            q: "Как вежливо попросить счёт у официанта в ресторане?",
            options: ["Give me money list!", "Could I have the bill, please?", "How much for food?"],
            correct: 1
        },
        {
            q: "Какую стойку вы будете искать в аэропорту для сдачи багажа и получения билета?",
            options: ["Baggage Claim", "Information Desk", "Check-in counter"],
            correct: 2
        }
    ];

    let currentStep = 0;
    let nameOfStudent = "";
    const reportData = {}; 
    let finalPlainTextReport = "";

    function startQuiz() {
        const input = document.getElementById("student-name");
        if (!input.value.trim()) {
            alert("Пожалуйста, введите имя!");
            return;
        }
        nameOfStudent = input.value.trim();
        document.getElementById("screen-start").classList.add("hidden");
        document.getElementById("screen-quiz").classList.remove("hidden");
        renderStep();
    }

    function renderStep() {
        const currentData = quizData[currentStep];
        document.getElementById("question-title").innerText = `Вопрос ${currentStep + 1}: ${currentData.q}`;
        
        const list = document.getElementById("options-list");
        list.innerHTML = ""; 

        currentData.options.forEach((opt, idx) => {
            const btn = document.createElement("button");
            btn.className = "option-link";
            btn.innerText = opt;
            btn.onclick = () => saveStepSelection(idx, opt);
            list.appendChild(btn);
        });
    }

    function saveStepSelection(idx, text) {
        const currentData = quizData[currentStep];
        const success = idx === currentData.correct;
        
        reportData[`Вопрос ${currentStep + 1}`] = {
            "Вопрос": currentData.q,
            "Ответ студента": text,
            "Статус": success ? "✅ Правильно" : "❌ Неправильно"
        };

        currentStep++;

        if (currentStep < quizData.length) {
            renderStep();
        } else {
            showFinalScreen();
        }
    }

    function showFinalScreen() {
        document.getElementById("screen-quiz").classList.add("hidden");
        document.getElementById("screen-result").classList.remove("hidden");

        // Формируем красивый текстовый блок результатов
        finalPlainTextReport = `Студент: ${nameOfStudent}\n\n` + 
            Object.keys(reportData).map(key => {
                return `${key}\nQ: ${reportData[key]["Вопрос"]}\nA: ${reportData[key]["Ответ студента"]}\n[${reportData[key]["Статус"]}]`;
            }).join("\n\n");

        // Показываем превью ученику на экране
        document.getElementById("results-log").innerText = finalPlainTextReport;
    }

    // Способ 1: Отправка через встроенную почту
    function sendViaEmail() {
        const subject = encodeURIComponent(`Результаты квиза Travel English - ${nameOfStudent}`);
        const body = encodeURIComponent(finalPlainTextReport);
        
        // Открывает установленный почтовый клиент (Outlook, Mail.ru, Gmail и т.д.) с готовым текстом
        window.location.href = `mailto:${TEACHER_EMAIL}?subject=${subject}&body=${body}`;
    }

    // Способ 2: Быстрая отправка через Telegram-поделиться
    function sendViaTelegram() {
        const text = encodeURIComponent(`Привет! Я прошел вводный квиз.\n\n${finalPlainTextReport}`);
        
        // Открывает Телеграм, где ученик просто выбирает ваш чат и отправляет готовое сообщение в 1 клик
        window.open(`https://t.me{encodeURIComponent(window.location.href)}&text=${text}`);
    }
</script>

</body>
</html>
