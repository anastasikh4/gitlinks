<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>George's Skatepark Adventure - Present Tense Lab</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --ww-blue: #1d3557;
            --ww-pink: #ff006e;
            --correct: #58cc02;
            --wrong: #ff4b4b;
            --bg-gradient: linear-gradient(135deg, #4361ee 0%, #3a0ca3 100%);
        }

        body {
            font-family: 'Raleway', sans-serif;
            background: var(--bg-gradient);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #2b2d42;
        }

        #game-container {
            width: 90%;
            max-width: 700px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            padding: 30px;
            text-align: center;
        }

        .progress-bar {
            height: 12px;
            background: #e0e0e0;
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        #progress-fill {
            height: 100%;
            width: 10%;
            background: var(--ww-pink);
            transition: width 0.4s ease;
        }

        h1 {
            color: var(--ww-blue);
            font-size: 28px;
            margin-bottom: 20px;
            font-weight: 800;
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 30px;
            min-height: 70px;
            color: var(--ww-blue);
            line-height: 1.5;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .option {
            background: white;
            border: 3px solid #e0e0e0;
            border-bottom: 6px solid #e0e0e0;
            border-radius: 15px;
            padding: 18px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.1s;
            text-align: center;
        }

        .option:hover {
            border-color: #cbd5e1;
        }

        .correct {
            background-color: #eef9e8 !important;
            border-color: var(--correct) !important;
            border-bottom-color: var(--correct) !important;
            color: var(--correct) !important;
            animation: bounce 0.5s;
        }

        .wrong {
            background-color: #fff0f0 !important;
            border-color: var(--wrong) !important;
            border-bottom-color: var(--wrong) !important;
            color: var(--wrong) !important;
            animation: shake 0.4s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        #result-screen.hidden, #quiz-area.hidden { display: none; }
    </style>
</head>
<body>

    <div id="game-container">
        <div class="progress-bar"><div id="progress-fill"></div></div>
        
        <div id="quiz-area">
            <h1 id="q-title">Question 1/10</h1>
            <div class="question-text" id="q-text">Loading...</div>
            <div class="options-grid" id="options-container"></div>
        </div>

        <div id="result-screen" class="hidden">
            <h1 style="font-size: 40px;">MISSION COMPLETE!</h1>
            <p id="final-score" style="font-size: 24px; font-weight: bold; color: var(--ww-pink);"></p>
            <button onclick="location.reload()" style="background:var(--ww-pink); color:white; border:none; padding:15px 40px; border-radius:50px; font-weight: 800; cursor:pointer; font-size:1.5rem; box-shadow: 0 5px 0 #b90051;">RESTART</button>
        </div>
    </div>

    <script>
        // Вопросы адаптированы под времена Present Simple и Present Continuous на основе фото
        const questions = [
            // Раунд 1: Раскрытие скобок из текста (Упражнение 5)
            { q: "This is George. He often _______ (go) to the park.", a: ["go", "goes", "is going", "going"], correct: 1 },
            { q: "He usually _______ (hang out) with his friends, Peter and Jess.", a: ["hang out", "hangs out", "is hanging out", "hanging out"], correct: 1 },
            { q: "They usually _______ (ride) their bikes.", a: ["ride", "rides", "are riding", "riding"], correct: 0 },
            { q: "But today George _______ (not ride) his bike.", a: ["don't ride", "doesn't ride", "is not riding", "not riding"], correct: 2 },
            { q: "He _______ (skateboard) with Peter and Jess at a skatepark right now.", a: ["skateboard", "skateboards", "skateboarding", "is skateboarding"], correct: 3 },
            { q: "Let's talk to him. 'Hi, George! _______ (you / have) fun?'", a: ["Do you have", "Are you having", "Have you", "You are having"], correct: 1 },
            { q: "'Yes! I _______ (learn) some new jumps. It isn't easy!'", a: ["learn", "learns", "am learning", "learning"], correct: 2 },
            
            // Раунд 2: Ответы на вопросы (Упражнение 6)
            { q: "Question: Where do you usually hang out with your friends?<br>Answer: I usually _______ at the park.", a: ["hang out", "hangs out", "am hanging out", "hung out"], correct: 0 },
            { q: "Question: Where are you meeting Peter and Jess today?<br>Answer: Today I _______ them at a skatepark.", a: ["meet", "meets", "am meeting", "meeting"], correct: 2 },
            { q: "Question: Are you having fun?<br>Answer: Yes, I _______!", a: ["do", "have", "am having", "am"], correct: 2 }
        ];

        let currentQ = 0;
        let score = 0;

        function loadQuestion() {
            if (currentQ >= questions.length) {
                showResults();
                return;
            }

            const data = questions[currentQ];
            document.getElementById('q-title').innerText = `Task ${currentQ + 1}/${questions.length}`;
            document.getElementById('q-text').innerHTML = data.q;
            document.getElementById('progress-fill').style.width = ((currentQ + 1) / questions.length * 100) + "%";

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            // Перемешивание вариантов ответов для сохранения динамики
            const indexedOptions = data.a.map((opt, i) => ({ text: opt, originalIndex: i }));
            indexedOptions.sort(() => Math.random() - 0.5);

            indexedOptions.forEach((option) => {
                const div = document.createElement('div');
                div.className = 'option';
                div.innerText = option.text;
                div.onclick = () => checkAnswer(option.originalIndex, div);
                container.appendChild(div);
            });
        }

        function checkAnswer(index, element) {
            const allOptions = document.querySelectorAll('.option');
            allOptions.forEach(opt => opt.style.pointerEvents = 'none');

            if (index === questions[currentQ].correct) {
                element.classList.add('correct');
                score++;
            } else {
                element.classList.add('wrong');
                // Находим плашку с правильным ответом на экране и подсвечиваем её
                allOptions.forEach(opt => {
                    const matchedOption = questions[currentQ].a[questions[currentQ].correct];
                    if (opt.innerText === matchedOption) {
                        opt.classList.add('correct');
                    }
                });
            }

            setTimeout(() => {
                currentQ++;
                loadQuestion();
            }, 1400);
        }

        function showResults() {
            document.getElementById('quiz-area').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('final-score').innerText = `Your Score: ${score} / ${questions.length}`;
        }

        loadQuestion();
    </script>
</body>
</html>
