<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supermarket Vocabulary Quiz</title>
    <style>
        :root {
            --quiz-purple: #461a42;
            --quiz-light-purple: #8854d0;
            --quiz-green: #26de81;
            --quiz-red: #eb3b5a;
            --white: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--quiz-purple);
            color: var(--white);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }

        .quiz-container {
            background: var(--white);
            color: #333;
            width: 100%;
            max-width: 550px;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .progress-container {
            width: 65%;
            background: #eee;
            height: 12px;
            border-radius: 10px;
            overflow: hidden;
        }

        #progress-bar {
            height: 100%;
            width: 0%;
            background: var(--quiz-light-purple);
            transition: width 0.4s ease;
        }

        .category-tag {
            background: var(--quiz-light-purple);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .question-box h2 {
            font-size: 1.3rem;
            margin-bottom: 20px;
            line-height: 1.5;
            font-weight: 600;
        }

        .options-grid {
            display: grid;
            gap: 12px;
        }

        .option-btn {
            background: #f1f2f6;
            border: 2px solid #dfe4ea;
            padding: 15px;
            border-radius: 12px;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 600;
            font-family: inherit;
        }

        .option-btn:hover:not(:disabled) {
            background: #e1e2e6;
            border-color: #ced6e0;
        }

        .correct {
            background: var(--quiz-green) !important;
            color: white !important;
            border-color: #20bf6b !important;
        }

        .wrong {
            background: var(--quiz-red) !important;
            color: white !important;
            border-color: #cf304a !important;
        }

        #feedback {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
            min-height: 24px;
            font-size: 1.1rem;
        }

        .footer-btn {
            display: none;
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            border: none;
            border-radius: 12px;
            background: var(--quiz-light-purple);
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #6c44a3;
            font-family: inherit;
        }

        .footer-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #6c44a3;
        }

        .final-screen {
            text-align: center;
            padding: 40px 20px;
        }
    </style>
</head>
<body>

<div class="quiz-container" id="quiz-box">
    <div class="header">
        <div class="progress-container"><div id="progress-bar"></div></div>
        <div class="category-tag" id="category">Vocabulary</div>
    </div>

    <div id="content">
        <div class="question-box">
            <h2 id="question">Loading...</h2>
        </div>
        <div class="options-grid" id="options"></div>
    </div>

    <div id="feedback"></div>
    <button id="next-btn" class="footer-btn" onclick="handleNext()">NEXT QUESTION</button>
</div>

<script>
    const questions = [
        {
            cat: "Exam Spot",
            q: "You use it to carry your shopping home.",
            options: ["A card", "A cashier", "A shopping bag"],
            correct: 2
        },
        {
            cat: "Exam Spot",
            q: "This person takes your money and gives you change.",
            options: ["A cashier", "A shopping trolley", "A shopping list"],
            correct: 0
        },
        {
            cat: "Exam Spot",
            q: "You write this to remember the things you want to buy.",
            options: ["A price", "A shopping list", "A special offer"],
            correct: 1
        },
        {
            cat: "Exam Spot",
            q: "It's big, it's got four wheels and you push it around the supermarket.",
            options: ["A shopping basket", "A shopping bag", "A shopping trolley"],
            correct: 2
        },
        {
            cat: "Exam Spot",
            q: "You put things in this at the supermarket. You don't push it. You carry it, but you don't take it home.",
            options: ["A shopping basket", "A shopping trolley", "A cashier"],
            correct: 0
        },
        {
            cat: "Exam Spot",
            q: "When something is cheaper than it usually is.",
            options: ["A shopping list", "A card", "A special offer"],
            correct: 2
        },
        {
            cat: "Sequencing",
            q: "What is the FIRST thing you do when you go shopping?",
            options: ["Take a basket.", "Pay for the shopping in cash.", "Go home and put the shopping away."],
            correct: 0
        },
        {
            cat: "Sequencing",
            q: "What do you do right BEFORE you pay for the shopping in cash?",
            options: ["Carry the shopping to the car.", "Stand in a queue.", "Get your change and your receipt."],
            correct: 1
        }
    ];

    let currentQ = 0;
    let score = 0;

    function loadQuestion() {
        const q = questions[currentQ];
        document.getElementById('category').innerText = q.cat;
        document.getElementById('question').innerHTML = q.q;
        document.getElementById('progress-bar').style.width = (currentQ / questions.length) * 100 + "%";
        
        const optionsEl = document.getElementById('options');
        optionsEl.innerHTML = '';
        
        q.options.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(i, btn);
            optionsEl.appendChild(btn);
        });

        document.getElementById('feedback').innerText = '';
        document.getElementById('next-btn').style.display = 'none';
    }

    function checkAnswer(idx, btn) {
        const allBtns = document.querySelectorAll('.option-btn');
        allBtns.forEach(b => b.disabled = true);

        if(idx === questions[currentQ].correct) {
            btn.classList.add('correct');
            document.getElementById('feedback').innerHTML = "<span style='color:var(--quiz-green)'>Correct! +100 XP</span>";
            score++;
        } else {
            btn.classList.add('wrong');
            allBtns[questions[currentQ].correct].classList.add('correct');
            document.getElementById('feedback').innerHTML = "<span style='color:var(--quiz-red)'>Oops! Check the image.</span>";
        }
        document.getElementById('next-btn').style.display = 'block';
    }

    function handleNext() {
        currentQ++;
        if(currentQ < questions.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        document.getElementById('progress-bar').style.width = "100%";
        document.getElementById('quiz-box').innerHTML = `
            <div class="final-screen">
                <h1 style="font-size: 3rem;">🛒</h1>
                <h2>Quiz Complete!</h2>
                <p style="font-size: 1.2rem;">Your Score: <strong>${score} / ${questions.length}</strong></p>
                <button class="footer-btn" style="display:block" onclick="location.reload()">TRY AGAIN</button>
            </div>
        `;
    }

    loadQuestion();
</script>

</body>
</html>
