<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Things Trace Lab</title>
    <style>
        :root { 
            --bg: #fdfefe; 
            --accent: #7b1fa2; /* Purple theme matching textbook style */
            --btn-green: #2ecc71; 
            --betty-orange: #e67e22;
        }
        body { font-family: 'Comic Sans MS', 'Comic Neue', sans-serif; background: #f3e5f5; display: flex; justify-content: center; padding: 20px; margin: 0; }
        
        .card { background: white; width: 100%; max-width: 800px; padding: 30px; border-radius: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; border: 6px solid #ce93d8; }
        
        .progress { color: var(--accent); font-size: 1.5rem; font-weight: bold; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        .emoji-hint { font-size: 6rem; margin: 5px 0; filter: drop-shadow(0 4px 4px rgba(0,0,0,0.1)); }

        #canvas-box { position: relative; background: #fff; border: 4px dashed #ce93d8; border-radius: 30px; margin: 20px auto; width: 700px; height: 320px; touch-action: none; }
        canvas { position: absolute; top: 0; left: 0; z-index: 2; cursor: crosshair; }
        
        /* Adjusted text-transform to preserve original capitalization strings */
        .trace-text { position: absolute; width: 100%; top: 50%; transform: translateY(-50%); font-size: 70px; color: #f3e5f5; user-select: none; z-index: 1; letter-spacing: 2px; font-weight: bold; text-align: center; }
        
        #notebook { display: none; padding: 40px 20px; background: #fdf9e7; border: 4px solid #f1c40f; border-radius: 30px; margin: 20px 0; }
        
        .word-show { font-size: 6rem; font-weight: bold; color: #2d3436; margin-bottom: 15px; line-height: 1.1; }
        
        .instr-text { font-size: 1.8rem; color: #7b1fa2; font-weight: bold; margin-bottom: 10px; }

        .btn-row { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
        button { padding: 15px 45px; font-size: 1.5rem; font-weight: bold; border-radius: 30px; cursor: pointer; border: none; transition: 0.2s; font-family: inherit; }
        .btn-next { background: var(--btn-green); color: white; box-shadow: 0 6px 0 #27ae60; }
        .btn-next:active { transform: translateY(4px); box-shadow: none; }
        .btn-clear { background: #ff6b6b; color: white; box-shadow: 0 6px 0 #ee5253; }
        .btn-clear:active { transform: translateY(4px); box-shadow: none; }

        h1 { font-size: 3.5rem; color: #2ecc71; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="card">
    <div class="progress" id="info">Object 1 of 6</div>
    <div class="emoji-hint" id="emoji">🎒</div>
    <div class="instr-text" id="instr">Trace the word! ✍️</div>

    <div id="canvas-box">
        <div class="trace-text" id="trace-text">Lee's schoolbag</div>
        <canvas id="drawCanvas" width="700" height="320"></canvas>
    </div>

    <div id="notebook">
        <div class="word-show" id="big-word">Lee's schoolbag</div>
        <h2 style="color: #e67e22; margin:0; font-size: 2.2rem;">📓 Запиши в тетрадь!</h2>
    </div>

    <div class="btn-row">
        <button class="btn-clear" id="clear-btn" onclick="clearDraw()">Clear</button>
        <button class="btn-next" id="main-btn" onclick="goNext()">DONE ✨</button>
    </div>
</div>

<script>
    // Dataset modified to use proper capitalized Names
    const data = [
        { word: "Lee's schoolbag", emoji: "🎒" },
        { word: "Alvin's rulers", emoji: "📏" },
        { word: "Erlina's umbrella", emoji: "☂️" },
        { word: "Mona's pen", emoji: "✒️" },
        { word: "Emma's book", emoji: "📖" },
        { word: "Harry's pencil case", emoji: "👝" }
    ];

    let idx = 0;
    let isNotebook = false;
    const canvas = document.getElementById('drawCanvas');
    const ctx = canvas.getContext('2d');
    let drawing = false;

    ctx.lineWidth = 9;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#9c27b0'; 

    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.clientX || (e.touches && e.touches.clientX);
        const clientY = e.clientY || (e.touches && e.touches.clientY);
        return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function start(e) { drawing = true; ctx.beginPath(); const p = getPos(e); ctx.moveTo(p.x, p.y); }
    function move(e) { if (!drawing) return; e.preventDefault(); const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); }
    function stop() { drawing = false; }

    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    window.addEventListener('mouseup', stop);
    canvas.addEventListener('touchstart', start);
    canvas.addEventListener('touchmove', move);
    canvas.addEventListener('touchend', stop);

    function clearDraw() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

    function goNext() {
        if (!isNotebook) {
            document.getElementById('canvas-box').style.display = 'none';
            document.getElementById('notebook').style.display = 'block';
            document.getElementById('clear-btn').style.display = 'none';
            document.getElementById('instr').innerText = "Now write it on paper:";
            document.getElementById('big-word').innerText = data[idx].word;
            isNotebook = true;
        } else {
            idx++;
            if (idx < data.length) {
                isNotebook = false;
                document.getElementById('canvas-box').style.display = 'block';
                document.getElementById('notebook').style.display = 'none';
                document.getElementById('clear-btn').style.display = 'inline-block';
                document.getElementById('instr').innerText = "Trace the word! ✍️";
                document.getElementById('trace-text').innerText = data[idx].word;
                document.getElementById('emoji').innerText = data[idx].emoji;
                document.getElementById('info').innerText = `Object ${idx + 1} of ${data.length}`;
                clearDraw();
            } else {
                document.querySelector('.card').innerHTML = "<h1>🎖️ GREAT JOB!</h1><p style='font-size:1.8rem'>You finished tracing all the school objects!</p><button class='btn-next' onclick='location.reload()'>START AGAIN</button>";
            }
        }
    }
</script>

</body>
</html>
