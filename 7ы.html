<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survival English Quiz</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }
        .quiz-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            max-width: 450px;
            width: 100%;
            box-sizing: border-box;
        }
        h2 { color: #212529; margin-top: 0; font-size: 22px; }
        .input-box { margin: 20px 0; }
        .input-box label { display: block; margin-bottom: 8px; font-weight: 600; color: #495057; }
        .input-box input { width: 100%; padding: 12px; border: 1px solid #ced4da; border-radius: 6px; font-size: 16px; box-sizing: border-box; }
        .option-link {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            background-color: #f1f3f5;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            text-align: left;
            cursor: pointer;
            font-size: 16px;
            color: #343a40;
            transition: all 0.2s;
            box-sizing: border-box;
        }
        .option-link:hover { background-color: #e9ecef; border-color: #ced4da; }
        .action-btn {
            background-color: #0d6efd;
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
        }
        .action-btn:hover { background-color: #0b5ed7; }
        .hidden { display: none; }
        .alert-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            font-weight: 600;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="quiz-card">
    <!-- ЭКРАН 1: Накапливаем данные (Имя ученика) -->
    <div id="screen-start">
        <h2>Английский для поездок ✈️</h2>
        <p>Короткий ИИ-тест для проверки ключевых фраз перед путешествием.</p>
        <div class="input-box">
            <label for="student-name">Имя ученика:</label>
            <input type="text" id="student-name" placeholder="Введите имя" required>
        </div>
        <button class="action-btn" onclick="startQuiz()">Начать тест</button>
    </div>

    <!-- ЭКРАН 2: Динамические ИИ вопросы -->
    <div id="screen-quiz" class="hidden">
        <h3 id="question-title">Текст вопроса</h3>
        <div id="options-list"></div>
    </div>

    <!-- ЭКРАН 3: Финал + Индикатор автомата -->
    <div id="screen-result" class="hidden">
        <h2>Тест завершен! 🎉</h2>
        <p>Результаты обрабатываются и сохраняются.</p>
        <div id="status-info" class="alert-box" style="background-color: #fff3cd; color: #664d03;">⏳ Сохранение результатов преподавателю...</div>
    </div>
</div>

<script>
    // Твой личный рабочий токен формы Formcarry
    const FORMCARRY_ID = "dfFvRQ5Gzyi"; 

    // Базовый пул ИИ-вопросов по теме Travel English
    const quizData = [
        {
            q: "Вы хотите заказать номер на одну ночь. Какую фразу вы выберете?",
            options: ["I'd like to book a room for one night, please.", "Give me one bed room.", "I stay here tonight."],
            correct: 0
        },
        {
            q: "Вам принесли счет в ресторане, но вы хотите расплатиться картой. Что нужно спросить?",
            options: ["Do you take credit cards?", "Where is my card money?", "Can I give you plastic?"],
            correct: 0
        },
        {
            q: "Как вежливо спросить дорогу до отеля у прохожего?",
            options: ["Where is hotel? Tell me.", "Excuse me, could you tell me the way to the hotel?", "I look for my hotel now."],
            correct: 1
        }
    ];

    let currentStep = 0;
    let nameOfStudent = "";
    const reportData = {}; 

    function startQuiz() {
        const input = document.getElementById("student-name");
        if (!input.value.trim()) {
            alert("Пожалуйста, укажите имя!");
            return;
        }
        nameOfStudent = input.value.trim();
        document.getElementById("screen-start").classList.add("hidden");
        document.getElementById("screen-quiz").classList.remove("hidden");
        renderStep();
    }

    function renderStep() {
        const currentData = quizData[currentStep];
        document.getElementById("question-title").innerText = `Вопрос ${currentStep + 1}: ${currentData.q}`;
        
        const list = document.getElementById("options-list");
        list.innerHTML = ""; 

        currentData.options.forEach((opt, idx) => {
            const btn = document.createElement("button");
            btn.className = "option-link";
            btn.innerText = opt;
            btn.onclick = () => saveStepSelection(idx, opt);
            list.appendChild(btn);
        });
    }

    function saveStepSelection(idx, text) {
        const currentData = quizData[currentStep];
        const success = idx === currentData.correct;
        
        // Логируем каждый клик в красивый отчет
        reportData[`Вопрос ${currentStep + 1}`] = {
            "Вопрос": currentData.q,
            "Выбор ученика": text,
            "Результат": success ? "Правильно" : "Неправильно"
        };

        currentStep++;

        if (currentStep < quizData.length) {
            renderStep();
        } else {
            submitReport();
        }
    }

    function submitReport() {
        // Мгновенно переключаем интерфейс на экран финала
        document.getElementById("screen-quiz").classList.add("hidden");
        document.getElementById("screen-result").classList.remove("hidden");

        const statusLabel = document.getElementById("status-info");

        // Формируем плоскую красивую строку, чтобы в панели Formcarry отчет читался идеально
        const plainTextSummary = Object.keys(reportData).map(key => {
            return `${key}\nQ: ${reportData[key]["Вопрос"]}\nA: ${reportData[key]["Выбор ученика"]}\n[${reportData[key]["Результат"]}]`;
        }).join("\n\n");

        // Прямой AJAX-запрос автомата на сервера Formcarry
        fetch(`https://formcarry.com{FORMCARRY_ID}`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Accept": "application/json"
            },
            body: JSON.stringify({
                student_name: nameOfStudent,
                quiz_report: plainTextSummary
            })
        })
        .then(response => {
            if (response.ok) {
                // Если Formcarry принял данные — красим плашку в зеленый
                statusLabel.style.backgroundColor = "#d4edda";
                statusLabel.style.color = "#155724";
                statusLabel.innerText = "✅ Успешно! Результаты отправлены преподавателю.";
            } else {
                throw new Error("Formcarry Error");
            }
        })
        .catch(error => {
            console.error("Ошибка при отправке пакета:", error);
            statusLabel.style.backgroundColor = "#f8d7da";
            statusLabel.style.color = "#721c24";
            statusLabel.innerText = "❌ Ошибка при автоматической отправке.";
        });
    }
</script>

</body>
</html>
