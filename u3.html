<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Album: Clothes Mission</title>
    <style>
        :root {
            --pink: #ff6b9d;
            --purple: #9b59b6;
            --text-dark: #2c3e50;
            --yellow: #ffc93c;
            --green: #58cc02;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Comic Neue', 'Arial Rounded MT Bold', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 40%, #c2e9fb 100%);
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #game-frame {
            background: rgba(255, 255, 255, 0.95);
            width: 90%;
            max-width: 640px;
            padding: 26px;
            border-radius: 40px;
            text-align: center;
            border: 6px solid #fff;
            box-shadow: 0 15px 40px rgba(155, 89, 182, 0.25);
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 10px;
        }

        .level-badge {
            background: #f3e5ff;
            color: var(--purple);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 900;
            font-size: 14px;
        }
        .score-badge {
            background: linear-gradient(135deg, var(--pink), var(--purple));
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 900;
            font-size: 14px;
            box-shadow: 0 4px 0 rgba(155,89,182,0.3);
        }

        /* ═══════ HERO SCENE — big item preview ═══════ */
        .hero-scene {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            margin: 12px 0 22px;
            padding: 16px 12px;
            background: linear-gradient(180deg, #fef8ff 0%, #f3e9ff 100%);
            border-radius: 24px;
            border: 2px dashed #d5b8e8;
        }

        .hero-emoji {
            font-size: 4.5rem;
            line-height: 1;
            animation: bounce 2s infinite;
        }

        .hint-pair {
            display: flex;
            gap: 14px;
        }

        .hint-item {
            background: #fff;
            border: 2px solid #ffe27a;
            border-radius: 16px;
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            min-width: 78px;
            box-shadow: 0 3px 0 #f5d76e;
            transition: 0.3s;
        }
        .hint-item.revealed {
            border-color: var(--green);
            background: #f2ffe4;
            box-shadow: 0 3px 0 #47a302;
        }
        .hint-item .h-emoji {
            font-size: 2.2rem;
            line-height: 1;
        }
        .hint-item .h-label {
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #b88302;
            text-transform: uppercase;
        }
        .hint-item.revealed .h-label {
            color: var(--green);
        }

        /* ═══════ SENTENCE BOX ═══════ */
        .sentence-box {
            background: #fdf9ff;
            padding: 22px;
            border-radius: 25px;
            font-size: 1.25rem;
            margin-bottom: 22px;
            line-height: 2;
            border: 2px dashed #d5b8e8;
            color: var(--text-dark);
            font-weight: 700;
        }

        /* Inline emoji hint before each gap */
        .inline-emoji {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            background: #fff8db;
            border: 2px solid #ffe27a;
            border-radius: 12px;
            padding: 2px 10px;
            margin: 0 4px;
            vertical-align: middle;
            line-height: 1.2;
            transition: 0.3s;
        }
        .inline-emoji.revealed {
            background: #e9ffd6;
            border-color: var(--green);
        }

        .gap {
            display: inline-block;
            min-width: 95px;
            background: #fff3cd;
            border-bottom: 3px solid var(--yellow);
            padding: 3px 12px;
            border-radius: 10px;
            color: #e67e22;
            font-weight: 900;
            transition: 0.3s;
            text-align: center;
        }
        .gap.filled {
            background: #d7ffb1;
            border-bottom-color: var(--green);
            color: #4a9c00;
        }

        /* ═══════ OPTIONS ═══════ */
        .options {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }
        .option-btn {
            background: white;
            border: 2px solid #ddd;
            border-bottom-width: 4px;
            padding: 14px 22px;
            font-size: 1.1rem;
            font-weight: 900;
            border-radius: 16px;
            cursor: pointer;
            transition: 0.15s;
            color: var(--text-dark);
            font-family: inherit;
        }
        .option-btn:hover:not(:disabled) {
            background: #f6f0ff;
            border-color: var(--purple);
            transform: translateY(-2px);
        }
        .option-btn:active:not(:disabled) {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }
        .option-btn:disabled {
            cursor: default;
            opacity: 0.4;
        }
        .option-btn.correct {
            background: #d7ffb1 !important;
            border-color: var(--green) !important;
            color: #4a9c00 !important;
            opacity: 1 !important;
        }
        .option-btn.wrong {
            background: #ffdfe0 !important;
            border-color: #ff4b4b !important;
            color: #ea2b2b !important;
            opacity: 1 !important;
        }

        /* ═══════ WIN SCREEN ═══════ */
        #win-screen { display: none; }
        #win-screen h1 {
            font-size: 2rem;
            color: var(--purple);
            margin-bottom: 8px;
        }
        #win-screen p {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 20px;
        }
        #win-screen button {
            padding: 16px 36px;
            border-radius: 20px;
            border: none;
            border-bottom: 5px solid #6c3483;
            background: var(--purple);
            color: white;
            font-weight: 900;
            font-size: 1rem;
            font-family: inherit;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #win-screen button:active {
            transform: translateY(3px);
            border-bottom-width: 2px;
        }

        .final-stars {
            font-size: 2rem;
            letter-spacing: 6px;
            margin: 10px 0 20px;
        }

        @media (max-width: 480px) {
            .sentence-box { font-size: 1rem; padding: 14px; line-height: 1.9; }
            .hero-emoji { font-size: 3rem; }
            .hint-item { min-width: 64px; padding: 8px 10px; }
            .hint-item .h-emoji { font-size: 1.7rem; }
            .inline-emoji { font-size: 1.25rem; padding: 1px 8px; }
            .option-btn { padding: 12px 16px; font-size: 0.95rem; }
            .level-badge, .score-badge { font-size: 12px; padding: 6px 12px; }
            .gap { min-width: 80px; }
        }
    </style>
</head>
<body>

<div id="game-frame">
    <div id="play-screen">
        <div class="header">
            <div class="level-badge">Photo <span id="lvl-num">1</span>/6</div>
            <div class="score-badge">⭐ Stars: <span id="score">0</span></div>
        </div>

        <!-- HERO + HINT PREVIEW -->
        <div class="hero-scene">
            <div class="hero-emoji" id="hero">👨</div>
            <div class="hint-pair">
                <div class="hint-item" id="hint-1">
                    <span class="h-emoji" id="hint-1-emoji">❓</span>
                    <span class="h-label" id="hint-1-label">Item 1</span>
                </div>
                <div class="hint-item" id="hint-2">
                    <span class="h-emoji" id="hint-2-emoji">❓</span>
                    <span class="h-label" id="hint-2-label">Item 2</span>
                </div>
            </div>
        </div>

        <div class="sentence-box" id="sentence"></div>
        <div class="options" id="options"></div>
    </div>

    <div id="win-screen">
        <h1>📸 Album Complete!</h1>
        <p>You know all the family and clothes vocabulary!</p>
        <div class="final-stars" id="final-stars">⭐⭐⭐</div>
        <button onclick="resetGame()">Play Again 🔄</button>
    </div>
</div>

<script>
    /* ═══════════════════════════════════════════
       FAMILY ALBUM MISSIONS
       Each mission shows the family member emoji
       plus 2 large hint cards with clothing/item emojis.
       The same emojis are also shown inline in the
       sentence right before each gap.
       ═══════════════════════════════════════════ */
    const missions = [
        {
            hero: "👨",
            hint1Emoji: "👒", hint1Label: "wear on head",
            hint2Emoji: "😊", hint2Label: "nice look",
            text: "Who is this man in a fancy <span class='inline-emoji' id='ie1'>👒</span><span class='gap' id='g1'>___</span>? He is very <span class='inline-emoji' id='ie2'>😊</span><span class='gap' id='g2'>___</span>!",
            answers: ["hat", "handsome"],
            options: ["hat", "handsome", "dress", "pretty"]
        },
        {
            hero: "👩",
            hint1Emoji: "👩", hint1Label: "family",
            hint2Emoji: "👓", hint2Label: "on eyes",
            text: "This is my <span class='inline-emoji' id='ie1'>👩</span><span class='gap' id='g1'>___</span>. She is not wearing <span class='inline-emoji' id='ie2'>👓</span><span class='gap' id='g2'>___</span>.",
            answers: ["mother", "glasses"],
            options: ["mother", "glasses", "father", "shoes"]
        },
        {
            hero: "👧",
            hint1Emoji: "👧", hint1Label: "family",
            hint2Emoji: "👗", hint2Label: "wear",
            text: "Look at my <span class='inline-emoji' id='ie1'>👧</span><span class='gap' id='g1'>___</span>! She has got a red <span class='inline-emoji' id='ie2'>👗</span><span class='gap' id='g2'>___</span>.",
            answers: ["sister", "dress"],
            options: ["sister", "dress", "brother", "hat"]
        },
        {
            hero: "👦",
            hint1Emoji: "👖", hint1Label: "wear",
            hint2Emoji: "😎", hint2Label: "nice look",
            text: "My brother is wearing blue <span class='inline-emoji' id='ie1'>👖</span><span class='gap' id='g1'>___</span>. They are very <span class='inline-emoji' id='ie2'>😎</span><span class='gap' id='g2'>___</span>.",
            answers: ["jeans", "cool"],
            options: ["jeans", "cool", "skirt", "sad"]
        },
        {
            hero: "👵",
            hint1Emoji: "👵", hint1Label: "family",
            hint2Emoji: "🧥", hint2Label: "wear",
            text: "This is my <span class='inline-emoji' id='ie1'>👵</span><span class='gap' id='g1'>___</span>. She has got a warm <span class='inline-emoji' id='ie2'>🧥</span><span class='gap' id='g2'>___</span>.",
            answers: ["grandmother", "coat"],
            options: ["grandmother", "coat", "jumper", "aunt"]
        },
        {
            hero: "👟",
            hint1Emoji: "👟", hint1Label: "wear",
            hint2Emoji: "💖", hint2Label: "nice look",
            text: "These are my new <span class='inline-emoji' id='ie1'>👟</span><span class='gap' id='g1'>___</span>. They are very <span class='inline-emoji' id='ie2'>💖</span><span class='gap' id='g2'>___</span>!",
            answers: ["shoes", "pretty"],
            options: ["shoes", "pretty", "hat", "new"]
        }
    ];

    let currentLevel = 0;
    let currentStep = 0;
    let score = 0;

    function loadLevel() {
        const m = missions[currentLevel];

        // Header
        document.getElementById('lvl-num').innerText = currentLevel + 1;
        document.getElementById('hero').innerText = m.hero;

        // Hint cards
        document.getElementById('hint-1-emoji').innerText = m.hint1Emoji;
        document.getElementById('hint-1-label').innerText = m.hint1Label;
        document.getElementById('hint-1').classList.remove('revealed');

        document.getElementById('hint-2-emoji').innerText = m.hint2Emoji;
        document.getElementById('hint-2-label').innerText = m.hint2Label;
        document.getElementById('hint-2').classList.remove('revealed');

        // Sentence with inline emoji + gap
        document.getElementById('sentence').innerHTML = m.text;

        // Options — shuffle
        const optionsEl = document.getElementById('options');
        optionsEl.innerHTML = '';
        const shuffled = [...m.options].sort(() => Math.random() - 0.5);

        shuffled.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => handleChoice(btn, opt);
            optionsEl.appendChild(btn);
        });
    }

    function handleChoice(btn, val) {
        const m = missions[currentLevel];

        if (val === m.answers[currentStep]) {
            btn.classList.add('correct');
            btn.disabled = true;

            // Fill the gap
            const gap = document.getElementById(`g${currentStep + 1}`);
            gap.innerText = val;
            gap.classList.add('filled');

            // Reveal the inline emoji + hint card
            const inlineEmoji = document.getElementById(`ie${currentStep + 1}`);
            if (inlineEmoji) inlineEmoji.classList.add('revealed');

            const hintCard = document.getElementById(`hint-${currentStep + 1}`);
            if (hintCard) hintCard.classList.add('revealed');

            score += 10;
            document.getElementById('score').innerText = score;

            if (navigator.vibrate) navigator.vibrate(25);

            currentStep++;

            if (currentStep === 2) {
                setTimeout(() => {
                    currentLevel++;
                    currentStep = 0;
                    if (currentLevel < missions.length) loadLevel();
                    else showWin();
                }, 950);
            }
        } else {
            btn.classList.add('wrong');
            btn.disabled = true;
            if (navigator.vibrate) navigator.vibrate([40, 40, 80]);
            setTimeout(() => {
                btn.classList.remove('wrong');
                btn.disabled = false;
            }, 600);
        }
    }

    function showWin() {
        document.getElementById('play-screen').style.display = 'none';
        document.getElementById('win-screen').style.display = 'block';

        let stars = '⭐';
        if (score >= 100) stars = '⭐⭐⭐';
        else if (score >= 60) stars = '⭐⭐';
        document.getElementById('final-stars').innerText = stars;

        launchConfetti();
    }

    function resetGame() {
        location.reload();
    }

    function launchConfetti() {
        const colors = ['#ff6b9d', '#9b59b6', '#ffc93c', '#58cc02', '#1cb0f6'];
        for (let i = 0; i < 60; i++) {
            const c = document.createElement('div');
            c.style.position = 'fixed';
            c.style.top = '-12px';
            c.style.left = Math.random() * 100 + 'vw';
            c.style.width = '10px';
            c.style.height = '14px';
            c.style.background = colors[Math.floor(Math.random() * colors.length)];
            c.style.pointerEvents = 'none';
            c.style.zIndex = '999';
            c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
            c.style.animation = `fall ${Math.random() * 2 + 2}s linear ${Math.random() * 0.8}s forwards`;
            document.body.appendChild(c);
            setTimeout(() => c.remove(), 5000);
        }

        if (!document.getElementById('confetti-style')) {
            const style = document.createElement('style');
            style.id = 'confetti-style';
            style.textContent = `@keyframes fall {
                0%   { transform: translateY(-10px) rotate(0deg); opacity: 1; }
                100% { transform: translateY(105vh) rotate(720deg); opacity: 0.4; }
            }`;
            document.head.appendChild(style);
        }
    }

    loadLevel();
</script>

</body>
</html>
