<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Some / Any · Time · Fiona's Diary — Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    :root {
        --blue: #2563eb;
        --blue-dark: #1e40af;
        --purple: #7c3aed;
        --purple-dark: #5b21b6;
        --green: #16a34a;
        --green-dark: #14532d;
        --green-soft: #dcfce7;
        --red: #dc2626;
        --red-soft: #fee2e2;
        --yellow: #facc15;
        --pink: #ec4899;
        --orange: #f97316;
        --dark: #1f2937;
    }

    html, body { height: 100%; }

    body {
        font-family: 'Nunito', sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
        background-attachment: fixed;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 14px;
        min-height: 100vh;
        min-height: 100dvh;
        color: var(--dark);
        overflow-x: hidden;
    }

    .quiz-wrap {
        width: 100%;
        max-width: 720px;
        background: white;
        border-radius: 28px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.25), 0 8px 0 rgba(0,0,0,0.12);
        overflow: hidden;
        position: relative;
    }

    /* HEADER */
    .header {
        background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
        padding: 16px 20px 14px;
        border-bottom: 4px solid var(--yellow);
    }
    .header-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
    }
    .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: 'Fredoka', sans-serif;
        font-weight: 700;
        font-size: 1rem;
        color: var(--purple-dark);
        letter-spacing: 0.5px;
    }
    .brand .logo {
        background: var(--purple);
        color: white;
        width: 34px;
        height: 34px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1rem;
        font-weight: 800;
        box-shadow: 0 3px 0 var(--purple-dark);
        font-family: 'Fredoka', sans-serif;
    }
    .score {
        background: white;
        border: 3px solid var(--orange);
        border-radius: 40px;
        padding: 4px 16px;
        font-weight: 900;
        color: var(--orange);
        font-size: 1rem;
        box-shadow: 0 3px 0 #c2410c;
    }

    .progress-track {
        height: 14px;
        background: white;
        border-radius: 10px;
        overflow: hidden;
        border: 2px solid #f59e0b;
        position: relative;
    }
    .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #4ade80, #16a34a);
        width: 0%;
        border-radius: 8px;
        transition: width 0.4s cubic-bezier(.4,0,.2,1);
        position: relative;
    }
    .progress-fill::after {
        content: "";
        position: absolute;
        top: 2px; left: 4px; right: 4px; height: 4px;
        background: rgba(255,255,255,0.45);
        border-radius: 4px;
    }

    .counter {
        text-align: center;
        font-weight: 800;
        font-size: 0.82rem;
        color: #92400e;
        margin-top: 8px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
    }

    /* QUESTION CARD */
    .card {
        padding: 34px 26px 30px;
        min-height: 340px;
        display: flex;
        flex-direction: column;
        animation: slideIn 0.4s cubic-bezier(.4,0,.2,1);
    }
    @keyframes slideIn {
        from { opacity: 0; transform: translateX(30px); }
        to { opacity: 1; transform: translateX(0); }
    }

    .category {
        display: inline-block;
        align-self: flex-start;
        background: var(--blue);
        color: white;
        font-family: 'Fredoka', sans-serif;
        font-weight: 600;
        font-size: 0.8rem;
        letter-spacing: 1.2px;
        padding: 5px 14px;
        border-radius: 20px;
        margin-bottom: 24px;
        box-shadow: 0 3px 0 var(--blue-dark);
        text-transform: uppercase;
    }
    .category.any   { background: var(--pink);   box-shadow: 0 3px 0 #be185d; }
    .category.time  { background: var(--orange); box-shadow: 0 3px 0 #c2410c; }
    .category.diary { background: var(--purple); box-shadow: 0 3px 0 var(--purple-dark); }

    .question-text {
        font-family: 'Nunito', sans-serif;
        font-weight: 800;
        font-size: 1.4rem;
        line-height: 1.55;
        color: var(--dark);
        text-align: center;
        margin-bottom: 34px;
        flex-grow: 1;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .question-text .blank {
        display: inline-block;
        min-width: 100px;
        padding: 0 8px;
        border-bottom: 4px solid var(--blue);
        color: var(--blue);
        background: #dbeafe;
        border-radius: 6px 6px 0 0;
        font-weight: 900;
        vertical-align: middle;
        margin: 0 4px;
    }

    /* ANSWERS — 2 columns */
    .answers {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        margin-top: auto;
    }

    .ans-btn {
        background: white;
        border: 3px solid var(--blue);
        border-bottom-width: 6px;
        border-bottom-color: var(--blue-dark);
        border-radius: 18px;
        padding: 22px 14px;
        font-family: 'Nunito', sans-serif;
        font-weight: 800;
        font-size: 1.15rem;
        color: var(--blue-dark);
        cursor: pointer;
        transition: all 0.1s ease;
        text-align: center;
        line-height: 1.3;
        min-height: 80px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .ans-btn:hover:not(.disabled) {
        background: #eff6ff;
        transform: translateY(-2px);
        border-bottom-width: 8px;
    }
    .ans-btn:active:not(.disabled) {
        transform: translateY(3px);
        border-bottom-width: 3px;
    }
    .ans-btn.correct {
        background: var(--green-soft);
        border-color: var(--green);
        border-bottom-color: var(--green-dark);
        color: var(--green-dark);
        animation: pulseGreen 0.5s ease;
    }
    .ans-btn.wrong {
        background: var(--red-soft);
        border-color: var(--red);
        border-bottom-color: #991b1b;
        color: #991b1b;
        animation: shake 0.4s ease;
    }
    .ans-btn.disabled {
        cursor: default;
        pointer-events: none;
    }
    .ans-btn.faded { opacity: 0.35; }

    @keyframes pulseGreen {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.04); }
    }
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20% { transform: translateX(-8px); }
        40% { transform: translateX(8px); }
        60% { transform: translateX(-5px); }
        80% { transform: translateX(5px); }
    }

    /* FEEDBACK BANNER */
    .feedback {
        position: absolute;
        left: 0; right: 0;
        bottom: 0;
        padding: 16px 20px;
        transform: translateY(110%);
        transition: transform 0.3s cubic-bezier(.4,0,.2,1);
        font-weight: 800;
        font-size: 1rem;
        display: flex;
        align-items: center;
        gap: 12px;
        border-top: 4px solid;
    }
    .feedback.show { transform: translateY(0); }
    .feedback.good {
        background: var(--green-soft);
        border-color: var(--green);
        color: var(--green-dark);
    }
    .feedback.bad {
        background: var(--red-soft);
        border-color: var(--red);
        color: #991b1b;
    }
    .feedback .icon {
        width: 40px;
        height: 40px;
        background: white;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.3rem;
        flex-shrink: 0;
        box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        font-weight: 900;
    }
    .feedback .text { flex: 1; line-height: 1.35; }
    .feedback .text small {
        display: block;
        font-weight: 600;
        opacity: 0.75;
        font-size: 0.82rem;
        margin-top: 2px;
    }

    /* RESULT SCREEN */
    .result {
        display: none;
        padding: 40px 26px 34px;
        text-align: center;
        animation: slideIn 0.5s ease;
    }
    .result.show { display: block; }
    .result .trophy {
        font-family: 'Fredoka', sans-serif;
        font-weight: 700;
        font-size: 2.6rem;
        color: var(--purple-dark);
        margin-bottom: 8px;
        letter-spacing: 3px;
    }
    .result h2 {
        font-family: 'Fredoka', sans-serif;
        font-weight: 700;
        font-size: 2rem;
        color: var(--purple-dark);
        margin-bottom: 6px;
    }
    .result .sub {
        font-size: 1.05rem;
        color: #6b7280;
        font-weight: 700;
        margin-bottom: 24px;
    }
    .result-score {
        background: linear-gradient(135deg, #fef3c7, #fde68a);
        border: 4px solid var(--yellow);
        border-radius: 20px;
        padding: 20px;
        margin-bottom: 22px;
        box-shadow: 0 6px 0 #d97706;
    }
    .result-score .num {
        font-family: 'Fredoka', sans-serif;
        font-weight: 700;
        font-size: 3.5rem;
        color: var(--orange);
        line-height: 1;
    }
    .result-score .den {
        font-size: 1.4rem;
        color: #92400e;
        font-weight: 800;
    }
    .result-score .label {
        font-weight: 800;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: #78350f;
        font-size: 0.85rem;
        margin-top: 6px;
    }

    .result-bars {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-bottom: 22px;
    }
    .result-bars span {
        display: block;
        width: 44px;
        height: 12px;
        background: var(--yellow);
        border-radius: 6px;
        border: 2px solid #d97706;
    }
    .result-bars span.empty {
        background: white;
    }

    .restart-btn {
        background: var(--purple);
        color: white;
        border: none;
        border-bottom: 6px solid var(--purple-dark);
        border-radius: 16px;
        padding: 16px 42px;
        font-family: 'Nunito', sans-serif;
        font-weight: 900;
        font-size: 1.1rem;
        letter-spacing: 1px;
        cursor: pointer;
        transition: all 0.12s;
        text-transform: uppercase;
    }
    .restart-btn:hover {
        transform: translateY(-2px);
        border-bottom-width: 8px;
    }
    .restart-btn:active {
        transform: translateY(3px);
        border-bottom-width: 3px;
    }

    /* MOBILE */
    @media (max-width: 520px) {
        body { padding: 8px; }
        .quiz-wrap { border-radius: 20px; }
        .header { padding: 12px 14px 10px; }
        .brand { font-size: 0.82rem; }
        .brand .logo { width: 28px; height: 28px; font-size: 0.9rem; }
        .score { font-size: 0.9rem; padding: 3px 12px; }
        .card { padding: 24px 16px 20px; min-height: 300px; }
        .question-text { font-size: 1.1rem; }
        .ans-btn { font-size: 1rem; padding: 18px 10px; border-radius: 14px; min-height: 72px; }
        .answers { gap: 10px; }
        .result h2 { font-size: 1.6rem; }
        .result-score .num { font-size: 2.8rem; }
    }
</style>
</head>
<body>

<div class="quiz-wrap">

    <!-- HEADER -->
    <div class="header">
        <div class="header-row">
            <div class="brand">
                <div class="logo">Q</div>
                <span>SOME / ANY · TIME · DIARY</span>
            </div>
            <div class="score">SCORE: <span id="scoreVal">0</span></div>
        </div>
        <div class="progress-track">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="counter">
            Question <span id="qNow">1</span> / <span id="qTotal">13</span>
        </div>
    </div>

    <!-- QUESTION CARD -->
    <div class="card" id="card">
        <span class="category" id="category">SOME / ANY</span>
        <div class="question-text" id="question">Loading...</div>
        <div class="answers" id="answers"></div>
    </div>

    <!-- FEEDBACK -->
    <div class="feedback" id="feedback">
        <div class="icon" id="fbIcon">✓</div>
        <div class="text" id="fbText">Correct!</div>
    </div>

    <!-- RESULT SCREEN -->
    <div class="result" id="result">
        <div class="trophy" id="trophy">FINISH</div>
        <h2 id="resultTitle">WELL DONE!</h2>
        <div class="sub" id="resultSub">You finished the quiz!</div>

        <div class="result-bars" id="resultBars"></div>

        <div class="result-score">
            <span class="num" id="finalScore">0</span>
            <span class="den">/ <span id="totalQ">13</span></span>
            <div class="label">Your Score</div>
        </div>

        <button class="restart-btn" onclick="location.reload()">Play Again</button>
    </div>

</div>

<script>
/* ============================================================
   QUIZ DATA — 13 questions, 2 variants each
   Q1–Q5 : each focuses on ONE noun from the prompt list
   Q6–Q10: prepositions of time
   Q11–Q13: Fiona's diary comprehension
   ============================================================ */
const questions = [
    /* ---- SOME / ANY — one noun per question ---- */
    {
        cat: 'SOME / ANY · BREAD', catClass: '',
        q: 'I want to buy <span class="blank">?</span>. Is there a baker\'s near here?',
        options: ['some bread', 'any bread'],
        correct: 'some bread',
        explain: 'Positive sentence → some bread'
    },
    {
        cat: 'SOME / ANY · EGGS', catClass: '',
        q: 'Are there <span class="blank">?</span> in the fridge? Steve wants to make an omelette.',
        options: ['some eggs', 'any eggs'],
        correct: 'any eggs',
        explain: 'Question → any eggs'
    },
    {
        cat: 'SOME / ANY · PICTURES', catClass: '',
        q: 'Give me my camera. I want to take <span class="blank">?</span>.',
        options: ['some pictures', 'any pictures'],
        correct: 'some pictures',
        explain: 'Positive sentence → some pictures'
    },
    {
        cat: 'SOME / ANY · STUDENTS', catClass: '',
        q: 'It\'s Sunday. There aren\'t <span class="blank">?</span> at school.',
        options: ['some students', 'any students'],
        correct: 'any students',
        explain: 'Negative sentence → any students'
    },
    {
        cat: 'SOME / ANY · PEOPLE', catClass: '',
        q: 'There are <span class="blank">?</span> in the park today.',
        options: ['some people', 'any people'],
        correct: 'some people',
        explain: 'Positive sentence → some people'
    },

    /* ---- PREPOSITIONS OF TIME ---- */
    {
        cat: 'PREPOSITIONS OF TIME', catClass: 'time',
        q: 'Fiona has a Spanish class <span class="blank">?</span>.',
        options: ['on Monday', 'in Monday'],
        correct: 'on Monday',
        explain: 'on + day of the week'
    },
    {
        cat: 'PREPOSITIONS OF TIME', catClass: 'time',
        q: 'It\'s Danny\'s birthday <span class="blank">?</span>.',
        options: ['on October 22nd', 'in October 22nd'],
        correct: 'on October 22nd',
        explain: 'on + specific date'
    },
    {
        cat: 'PREPOSITIONS OF TIME', catClass: 'time',
        q: 'On Wednesday, she\'s meeting Pam <span class="blank">?</span>.',
        options: ['at 8 o\'clock', 'on 8 o\'clock'],
        correct: 'at 8 o\'clock',
        explain: 'at + clock time'
    },
    {
        cat: 'PREPOSITIONS OF TIME', catClass: 'time',
        q: 'On Friday, she has a Maths test <span class="blank">?</span>.',
        options: ['in the morning', 'on the morning'],
        correct: 'in the morning',
        explain: 'in + part of the day'
    },
    {
        cat: 'PREPOSITIONS OF TIME', catClass: 'time',
        q: 'Fiona is going to London <span class="blank">?</span>.',
        options: ['at the weekend', 'in the weekend'],
        correct: 'at the weekend',
        explain: 'at the weekend (British English)'
    },

    /* ---- FIONA'S DIARY — comprehension ---- */
    {
        cat: 'FIONA\'S DIARY', catClass: 'diary',
        q: 'When is Danny\'s birthday?',
        options: ['On October 22nd', 'On October 21st'],
        correct: 'On October 22nd',
        explain: 'Tuesday 22 — Danny\'s birthday'
    },
    {
        cat: 'FIONA\'S DIARY', catClass: 'diary',
        q: 'What time is Fiona meeting Pam?',
        options: ['At 8.00 pm', 'At 11.00 am'],
        correct: 'At 8.00 pm',
        explain: 'Wednesday 23 — Meeting Pam at 8.00 pm'
    },
    {
        cat: 'FIONA\'S DIARY', catClass: 'diary',
        q: 'Where is Fiona going at the weekend?',
        options: ['To London', 'To Paris'],
        correct: 'To London',
        explain: 'Saturday 26 + Sunday 27 — GOING TO LONDON'
    }
];

/* ============================================================
   STATE
   ============================================================ */
let current = 0;
let score = 0;
let answered = false;

const cardEl = document.getElementById('card');
const categoryEl = document.getElementById('category');
const questionEl = document.getElementById('question');
const answersEl = document.getElementById('answers');
const feedbackEl = document.getElementById('feedback');
const fbIcon = document.getElementById('fbIcon');
const fbText = document.getElementById('fbText');
const progressFill = document.getElementById('progressFill');
const qNow = document.getElementById('qNow');
const qTotal = document.getElementById('qTotal');
const scoreVal = document.getElementById('scoreVal');
const resultEl = document.getElementById('result');

qTotal.textContent = questions.length;
document.getElementById('totalQ').textContent = questions.length;

/* ============================================================
   SHUFFLE (Fisher–Yates)
   ============================================================ */
function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

/* ============================================================
   RENDER QUESTION
   ============================================================ */
function renderQuestion() {
    answered = false;
    const q = questions[current];

    progressFill.style.width = (current / questions.length) * 100 + '%';
    qNow.textContent = current + 1;

    categoryEl.textContent = q.cat;
    categoryEl.className = 'category ' + (q.catClass || '');

    questionEl.innerHTML = q.q;

    // shuffle the two options so the correct one can be 1st or 2nd
    answersEl.innerHTML = '';
    answersEl.className = 'answers';
    const shuffled = shuffle(q.options);

    shuffled.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'ans-btn';
        btn.textContent = opt;
        btn.onclick = () => checkAnswer(btn, opt, q);
        answersEl.appendChild(btn);
    });

    feedbackEl.className = 'feedback';
}

/* ============================================================
   CHECK ANSWER
   ============================================================ */
function checkAnswer(btn, choice, q) {
    if (answered) return;
    answered = true;

    const isCorrect = choice === q.correct;
    const allBtns = answersEl.querySelectorAll('.ans-btn');
    allBtns.forEach(b => b.classList.add('disabled'));

    if (isCorrect) {
        score++;
        scoreVal.textContent = score;
        btn.classList.add('correct');
        allBtns.forEach(b => { if (b !== btn) b.classList.add('faded'); });

        fbIcon.textContent = '✓';
        fbText.innerHTML = '<strong>Correct!</strong><small>' + q.explain + '</small>';
        feedbackEl.className = 'feedback good show';

        setTimeout(() => {
            feedbackEl.classList.remove('show');
            current++;
            if (current >= questions.length) {
                showResult();
            } else {
                setTimeout(renderQuestion, 300);
            }
        }, 1200);
    } else {
        btn.classList.add('wrong');
        allBtns.forEach(b => {
            if (b.textContent === q.correct) b.classList.add('correct');
            else if (b !== btn) b.classList.add('faded');
        });

        fbIcon.textContent = '✕';
        fbText.innerHTML = '<strong>Not quite…</strong><small>Correct: ' + q.correct + ' — ' + q.explain + '</small>';
        feedbackEl.className = 'feedback bad show';

        setTimeout(() => {
            feedbackEl.classList.remove('show');
            current++;
            if (current >= questions.length) {
                showResult();
            } else {
                setTimeout(renderQuestion, 300);
            }
        }, 1800);
    }
}

/* ============================================================
   RESULT SCREEN
   ============================================================ */
function showResult() {
    cardEl.style.display = 'none';
    feedbackEl.className = 'feedback';
    progressFill.style.width = '100%';
    resultEl.classList.add('show');

    const pct = Math.round((score / questions.length) * 100);
    document.getElementById('finalScore').textContent = score;

    let trophy, title, sub, bars;
    if (pct === 100) {
        trophy = 'PERFECT'; title = 'PERFECT!'; sub = 'You are a grammar star!';
        bars = 3;
    } else if (pct >= 80) {
        trophy = 'EXCELLENT'; title = 'EXCELLENT!'; sub = 'Almost perfect — well done!';
        bars = 3;
    } else if (pct >= 60) {
        trophy = 'GOOD'; title = 'GOOD JOB!'; sub = 'Keep practising!';
        bars = 2;
    } else if (pct >= 40) {
        trophy = 'KEEP GOING'; title = 'KEEP GOING!'; sub = 'Try the quiz again!';
        bars = 1;
    } else {
        trophy = 'TRY AGAIN'; title = 'TRY AGAIN!'; sub = 'Practise makes perfect!';
        bars = 1;
    }

    document.getElementById('trophy').textContent = trophy;
    document.getElementById('resultTitle').textContent = title;
    document.getElementById('resultSub').textContent = sub;

    const barsEl = document.getElementById('resultBars');
    barsEl.innerHTML = '';
    for (let i = 0; i < 3; i++) {
        const span = document.createElement('span');
        if (i >= bars) span.classList.add('empty');
        barsEl.appendChild(span);
    }
}

/* ============================================================
   START
   ============================================================ */
renderQuestion();
</script>

</body>
</html>
