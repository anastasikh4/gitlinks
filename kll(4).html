<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Science & Vocabulary: Missing Letter 🎉</title>
    <style>
        :root {
            --primary: #ffeb3b;
            --secondary: #ff5722;
            --bg: #e1f5fe;
            --card: #fff176;
            --success: #2ecc71;
            --error: #e74c3c;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Comic Sans MS', 'Arial Rounded MT Bold', sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 15px;
            text-align: center;
            font-size: 14px;
            color: #222;
        }
        h1 {
            font-size: 28px;
            color: #d81b60;
            margin: 8px 0;
            text-shadow: 2px 2px 0 white;
        }
        .game-container {
            background: white;
            padding: 20px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            max-width: 680px;
            margin: 0 auto;
            min-height: 520px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .level-info {
            font-size: 18px;
            font-weight: bold;
            color: #1976d2;
            margin: 12px 0 20px;
        }
        
        /* --- STAGE 0 MATCHING GAME --- */
        .match-board {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        .match-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .match-col-title {
            font-weight: bold;
            font-size: 16px;
            color: #555;
            margin-bottom: 5px;
        }
        .match-card {
            padding: 15px;
            background: #fff;
            border: 3px solid #ddd;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            transition: 0.2s;
            box-shadow: 0 4px 0 #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 60px;
            text-align: center;
        }
        .match-card:hover { background: #f0f0f0; transform: translateY(-2px); }
        .match-card.selected { border-color: #ffb300; background: #fff8e1; box-shadow: 0 4px 0 #ffb300; }
        .match-card.matched { background: #c8e6c9; border-color: #81c784; color: #2e7d32; box-shadow: 0 4px 0 #81c784; pointer-events: none; opacity: 0.6; }
        .match-card.wrong-match { animation: shake 0.4s; background: #ffcdd2; border-color: #e57373; }

        /* --- STAGE 1-3 MISSING LETTER UI --- */
        .russian-hint {
            font-size: 20px;
            color: #555;
            font-style: italic;
            margin-bottom: 15px;
            background: #f0f4c3;
            display: inline-block;
            padding: 5px 15px;
            border-radius: 10px;
        }
        .english-display {
            font-size: 32px;
            font-weight: bold;
            color: #1976d2;
            letter-spacing: 2px;
            margin-bottom: 30px;
            line-height: 1.4;
        }
        .missing-char {
            color: #d81b60;
            border-bottom: 4px dashed #d81b60;
            padding: 0 5px;
        }

        .word-pool {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 15px;
        }
        .letter-btn {
            background: #fff;
            padding: 15px 25px;
            border: 3px solid #ddd;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            font-size: 24px;
            color: #1976d2;
            transition: 0.2s;
            box-shadow: 0 5px 0 #ccc;
            font-family: inherit;
            min-width: 60px;
        }
        .letter-btn:hover { background: #f0f0f0; transform: translateY(-2px); }
        .letter-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #ccc; }
        .letter-btn:disabled { opacity: 0.4; pointer-events: none; }
        
        .letter-btn.correct { background: #c8e6c9; border-color: #81c784; color: #2e7d32; box-shadow: 0 5px 0 #81c784; }
        .letter-btn.wrong { background: #ffcdd2; border-color: #e57373; color: #c62828; box-shadow: 0 5px 0 #e57373; animation: shake 0.4s; }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        .feedback { margin-top: 25px; font-weight: bold; min-height: 30px; font-size: 1.3rem; }
        .correct-text { color: var(--success); }
        .wrong-text { color: var(--error); }
        
        /* Final Screen */
        .final-screen {
            display: none;
            text-align: center;
        }
        .final-screen h2 { color: #1976d2; font-size: 32px; }
        
        .status-msg {
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 15px;
            min-height: 20px;
        }

        /* Utilities */
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="game-container">
    <h1>Science & Vocabulary Lab 🧪</h1>
    <div id="level-indicator" class="level-info">Stage 0 — Warm-up Match 🧠</div>

    <!-- STAGE 0: MATCHING -->
    <div id="stage0-ui">
        <div class="match-board">
            <div class="match-col" id="match-left">
                <div class="match-col-title">🇬🇧 English</div>
            </div>
            <div class="match-col" id="match-right">
                <div class="match-col-title">🇷🇺 Russian</div>
            </div>
        </div>
        <div class="feedback" id="feedback-0"></div>
    </div>

    <!-- STAGE 1-3: MISSING LETTER -->
    <div id="game-ui" class="hidden">
        <div class="russian-hint" id="russian-hint">Loading...</div>
        <div class="english-display" id="english-display">Loading...</div>
        <div class="word-pool" id="options-pool"></div>
        <div class="feedback" id="feedback"></div>
    </div>

    <!-- FINAL SCREEN -->
    <div id="final-screen" class="final-screen">
        <h2>Mission Accomplished! 👑</h2>
        <p style="font-size: 1.2rem; margin: 10px 0;">You've masterfully finished all assessment modules.</p>
        <p id="final-score" style="font-size: 1.5rem; font-weight: bold; color: #d81b60;">Final Score: 0 / 17</p>
        
        <!-- Status Message for Google Sheets Sync -->
        <div id="send-status" class="status-msg"></div>
    </div>
</div>

<script>
    // ========== TRACKING DATA ==========
    const TEST_NAME = "Science & Vocab: Match + Missing Letter";
    let userMistakes = [];
    let totalScore = 0;
    const totalQuestions = 17; // 5 (Stage 0) + 2 (Stage 1) + 5 (Stage 2) + 5 (Stage 3)

    // ========== DATA SETS ==========
    // Stage 0: Matching English to Russian
    const stage0Data = [
        { id: 1, left: "Natural Science", right: "Естественные науки" },
        { id: 2, left: "Social Science", right: "Социальные науки" },
        { id: 3, left: "Biology", right: "Биология" },
        { id: 4, left: "Economics", right: "Экономика" },
        { id: 5, left: "Engineering", right: "Инженерия" }
    ];

    // Stage 1: Categories (Missing Letter)
    const stage1Data = [
        { ru: "Естественные науки", en: "N_tural Science", missing: "a", options: ["a", "e", "i", "o"] },
        { ru: "Социальные науки", en: "S_cial Science", missing: "o", options: ["o", "u", "a", "e"] }
    ];

    // Stage 2: Vocabulary (Missing Letter)
    const stage2Data = [
        { ru: "поднимать", en: "l_ft", missing: "i", options: ["i", "e", "a", "o"] },
        { ru: "захватывать", en: "capt_re", missing: "u", options: ["u", "a", "e", "o"] },
        { ru: "эксперименты", en: "experimen_s", missing: "t", options: ["t", "d", "s", "c"] },
        { ru: "представил", en: "presen_ed", missing: "t", options: ["t", "d", "s", "k"] },
        { ru: "целые и невредимые", en: "safe and s_und", missing: "o", options: ["o", "a", "u", "e"] }
    ];

    // Stage 3: Phrases in Context (Missing Letter)
    const stage3Data = [
        { ru: "пришли к выводу", en: "came to the concl_sion", missing: "u", options: ["u", "a", "e", "o"] },
        { ru: "поднять это", en: "l_ft this up", missing: "i", options: ["i", "a", "e", "o"] },
        { ru: "захватить момент", en: "capt_re the moment", missing: "u", options: ["u", "a", "e", "o"] },
        { ru: "представила выводы", en: "presen_ed her findings", missing: "t", options: ["t", "d", "s", "c"] },
        { ru: "вернулись невредимыми", en: "returned safe and s_und", missing: "o", options: ["o", "a", "u", "e"] }
    ];

    let currentStage = 0;
    let currentIndex = 0;
    let currentData = [];
    let isAnswered = false;

    // Stage 0 specific vars
    let selectedLeftCard = null;
    let selectedRightCard = null;
    let matchesFoundStage0 = 0;

    // ========== GAME LOGIC ==========
    function initGame() {
        currentStage = 0;
        currentIndex = 0;
        totalScore = 0;
        userMistakes = [];
        
        document.getElementById('stage0-ui').classList.remove('hidden');
        document.getElementById('game-ui').classList.add('hidden');
        document.getElementById('final-screen').style.display = 'none';
        
        const statusEl = document.getElementById('send-status');
        if(statusEl) statusEl.innerText = "";

        startStage0();
    }

    // --- STAGE 0 LOGIC (MATCHING) ---
    function startStage0() {
        document.getElementById('level-indicator').innerText = "Stage 0 — Warm-up Match 🧠";
        document.getElementById('feedback-0').innerText = "";
        
        const leftCol = document.getElementById('match-left');
        const rightCol = document.getElementById('match-right');
        
        // Keep the headers, remove only cards
        leftCol.innerHTML = '<div class="match-col-title">🇬🇧 English</div>';
        rightCol.innerHTML = '<div class="match-col-title">🇷🇺 Russian</div>';
        
        matchesFoundStage0 = 0;
        selectedLeftCard = null;
        selectedRightCard = null;

        // Render Left Cards (in original order)
        stage0Data.forEach(item => {
            const card = document.createElement('div');
            card.className = 'match-card';
            card.innerText = item.left;
            card.dataset.id = item.id;
            card.onclick = () => handleMatchClick(card, 'left');
            leftCol.appendChild(card);
        });

        // Render Right Cards (shuffled)
        const shuffledRight = [...stage0Data].sort(() => Math.random() - 0.5);
        shuffledRight.forEach(item => {
            const card = document.createElement('div');
            card.className = 'match-card';
            card.innerText = item.right;
            card.dataset.id = item.id;
            card.onclick = () => handleMatchClick(card, 'right');
            rightCol.appendChild(card);
        });
    }

    function handleMatchClick(card, side) {
        if (card.classList.contains('matched')) return;

        if (side === 'left') {
            if (selectedLeftCard) selectedLeftCard.classList.remove('selected');
            selectedLeftCard = card;
        } else {
            if (selectedRightCard) selectedRightCard.classList.remove('selected');
            selectedRightCard = card;
        }
        
        card.classList.add('selected');

        if (selectedLeftCard && selectedRightCard) {
            checkMatch();
        }
    }

    function checkMatch() {
        const leftId = selectedLeftCard.dataset.id;
        const rightId = selectedRightCard.dataset.id;
        const feedback = document.getElementById('feedback-0');

        if (leftId === rightId) {
            // Match
            totalScore++;
            matchesFoundStage0++;
            
            selectedLeftCard.classList.remove('selected');
            selectedRightCard.classList.remove('selected');
            selectedLeftCard.classList.add('matched');
            selectedRightCard.classList.add('matched');
            
            feedback.innerHTML = "<span class='correct-text'>Match found! ✅</span>";
            
            selectedLeftCard = null;
            selectedRightCard = null;

            if (matchesFoundStage0 === stage0Data.length) {
                setTimeout(startStage1, 1000);
            }
        } else {
            // No match
            userMistakes.push(selectedLeftCard.innerText + " -> " + selectedRightCard.innerText);
            feedback.innerHTML = "<span class='wrong-text'>Try again! ❌</span>";
            
            const l = selectedLeftCard;
            const r = selectedRightCard;
            l.classList.add('wrong-match');
            r.classList.add('wrong-match');
            
            setTimeout(() => {
                l.classList.remove('wrong-match', 'selected');
                r.classList.remove('wrong-match', 'selected');
                selectedLeftCard = null;
                selectedRightCard = null;
                feedback.innerText = "";
            }, 800);
        }
    }

    // --- STAGE 1-3 LOGIC (MISSING LETTER) ---
    function startStage1() {
        document.getElementById('stage0-ui').classList.add('hidden');
        document.getElementById('game-ui').classList.remove('hidden');
        
        document.getElementById('level-indicator').innerText = "Stage 1 — Categories 🧬";
        currentData = stage1Data;
        currentIndex = 0;
        loadQuestion();
    }

    function startStage2() {
        document.getElementById('level-indicator').innerText = "Stage 2 — Vocabulary 📚";
        currentData = stage2Data;
        currentIndex = 0;
        loadQuestion();
    }

    function startStage3() {
        document.getElementById('level-indicator').innerText = "Stage 3 — Context 📝";
        currentData = stage3Data;
        currentIndex = 0;
        loadQuestion();
    }

    function loadQuestion() {
        isAnswered = false;
        const data = currentData[currentIndex];
        
        document.getElementById('russian-hint').innerText = data.ru;
        
        const formattedEn = data.en.replace("_", `<span class="missing-char">_</span>`);
        document.getElementById('english-display').innerHTML = formattedEn;
        document.getElementById('feedback').innerText = "";

        const pool = document.getElementById('options-pool');
        pool.innerHTML = "";
        
        const shuffledOptions = [...data.options].sort(() => Math.random() - 0.5);
        
        shuffledOptions.forEach(letter => {
            const btn = document.createElement('button');
            btn.className = 'letter-btn';
            btn.innerText = letter;
            btn.onclick = () => checkAnswer(letter, btn, data.missing);
            pool.appendChild(btn);
        });
    }

    function checkAnswer(selectedLetter, btn, correctLetter) {
        if (isAnswered) return;
        isAnswered = true;

        const poolBtns = document.querySelectorAll('.letter-btn');
        poolBtns.forEach(b => b.disabled = true);

        if (selectedLetter === correctLetter) {
            btn.classList.add('correct');
            document.getElementById('feedback').innerHTML = "<span class='correct-text'>Correct! 🎉</span>";
            totalScore++;
        } else {
            btn.classList.add('wrong');
            userMistakes.push(selectedLetter);
            document.getElementById('feedback').innerHTML = `<span class='wrong-text'>Oops! The correct letter was '${correctLetter}'. ❌</span>`;
            
            poolBtns.forEach(b => {
                if (b.innerText === correctLetter) {
                    b.classList.add('correct');
                }
            });
        }

        setTimeout(() => {
            currentIndex++;
            if (currentIndex < currentData.length) {
                loadQuestion();
            } else {
                nextStage();
            }
        }, 1500);
    }

    function nextStage() {
        currentStage++;
        if (currentStage === 2) {
            startStage2();
        } else if (currentStage === 3) {
            startStage3();
        } else {
            showGlobalGameOver();
        }
    }

    function showGlobalGameOver() {
        document.getElementById('stage0-ui').classList.add('hidden');
        document.getElementById('game-ui').classList.add('hidden');
        document.getElementById('final-screen').style.display = 'block';
        document.getElementById('final-score').innerText = `Final Score: ${totalScore} / ${totalQuestions}`;
        
        sendResultsToGoogle();
    }

    // ========== GOOGLE SHEETS SENDING FUNCTION ==========
    function sendResultsToGoogle() {
        const url = "https://script.google.com/macros/s/AKfycbxZDFh5oa4GAU6RMvWX_OIh0GeLTbolr7P-6cCtbCNT5qiTShRaCYlETAxewsLsnooK/exec";
        
        const formData = new URLSearchParams();
        formData.append("name", TEST_NAME);
        formData.append("score", totalScore);
        formData.append("total", totalQuestions);
        formData.append("mistakes", userMistakes.join(', '));

        const statusEl = document.getElementById('send-status');
        statusEl.style.color = "#555";
        statusEl.innerText = "Sending telemetry data...";

        fetch(url, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded'
            },
            body: formData.toString()
        })
        .then(() => {
            statusEl.style.color = '#2ecc71'; // Green
            statusEl.innerText = "Results sent successfully! ✅";
        })
        .catch((error) => {
            console.error("Error sending results:", error);
            statusEl.style.color = '#e74c3c'; // Red
            statusEl.innerText = "Failed to send results ❌.";
        });
    }

    // Auto-boot setup
    window.onload = initGame;
</script>

</body>
</html>
