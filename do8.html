<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phonics Sounds: /ɒ/, /æ/, /ə/</title>
    <style>
        :root { --primary: #4a90e2; --secondary: #a29bfe; --success: #2ecc71; --error: #e74c3c; --round-bg: #fffbe6; }
        * { box-sizing: border-box; font-family: 'Comic Sans MS', cursive, sans-serif; }
        body { background: #fdfbfb; display: flex; justify-content: center; padding: 20px; margin: 0; min-height: 100vh; align-items: center; }
        
        .quiz-container { 
            background: white; 
            width: 100%; 
            max-width: 700px; 
            padding: 30px; 
            border-radius: 30px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            text-align: center; 
            border: 4px solid #eee; 
        }
        
        .round-indicator { 
            background: var(--round-bg); 
            padding: 10px; 
            border-radius: 15px; 
            margin-bottom: 15px; 
            font-weight: bold; 
            color: #d4a017; 
            border: 1px solid #ffe58f; 
            font-size: 1.1rem;
        }
        
        .word-display { 
            font-size: 2.5rem; 
            color: var(--primary); 
            margin: 10px 0; 
            font-weight: bold; 
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }
        .word-emoji { font-size: 3.5rem; }
        
        .speaker-btn { 
            background: #eee; 
            border: none; 
            border-radius: 50%; 
            width: 50px; 
            height: 50px; 
            cursor: pointer; 
            font-size: 1.3rem; 
            margin-bottom: 20px; 
            box-shadow: 0 3px 0 #ccc;
            transition: 0.1s;
        }
        .speaker-btn:active { transform: translateY(3px); box-shadow: none; }

        .options-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 15px; 
            margin-top: 20px; 
        }
        
        .sound-opt { 
            background: white; 
            padding: 20px 10px; 
            border: 3px solid #ddd; 
            border-radius: 20px; 
            cursor: pointer; 
            position: relative; 
            transition: 0.2s; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 120px; /* Adjusted slightly */
        }
        .sound-opt:hover { border-color: var(--primary); background: #f7fbff; }
        
        .listen-hint { 
            position: absolute; 
            top: 8px; 
            right: 8px; 
            background: #f0f0f0; 
            border: none; 
            border-radius: 50%; 
            width: 32px; 
            height: 32px; 
            cursor: pointer; 
            font-size: 0.9rem; 
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sound-symbol { 
            font-size: 2.5rem; 
            font-weight: bold;
            color: #333; 
            pointer-events: none; 
        }

        .feedback { 
            margin-top: 25px; 
            min-height: 40px; 
            font-size: 1.4rem; 
            font-weight: bold; 
        }
        
        .correct-anim { background: var(--success) !important; color: white !important; border-color: #27ae60 !important; }
        .correct-anim .sound-symbol { color: white !important; }
        .wrong-anim { background: var(--error) !important; color: white !important; border-color: #c0392b !important; }
        .wrong-anim .sound-symbol { color: white !important; }
        
        @media (max-width: 500px) {
            .options-grid { grid-template-columns: 1fr; gap: 10px; }
            .sound-opt { min-height: 70px; }
            .word-display { font-size: 2rem; }
            .word-emoji { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

<div class="quiz-container" id="quiz-box">
    <div id="round-text" class="round-indicator">Choose the correct sound</div>
    
    <div class="word-display" id="word-display">
        <span class="word-emoji" id="word-emoji">🐶</span>
        <span id="word-text">dog</span>
    </div>
    
    <button class="speaker-btn" onclick="speakWord(document.getElementById('word-text').innerText)">🔊</button>
    
    <div class="options-grid" id="options-container">
        <!-- Options will be generated by JS -->
    </div>

    <div class="feedback" id="feedback"></div>
</div>

<script>
    let currentIndex = 0;
    const sounds = ["/ɒ/", "/æ/", "/ə/"]; // The three target sounds
    
    // Data based on the objects in the picture
    const quizData = [
        { word: "dog", emoji: "🐶", sound: "/ɒ/", example: "box" },
        { word: "doll", emoji: "🪆", sound: "/ɒ/", example: "dog" },
        { word: "box", emoji: "📦", sound: "/ɒ/", example: "doll" },
        { word: "cat", emoji: "🐱", sound: "/æ/", example: "sharpener" },
        { word: "sharpener", emoji: "🪓", sound: "/æ/", example: "cat" },
        { word: "teacher", emoji: "👩‍🏫", sound: "/ə/", example: "ruler" },
        { word: "ruler", emoji: "📏", sound: "/ə/", example: "teacher" },
        { word: "rubber", emoji: "🧽", sound: "/ə/", example: "orange" },
        { word: "orange", emoji: "🍊", sound: "/ə/", example: "rubber" }
    ];

    function loadWord() {
        if (currentIndex >= quizData.length) {
            showFinal();
            return;
        }

        const data = quizData[currentIndex];
        
        // Update UI with word and emoji
        document.getElementById('word-emoji').innerText = data.emoji;
        document.getElementById('word-text').innerText = data.word;
        document.getElementById('feedback').innerText = "";
        document.getElementById('round-text').innerText = `Word ${currentIndex + 1} of ${quizData.length}`;

        // Generate the 3 options (shuffled)
        const container = document.getElementById('options-container');
        container.innerHTML = "";
        
        // Shuffle the sounds for every question
        let shuffledSounds = [...sounds].sort(() => Math.random() - 0.5);
        
        shuffledSounds.forEach(sound => {
            // Pick a random example word for the audio hint button
            const randomExampleObj = quizData.find(q => q.sound === sound);
            const exampleWord = randomExampleObj ? randomExampleObj.word : "example";

            const optDiv = document.createElement('div');
            optDiv.className = "sound-opt";
            
            const isCorrect = sound === data.sound;
            
            optDiv.onclick = () => handleChoice(optDiv, isCorrect, data.word);

            // Note: The example word is no longer printed on the screen, only kept for the audio hint
            optDiv.innerHTML = `
                <button class="listen-hint" onclick="hearSoundHint('${exampleWord}', event)">👂</button>
                <span class="sound-symbol">${sound}</span>
            `;
            
            container.appendChild(optDiv);
        });
        
        setTimeout(() => speakWord(data.word), 400);
    }

    function speakWord(text) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'en-GB'; 
        msg.rate = 0.8;
        window.speechSynthesis.speak(msg);
    }

    function hearSoundHint(exampleWord, event) {
        event.stopPropagation(); 
        speakWord(exampleWord);
    }

    function handleChoice(element, isCorrect, word) {
        if (element.classList.contains('correct-anim') || element.classList.contains('wrong-anim')) return;

        if (isCorrect) {
            element.classList.add('correct-anim');
            document.getElementById('feedback').innerHTML = "<span style='color:var(--success)'>Correct! ✨</span>";
            setTimeout(() => {
                currentIndex++;
                loadWord();
            }, 1200);
        } else {
            element.classList.add('wrong-anim');
            document.getElementById('feedback').innerHTML = "<span style='color:var(--error)'>Oh no! 👂 Try again</span>";
            speakWord(word);
            setTimeout(() => {
                element.classList.remove('wrong-anim');
                document.getElementById('feedback').innerText = "";
            }, 1200);
        }
    }

    function showFinal() {
        document.getElementById('quiz-box').innerHTML = `
            <h1 style="color:#4a90e2; font-size: 3rem;">🏆</h1>
            <h2 style="color:#2ecc71;">Phonics Hero!</h2>
            <p style="font-size:1.2rem;">You successfully sorted all the words into the correct sound groups!</p>
            <button onclick="location.reload()" style="padding:15px 30px; font-size:1.2rem; background:#4a90e2; color:white; border:none; border-radius:10px; cursor:pointer; margin-top:20px; box-shadow: 0 4px 0 #2c3e50;">Play Again</button>
        `;
    }

    loadWord();
</script>
</body>
</html>
