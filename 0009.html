<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>English Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --green: #58cc02; 
            --green-dark: #46a302; 
            --red: #ff4b4b; 
            --red-dark: #ea2b2b; 
            --gray: #e5e5e5; 
            --text: #3c3c3c; 
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: 'Nunito', sans-serif; 
            background: #f7f7f7; 
            margin: 0; display: flex; flex-direction: column; 
            align-items: center; min-height: 100vh; padding: 20px; color: var(--text); 
        }
        .container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 20px; }
        .progress-bg { width: 100%; height: 16px; background: var(--gray); border-radius: 8px; overflow: hidden; display: none; }
        .progress-fill { height: 100%; width: 0%; background: var(--green); border-radius: 8px; transition: width 0.4s ease; }
        .card { 
            background: #fff; border: 2px solid var(--gray); border-bottom: 4px solid var(--gray); 
            border-radius: 16px; padding: 30px 20px; display: flex; flex-direction: column; gap: 24px; 
            transition: opacity 0.3s, transform 0.3s; 
        }
        .card.fade-out { opacity: 0; transform: translateY(10px); }
        .card.fade-in { opacity: 1; transform: translateY(0); }
        .ru-hint { font-size: 18px; font-weight: 700; color: #afafaf; text-align: center; }
        .en-text { font-size: 24px; font-weight: 800; text-align: center; line-height: 1.4; }
        .blank { display: inline-block; min-width: 80px; border-bottom: 3px solid var(--green); color: var(--green); }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .opt-btn { 
            background: #fff; border: 2px solid var(--gray); border-bottom: 4px solid var(--gray); 
            border-radius: 12px; padding: 16px; font-size: 18px; font-weight: 700; 
            color: var(--text); cursor: pointer; transition: 0.1s; font-family: inherit; 
        }
        .opt-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
        .opt-btn.correct { 
            background: #d7ffb8; border-color: var(--green); border-bottom-color: var(--green-dark); 
            color: var(--green-dark); pointer-events: none; 
        }
        .opt-btn.wrong { 
            background: #ffdfe0; border-color: var(--red); border-bottom-color: var(--red-dark); 
            color: var(--red-dark); animation: shake 0.4s; pointer-events: none; 
        }
        @keyframes shake { 
            0%,100% { transform: translateX(0); } 
            25% { transform: translateX(-6px); } 
            75% { transform: translateX(6px); } 
        }
        .start-screen h1 { text-align: center; color: var(--green); margin-bottom: 10px; }
        .start-screen p { text-align: center; font-size: 18px; font-weight: 700; color: #777; margin-bottom: 20px; }
        .name-input { 
            width: 100%; padding: 15px; font-size: 18px; font-family: inherit; font-weight: 700; 
            border: 2px solid var(--gray); border-radius: 12px; margin-bottom: 10px; outline: none; 
        }
        .name-input:focus { border-color: var(--green); }
        .result-screen { display: none; text-align: center; padding: 40px 20px; }
        .result-screen h1 { font-size: 32px; color: var(--green); margin-bottom: 10px; }
        .restart-btn { 
            background: var(--green); color: #fff; border: none; border-bottom: 4px solid var(--green-dark); 
            border-radius: 12px; padding: 16px 32px; font-size: 18px; font-weight: 800; 
            cursor: pointer; width: 100%; max-width: 300px; margin-top: 20px; font-family: inherit; 
        }
    </style>
</head>
<body>

<div class="container">
    <div class="progress-bg" id="progress-container">
        <div class="progress-fill" id="progress-bar"></div>
    </div>
    
    <div class="card fade-in start-screen" id="start-screen">
        <h1>English Quiz</h1>
        <p>Enter your name to start the test.</p>
        <input type="text" id="studentName" class="name-input" placeholder="Your Name">
        <button class="restart-btn" onclick="startQuiz()">Start Quiz 🚀</button>
    </div>

    <div class="card" id="quiz-card" style="display: none;">
        <div class="ru-hint" id="ru-hint"></div>
        <div class="en-text" id="en-text"></div>
        <div class="options" id="options-grid"></div>
    </div>

    <div class="card result-screen" id="result-screen">
        <h1 id="result-title">Great job! 🏆</h1>
        <p style="font-size:20px; font-weight:700;">You scored <span id="final-score">0</span> / <span id="total-q">0</span></p>
        <p id="status-msg" style="font-size: 16px; color: #888;">Sending results to teacher...</p>
        <button class="restart-btn" onclick="resetQuiz()">Try Again 🔄</button>
    </div>
</div>

<script>
// Ваша ссылка на Google Apps Script
const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxZDFh5oa4GAU6RMvWX_OIh0GeLTbolr7P-6cCtbCNT5qiTShRaCYlETAxewsLsnooK/exec';

// Ваши фразы
const rawData = [
    { ru: "Не подведи меня", en: "don't let me ___", correct: "down" },
    { ru: "Это срочно", en: "it's ___", correct: "urgent" },
    { ru: "Командный вид спорта", en: "a team ___", correct: "sport" },
    { ru: "Что случилось?", en: "what ___?", correct: "happened" },
    { ru: "Очень быстро", en: "very ___", correct: "fast" }
];

let quizData = [], currentIdx = 0, score = 0, isAnswering = false;
let studentName = "";

const shuffle = (arr) => arr.sort(() => Math.random() - 0.5);

// ОТПРАВКА РЕЗУЛЬТАТОВ
function sendResultsToGoogle(name, finalScore, totalQuestions) {
    const formData = new URLSearchParams();
    formData.append('name', name);
    formData.append('score', finalScore);
    formData.append('total', totalQuestions);

    fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors', 
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded'
        },
        body: formData.toString()
    })
    .then(() => {
        document.getElementById('status-msg').innerText = "Results sent successfully! ✅";
        document.getElementById('status-msg').style.color = "#58cc02";
    })
    .catch(error => {
        console.error('Ошибка:', error);
        document.getElementById('status-msg').innerText = "Failed to send results. ❌";
        document.getElementById('status-msg').style.color = "#ff4b4b";
    });
}

function startQuiz() {
    studentName = document.getElementById('studentName').value.trim();
    if (!studentName) {
        alert("Please enter your name first!");
        return;
    }

    currentIdx = 0; score = 0; isAnswering = false;
    quizData = shuffle([...rawData]);
    
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('quiz-card').style.display = 'flex';
    document.getElementById('result-screen').style.display = 'none';
    
    document.getElementById('progress-container').style.display = 'block';
    document.getElementById('total-q').innerText = quizData.length;
    document.getElementById('progress-bar').style.width = '0%';
    
    loadQuestion();
}

function loadQuestion() {
    if (currentIdx >= quizData.length) return showResults();
    
    const q = quizData[currentIdx];
    document.getElementById('ru-hint').innerText = q.ru;
    document.getElementById('en-text').innerHTML = q.en.replace('___', '<span class="blank">___</span>');
    
    let wrongOptions = rawData.filter(item => item.correct !== q.correct).map(item => item.correct);
    wrongOptions = shuffle(wrongOptions).slice(0, 3);
    const options = shuffle([q.correct, ...wrongOptions]);
    
    const grid = document.getElementById('options-grid');
    grid.innerHTML = '';
    options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(btn, opt, q.correct);
        grid.appendChild(btn);
    });
    
    document.getElementById('progress-bar').style.width = `${(currentIdx / quizData.length) * 100}%`;
    isAnswering = false;
}

function checkAnswer(btn, selected, correct) {
    if (isAnswering) return;
    isAnswering = true;
    const allBtns = document.querySelectorAll('.opt-btn');
    allBtns.forEach(b => b.disabled = true);

    if (selected === correct) {
        btn.classList.add('correct');
        score++;
        setTimeout(nextQuestion, 1000);
    } else {
        btn.classList.add('wrong');
        if (navigator.vibrate) navigator.vibrate(200); 
        allBtns.forEach(b => { if (b.innerText === correct) b.classList.add('correct'); });
        setTimeout(nextQuestion, 2000);
    }
}

function nextQuestion() {
    isAnswering = false;
    const card = document.getElementById('quiz-card');
    card.classList.remove('fade-in');
    card.classList.add('fade-out');
    
    setTimeout(() => {
        currentIdx++;
        if (currentIdx < quizData.length) {
            loadQuestion();
            card.classList.remove('fade-out');
            card.classList.add('fade-in');
        } else {
            showResults();
        }
    }, 300);
}

function showResults() {
    document.getElementById('quiz-card').style.display = 'none';
    document.getElementById('progress-bar').style.width = '100%';
    document.getElementById('result-screen').style.display = 'block';
    document.getElementById('final-score').innerText = score;
    
    document.getElementById('result-title').innerText = (score === quizData.length) ? "Perfect! 🏆" : "Good job! 🌟";

    sendResultsToGoogle(studentName, score, quizData.length);
}

function resetQuiz() {
    document.getElementById('studentName').value = studentName;
    document.getElementById('start-screen').style.display = 'flex';
    document.getElementById('result-screen').style.display = 'none';
    document.getElementById('progress-container').style.display = 'none';
    document.getElementById('status-msg').innerText = "Sending results to teacher...";
    document.getElementById('status-msg').style.color = "#888";
}
</script>
</body>
</html>
