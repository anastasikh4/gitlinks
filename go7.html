<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky High: Easy Farm Mission</title>
    <style>
        :root {
            --sky-blue: #87ceeb;
            --sun-yellow: #feca57;
            --text-dark: #2c3e50;
        }

        body {
            font-family: 'Segoe UI', 'Arial Rounded MT Bold', sans-serif;
            background: linear-gradient(180deg, #4facfe 0%, #00f2fe 100%);
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .bg-cloud {
            position: fixed;
            background: white;
            border-radius: 50px;
            opacity: 0.3;
            animation: move linear infinite;
            z-index: 0;
        }
        @keyframes move {
            from { left: -150px; }
            to { left: 100%; }
        }

        #game-frame {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            width: 90%;
            max-width: 600px;
            padding: 30px;
            border-radius: 30px;
            text-align: center;
            border: 4px solid white;
            z-index: 1;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .level-badge {
            background: #1e293b;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: bold;
            color: white;
        }

        .score-badge {
            background: var(--sun-yellow);
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: bold;
            color: var(--text-dark);
        }

        .hero-emoji {
            font-size: 5rem;
            animation: float 3s ease-in-out infinite;
            margin: 15px 0;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .sentence-box {
            background: white;
            padding: 25px;
            border-radius: 20px;
            font-size: 1.3rem;
            margin-bottom: 25px;
            box-shadow: 0 6px 0 #cbd5e1;
            line-height: 1.6;
            color: var(--text-dark);
            text-align: center;
        }

        .gap {
            background: #ffe066;
            border-bottom: 4px solid #d97706;
            padding: 2px 10px;
            border-radius: 8px;
            display: inline-block;
            min-width: 100px;
            font-weight: bold;
            color: #b45309;
            text-align: center;
        }

        .options {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .option-btn {
            background: white;
            border: 2px solid #cbd5e1;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 0 #cbd5e1;
            font-family: inherit;
            color: var(--text-dark);
        }

        .option-btn:hover {
            transform: translateY(-2px);
            background: #f8fafc;
        }

        .option-btn:active {
            transform: translateY(2px);
            box-shadow: none;
        }

        .option-btn.correct {
            background: #2ecc71 !important;
            color: white !important;
            border-color: #27ae60 !important;
            box-shadow: 0 4px 0 #27ae60 !important;
        }

        .option-btn.wrong {
            background: #ff6b6b !important;
            color: white !important;
            border-color: #e74c3c !important;
            box-shadow: 0 4px 0 #e74c3c !important;
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 20px;
        }

        .progress-fill {
            height: 100%;
            background: #2ecc71;
            width: 0%;
            transition: width 0.4s ease;
        }

        .reset-btn {
            margin-top: 20px;
            background: #cbd5e1;
            border: none;
            padding: 10px 24px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            color: var(--text-dark);
            font-size: 1rem;
        }
        .reset-btn:hover { background: #bbecf6; }

        #win-screen { display: none; }
        .win-emoji { font-size: 4rem; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="bg-cloud" style="width:120px; height:40px; top:10%; animation-duration: 14s;"></div>
<div class="bg-cloud" style="width:180px; height:55px; top:40%; animation-duration: 19s;"></div>
<div class="bg-cloud" style="width:140px; height:45px; top:75%; animation-duration: 22s;"></div>

<div id="game-frame">
    <div id="play-screen">
        <div class="header">
            <div class="level-badge">🌟 Mission <span id="lvl-num">1</span> / <span id="total">7</span></div>
            <div class="score-badge">⭐ SCORE: <span id="score">0</span></div>
        </div>

        <div class="hero-emoji" id="hero">🚜</div>

        <div class="sentence-box" id="sentence">Loading transmission...</div>

        <div class="options" id="options"></div>

        <div class="progress-bar">
            <div class="progress-fill" id="progress"></div>
        </div>

        <button class="reset-btn" onclick="resetGame()">🔄 Reset Game</button>
    </div>

    <div id="win-screen">
        <div class="win-emoji">🏆🚜🌾</div>
        <h2 style="color: var(--text-dark); font-size: 2rem;">Farm Mission Complete!</h2>
        <p style="font-size: 1.2rem; color: #475569;">Excellent work! You know all the farm words.</p>
        <button class="reset-btn" onclick="resetGame()" style="background: var(--sun-yellow); padding: 14px 35px; font-size: 1.1rem;">🌟 Play Again</button>
    </div>
</div>

<script>
    // ORIGINAL DATA
    const masterMissions = [
        {
            hero: "🚜",
            text: "<b>Farmer:</b> <span class='gap' id='g1'>____</span> to my farm!",
            answer: "welcome",
            options: ["welcome", "pretty", "ride"]
        },
        {
            hero: "🐄",
            text: "<b>Starlie:</b> Where are your cows?<br><b>Farmer:</b> They're <span class='gap' id='g1'>____</span> the farm.",
            answer: "around",
            options: ["around", "walking", "driving"]
        },
        {
            hero: "🐎",
            text: "<b>Starlie:</b> Wow! Can I <span class='gap' id='g1'>____</span> a horse?",
            answer: "ride",
            options: ["ride", "warm", "around"]
        },
        {
            hero: "🐴",
            text: "<b>Farmer:</b> Yes! This horse is very <span class='gap' id='g1'>____</span>.",
            answer: "pretty",
            options: ["pretty", "walking", "welcome"]
        },
        {
            hero: "🚜",
            text: "<b>Farmer:</b> Look, I am <span class='gap' id='g1'>____</span> a tractor!",
            answer: "driving",
            options: ["driving", "ride", "warm"]
        },
        {
            hero: "☀️",
            text: "<b>Farmer:</b> The weather is very <span class='gap' id='g1'>____</span> today.",
            answer: "warm",
            options: ["warm", "pretty", "walking"]
        },
        {
            hero: "🚶",
            text: "<b>Starlie:</b> I like <span class='gap' id='g1'>____</span> around the fields!",
            answer: "walking",
            options: ["walking", "driving", "around"]
        }
    ];

    let missions = []; // Will hold the shuffled version
    let currentLevel = 0;
    let score = 0;
    let lockSelection = false;

    // Fisher-Yates Shuffle Algorithm for true randomization
    function shuffleArray(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex !== 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    }

    function loadMissions() {
        if (currentLevel >= missions.length) {
            document.getElementById('play-screen').style.display = 'none';
            document.getElementById('win-screen').style.display = 'block';
            return;
        }

        lockSelection = false;
        
        const data = missions[currentLevel];
        document.getElementById('lvl-num').innerText = currentLevel + 1;
        document.getElementById('total').innerText = missions.length;
        document.getElementById('hero').innerText = data.hero;
        document.getElementById('sentence').innerHTML = data.text;
        
        const percentage = (currentLevel / missions.length) * 100;
        document.getElementById('progress').style.width = `${percentage}%`;

        const optionsContainer = document.getElementById('options');
        optionsContainer.innerHTML = '';

        // Shuffle the 3 options for THIS specific question
        const shuffledOptions = shuffleArray([...data.options]);

        shuffledOptions.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => verifySelection(opt, btn);
            optionsContainer.appendChild(btn);
        });
    }

    function verifySelection(selectedOption, buttonNode) {
        if (lockSelection) return;

        const data = missions[currentLevel];
        
        if (selectedOption === data.answer) {
            lockSelection = true;
            buttonNode.classList.add('correct');
            document.getElementById('g1').innerText = selectedOption;
            score += 10;
            document.getElementById('score').innerText = score;
            
            // Wait 1 second, then go to the next question
            setTimeout(() => {
                currentLevel++;
                loadMissions();
            }, 1000);
        } else {
            // Wrong answer - flash red and remove class
            buttonNode.classList.add('wrong');
            setTimeout(() => buttonNode.classList.remove('wrong'), 800);
        }
    }

    function startGame() {
        currentLevel = 0;
        score = 0;
        document.getElementById('score').innerText = score;
        document.getElementById('play-screen').style.display = 'block';
        document.getElementById('win-screen').style.display = 'none';
        
        // Shuffle the order of the questions
        missions = shuffleArray([...masterMissions]);
        
        loadMissions();
    }

    function resetGame() {
        startGame();
    }

    window.onload = startGame;
</script>

</body>
</html>
