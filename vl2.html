<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grammar Quiz: Perfect Tenses</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --bg-gradient: linear-gradient(135deg, #e0e7ff 0%, #fae8ff 100%);
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            
            --accent-primary: #8b5cf6;
            --accent-secondary: #ec4899;
            
            --correct-bg: #ecfdf5;
            --correct-border: #10b981;
            --correct-text: #047857;
            
            --wrong-bg: #fef2f2;
            --wrong-border: #ef4444;
            --wrong-text: #b91c1c;
            
            --btn-bg: #ffffff;
            --btn-border: #cbd5e1;
            --btn-shadow: #cbd5e1;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .game-container {
            max-width: 800px;
            width: 100%;
            padding: 40px;
            background: var(--card-bg);
            border-radius: 24px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            position: relative;
            z-index: 2;
        }

        h1 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            margin-top: 0;
            font-size: 2em;
            text-align: center;
            color: var(--text-main);
            margin-bottom: 25px;
            letter-spacing: -0.5px;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            height: 10px;
            background: #e2e8f0;
            border-radius: 10px;
            margin-bottom: 35px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 10px;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* --- LEVEL 1: MATCHING --- */
        .level { display: none; animation: fadeIn 0.4s ease; }
        .active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .game-board {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 350px;
        }

        .column h3 {
            margin: 0 0 10px 0;
            color: var(--text-muted);
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
            font-weight: 700;
        }

        .card {
            padding: 18px 20px;
            background: var(--btn-bg);
            border-radius: 16px;
            border: 2px solid var(--btn-border);
            border-bottom-width: 4px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.1s ease;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80px;
            text-align: center;
            color: var(--text-main);
        }

        .card:hover { 
            border-color: var(--accent-primary);
            background: #f8fafc;
        }
        
        .card:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }

        .card.selected { 
            border-color: var(--accent-primary); 
            background: #f3e8ff;
            color: var(--accent-primary);
        }
        
        .card.matched { 
            background: var(--correct-bg); 
            border-color: var(--correct-border); 
            color: var(--correct-text); 
            cursor: default; 
            pointer-events: none; 
            opacity: 0.7;
            transform: none;
        }
        
        .card.wrong-match { 
            background: var(--wrong-bg); 
            border-color: var(--wrong-border); 
            color: var(--wrong-text);
            animation: shake 0.4s; 
        }

        /* --- LEVEL 2: MCQ --- */
        .question-box {
            background: #f8fafc;
            padding: 30px;
            border-radius: 20px;
            border: 2px solid var(--border-color);
            font-size: 1.3rem;
            line-height: 1.6;
            text-align: left;
            margin-bottom: 30px;
            min-height: 120px;
            display: flex;
            align-items: center;
            font-weight: 600;
            color: var(--text-main);
        }

        .blank-space {
            display: inline-block;
            min-width: 140px;
            border-bottom: 3px solid var(--accent-primary);
            text-align: center;
            color: var(--accent-primary);
            font-weight: 800;
            margin: 0 8px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .option-btn {
            background: var(--btn-bg);
            border: 2px solid var(--btn-border);
            border-bottom-width: 4px;
            border-radius: 16px;
            padding: 18px 15px;
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            font-family: inherit;
            transition: all 0.1s;
        }

        .option-btn:active:not(:disabled) { 
            transform: translateY(2px); 
            border-bottom-width: 2px; 
        }
        
        .option-btn:hover:not(:disabled) { 
            background: #f8fafc; 
            border-color: var(--accent-primary);
        }
        
        .option-btn.correct { 
            background: var(--correct-bg); 
            border-color: var(--correct-border); 
            color: var(--correct-text); 
        }
        
        .option-btn.wrong { 
            background: var(--wrong-bg); 
            border-color: var(--wrong-border); 
            color: var(--wrong-text); 
            animation: shake 0.4s; 
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            50% { transform: translateX(6px); }
            75% { transform: translateX(-6px); }
            100% { transform: translateX(0); }
        }

        .feedback { 
            font-weight: 700; 
            min-height: 30px; 
            margin-top: 20px; 
            font-size: 1.1em; 
            text-align: center;
        }

        /* --- WIN SCREEN --- */
        #win-screen {
            display: none;
            text-align: center;
            padding: 30px 20px;
            animation: fadeIn 0.5s ease;
        }

        #win-screen h2 { 
            font-family: 'Montserrat', sans-serif;
            font-size: 2.5em; 
            color: var(--text-main);
            margin-bottom: 10px; 
        }
        
        .final-score { 
            font-size: 1.5em; 
            margin-bottom: 20px; 
            font-weight: 700; 
            color: var(--accent-primary);
        }
        
        .success-msg { 
            color: var(--correct-text); 
            font-weight: 600; 
            font-size: 1.1em; 
            margin-top: 20px; 
            display: none; 
            padding: 12px;
            background: var(--correct-bg);
            border-radius: 12px;
            border: 1px solid var(--correct-border);
        }

        .btn-restart {
            padding: 16px 40px;
            font-size: 1.1em;
            cursor: pointer;
            color: #ffffff;
            background: var(--accent-primary);
            border: none;
            border-radius: 12px;
            transition: 0.2s;
            font-family: inherit;
            font-weight: 700;
            margin-top: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 6px -1px rgba(139, 92, 246, 0.3);
        }

        .btn-restart:hover { 
            background: #7c3aed;
            transform: translateY(-2px);
            box-shadow: 0 6px 8px -1px rgba(139, 92, 246, 0.4);
        }

        @media (max-width: 650px) {
            .game-container { padding: 25px 20px; }
            .options-grid { grid-template-columns: 1fr; }
            .game-board { flex-direction: column; gap: 15px; }
            .question-box { font-size: 1.1em; padding: 20px; }
            .column { max-width: 100%; }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>Grammar Master</h1>
        
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <!-- LEVEL 1: MATCHING -->
        <div id="level1" class="level active">
            <div class="column"><h3>Match the word to its definition</h3></div>
            <div class="game-board">
                <div class="column" id="left-col"></div>
                <div class="column" id="right-col"></div>
            </div>
            <div id="feedback" class="feedback"></div>
        </div>

        <!-- LEVEL 2: MCQ -->
        <div id="level2" class="level">
            <div class="column"><h3>Present Perfect vs. Present Perfect Continuous</h3></div>
            <div class="question-box" id="question-text"></div>
            <div class="options-grid" id="options-grid"></div>
            <div id="feedback2" class="feedback"></div>
        </div>

        <!-- WIN SCREEN -->
        <div id="win-screen">
            <h2>Module Complete</h2>
            <p style="color: var(--text-muted); margin-bottom: 5px;">You successfully finished the grammar challenge.</p>
            <div class="final-score" id="final-score">Score: 0 / 10</div>
            <p class="success-msg" id="success-msg">Results synced successfully! ✅</p>
            <button class="btn-restart" onclick="location.reload()">Try Again</button>
        </div>
    </div>

    <script>
        // ================================================================
        //  CONFIGURATION & DATA
        // ================================================================
        const TEST_NAME = "Light UI: Vocab & Perfect Tenses";
        let userMistakes = [];
        let score = 0;
        let matchesFound = 0;
        let selectedLeft = null;
        let selectedRight = null;
        let currentQuizIndex = 0;
        const totalQuestions = 10; // 5 matches + 5 MCQ

        // --- LEVEL 1: MATCHING DATA ---
        const matchData = [
            { id: 1, left: "Hungry", right: "You want to eat food." },
            { id: 2, left: "Tired", right: "You want to sleep." },
            { id: 3, left: "Thirsty", right: "You want to drink water." },
            { id: 4, left: "Scared", right: "You feel afraid." },
            { id: 5, left: "Fast", right: "Moving very quickly." }
        ];

        // --- LEVEL 2: MCQ DATA (Present Perfect vs Continuous) ---
        const quizData = [
            { 
                sentence: "1. I ___ that book. You can have it now.", 
                options: ["have read", "have been reading", "read", "am reading"], 
                correct: "have read" 
            },
            { 
                sentence: "2. Her eyes are red. She ___.", 
                options: ["has cried", "has been crying", "cried", "is crying"], 
                correct: "has been crying" 
            },
            { 
                sentence: "3. How long ___ English?", 
                options: ["have you learned", "have you been learning", "did you learn", "do you learn"], 
                correct: "have you been learning" 
            },
            { 
                sentence: "4. He ___ his homework, so he can play now.", 
                options: ["has just finished", "has just been finishing", "just finished", "is finishing"], 
                correct: "has just finished" 
            },
            { 
                sentence: "5. She ___ three emails this morning.", 
                options: ["has written", "has been writing", "wrote", "is writing"], 
                correct: "has written" 
            }
        ];

        // ================================================================
        //  LEVEL 1: MATCHING LOGIC
        // ================================================================
        function initLevel1() {
            const leftCol = document.getElementById('left-col');
            const rightCol = document.getElementById('right-col');

            leftCol.innerHTML = '';
            rightCol.innerHTML = '';

            // Left Cards (Words)
            matchData.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerText = item.left;
                card.dataset.id = item.id;
                card.onclick = () => handleCardClick(card, 'left');
                leftCol.appendChild(card);
            });

            // Right Cards (Definitions) - Shuffled
            const shuffledRight = [...matchData].sort(() => Math.random() - 0.5);
            shuffledRight.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerText = item.right;
                card.dataset.id = item.id;
                card.onclick = () => handleCardClick(card, 'right');
                rightCol.appendChild(card);
            });
        }

        function handleCardClick(card, side) {
            if (card.classList.contains('matched')) return;

            if (card.classList.contains('selected')) {
                card.classList.remove('selected');
                if (side === 'left') selectedLeft = null; else selectedRight = null;
                return;
            }

            if (side === 'left') {
                if (selectedLeft) selectedLeft.classList.remove('selected');
                selectedLeft = card;
            } else {
                if (selectedRight) selectedRight.classList.remove('selected');
                selectedRight = card;
            }
            card.classList.add('selected');

            if (selectedLeft && selectedRight) {
                checkMatch();
            }
        }

        function checkMatch() {
            const leftId = selectedLeft.dataset.id;
            const rightId = selectedRight.dataset.id;
            const feed = document.getElementById('feedback');

            if (leftId === rightId) {
                score++;
                matchesFound++;
                updateProgress();
                
                feed.innerText = "Match found! ✅";
                feed.style.color = "var(--correct-border)";

                selectedLeft.classList.remove('selected');
                selectedRight.classList.remove('selected');
                selectedLeft.classList.add('matched');
                selectedRight.classList.add('matched');

                if (navigator.vibrate) navigator.vibrate(50);

                selectedLeft = null;
                selectedRight = null;

                if (matchesFound === matchData.length) {
                    setTimeout(nextLevel, 1000);
                }
            } else {
                feed.innerText = "Incorrect. Try again.";
                feed.style.color = "var(--wrong-border)";

                const lCard = selectedLeft;
                const rCard = selectedRight;
                lCard.classList.add('wrong-match');
                rCard.classList.add('wrong-match');

                if (!userMistakes.includes(lCard.innerText)) userMistakes.push(lCard.innerText);
                if (!userMistakes.includes(rCard.innerText)) userMistakes.push(rCard.innerText);

                if (navigator.vibrate) navigator.vibrate([50, 50, 50]);

                setTimeout(() => {
                    lCard.classList.remove('wrong-match', 'selected');
                    rCard.classList.remove('wrong-match', 'selected');
                    selectedLeft = null;
                    selectedRight = null;
                    feed.innerText = "";
                }, 800);
            }
        }

        function updateProgress() {
            const totalDone = matchesFound + currentQuizIndex;
            document.getElementById('progress-bar').style.width = (totalDone / totalQuestions) * 100 + '%';
        }

        // ================================================================
        //  LEVEL 2: MCQ LOGIC
        // ================================================================
        function nextLevel() {
            document.getElementById('level1').classList.remove('active');
            document.getElementById('level2').classList.add('active');
            document.getElementById('feedback').innerText = "";
            loadQuestion();
        }

        function loadQuestion() {
            if (currentQuizIndex >= quizData.length) {
                showWinScreen();
                return;
            }

            const q = quizData[currentQuizIndex];
            document.getElementById('question-text').innerHTML = q.sentence.replace("___", '<span class="blank-space">___</span>');

            const optionsGrid = document.getElementById('options-grid');
            optionsGrid.innerHTML = '';

            const shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);
            
            shuffledOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(btn, opt, q.correct);
                optionsGrid.appendChild(btn);
            });
        }

        function checkAnswer(btn, selected, correct) {
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.disabled = true);

            if (selected === correct) {
                score++;
                btn.classList.add('correct');
                if (navigator.vibrate) navigator.vibrate(50);
            } else {
                btn.classList.add('wrong');
                if (!userMistakes.includes(selected)) userMistakes.push(selected);
                if (navigator.vibrate) navigator.vibrate([50, 50, 50]);
                
                allBtns.forEach(b => {
                    if (b.innerText === correct) b.classList.add('correct');
                });
            }
            
            updateProgress();

            setTimeout(() => {
                currentQuizIndex++;
                loadQuestion();
            }, 1500);
        }

        // ================================================================
        //  WIN SCREEN & GOOGLE SHEETS INTEGRATION
        // ================================================================
        function showWinScreen() {
            document.getElementById('progress-bar').style.width = '100%';
            document.getElementById('level2').classList.remove('active');
            document.getElementById('win-screen').style.display = 'block';
            document.getElementById('final-score').innerText = `Score: ${score} / ${totalQuestions}`;
            
            sendResultsToGoogle();
        }

        async function sendResultsToGoogle() {
            const url = "https://script.google.com/macros/s/AKfycbxZDFh5oa4GAU6RMvWX_OIh0GeLTbolr7P-6cCtbCNT5qiTShRaCYlETAxewsLsnooK/exec";
            
            const params = new URLSearchParams({
                name: TEST_NAME,
                score: score,
                total: totalQuestions,
                mistakes: userMistakes.join(', ')
            });

            try {
                await fetch(url, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: params.toString()
                });
                
                document.getElementById('success-msg').style.display = 'block';
            } catch (error) {
                console.error("Error sending results:", error);
            }
        }

        // Start Game
        initLevel1();
    </script>
</body>
</html>
