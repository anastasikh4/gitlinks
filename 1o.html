<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMONG US: FIX THE HOUSEWORK SABOTAGE!</title>
    <style>
        :root {
            --crew-blue: #225ee1;
            --imp-red: #ea0606;
            --task-green: #39fd32;
            --ship-dark: #0d121a;
            --white: #ffffff;
            --btn-gray: #4e5d6a;
        }

        body {
            background-color: var(--ship-dark);
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--white);
            overflow: hidden;
        }

        #game-card {
            width: 95%;
            max-width: 520px;
            background: #1e2732;
            border-radius: 15px;
            border: 4px solid #3f484e;
            padding: 25px;
            text-align: center;
        }

        .header { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .task-status { color: var(--task-green); font-weight: bold; font-family: monospace; border: 1px solid var(--task-green); padding: 5px 10px; }

        .display-area {
            background: #283341;
            min-height: 160px;
            border-radius: 10px;
            margin-bottom: 20px;
            padding: 20px;
            border: 2px solid #3f484e;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .sentence-text { font-size: 1.4rem; margin-bottom: 20px; line-height: 1.5; font-weight: 600; }
        .word-builder { 
            background: #000; 
            padding: 12px; 
            border-radius: 8px; 
            min-height: 45px; 
            font-size: 1.8rem; 
            letter-spacing: 5px; 
            color: var(--task-green);
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .letter-grid { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 20px; min-height: 50px; }

        .btn-letter {
            background: var(--crew-blue);
            border: none;
            border-bottom: 4px solid #163da1;
            border-radius: 8px;
            padding: 10px 18px;
            font-size: 1.4rem;
            font-weight: bold;
            cursor: pointer;
            color: white;
        }

        .btn-letter:active { transform: translateY(2px); border-bottom: 2px solid #163da1; }
        
        .controls { display: flex; gap: 10px; margin-top: 20px; }
        .btn-control { flex: 1; padding: 12px; border-radius: 5px; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .reset-btn { background: var(--imp-red); color: white; }

        #total-progress { width: 100%; height: 20px; background: #000; border: 1px solid #3f484e; border-radius: 5px; margin-top: 25px; overflow: hidden; }
        #progress-fill { width: 0%; height: 100%; background: var(--task-green); transition: 0.4s; }

        #win-screen { display: none; }
    </style>
</head>
<body>

<div id="game-card">
    <div id="play-area">
        <div class="header">
            <div style="font-weight: bold; letter-spacing: 0.5px;">FIX THE SABOTAGE!</div>
            <div class="task-status">TASK: <span id="done-count">1</span>/8</div>
        </div>

        <div class="display-area">
            <div class="sentence-text" id="sentence-box">Loading...</div>
            <div class="word-builder" id="user-word"></div>
        </div>

        <div class="letter-grid" id="letter-box"></div>
        
        <div class="controls">
            <button class="btn-control reset-btn" onclick="resetWord()">Clear ❌</button>
        </div>

        <div id="total-progress"><div id="progress-fill"></div></div>
    </div>

    <div id="win-screen">
        <h1 style="color: var(--task-green); font-size: 40px; margin-bottom: 15px;">HOUSEWORK CLEANED! 🚀</h1>
        <p style="font-size: 1.2rem;">All dialogue lines and picture labels are successfully verified.</p>
        <button class="btn-letter" onclick="location.reload()" style="width:100%; background: var(--task-green); border-bottom-color: #27ae60; margin-top: 20px;">PLAY AGAIN</button>
    </div>
</div>

<script>
    let current = 0;
    let typedWord = "";
    
    // Tasks mapped exactly from the textbook content: Dialogues & Picture Labels
    const tasks = [
        { q: "Max: Can you _______ me with the housework?", ans: "HELP", icon: "🧹" },
        { q: "Max: No _______ , Mum.", ans: "PROBLEM", icon: "👍" },
        { q: "Mum: Can you wash the _______?", ans: "TOMATOES", icon: "🍅" },
        { q: "Bob: Do you _______ any help with the bedrooms?", ans: "NEED", icon: "🛏️" },
        { q: "Can I help you _______ the car?", ans: "WASH", icon: "🚗" },
        { q: "Picture 1: Can I help you with the _______?", ans: "CLOTHES", icon: "🧺" },
        { q: "Picture 2: Do you need any help with the _______?", ans: "SOFA", icon: "🛋️" },
        { q: "Picture 3: Can you move the _______?", ans: "TABLE", icon: "🪵" }
    ];

    function shuffle(array) {
        return array.sort(() => Math.random() - 0.5);
    }

    function loadTask() {
        const t = tasks[current];
        typedWord = "";
        document.getElementById('user-word').innerText = "";
        document.getElementById('sentence-box').innerHTML = `<span style="font-size: 2.5rem; display: block; margin-bottom: 10px;">${t.icon}</span>${t.q}`;
        document.getElementById('done-count').innerText = current + 1;
        
        const letterBox = document.getElementById('letter-box');
        letterBox.innerHTML = '';
        
        // Shuffle letters of the answer
        const letters = shuffle(t.ans.split(''));
        letters.forEach(char => {
            const btn = document.createElement('button');
            btn.className = 'btn-letter';
            btn.innerText = char;
            btn.onclick = () => addLetter(char, btn);
            letterBox.appendChild(btn);
        });

        document.getElementById('progress-fill').style.width = (current / tasks.length * 100) + '%';
    }

    function addLetter(char, btn) {
        typedWord += char;
        document.getElementById('user-word').innerText = typedWord;
        btn.style.visibility = "hidden";
        
        if (typedWord.length === tasks[current].ans.length) {
            if (typedWord === tasks[current].ans) {
                setTimeout(nextLevel, 500);
            } else {
                document.getElementById('user-word').style.color = 'var(--imp-red)';
                setTimeout(() => {
                    document.getElementById('user-word').style.color = 'var(--task-green)';
                    resetWord();
                }, 600);
            }
        }
    }

    function resetWord() {
        typedWord = "";
        document.getElementById('user-word').innerText = "";
        const buttons = document.querySelectorAll('.btn-letter');
        buttons.forEach(b => b.style.visibility = "visible");
    }

    function nextLevel() {
        current++;
        if (current < tasks.length) {
            loadTask();
        } else {
            document.getElementById('progress-fill').style.width = '100%';
            showWin();
        }
    }

    function showWin() {
        document.getElementById('play-area').style.display = 'none';
        document.getElementById('win-screen').style.display = 'block';
    }

    loadTask();
</script>
</body>
</html>
