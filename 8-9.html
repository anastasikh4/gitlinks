<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duolingo Quiz · Present Tenses</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --green: #58cc02;
            --dark-green: #46a302;
            --red: #ff4b4b;
            --dark-red: #ea2b2b;
            --blue: #1cb0f6;
            --gray: #e5e5e5;
            --text: #4b4b4b;
        }

        body {
            font-family: 'Nunito', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: white;
            color: var(--text);
            overflow-x: hidden;
            min-height: 100vh;
        }

        header {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            display: flex;
            align-items: center;
            box-sizing: border-box;
            position: sticky;
            top: 0;
            background: white;
            z-index: 10;
        }

        .progress-bar {
            flex-grow: 1;
            height: 16px;
            background: var(--gray);
            border-radius: 10px;
            overflow: hidden;
        }

        #fill {
            width: 0%;
            height: 100%;
            background: var(--green);
            border-radius: 10px;
            transition: width 0.4s cubic-bezier(0.65, 0, 0.35, 1);
        }

        main {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            margin-top: 10px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        h2.step-label {
            color: #afafaf;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        h1.question-text {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 30px;
            color: var(--text);
            line-height: 1.4;
        }

        h1.question-text .blank {
            display: inline-block;
            min-width: 80px;
            border-bottom: 4px solid var(--blue);
            padding: 0 6px;
            color: var(--blue);
            font-weight: 900;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            background: white;
            border: 2px solid var(--gray);
            border-bottom: 4px solid var(--gray);
            border-radius: 15px;
            padding: 15px 20px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            text-align: left;
            transition: all 0.1s;
            color: var(--text);
            font-family: 'Nunito', sans-serif;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #f7f7f7;
            transform: scale(1.01);
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .option-btn.correct {
            background: #d7ffb8;
            border-color: #58cc02;
            border-bottom-color: #46a302;
            color: #58a700;
        }

        .option-btn.wrong {
            background: #ffdfe0;
            border-color: #ff4b4b;
            border-bottom-color: #ea2b2b;
            color: #ea2b2b;
            animation: shake 0.4s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        #feedback-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 24px 30px;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.08);
        }

        .feedback-content {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        .feedback-content h2 {
            margin: 0;
            font-size: 22px;
            font-weight: 800;
            flex: 1;
        }

        .next-btn {
            padding: 12px 36px;
            border-radius: 12px;
            border: none;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            text-transform: uppercase;
            font-family: 'Nunito', sans-serif;
            transition: 0.1s;
            flex-shrink: 0;
        }

        .next-btn:active {
            transform: translateY(2px);
        }

        .correct-ui {
            background: #d7ffb8;
            color: #58a700;
        }

        .wrong-ui {
            background: #ffdfe0;
            color: #ea2b2b;
        }

        .btn-green {
            background: var(--green);
            border-bottom: 4px solid var(--dark-green);
            color: white;
        }

        .btn-green:active {
            border-bottom-width: 2px;
            transform: translateY(2px);
        }

        .btn-red {
            background: var(--red);
            border-bottom: 4px solid var(--dark-red);
            color: white;
        }

        .btn-red:active {
            border-bottom-width: 2px;
            transform: translateY(2px);
        }

        .completion-screen {
            text-align: center;
            padding: 40px 20px;
        }

        .completion-screen h1 {
            font-size: 36px;
            font-weight: 900;
            color: var(--green);
            margin-bottom: 10px;
        }

        .completion-screen p {
            font-size: 20px;
            color: var(--text);
        }

        .completion-screen .big-emoji {
            font-size: 72px;
            display: block;
            margin-bottom: 16px;
        }

        .close-btn {
            margin-right: 15px;
            cursor: pointer;
            color: #afafaf;
            font-size: 22px;
            font-weight: 700;
            user-select: none;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: var(--text);
        }

        @media (max-width: 480px) {
            header {
                padding: 14px 16px;
            }
            main {
                padding: 14px 16px;
            }
            h1.question-text {
                font-size: 20px;
            }
            .option-btn {
                font-size: 16px;
                padding: 13px 16px;
            }
            .feedback-content h2 {
                font-size: 18px;
            }
            .next-btn {
                padding: 10px 24px;
                font-size: 14px;
            }
            #feedback-bar {
                padding: 16px 18px;
            }
            .close-btn {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

<header>
    <span class="close-btn" onclick="if(confirm('Restart the quiz?')) location.reload()">✕</span>
    <div class="progress-bar"><div id="fill"></div></div>
</header>

<main id="quiz-container">
    <h2 class="step-label" id="step-label">QUESTION 1</h2>
    <h1 class="question-text" id="question-text">Loading...</h1>
    <div class="options-grid" id="options">
        <!-- Options generated by JS -->
    </div>
</main>

<div id="feedback-bar">
    <div class="feedback-content">
        <h2 id="feedback-msg">Excellent!</h2>
        <button class="next-btn" id="action-btn" onclick="nextQuestion()">Continue</button>
    </div>
</div>

<script>
    // ================================================================
    // DATA — Present Simple vs Present Continuous
    // ================================================================

    const questions = [
        {
            q: 'Hi, <span class="blank">______</span> you studying?',
            a: 'are',
            options: ['are', 'do', 'is'],
            hint: 'Present Continuous question'
        },
        {
            q: 'No, I\'m not. I <span class="blank">______</span> a film.',
            a: 'am watching',
            options: ['watch', 'am watching', 'watching'],
            hint: 'Present Continuous for action now'
        },
        {
            q: '<span class="blank">______</span> you like it?',
            a: 'Do',
            options: ['Do', 'Are', 'Is'],
            hint: 'Present Simple question'
        },
        {
            q: '<span class="blank">______</span> you doing the shopping?',
            a: 'Are',
            options: ['Are', 'Do', 'Is'],
            hint: 'Present Continuous question'
        },
        {
            q: 'I <span class="blank">______</span> to make a cake.',
            a: 'want',
            options: ['want', 'wants', 'am wanting'],
            hint: 'Stative verb — Present Simple'
        },
        {
            q: 'I <span class="blank">______</span> your cakes!',
            a: 'love',
            options: ['love', 'loves', 'am loving'],
            hint: 'Stative verb — Present Simple'
        },
        {
            q: '<span class="blank">______</span> you need anything else?',
            a: 'Do',
            options: ['Do', 'Are', 'Is'],
            hint: 'Present Simple question'
        },
        {
            q: 'She <span class="blank">______</span> (study) every evening.',
            a: 'studies',
            options: ['studies', 'is studying', 'study'],
            hint: 'Present Simple for routine'
        }
    ];

    // ================================================================
    // STATE
    // ================================================================

    let currentIdx = 0;
    let canAnswer = true;

    // ================================================================
    // LOAD QUESTION
    // ================================================================

    function loadQuestion() {
        canAnswer = true;
        const q = questions[currentIdx];

        document.getElementById('step-label').textContent =
            `QUESTION ${currentIdx + 1} OF ${questions.length}`;

        document.getElementById('question-text').innerHTML = q.q;

        document.getElementById('feedback-bar').style.display = 'none';

        const optionsContainer = document.getElementById('options');
        optionsContainer.innerHTML = '';

        q.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = opt;
            btn.onclick = () => checkAnswer(opt, btn);
            optionsContainer.appendChild(btn);
        });

        // Update progress
        const progress = (currentIdx / questions.length) * 100;
        document.getElementById('fill').style.width = progress + '%';
    }

    // ================================================================
    // CHECK ANSWER
    // ================================================================

    function checkAnswer(selected, btn) {
        if (!canAnswer) return;
        canAnswer = false;

        const correct = questions[currentIdx].a;
        const bar = document.getElementById('feedback-bar');
        const msg = document.getElementById('feedback-msg');
        const actionBtn = document.getElementById('action-btn');

        // Disable all buttons
        document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);

        if (selected === correct) {
            btn.classList.add('correct');
            bar.className = 'correct-ui';
            msg.textContent = '✅ Correct! ✨';
            actionBtn.className = 'next-btn btn-green';
        } else {
            btn.classList.add('wrong');
            // Highlight the correct answer
            document.querySelectorAll('.option-btn').forEach(b => {
                if (b.textContent === correct) {
                    b.classList.add('correct');
                }
            });
            bar.className = 'wrong-ui';
            msg.textContent = `❌ Oops! The answer is: ${correct}`;
            actionBtn.className = 'next-btn btn-red';
        }

        bar.style.display = 'flex';
        document.getElementById('fill').style.width = ((currentIdx + 1) / questions.length * 100) + '%';
    }

    // ================================================================
    // NEXT QUESTION
    // ================================================================

    function nextQuestion() {
        currentIdx++;
        if (currentIdx < questions.length) {
            loadQuestion();
        } else {
            // Show completion screen
            document.getElementById('quiz-container').innerHTML = `
                <div class="completion-screen">
                    <span class="big-emoji">🎉</span>
                    <h1>Lesson Complete!</h1>
                    <p>You've mastered Present Simple &amp; Present Continuous!</p>
                    <br>
                    <button class="next-btn btn-green" onclick="location.reload()" style="display:inline-block; padding:14px 48px; font-size:18px;">
                        🔄 Play Again
                    </button>
                </div>
            `;
            document.getElementById('feedback-bar').style.display = 'none';
            document.getElementById('fill').style.width = '100%';
        }
    }

    // ================================================================
    // KEYBOARD SUPPORT
    // ================================================================

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ') {
            const bar = document.getElementById('feedback-bar');
            if (bar.style.display === 'flex') {
                e.preventDefault();
                nextQuestion();
            }
        }
        // Number keys 1-3 for options
        if (e.key >= '1' && e.key <= '3') {
            const btns = document.querySelectorAll('.option-btn');
            const idx = parseInt(e.key) - 1;
            if (btns[idx] && !btns[idx].disabled) {
                btns[idx].click();
            }
        }
    });

    // ================================================================
    // START
    // ================================================================

    loadQuestion();
</script>

</body>
</html>
