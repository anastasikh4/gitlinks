<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Race Track Grammar Builder</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f0f4f8;
            --panel-bg: #ffffff;
            --text-main: #2d3748;
            --text-muted: #718096;
            --primary-color: #ff6b6b; /* Coral red */
            --secondary-color: #4ecdc4; /* Light teal */
            --border-color: #e2e8f0;
            --success-bg: #dcfce7;
            --success-text: #166534;
            --error-bg: #fee2e2;
            --error-text: #991b1b;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .panel {
            border: 3px solid var(--border-color);
            padding: 30px;
            max-width: 850px;
            width: 100%;
            background-color: var(--panel-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        h2 {
            text-align: center;
            color: var(--primary-color);
            margin-top: 0;
            font-size: 1.8rem;
            font-weight: 800;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }

        .status {
            text-align: center;
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 30px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Layout for each zone */
        .zone-container {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
            background: #f8fafc;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            align-items: center;
        }

        @media (max-width: 768px) {
            .zone-container {
                flex-direction: column;
            }
            .zone-image img {
                width: 100%;
                height: 180px;
            }
        }

        .zone-image {
            flex: 0 0 220px;
        }

        .zone-image img {
            width: 220px;
            height: 160px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid var(--border-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .zone-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .zone-title {
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--secondary-color);
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .sentence-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            background: #ffffff;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .sign {
            font-weight: 800;
            font-size: 1.2rem;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: white;
        }

        .sign.plus { background-color: #10b981; }
        .sign.minus { background-color: #ef4444; }

        select {
            background-color: #f8fafc;
            color: var(--text-main);
            border: 2px solid var(--border-color);
            padding: 8px 12px;
            font-family: inherit;
            font-weight: 700;
            cursor: pointer;
            border-radius: 6px;
            flex: 1;
            min-width: 100px;
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        select:focus {
            outline: none;
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 3px rgba(78, 205, 196, 0.2);
        }

        /* Highlights for correct/incorrect */
        select.correct-choice {
            border-color: #10b981;
            background-color: #ecfdf5;
            color: #047857;
        }

        select.wrong-choice {
            border-color: #ef4444;
            background-color: #fef2f2;
            color: #b91c1c;
        }

        .verify-btn {
            display: block;
            width: 100%;
            margin-top: 30px;
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            padding: 16px;
            font-family: inherit;
            font-weight: 800;
            font-size: 1.2rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 10px;
            box-shadow: 0 4px 0 #e55a5a;
            transition: all 0.1s;
        }

        .verify-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #e55a5a;
        }

        .verify-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #e55a5a;
        }

        .telemetry-log {
            margin-top: 25px;
            padding: 20px;
            border-radius: 10px;
            display: none;
            font-weight: 700;
            font-size: 1rem;
            line-height: 1.6;
        }

        .telemetry-log.success {
            background-color: var(--success-bg);
            color: var(--success-text);
            border: 2px solid #10b981;
        }

        .telemetry-log.error {
            background-color: var(--error-bg);
            color: var(--error-text);
            border: 2px solid #ef4444;
        }

        .footer-status {
            margin-top: 20px;
            font-size: 0.9rem;
            color: var(--text-muted);
            text-align: center;
            font-weight: 700;
        }
    </style>
</head>
<body>

<div class="panel">
    <h2>Mission: Race Track Grammar</h2>
    <div class="status">Rules Analyzer Status: Grammar Sync</div>

    <!-- ZONE 1: SEATBELT -->
    <div class="zone-container">
        <div class="zone-image">
            <img src="https://novorossijsk.reqcar.com/assets/upload/images/articles_1710754319.jpg" alt="Racing Seatbelt">
        </div>
        <div class="zone-content">
            <div class="zone-title">1. Racing Seatbelt</div>
            
            <div class="sentence-row" data-zone="seatbelt" data-type="plus">
                <span class="sign plus">+</span>
                <select class="part-1">
                    <option value="">-- select --</option>
                    <option value="Always wear">Always wear</option>
                    <option value="Don't drive">Don't drive</option>
                </select>
                <select class="part-2">
                    <option value="">-- select --</option>
                    <option value="fast when">fast when</option>
                    <option value="a uniform and a helmet">a uniform and a helmet</option>
                </select>
                <select class="part-3">
                    <option value="">-- select --</option>
                    <option value="when driving">when driving</option>
                    <option value="it's dangerous">it's dangerous</option>
                </select>
            </div>

            <div class="sentence-row" data-zone="seatbelt" data-type="minus">
                <span class="sign minus">-</span>
                <select class="part-1">
                    <option value="">-- select --</option>
                    <option value="Always wear">Always wear</option>
                    <option value="Don't drive">Don't drive</option>
                </select>
                <select class="part-2">
                    <option value="">-- select --</option>
                    <option value="a uniform and a helmet">a uniform and a helmet</option>
                    <option value="fast when">fast when</option>
                </select>
                <select class="part-3">
                    <option value="">-- select --</option>
                    <option value="when driving">when driving</option>
                    <option value="it's dangerous">it's dangerous</option>
                </select>
            </div>
        </div>
    </div>

    <!-- ZONE 2: PIT LANE -->
    <div class="zone-container">
        <div class="zone-image">
            <img src="https://i.pinimg.com/originals/e0/c7/38/e0c73837d83ca7feb31b1e054118b451.jpg" alt="Pit Lane">
        </div>
        <div class="zone-content">
            <div class="zone-title">2. Pit Lane</div>

            <div class="sentence-row" data-zone="pitlane" data-type="plus">
                <span class="sign plus">+</span>
                <select class="part-1">
                    <option value="">-- select --</option>
                    <option value="Don't listen to">Don't listen to</option>
                    <option value="Stop at the traffic">Stop at the traffic</option>
                </select>
                <select class="part-2">
                    <option value="">-- select --</option>
                    <option value="lights when">lights when</option>
                    <option value="music on the race,">music on the race,</option>
                </select>
                <select class="part-3">
                    <option value="">-- select --</option>
                    <option value="it's red">it's red</option>
                    <option value="just drive">just drive</option>
                </select>
            </div>

            <div class="sentence-row" data-zone="pitlane" data-type="minus">
                <span class="sign minus">-</span>
                <select class="part-1">
                    <option value="">-- select --</option>
                    <option value="Stop at the traffic">Stop at the traffic</option>
                    <option value="Don't listen to">Don't listen to</option>
                </select>
                <select class="part-2">
                    <option value="">-- select --</option>
                    <option value="lights when">lights when</option>
                    <option value="music on the race,">music on the race,</option>
                </select>
                <select class="part-3">
                    <option value="">-- select --</option>
                    <option value="it's red">it's red</option>
                    <option value="just drive">just drive</option>
                </select>
            </div>
        </div>
    </div>

    <!-- ZONE 3: TRAFFIC WARDEN -->
    <div class="zone-container">
        <div class="zone-image">
            <img src="https://avatars.mds.yandex.net/i?id=17d39ae046ba7f393138d0cf5b53f1ab_l-4026732-images-thumbs&n=13" alt="Traffic Warden">
        </div>
        <div class="zone-content">
            <div class="zone-title">3. Traffic Warden</div>

            <div class="sentence-row" data-zone="warden" data-type="plus">
                <span class="sign plus">+</span>
                <select class="part-1">
                    <option value="">-- select --</option>
                    <option value="Always look">Always look</option>
                    <option value="Don't listen to">Don't listen to</option>
                </select>
                <select class="part-2">
                    <option value="">-- select --</option>
                    <option value="at the traffic warden">at the traffic warden</option>
                    <option value="the radio if">the radio if</option>
                </select>
                <select class="part-3">
                    <option value="">-- select --</option>
                    <option value="when you are on the road">when you are on the road</option>
                    <option value="you are in formula car">you are in formula car</option>
                </select>
            </div>

            <div class="sentence-row" data-zone="warden" data-type="minus">
                <span class="sign minus">-</span>
                <select class="part-1">
                    <option value="">-- select --</option>
                    <option value="Always look">Always look</option>
                    <option value="Don't listen to">Don't listen to</option>
                </select>
                <select class="part-2">
                    <option value="">-- select --</option>
                    <option value="at the traffic warden">at the traffic warden</option>
                    <option value="the radio if">the radio if</option>
                </select>
                <select class="part-3">
                    <option value="">-- select --</option>
                    <option value="when you are on the road">when you are on the road</option>
                    <option value="you are in formula car">you are in formula car</option>
                </select>
            </div>
        </div>
    </div>

    <button class="verify-btn" id="verifyBtn">Verify Sentence Telemetry</button>
    
    <div class="telemetry-log" id="logPanel"></div>
    <div class="footer-status">Report window panel ready...</div>
</div>

<script>
    // Правильные ответы
    const correctAnswers = [
        { zone: "seatbelt", type: "plus", p1: "Always wear", p2: "a uniform and a helmet", p3: "when driving" },
        { zone: "seatbelt", type: "minus", p1: "Don't drive", p2: "fast when", p3: "it's dangerous" },
        { zone: "pitlane", type: "plus", p1: "Stop at the traffic", p2: "lights when", p3: "it's red" },
        { zone: "pitlane", type: "minus", p1: "Don't listen to", p2: "music on the race,", p3: "just drive" },
        { zone: "warden", type: "plus", p1: "Always look", p2: "at the traffic warden", p3: "when you are on the road" },
        { zone: "warden", type: "minus", p1: "Don't listen to", p2: "the radio if", p3: "you are in formula car" }
    ];

    const verifyBtn = document.getElementById('verifyBtn');
    const logPanel = document.getElementById('logPanel');
    const allSelects = document.querySelectorAll('select');

    // ФУНКЦИЯ ПЕРЕМЕШИВАНИЯ ВАРИАНТОВ
    function shuffleSelectOptions(selectElement) {
        const options = Array.from(selectElement.options).filter(opt => opt.value !== "");
        // Fisher-Yates Shuffle
        for (let i = options.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [options[i], options[j]] = [options[j], options[i]];
        }
        
        // Сохраняем placeholder (-- select --)
        const placeholder = selectElement.options[0];
        selectElement.innerHTML = "";
        selectElement.appendChild(placeholder);
        
        // Добавляем перемешанные варианты
        options.forEach(opt => selectElement.appendChild(opt));
    }

    // Применяем перемешивание ко всем выпадающим спискам при загрузке
    allSelects.forEach(select => {
        shuffleSelectOptions(select);
        
        // Очистка цветов при изменении выбора
        select.addEventListener('change', function() {
            this.classList.remove('correct-choice', 'wrong-choice');
        });
    });

    // Проверка ответов
    verifyBtn.addEventListener('click', () => {
        let totalRows = correctAnswers.length;
        let correctCount = 0;
        let errorMessages = [];

        // Сброс прошлых результатов
        allSelects.forEach(select => select.classList.remove('correct-choice', 'wrong-choice'));

        correctAnswers.forEach(ans => {
            const row = document.querySelector(`.sentence-row[data-zone="${ans.zone}"][data-type="${ans.type}"]`);
            const p1Select = row.querySelector('.part-1');
            const p2Select = row.querySelector('.part-2');
            const p3Select = row.querySelector('.part-3');

            const userP1 = p1Select.value;
            const userP2 = p2Select.value;
            const userP3 = p3Select.value;

            let rowCorrect = true;

            if (userP1 === ans.p1) p1Select.classList.add('correct-choice'); else { p1Select.classList.add('wrong-choice'); rowCorrect = false; }
            if (userP2 === ans.p2) p2Select.classList.add('correct-choice'); else { p2Select.classList.add('wrong-choice'); rowCorrect = false; }
            if (userP3 === ans.p3) p3Select.classList.add('correct-choice'); else { p3Select.classList.add('wrong-choice'); rowCorrect = false; }

            if (rowCorrect) {
                correctCount++;
            } else {
                errorMessages.push(`Error in ${ans.zone.toUpperCase()} [${ans.type === 'plus' ? '+' : '-'}] syntax.`);
            }
        });

        logPanel.style.display = "block";

        if (correctCount === totalRows) {
            logPanel.className = "telemetry-log success";
            logPanel.innerHTML = `<strong>Perfect!</strong><br>All ${correctCount}/${totalRows} rules configured properly! Race track clearance granted.`;
        } else {
            logPanel.className = "telemetry-log error";
            logPanel.innerHTML = `<strong>Oops! Check your answers.</strong><br>Correct rows: ${correctCount}/${totalRows}.<br><br>${errorMessages.join('<br>')}`;
        }
    });
</script>

</body>
</html>
