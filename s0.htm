<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Quest: 3 Variants 📚</title>
    <style>
        :root {
            --bubble-gum: #ffb7c5;
            --ocean-blue: #00bcd4;
            --sunny-yellow: #ffeb3b;
            --coral-orange: #ffab91;
            --seaweed-green: #a5d6a7;
            --purple: #ce93d8;
            --text-color: #4a148c;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background-color: #e1f5fe;
            background-image: radial-gradient(#b3e5fc 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }

        .game-area { width: 100%; max-width: 480px; text-align: center; }

        .progress-bubbles {
            display: flex; justify-content: center; gap: 6px;
            margin-bottom: 15px; flex-wrap: wrap;
        }
        .bubble {
            width: 14px; height: 14px;
            background: #b3e5fc; border-radius: 50%;
            border: 2px solid white; transition: 0.3s;
        }
        .bubble.active { background: var(--ocean-blue); transform: scale(1.3); }
        .bubble.done { background: var(--seaweed-green); }

        .friend-card {
            background: white; padding: 34px 20px 26px; border-radius: 40px;
            box-shadow: 0 10px 0 rgba(0,131,143,0.2); border: 6px solid white;
            min-height: 320px; display: flex; flex-direction: column; justify-content: center;
            position: relative; animation: bounceIn 0.5s ease;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .quest-label {
            position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
            background: var(--coral-orange); color: white;
            padding: 5px 20px; border-radius: 20px;
            font-weight: bold; box-shadow: 0 4px 0 #e64a19;
            font-size: 0.95rem; white-space: nowrap;
        }

        .friend-emoji { font-size: 3.6rem; margin-bottom: 10px; }
        .question-text {
            font-size: 1.3rem; font-weight: bold; margin-bottom: 22px;
            line-height: 1.4; color: var(--text-color);
        }
        .question-text .blank {
            display: inline-block;
            min-width: 90px;
            border-bottom: 3px dashed var(--ocean-blue);
            color: var(--ocean-blue);
            font-weight: 900;
            vertical-align: middle;
            padding: 0 6px;
        }

        .options-group { display: grid; gap: 12px; }

        .btn-choice {
            background: white; border: 4px solid var(--text-color);
            padding: 15px 12px; border-radius: 22px; cursor: pointer;
            font-size: 1.15rem; font-weight: bold;
            color: var(--text-color); box-shadow: 0 6px 0 var(--text-color);
            font-family: inherit; transition: 0.15s;
        }

        .btn-choice:hover:not(:disabled) {
            background: var(--sunny-yellow); transform: translateY(-3px);
        }
        .btn-choice:active:not(:disabled) {
            transform: translateY(3px); box-shadow: 0 2px 0 var(--text-color);
        }
        .btn-choice.correct {
            background: var(--seaweed-green); color: white;
            border-color: #388e3c; box-shadow: 0 6px 0 #388e3c;
            animation: yippee 0.4s ease;
        }
        .btn-choice.wrong {
            background: var(--bubble-gum); color: white;
            border-color: #c62828; box-shadow: 0 6px 0 #c62828;
            animation: shake 0.4s ease;
        }

        @keyframes yippee { 50% { transform: scale(1.05); } }
        @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

        .end-screen { display: none; }
        .btn-restart {
            margin-top: 26px; background: var(--ocean-blue); color: white;
            border: none; padding: 18px 40px; border-radius: 50px; cursor: pointer;
            font-weight: bold; font-size: 1.2rem; box-shadow: 0 6px 0 #0097a7;
            font-family: inherit; transition: 0.2s;
        }
        .btn-restart:hover { transform: translateY(-2px); }
        .btn-restart:active { transform: translateY(3px); box-shadow: 0 2px 0 #0097a7; }

        .score-line { font-size: 1.2rem; font-weight: bold; color: var(--purple); margin: 8px 0 4px; }

        @media (max-width: 380px) {
            .question-text { font-size: 1.15rem; }
            .btn-choice { font-size: 1rem; padding: 13px 10px; }
        }
    </style>
</head>
<body>

<div class="game-area" id="quiz-game">
    <div class="progress-bubbles" id="progress-container"></div>
    <div class="friend-card">
        <div class="quest-label" id="quest-label">Action Quest</div>
        <div class="friend-emoji" id="friend-emoji">📚</div>
        <div class="question-text" id="question-text">Loading...</div>
        <div class="options-group" id="options-group"></div>
    </div>
</div>

<div class="game-area end-screen" id="end-screen">
    <div style="font-size: 5rem;">🌟📚🌟</div>
    <h1 style="color: var(--ocean-blue);">School Master!</h1>
    <p class="score-line" id="final-score"></p>
    <p style="font-size: 1.15rem;">You know your classroom words and numbers!</p>
    <button class="btn-restart" onclick="location.reload()">PLAY AGAIN? 📚</button>
</div>

<script>
    /* ============================================================
       DATA — each question: 1 correct (a) + 2 distractors (wrong)
       ============================================================ */
    const questions = [
        /* ===== Exercise 24 — Classroom instructions ===== */
        {
            q: "Sit down and ___ quiet, please.",
            a: "be",
            wrong: ["are", "am"],
            emoji: "🤫", tag: "Action Quest"
        },
        {
            q: "___ your books, please.",
            a: "Open",
            wrong: ["Sit", "Take"],
            emoji: "📖", tag: "Action Quest"
        },
        {
            q: "Open your books and ___ the story.",
            a: "read",
            wrong: ["sing", "count"],
            emoji: "📚", tag: "Action Quest"
        },
        {
            q: "___ the story in your notebook, please.",
            a: "Write",
            wrong: ["Draw", "Sing"],
            emoji: "✏️", tag: "Action Quest"
        },
        {
            q: "Stand ___, please.",
            a: "up",
            wrong: ["down", "out"],
            emoji: "🧍", tag: "Action Quest"
        },

        /* ===== Numbers ===== */
        {
            q: "How many is 'sixteen'?",
            a: "16",
            wrong: ["60", "6"],
            emoji: "🔢", tag: "Number Quest"
        },
        {
            q: "How many is 'twenty'?",
            a: "20",
            wrong: ["12", "2"],
            emoji: "2️⃣0️⃣", tag: "Number Quest"
        },
        {
            q: "How many is 'fifteen'?",
            a: "15",
            wrong: ["50", "5"],
            emoji: "1️⃣5️⃣", tag: "Number Quest"
        },
        {
            q: "How many is 'twelve'?",
            a: "12",
            wrong: ["20", "2"],
            emoji: "1️⃣2️⃣", tag: "Number Quest"
        },
        {
            q: "How many is 'fourteen'?",
            a: "14",
            wrong: ["40", "4"],
            emoji: "1️⃣4️⃣", tag: "Number Quest"
        },
        {
            q: "How many is 'eleven'?",
            a: "11",
            wrong: ["12", "10"],
            emoji: "1️⃣1️⃣", tag: "Number Quest"
        },
        {
            q: "How many is 'seventeen'?",
            a: "17",
            wrong: ["70", "7"],
            emoji: "1️⃣7️⃣", tag: "Number Quest"
        },

        /* ===== Short answers ===== */
        {
            q: "Are you a pupil?",
            a: "Yes, I am.",
            wrong: ["Yes, I am not.", "No, I am."],
            emoji: "🎒", tag: "Short Answer"
        },
        {
            q: "Is he a teacher?",
            a: "Yes, he is.",
            wrong: ["No, he is.", "Yes, he isn't."],
            emoji: "👨‍🏫", tag: "Short Answer"
        },
        {
            q: "Is she your friend?",
            a: "Yes, she is.",
            wrong: ["Yes, she is not.", "No, she is."],
            emoji: "👭", tag: "Short Answer"
        },
        {
            q: "Are they students?",
            a: "No, they aren't.",
            wrong: ["No, they are.", "Yes, they isn't."],
            emoji: "🎓", tag: "Short Answer"
        },

        /* ===== Word order ===== */
        {
            q: "Put in order: they / sad / are ?",
            a: "Are they sad?",
            wrong: ["They are sad?", "Sad they are?"],
            emoji: "😢", tag: "Word Order"
        },
        {
            q: "Put in order: it / a / pencil / is ?",
            a: "Is it a pencil?",
            wrong: ["It is a pencil?", "A pencil it is?"],
            emoji: "✏️", tag: "Word Order"
        },
        {
            q: "Put in order: you / happy / are ?",
            a: "Are you happy?",
            wrong: ["You are happy?", "Happy you are?"],
            emoji: "😊", tag: "Word Order"
        },
        {
            q: "Put in order: he / a / doctor / is ?",
            a: "Is he a doctor?",
            wrong: ["He is a doctor?", "A doctor he is?"],
            emoji: "👨‍⚕️", tag: "Word Order"
        },
        {
            q: "Put in order: she / your / sister / is ?",
            a: "Is she your sister?",
            wrong: ["She is your sister?", "Your sister she is?"],
            emoji: "👧", tag: "Word Order"
        }
    ];

    let currentIndex = 0;
    let correctCount = 0;
    let locked = false;

    const progressContainer = document.getElementById('progress-container');
    const questLabel = document.getElementById('quest-label');

    /* proper Fisher-Yates shuffle */
    function shuffle(arr){
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--){
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    /* build progress bubbles */
    questions.forEach(() => {
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        progressContainer.appendChild(bubble);
    });

    function loadCard() {
        const q = questions[currentIndex];
        locked = false;

        questLabel.innerText = q.tag;

        document.getElementById('question-text').innerHTML =
            q.q.replace(/___/g, '<span class="blank">?</span>');
        document.getElementById('friend-emoji').innerText = q.emoji;

        const bubbles = document.querySelectorAll('.bubble');
        bubbles.forEach((b, idx) => {
            b.className = 'bubble';
            if (idx === currentIndex) b.classList.add('active');
            if (idx < currentIndex) b.classList.add('done');
        });

        const container = document.getElementById('options-group');
        container.innerHTML = '';

        /* MIX correct + 2 distractors with proper shuffle */
        const allOptions = shuffle([q.a, ...q.wrong]);

        allOptions.forEach(choice => {
            const btn = document.createElement('button');
            btn.className = 'btn-choice';
            btn.innerText = choice;

            btn.onclick = () => {
                if (locked) return;
                const btns = document.querySelectorAll('.btn-choice');

                if (choice === q.a) {
                    locked = true;
                    correctCount++;
                    btns.forEach(b => b.disabled = true);
                    btn.classList.add('correct');
                    setTimeout(nextQuestion, 900);
                } else {
                    btn.classList.add('wrong');
                    btn.disabled = true;
                    /* reveal the correct answer */
                    btns.forEach(b => {
                        if (b.innerText === q.a) b.classList.add('correct');
                    });
                }
            };

            container.appendChild(btn);
        });
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex < questions.length) {
            loadCard();
        } else {
            document.getElementById('quiz-game').style.display = 'none';
            document.getElementById('end-screen').style.display = 'block';
            document.getElementById('final-score').innerText =
                "🏆 " + correctCount + " / " + questions.length + " correct!";
        }
    }

    loadCard();
</script>
</body>
</html>
